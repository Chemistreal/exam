<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@300;400;500;600;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4EFE6; --paper-soft:#FBFAF6; --surface:#FBF8F1; --surface-2:#F6F1E7; --surface-3:#FAF6EC;
  --ink:#1C1812; --ink-2:#40392F; --ink-3:#857B6B; --ink-4:#A79D8B;
  --line:#E6DECF; --line-2:#EFE7D6; --line-3:#D6CAB3;
  --teal:#0E7A6E; --teal-d:#0A5C53; --teal-t:#E2EFEC; --teal-t2:#CFE6E0;
  --brass:#A07E2B; --brass-d:#7A5E1C; --brass-t:#F1E7CF; --gold-2:#C9A24B;
  --cobalt:#2A5470; --amber:#BD7A12; --rose:#B23A6B; --emerald:#2E7D5B;
  --foil-line:linear-gradient(90deg,rgba(122,94,28,0),#C9A24B 40%,#7A5E1C 60%,rgba(122,94,28,0));
  --st:#A07E2B;  --st-bg:#F2E9D2;
  --ms:#B23A6B;  --ms-bg:#F7E6EE;
  --bs:#0E7A6E;  --bs-bg:#E2EFEC;
  --tk:#2A5470;  --tk-bg:#E7EDF1;
  --good:#2E7D5B; --bad:#B23A6B;
  --serif:"Hahmlet","Noto Serif KR",Georgia,serif;
  --sans:"IBM Plex Sans KR","Noto Sans KR","Pretendard",-apple-system,system-ui,sans-serif;
  --mono:"IBM Plex Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  --shadow:0 1px 2px rgba(28,24,18,.05),0 14px 34px -22px rgba(28,24,18,.4);
  --shadow-s:inset 0 1px 0 rgba(255,255,255,.6),0 1px 2px rgba(28,24,18,.05),0 16px 38px -28px rgba(28,24,18,.42);
  --maxw:1040px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.62;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum"}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:0}
.serif{font-family:var(--serif)}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px}
a{color:var(--teal)}

/* ===== 마스트헤드 ===== */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top__in{display:flex;align-items:center;justify-content:space-between;max-width:var(--maxw);margin:0 auto;padding:15px 22px}
.bw{display:flex;align-items:center;gap:12px}
.bw__mark{width:38px;height:38px;border-radius:10px;background:var(--teal);position:relative;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.bw__mark::after{content:"";position:absolute;left:9px;top:9px;right:9px;bottom:9px;border:1.5px solid var(--brass);border-radius:4px;opacity:.85}
.bw__mark span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--serif);font-weight:700;font-size:15px}
.bw__name{font-family:var(--serif);font-weight:700;font-size:16px;letter-spacing:-.01em;line-height:1.1}
.bw__sub{font-size:10.5px;color:var(--ink-3);font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.teal-rule{height:2px;background:linear-gradient(90deg,var(--teal) 0%,var(--teal-d) 70%,var(--brass) 100%)}
.btn{font-family:var(--sans);font-size:13px;font-weight:500;padding:8px 15px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);transition:.15s}
.btn:hover{border-color:var(--ink-3);color:var(--ink)}
.btn--p{background:var(--teal);color:#fff;border-color:var(--teal)}
.btn--p:hover{background:var(--teal-d);color:#fff}
.btn--g{background:none}
.btn-row{display:flex;gap:9px;flex-wrap:wrap}

/* ===== 뷰 ===== */
.view{display:none;padding:36px 0 96px}
.view.on{display:block;animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

/* ===== 시험 선택 ===== */
.hero{max-width:720px;margin-bottom:34px}
.hero__ey{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass-d);margin-bottom:14px}
.hero h1{font-family:var(--serif);font-size:33px;font-weight:700;line-height:1.24;letter-spacing:-.02em;margin-bottom:14px}
.hero p{color:var(--ink-2);font-size:15px;max-width:600px}
.exam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:8px}
.ec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;cursor:pointer;transition:.18s;position:relative;overflow:hidden}
.ec:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--teal-t2)}
.ec::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--teal);opacity:0;transition:.18s}
.ec:hover::before{opacity:1}
.ec.dis{opacity:.5;cursor:not-allowed}
.ec.dis:hover{transform:none;box-shadow:none;border-color:var(--line)}
.ec__t{font-family:var(--serif);font-size:18px;font-weight:700;margin-bottom:6px;letter-spacing:-.01em}
.ec__r{font-size:13px;color:var(--ink-2);margin-bottom:14px}
.ec__m{display:flex;gap:16px;font-family:var(--mono);font-size:11.5px;color:var(--ink-3);border-top:1px solid var(--line-2);padding-top:12px}
.ec__m b{color:var(--teal);font-weight:700}
.tag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.06em;padding:3px 8px;border-radius:5px;background:var(--surface-2);color:var(--ink-3);text-transform:uppercase}

/* ===== OMR 입력 ===== */
.omr-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:8px}
.omr-head h2{font-family:var(--serif);font-size:23px;font-weight:700}
.omr-head .sub{color:var(--ink-2);font-size:13.5px;margin-top:4px}
.idform{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:18px;margin:18px 0 22px}
.idform label{display:block;font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.03em;margin-bottom:5px}
.idform input{width:100%;font-family:var(--sans);font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface-3);color:var(--ink)}
.idform input:focus{outline:none;border-color:var(--teal);background:#fff}
.prog{position:sticky;top:0;z-index:5;background:var(--paper);padding:13px 0;border-bottom:1px solid var(--line);margin-bottom:18px}
.prog__bar{height:6px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.prog__fill{height:100%;background:var(--teal);width:0;transition:width .3s}
.prog__meta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--ink-2);margin-bottom:9px}
.prog__meta .warn{color:var(--ms)}
.omr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.qrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.qrow__n{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);width:24px;text-align:right;flex:0 0 auto}
.qrow__ch{display:flex;gap:5px}
.ansin{width:46px;height:38px;text-align:center;font-family:var(--serif);font-size:18px;font-weight:700;color:var(--ink);border:1px solid var(--line);border-radius:8px;background:var(--surface-3);transition:.12s;appearance:none;-moz-appearance:textfield}
.ansin:focus{outline:none;border-color:var(--teal);background:#fff;box-shadow:0 0 0 3px var(--teal-t)}
.ansin.filled{border-color:var(--teal);color:var(--teal);background:var(--teal-t)}
.ansin::placeholder{color:var(--ink-4);font-weight:400}
.omr-hint{font-size:12.5px;color:var(--ink-2);background:var(--teal-t);border:1px solid var(--teal-t2);border-radius:10px;padding:11px 15px;margin-bottom:16px;line-height:1.6}
.omr-hint b{color:var(--teal-d)}
.rosterBar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 15px;margin-bottom:14px}
.rosterBar b{color:var(--ink);font-weight:700}
.rosterBar .rb-r{display:flex;align-items:center;gap:6px;color:var(--ink-3)}
.rosterBar .rb-live{color:var(--teal-d);font-weight:700}
.rosterBar .muted{color:var(--ink-4)}
.lnk{background:none;border:none;color:var(--bad);font-family:var(--sans);font-size:12px;cursor:pointer;padding:0;text-decoration:underline}
.lnk2{background:none;border:none;color:var(--teal-d);font-family:var(--sans);font-size:12px;cursor:pointer;padding:0;text-decoration:underline}

/* ===== 리포트 공통 ===== */
.rep{max-width:var(--maxw);margin:0 auto}
.sec{background:linear-gradient(180deg,var(--surface),#F7F2E9);border:1px solid var(--line);border-radius:16px;padding:26px 28px;margin-bottom:18px;box-shadow:var(--shadow-s)}
.sec__h{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
.sec__no{font-family:var(--mono);font-size:12px;color:var(--brass-d);letter-spacing:.06em;flex:0 0 auto}
.sec__t{font-family:var(--serif);font-size:20px;font-weight:700;letter-spacing:-.012em}
.sec__d{font-size:13px;color:var(--ink-3);margin:6px 0 20px;line-height:1.6}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}

/* 리포트 머리글 */
.rhead{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0;margin-bottom:18px;overflow:hidden;box-shadow:var(--shadow-s)}
.rhead__top{position:relative;padding:24px 28px 22px;border-bottom:2px solid var(--ink);display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap}
.rhead__top::after{content:"";position:absolute;left:28px;bottom:-2px;width:72px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--brass-d),var(--gold-2))}
.rhead__ey{letter-spacing:.3em !important;font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--brass-d);margin-bottom:9px}
.rhead__t{font-family:var(--serif);font-size:28px;font-weight:600;line-height:1.16;letter-spacing:-.015em;background:linear-gradient(92deg,var(--ink),var(--brass-d) 150%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.rhead__r{font-size:13.5px;color:var(--ink-2);margin-top:7px}
.idcard{display:flex;gap:0;flex-wrap:wrap}
.idcard__i{padding:7px 18px;border-left:1px solid var(--line-2)}
.idcard__i:first-child{border-left:none;padding-left:0}
.idcard__k{font-size:10px;color:var(--ink-4);letter-spacing:.05em;text-transform:uppercase;font-family:var(--mono)}
.idcard__v{font-size:15px;font-weight:700;font-family:var(--serif);margin-top:1px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:0;padding:22px 28px}
.kpi{padding:0 22px;border-left:1px solid var(--line-2)}
.kpi:first-child{border-left:none;padding-left:0}
.kpi__k{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px}
.kpi__v{font-family:var(--serif);font-size:32px;font-weight:700;line-height:1;letter-spacing:-.02em}
.kpi__v small{font-size:16px;color:var(--ink-3);font-weight:500}
.kpi__s{font-size:12px;color:var(--ink-2);margin-top:8px}
.kpi__s .up{color:var(--good);font-weight:700}
.kpi__s .dn{color:var(--bad);font-weight:700}
.kpi__spark{margin-top:8px}

/* 요약 풀쿼트 */
/* 다크 히어로 (핵심 진단 · 킥) */
.hero-diag{position:relative;background:radial-gradient(120% 140% at 78% 8%,#13726655 0%,rgba(0,0,0,0) 42%),radial-gradient(90% 120% at 12% 100%,#0a5c5340 0%,rgba(0,0,0,0) 46%),linear-gradient(135deg,var(--teal-d) 0%,#0c3a32 55%,#0f221e 100%);border-radius:18px;padding:30px 32px;margin-bottom:18px;color:#F4F1E8;box-shadow:0 1px 2px rgba(28,24,18,.06),0 26px 60px -34px rgba(10,70,59,.85);overflow:hidden}
.hero-diag::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 50% at 80% 0%,rgba(234,201,131,.16),rgba(0,0,0,0) 70%);pointer-events:none}
.hero-diag::after{content:"";position:absolute;inset:0;border-radius:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 0 60px rgba(255,255,255,.03);pointer-events:none}
.hero-diag__ey{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#D8B978;margin-bottom:14px}
.hero-diag__head{font-family:var(--serif);font-size:25px;font-weight:600;line-height:1.42;letter-spacing:-.012em;color:#FBFAF6}
.hero-diag__head b{color:#EAC983;font-weight:700}
.hero-diag__stats{display:flex;gap:0;margin-top:24px;border-top:1px solid rgba(255,255,255,.13);padding-top:18px;flex-wrap:wrap}
.hds{padding:4px 26px;border-left:1px solid rgba(255,255,255,.13)}
.hds:first-child{border-left:none;padding-left:0}
.hds__v{font-family:var(--serif);font-size:23px;font-weight:700;color:#EAC983;line-height:1.1;letter-spacing:-.01em}
.hds__k{font-size:11px;color:#A6BAB2;margin-top:7px;font-family:var(--mono);letter-spacing:.02em}
/* 상세 진단 */
.detail{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 28px;margin-bottom:18px;box-shadow:var(--shadow-s)}
.detail__q{font-family:var(--serif);font-size:16px;line-height:1.72;font-weight:500;color:var(--ink);margin-top:10px;letter-spacing:-.006em}
.detail__q b{color:var(--teal-d);font-weight:700}
.detail__q p{margin-bottom:9px}
.detail__q p:last-child{margin-bottom:0}

/* 사분면 */
.quad-wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:26px;align-items:start}
.quad-legend{display:flex;flex-direction:column;gap:10px}
.ql{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-radius:11px;border:1px solid var(--line-2)}
.ql__dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;margin-top:5px}
.ql__t{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.ql__n{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.ql__d{font-size:12px;color:var(--ink-2);margin-top:2px;line-height:1.5}
.ql.pri{border-color:var(--ms);background:var(--ms-bg)}
.ql.pri .ql__t{color:var(--ms)}
.chip-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.qchip{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:5px;background:#fff;border:1px solid var(--line);color:var(--ink-2)}

/* 영역별 다이버징 */
.areatab{width:100%;border-collapse:collapse;font-size:13px;margin-top:18px}
.areatab th{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);font-weight:500;text-align:right;padding:0 9px 9px;border-bottom:1px solid var(--line)}
.areatab th:first-child{text-align:left}
.areatab td{padding:8px 9px;border-bottom:1px solid var(--line-2);text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.areatab td:first-child{text-align:left;font-family:var(--sans);font-weight:500}
.areatab tr:hover td{background:var(--surface-3)}
.grp-row td{background:var(--surface-2)!important;font-family:var(--serif)!important;font-weight:700;color:var(--teal-d);font-size:12.5px;letter-spacing:.02em}
.dbar{position:relative;height:20px;display:flex;align-items:center}
.dbar__center{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}
.dbar__fill{position:absolute;height:10px;border-radius:3px;top:5px}
.dval{font-weight:700}
.dval.pos{color:var(--good)}.dval.neg{color:var(--bad)}

/* 유형 숙련도 */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px 26px;margin-top:18px}
.cgroup__h{font-family:var(--serif);font-weight:700;font-size:13px;color:var(--teal-d);padding-bottom:7px;border-bottom:1px solid var(--line-2);margin-bottom:9px;letter-spacing:.01em}
.crow{display:flex;align-items:center;gap:9px;padding:3px 0}
.crow__t{font-size:12.5px;color:var(--ink-2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow__bar{width:46px;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;flex:0 0 auto}
.crow__bar i{display:block;height:100%;border-radius:3px}
.crow__n{font-family:var(--mono);font-size:11px;color:var(--ink-3);width:30px;text-align:right;flex:0 0 auto}

/* 오개념 */
.misc{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.mcard{display:flex;gap:14px;border:1px solid var(--line);border-left:3px solid var(--ms);border-radius:11px;padding:15px 17px;background:var(--surface-3)}
.mcard__n{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ms);flex:0 0 auto;background:var(--ms-bg);width:42px;height:42px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.mcard__b{flex:1}
.mcard__hd{font-weight:700;font-size:13.5px;margin-bottom:3px}
.mcard__hd small{font-family:var(--mono);font-weight:400;color:var(--ink-3);margin-left:7px}
.mcard__tx{font-size:13px;color:var(--ink-2);line-height:1.55}
.misc-link{font-size:12.5px;color:var(--ink-2);margin-top:14px;padding-top:14px;border-top:1px solid var(--line-2)}

/* 처방 */
.rx{counter-reset:rx;display:flex;flex-direction:column;gap:0;margin-top:14px}
.rxi{display:flex;gap:16px;padding:15px 0;border-bottom:1px solid var(--line-2)}
.rxi:last-child{border-bottom:none}
.rxi__no{counter-increment:rx;font-family:var(--serif);font-weight:700;font-size:18px;color:var(--brass-d);flex:0 0 auto;width:30px}
.rxi__no::before{content:counter(rx)}
.rxi__b strong{font-size:14px;font-weight:700;display:block;margin-bottom:3px}

/* 진입 히어로 */
.hero h1{font-family:var(--serif);font-weight:600;letter-spacing:-.02em;line-height:1.08}
.hero__ey{color:var(--brass-d);letter-spacing:.22em}
.hero--art>p{position:relative}
.hero--art::after{content:"";display:block;height:1px;width:128px;margin:20px 0 2px;background:var(--foil-line)}

/* 시험 카드 */
.ec{background:linear-gradient(180deg,var(--surface),#F6F1E7)!important;box-shadow:var(--shadow-s)!important;position:relative;overflow:hidden;transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .3s var(--ease)}
.ec::before{content:"";position:absolute;left:0;top:0;width:100%;height:3px;background:var(--foil-line);opacity:0;transition:opacity .3s var(--ease)}
.ec:hover::before{opacity:1}
.ec:hover{border-color:var(--gold-2)!important;transform:translateY(-3px);box-shadow:0 1px 2px rgba(28,24,18,.05),0 26px 50px -30px rgba(28,24,18,.5)!important}
.ec__t{font-family:var(--serif);font-weight:600;letter-spacing:-.01em}
.ec__m b{font-family:var(--serif)}

/* 식별 정보 */
.idcard{align-items:stretch}
.idcard__i{padding:7px 20px;border-left:1px solid var(--line-2)}
.idcard__k{font-size:9.5px;letter-spacing:.14em;color:var(--ink-3)}
.idcard__v{font-size:16px;font-weight:500;letter-spacing:-.005em}

/* KPI: 세리프 수치 + 칸 구분선 */
.kpis{position:relative}
.kpi{position:relative}
.kpi+.kpi::before{content:"";position:absolute;left:0;top:16%;height:68%;width:1px;background:var(--line-2)}
.kpi__k{font-size:10px;letter-spacing:.13em;color:var(--ink-3)}
.kpi__v{font-variant-numeric:tabular-nums;letter-spacing:-.022em}
.kpi__v small{font-weight:400}

/* 섹션 헤더: 골드 번호 + 트레일링 헤어라인 */
.sec__no{font-weight:600;color:var(--gold-2);font-size:12px}
.sec__t{flex:0 1 auto}
.sec__h::after{content:"";flex:1 1 30px;min-width:26px;height:1px;align-self:center;background:linear-gradient(90deg,var(--line-2),rgba(214,202,179,0));margin-left:6px}
@media(max-width:560px){.sec__h{flex-wrap:wrap}.sec__h::after{display:none}}
.sec__d{color:var(--ink-3)}

/* 표 리파인 */
.areatab th,.gtab th{letter-spacing:.08em;color:var(--ink-3)}
.areatab td{font-variant-numeric:tabular-nums}
.areatab tr:hover td{background:var(--surface-3)}
.grp-row td{background:linear-gradient(90deg,var(--surface-2),rgba(246,241,231,0))!important;font-family:var(--mono)!important;font-size:10.5px!important;letter-spacing:.16em!important;text-transform:uppercase;color:var(--brass-d)!important;font-weight:600!important;padding-top:15px!important;padding-bottom:7px!important}
.bchip{font-variant-numeric:normal;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}

/* 칩·배지 */
.qchip{background:var(--surface);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.badge{box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 1px 1px rgba(28,24,18,.03)}

/* 상세 진단 리드 */
.detail{background:linear-gradient(180deg,var(--surface),#F8F3EA)}
.detail__q p:first-child{font-size:16.5px}

/* 총평: 레터프레스 머리 */
.note{background:linear-gradient(180deg,#FBF8F1,var(--paper))!important;border-color:var(--line-3)!important}
.note__h{letter-spacing:.01em}
.note__h::before{content:"";display:inline-block;width:20px;height:1px;background:var(--brass-d);vertical-align:middle}

/* 처방 카드 */
.rxi{transition:transform .25s var(--ease)}
.rxi:hover{transform:translateX(2px)}

/* FAQ 미세 */
.faq__q{transition:color .15s var(--ease),background .15s var(--ease)}
.faq__item[open]{background:linear-gradient(90deg,rgba(201,162,75,.05),rgba(201,162,75,0))}

/* 인쇄: 질감/블러 제거 */
@media print{ body{background:#fff!important} .top{display:none} }

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function rankPct(value,arr){const n=arr.length;let below=0,equal=0;for(const v of arr){if(v<value)below++;else if(v===value)equal++;}const greater=n-below-equal;return{rank:greater+1,ties:equal,pct:n?((below+(equal?0.5*equal:0))/n)*100:0,n};}
function to100(pts,maxPts){return maxPts?pts/maxPts*100:0;}

function analyze(exam,answers,cohort){
 const qs=exam.questions,maxTotal=qs.length*PT;
 const graded=qs.map(q=>{const a=answers[q.n];return{...q,choice:a,correct:a===q.ans,band:band(q.p)};});
 const rawCorrect=graded.filter(g=>g.correct).length,total=rawCorrect*PT;
 const areas={};
 for(const g of graded){
  if(!areas[g.area])areas[g.area]={name:g.area,group:AREA_GROUP[g.area]||"기타",nQ:0,maxPts:0,correct:0,pts:0,sumP:0};
  const A=areas[g.area];A.nQ++;A.maxPts+=PT;A.sumP+=g.p;if(g.correct){A.correct++;A.pts+=PT;}
 }
 const totalArr=cohort?cohort.map(s=>s.total):null;
 const totalStat=totalArr?rankPct(total,totalArr):null;
 const cohortTotalMean=totalArr?totalArr.reduce((s,v)=>s+v,0)/totalArr.length:null;
 const areaList=AREA_ORDER.filter(a=>areas[a]).map(a=>{
  const A=areas[a];A.myAcc=A.nQ?A.correct/A.nQ*100:0;A.my100=to100(A.pts,A.maxPts);A.popAcc=A.nQ?A.sumP/A.nQ:0;
  if(cohort){const arr=cohort.map(s=>s.areaPts[a]||0);const mean=arr.reduce((s,v)=>s+v,0)/arr.length;const st=rankPct(A.pts,arr);A.cohMeanPts=mean;A.cohMean100=to100(mean,A.maxPts);A.rank=st.rank;A.pct=st.pct;A.n=st.n;}
  A.diff100=A.my100-(A.cohMean100!=null?A.cohMean100:A.popAcc);
  return A;
 });
 const groups={};
 for(const A of areaList){const g=A.group;if(!groups[g])groups[g]={name:g,nQ:0,maxPts:0,correct:0,pts:0};groups[g].nQ+=A.nQ;groups[g].maxPts+=A.maxPts;groups[g].correct+=A.correct;groups[g].pts+=A.pts;}
 const groupList=Object.values(groups).map(G=>({...G,acc:G.nQ?G.correct/G.nQ*100:0,p100:to100(G.pts,G.maxPts)}));
 const TH=70,quad={strength:[],miss:[],base:[],task:[]};
 for(const g of graded){const hard=g.p<TH;if(g.correct&&hard)quad.strength.push(g);else if(!g.correct&&!hard)quad.miss.push(g);else if(g.correct&&!hard)quad.base.push(g);else quad.task.push(g);}
 const concepts={};
 for(const g of graded){const k=g.area+"||"+g.type;if(!concepts[k])concepts[k]={area:g.area,type:g.type,nQ:0,correct:0,qs:[]};concepts[k].nQ++;if(g.correct)concepts[k].correct++;concepts[k].qs.push(g.n);}
 const conceptList=Object.values(concepts);
 const misc=[];
 for(const g of graded){
  if(g.correct||!g.choice||!g.misc) continue;
  const m=g.misc, text=(typeof m==='string')?m:(m[g.choice]||m['*']||null);
  if(text) misc.push({n:g.n,area:g.area,type:g.type,choice:g.choice,ans:g.ans,text});
 }
 let estPct=null;
 if(!cohort){const mu=qs.reduce((s,q)=>s+q.p/100*PT,0);const varr=qs.reduce((s,q)=>{const p=q.p/100;return s+p*(1-p)*PT*PT;},0);const sd=Math.sqrt(varr);estPct=Phi((total-mu)/sd)*100;}
 return{exam,total,maxTotal,rawCorrect,my100:to100(total,maxTotal),totalStat,cohortTotalMean,estPct,areaList,groupList,quad,conceptList,misc,graded,TH};
}

/* ====================== 차트 (SVG, 단색+악센트) ====================== */
function distSVG(r){
 // 코호트 총점 히스토그램 + 본인 위치
 const arr=App.cohort.map(s=>s.total),min=Math.min(...arr),max=Math.max(...arr);
 const W=420,H=170,pad={l:8,r:8,t:14,b:26};
 const bins=24,lo=Math.floor(min/PT)*PT,hi=Math.ceil(max/PT)*PT,bw=(hi-lo)/bins;
 const counts=new Array(bins).fill(0);
 arr.forEach(v=>{let b=Math.floor((v-lo)/bw);if(b>=bins)b=bins-1;if(b<0)b=0;counts[b]++;});
 const cmax=Math.max(...counts),iw=W-pad.l-pad.r,ih=H-pad.t-pad.b;
 const x=v=>pad.l+(v-lo)/(hi-lo)*iw;
 const myX=x(r.total);
 const sortedC=arr.slice().sort((a,b)=>a-b);
 const pctScore=pp=>{ if(!sortedC.length)return lo; let idx=Math.floor(pp/100*sortedC.length); if(idx>=sortedC.length)idx=sortedC.length-1; if(idx<0)idx=0; return sortedC[idx]; };
 const refs=[{p:90,l:'상위10%'},{p:75,l:'상위25%'},{p:50,l:'중앙'}].map(o=>{const v=pctScore(o.p),rx=x(v);return `<line x1="${rx}" y1="${pad.t+1}" x2="${rx}" y2="${pad.t+ih}" stroke="var(--ink-4)" stroke-dasharray="2 3" stroke-width="1" opacity=".5"/><text x="${rx}" y="${pad.t+8}" font-size="7.5" fill="var(--ink-4)" text-anchor="middle" font-family="var(--mono)">${o.l}</text>`;}).join("");
 let bars="";
 for(let i=0;i<bins;i++){
  const bx=pad.l+i/bins*iw,bh=cmax?counts[i]/cmax*ih:0,inMy=(lo+i*bw)<=r.total&&r.total<(lo+(i+1)*bw);
  bars+=`<rect x="${bx+0.5}" y="${pad.t+ih-bh}" width="${iw/bins-1}" height="${bh}" rx="1.5" fill="${inMy?'var(--teal)':'var(--line)'}"/>`;
 }
 const ticks=[lo,Math.round((lo+hi)/2/PT)*PT,hi].map(v=>`<text x="${x(v)}" y="${H-9}" font-size="9.5" fill="var(--ink-3)" text-anchor="middle" font-family="var(--mono)">${v}</text>`).join("");
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="점수 분포">
  ${bars}
  ${refs}
  <line x1="${myX}" y1="${pad.t-4}" x2="${myX}" y2="${pad.t+ih}" stroke="var(--brass)" stroke-width="2"/>
  <circle cx="${myX}" cy="${pad.t-4}" r="3.5" fill="var(--brass)"/>
  <text x="${myX}" y="${pad.t-9}" font-size="10" font-weight="700" fill="var(--brass-d)" text-anchor="middle" font-family="var(--mono)">본인 ${r.total}</text>
  <line x1="${pad.l}" y1="${pad.t+ih}" x2="${W-pad.r}" y2="${pad.t+ih}" stroke="var(--line)" stroke-width="1"/>
  ${ticks}
 </svg>`;
}

function qmark(kind,cx,cy,color,rr){
 const r=rr||4.2;
 if(kind==='miss') return `<path d="M${cx} ${cy-r-0.6} L${cx+r+0.6} ${cy} L${cx} ${cy+r+0.6} L${cx-r-0.6} ${cy} Z" fill="${color}"/>`;
 if(kind==='task') return `<path d="M${cx} ${cy-r-0.6} L${cx+r+0.4} ${cy+r} L${cx-r-0.4} ${cy+r} Z" fill="${color}"/>`;
 if(kind==='base') return `<rect x="${cx-r+0.3}" y="${cy-r+0.3}" width="${2*r-0.6}" height="${2*r-0.6}" rx="0.8" fill="${color}"/>`;
 return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}"/>`;
}
function scatterSVG(r){
 const W=380,H=300,pad={l:42,r:14,t:14,b:34};
 const iw=W-pad.l-pad.r,ih=H-pad.t-pad.b;
 const cx=pad.l+iw*((100-r.TH)/100); // 임계 정답률 세로선 (난이도축: 왼=어려움)
 const my=pad.t+ih/2;
 const cols={strength:'var(--st)',miss:'var(--ms)',base:'var(--bs)',task:'var(--tk)'};
 const bg=`
  <rect x="${pad.l}" y="${pad.t}" width="${cx-pad.l}" height="${my-pad.t}" fill="var(--st-bg)" opacity=".6"/>
  <rect x="${cx}" y="${pad.t}" width="${pad.l+iw-cx}" height="${my-pad.t}" fill="var(--bs-bg)" opacity=".6"/>
  <rect x="${pad.l}" y="${my}" width="${cx-pad.l}" height="${pad.t+ih-my}" fill="var(--tk-bg)" opacity=".6"/>
  <rect x="${cx}" y="${my}" width="${pad.l+iw-cx}" height="${pad.t+ih-my}" fill="var(--ms-bg)" opacity=".7"/>`;
 const X=p=>pad.l+iw*((100-p)/100);
 const rnd=mulberry32(99);
 let pts="";
 r.graded.forEach(g=>{
  const px=X(g.p),jy=(rnd()-0.5)*(ih/2-22),py=(g.correct?pad.t+ih/4:pad.t+3*ih/4)+jy;
  const kind=g.correct?(g.p<r.TH?'strength':'base'):(g.p<r.TH?'task':'miss');
  const c=cols[kind];
  pts+=`<g opacity=".92">${qmark(kind,px,py,c)}<title>${g.n}번 · 정답률 ${g.p}% · ${g.correct?'정답':'오답'}</title></g>`;
 });
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="난이도 정오 사분면">
  ${bg}
  <line x1="${cx}" y1="${pad.t}" x2="${cx}" y2="${pad.t+ih}" stroke="var(--ink-3)" stroke-dasharray="3 3" stroke-width="1"/>
  <line x1="${pad.l}" y1="${my}" x2="${pad.l+iw}" y2="${my}" stroke="var(--ink-3)" stroke-dasharray="3 3" stroke-width="1"/>
  ${pts}
  <text x="${pad.l-6}" y="${pad.t+ih/4+4}" font-size="10" fill="var(--ink-3)" text-anchor="end" font-family="var(--mono)">정답</text>
  <text x="${pad.l-6}" y="${pad.t+3*ih/4+4}" font-size="10" fill="var(--ink-3)" text-anchor="end" font-family="var(--mono)">오답</text>
  <text x="${pad.l}" y="${H-10}" font-size="10" fill="var(--ink-3)" text-anchor="start" font-family="var(--mono)">← 어려움</text>
  <text x="${pad.l+iw}" y="${H-10}" font-size="10" fill="var(--ink-3)" text-anchor="end" font-family="var(--mono)">쉬움 →</text>
  <text x="${cx}" y="${H-10}" font-size="9" fill="var(--ink-4)" text-anchor="middle" font-family="var(--mono)">정답률 ${r.TH}%</text>
 </svg>`;
}

/* ====================== 서술 생성 ====================== */
function buildNarrative(r){
 const out=[];const pct=r.totalStat?r.totalStat.pct:r.estPct;
 const tier=pct>=85?"최상위권":pct>=70?"상위권":pct>=50?"중상위권":pct>=30?"중위권":"기초 보강 단계";
 out.push(`이번 시험에서 <b>${r.total}점 / ${r.maxTotal}점</b>(백점환산 ${r.my100.toFixed(0)}점)을 받아 ${r.totalStat?`전체 ${r.totalStat.n}명 중 <b>${r.totalStat.rank}등</b>, 백분위 <b>${pct.toFixed(0)}</b>의 ${tier}`:`백분위 약 <b>${pct.toFixed(0)}</b>의 ${tier}`} 위치입니다.`);
 const ms=r.quad.miss.length,hs=r.quad.strength.length;
 if(ms>0) out.push(`정답률이 높아 충분히 맞힐 수 있던 문항 <b>${ms}개</b>를 놓쳤습니다. 이 ${ms*PT}점은 실력이 아니라 습관에서 새는 점수이므로, 가장 먼저 메워야 할 최우선 과제입니다.`);
 else out.push(`쉬운 문항에서의 실점이 없어 기본기가 안정적으로 자리 잡았습니다.`);
 if(hs>0) out.push(`반대로 정답률이 낮은 고난도 문항을 <b>${hs}개</b> 맞혀, 단순 암기를 넘어 개념을 응용하는 힘을 보였습니다.`);
 const sorted=[...r.areaList].filter(a=>a.nQ>=2).sort((a,b)=>a.diff100-b.diff100);
 if(sorted.length){const w=sorted[0],s=sorted[sorted.length-1];
  out.push(`영역별로는 <b>${s.name}</b>가 평균 대비 가장 앞서고, <b>${w.name}</b>가 가장 뒤처집니다. 다음 학습은 ${w.name} 보강을 최우선으로 잡으세요.`);}
 if(r.misc.length) out.push(`오답 <b>${r.misc.length}문항</b> 각각에 대해 어떤 개념이 흔들렸는지 아래 카드에 정리했습니다.`);
 return out;
}
function buildKick(r){
 const pct=r.totalStat?r.totalStat.pct:r.estPct;
 const top=100-pct;
 const tier=pct>=85?'최상위권':pct>=70?'상위권':pct>=50?'중상위권':pct>=30?'중위권':'기초 보강 단계';
 const miss=r.quad.miss.length;
 const areas=[...r.areaList].filter(a=>a.nQ>=2);
 const weak=areas.slice().sort((a,b)=>a.diff100-b.diff100)[0];
 const strong=areas.slice().sort((a,b)=>b.diff100-a.diff100)[0];
 let head;
 if(pct<40) head=`기본기를 다지는 단계입니다. 맞힌 <b>${r.rawCorrect}문항</b>을 발판으로 한 영역씩 쌓아 올리면 됩니다.`;
 else if(miss>0) head=`${tier}, 그러나 충분히 맞힐 <b>${miss*PT}점</b>이 새고 있습니다.`;
 else if(weak&&weak.diff100<0) head=`${tier}. 이제 <b>${weak.name}</b> 한 영역이 분기점입니다.`;
 else head=`약점 없이 균형 잡힌 <b>${tier}</b> 성취입니다.`;
 const chips=[];
 chips.push({v:r.totalStat?`상위 ${top<1?'1':top.toFixed(0)}%`:`백분위 ${pct.toFixed(0)}`,k:r.totalStat?`${r.totalStat.rank}등 / ${r.totalStat.n}명`:'추정 백분위'});
 chips.push(miss>0?{v:`${miss*PT}점`,k:`치명적 실수 ${miss}문항`}:{v:'0',k:'기본 문항 실수'});
 if(strong) chips.push({v:strong.name,k:strong.diff100>0?`최강 영역 · 평균 +${strong.diff100.toFixed(0)}`:`가장 잘한 영역 · ${strong.myAcc.toFixed(0)}%`});
 return {head,chips};
}
function buildRx(r){
 const rx=[];
 if(r.quad.miss.length){const ns=r.quad.miss.map(g=>g.n).sort((a,b)=>a-b).join(", ");rx.push({tag:'<span class="rxi__tag tag-pri">최우선</span>',title:`치명적 실수 ${r.quad.miss.length}문항부터 복구`,body:`${ns}번. 정답률이 높았던 문항입니다. 풀이를 다시 보며 '왜 틀렸는지'를 한 줄로 적어 오답노트에 남기세요. 여기서 ${r.quad.miss.length*PT}점을 즉시 회복할 수 있습니다.`});}
 const weak=[...r.areaList].filter(a=>a.nQ>=2&&a.diff100<0).map(a=>({a,roi:(1-a.myAcc/100)*a.maxPts})).sort((x,y)=>y.roi-x.roi).slice(0,2).map(o=>o.a);
 weak.forEach(w=>{if(w.diff100<0)rx.push({tag:'<span class="rxi__tag tag-area">영역 보강</span>',title:`${w.name} 집중 보강`,body:`평균 대비 ${Math.abs(w.diff100).toFixed(0)}점 낮습니다(정답률 ${w.myAcc.toFixed(0)}%). 해당 영역 유형 문제를 한 세트 더 풀어 격차를 좁히세요.`});});
 if(r.misc.length){r.misc.slice(0,2).forEach(m=>rx.push({tag:'<span class="rxi__tag tag-misc">개념 교정</span>',title:`${m.type} 오개념 교정`,body:`${m.n}번에서 "${m.text}"가 드러났습니다. 해당 개념을 다시 정리하고 같은 유형을 한 번 더 점검하세요.`}));}
 if(r.quad.task.length){const ns=r.quad.task.map(g=>g.n).sort((a,b)=>a-b).join(", ");rx.push({tag:'<span class="rxi__tag tag-area">심화 도전</span>',title:`고난도 미해결 문항 재도전`,body:`${ns}번. 정답률이 낮은 변별 문항입니다. 지금 당장은 아니어도, 위 과제를 끝낸 뒤 도전하면 상위권 굳히기로 이어집니다.`});}
 return rx;
}

 const cmax=Math.max(...counts)||1,x=v=>(v-lo)/((hi-lo)||1)*W,myX=x(r.total);
 let bars=''; for(let i=0;i<bins;i++){const bh=counts[i]/cmax*(H-12);bars+=`<rect x="${i/bins*W}" y="${H-bh}" width="${W/bins-0.8}" height="${bh}" rx="1" fill="rgba(255,255,255,.20)"/>`;}
 return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">${bars}<line x1="${myX}" y1="0" x2="${myX}" y2="${H}" stroke="#EAC983" stroke-width="2"/><circle cx="${myX}" cy="3" r="2.6" fill="#EAC983"/></svg>`;
}

function trendSVG(arr){

/* ====================== 학습 성향 · 요약 · 신뢰도 ====================== */
function learnerPattern(r){
 const pct=r.totalStat?r.totalStat.pct:r.estPct;
 const miss=r.quad.miss.length, hard=r.quad.strength.length;
 const areas=r.areaList.filter(a=>a.nQ>=2), accs=areas.map(a=>a.myAcc);
 const mean=accs.length?accs.reduce((a,b)=>a+b,0)/accs.length:0;
 const variance=accs.length?Math.sqrt(accs.reduce((s,v)=>s+(v-mean)**2,0)/accs.length):0;

  :`지금은 <b>기본 개념을 차근차근 쌓는 단계</b>입니다. 자주 나오는 기본 유형부터 확실히 잡으면 점수가 빠르게 따라옵니다. 조급해하지 않으셔도 됩니다.`)});

 if(trend&&trend.length>=2){ const d=trend[trend.length-1].total-trend[trend.length-2].total;
  F.push({q:'지난 회차보다 점수가 어떻게 변했나요?', a:
   (d>0?`직전 회차보다 <b>${d}점 올랐습니다</b>. 좋은 흐름이니, 하던 방식을 유지하며 약점 영역만 추가로 챙기면 됩니다.`
    :d<0?`직전 회차보다 <b>${Math.abs(d)}점 내렸습니다</b>. 다만 시험마다 난이도와 범위가 달라 한 번의 변동은 흔한 일입니다. 한두 번의 점수보다 <b>여러 회차의 추세</b>를 함께 보는 것이 정확합니다.`
    :`직전 회차와 <b>같은 점수</b>입니다. 약점 영역을 메우면 다음 단계로 올라설 수 있습니다.`)+
   ` 회차별 추이는 리포트의 그래프에서 확인하실 수 있습니다.`}); }

 if(r.totalStat) F.push({q:'백분위와 석차는 어떻게 해석하나요?', a:
  `백분위 <b>${pct.toFixed(0)}</b>은 함께 시험 본 학생 중 <b>${pct.toFixed(0)}%</b>보다 점수가 높다는 뜻입니다. 석차는 <b>${r.totalStat.rank}등</b>입니다. 인원수에 따라 등수의 의미가 달라지기 때문에, 집단이 바뀌어도 비교가 되는 <b>백분위</b>를 함께 보시면 위치를 더 정확히 가늠하실 수 있습니다.`});

 F.push({q:'정답률이 낮은데 맞고, 높은데 틀린 건 무슨 의미인가요?', a:
  `리포트의 '신호등 사분면'은 모든 문항을 <b>난이도(정답률)</b>와 <b>정오</b>의 두 축으로 나눈 것입니다. 정답률이 높은데 틀린 칸이 <b>'치명적 실수'</b>로 가장 먼저 메워야 할 곳이고, 정답률이 낮은데 맞힌 칸은 <b>'심화 강점'</b>으로 응용력이 발휘된 지점입니다.`});

 F.push({q:'집에서 무엇을 도와주면 좋을까요?', a:
  `세 가지면 충분합니다. ① 틀린 문항을 <b>다시 풀고 "왜 틀렸는지" 한 줄</b> 적게 해 주세요. ② 점수 결과보다 <b>다시 풀어오는 과정</b>을 칭찬해 주세요. ③ 모르는 개념은 다음 수업에서 질문하도록 격려해 주세요. 점수로 다그치기보다 <b>꾸준함</b>을 응원해 주시는 것이 이 시기에는 가장 효과적입니다.`});

 F.push({q:'다음 시험까지 어떻게 준비하면 되나요?', a:
  `① ${weak&&weak.diff100<0?`<b>${weak.name}</b> 등 약점 영역`:'정답률이 낮았던 영역'}의 유형을 한 세트 더 풀고, ② ${missN?`이번에 놓친 <b>${missN}개 실수 문항</b>의`:'틀린 문항의'} 오답노트를 완성한 뒤, ③ 다음 진도를 가볍게 예습하는 순서를 권합니다. 무리한 분량보다 <b>약점 한 영역을 확실히</b> 끝내는 편이 점수로 이어집니다.`});

 if(r.misc.length||missN) F.push({q:'오답노트는 어떻게 쓰면 되나요?', a:
  `문항마다 ① <b>내가 고른 답과 정답</b>, ② <b>왜 틀렸는지 한 줄</b>, ③ <b>관련 개념 한 줄</b>이면 충분합니다. 리포트의 '오답 문항 개념 분석'에 문항별로 흔들린 개념을 적어 두었으니, 그대로 옮겨 적게 하시면 가장 빠릅니다.`});

 if(hard>=2&&pct>=70) F.push({q:'화학에 소질이 있나요? 올림피아드를 준비해도 될까요?', a:
  `정답률이 낮은 고난도 문항을 <b>${hard}개</b> 맞혀 <b>응용력</b>을 보였습니다. 본인이 화학에 흥미가 있다면 심화에 도전해 볼 만합니다. 다만 무리한 선행보다 <b>현재 단원을 깊이 있게 숙달</b>하는 것이 먼저이고, 올림피아드는 그 토대가 충분히 쌓인 뒤에 권해 드립니다.`});
 else if(pct<50) F.push({q:'화학에 소질이 있을까요?', a:
  `소질은 타고나는 것이라기보다 <b>기본기가 쌓이면서 드러나는</b> 경우가 많습니다. 지금은 자주 나오는 기본 개념을 확실히 잡는 단계가 가장 효과적입니다. 이 토대가 갖춰지면 어려운 문제도 자연스럽게 풀리기 시작합니다.`});

 F.push({q:'이 점수로 내신이나 입시는 괜찮을까요?', a:
  `이 리포트는 <b>특정 단원의 현재 이해도</b>를 진단하는 도구이지, 내신 등급이나 입시 결과를 예측하지는 않습니다. 지금 드러난 약점을 하나씩 메워 가는 것이 결국 학교 시험과 그 이후의 가장 든든한 토대가 됩니다. 한 번의 점수에 일희일비하기보다 <b>방향</b>을 잡는 자료로 활용해 주세요.`});

 return F;
}

  const tot=ans.map(a=>{let t=0;qs.forEach((q,i)=>{if(+a[i]===q.ans)t++;});return t;});
  const order=tot.map((t,idx)=>({t,idx})).sort((x,y)=>y.t-x.t);

  const el=document.getElementById('ai_'+n);
  if(e.key==='Backspace'&&!el.value){ const p=this.adjInput(n,-1); if(p)p.focus(); e.preventDefault(); }
  else if(e.key==='ArrowRight'){ const x=this.adjInput(n,1); if(x){x.focus();e.preventDefault();} }
  else if(e.key==='ArrowLeft'){ const x=this.adjInput(n,-1); if(x){x.focus();e.preventDefault();} }
  else if(e.key==='Enter'){ e.preventDefault(); this.grade(); }
 },
 pasteAns(e,n){
  e.preventDefault(); this.demo=false;
  const raw=((e.clipboardData||window.clipboardData).getData('text')||'').replace(/[^0-4]/g,'');
  if(!raw)return;
  const qs=this.exam.questions; let i=qs.findIndex(q=>q.n===n);
  for(const ch of raw){ if(i>=qs.length)break; const v=+ch; if(v>=1&&v<=4)this.setAns(qs[i].n,v); else this.clearOne(qs[i].n); i++; }
  this.updateProg();
  const last=qs[Math.min(i,qs.length-1)],le=document.getElementById('ai_'+last.n); if(le)le.focus();
 },
 updateProg(){
  const done=Object.keys(this.answers).length,total=this.exam.questions.length;
  document.getElementById('progTxt').textContent=`${done} / ${total} 입력`;
  document.getElementById('progFill').style.width=(done/total*100)+'%';
  const miss=total-done;
  document.getElementById('progWarn').innerHTML=miss>0?`<span class="warn">미입력 ${miss}문항 (0점 처리)</span>`:`<span style="color:var(--good)">입력 완료</span>`;
 },
 loadSample(){
  const a={};this.exam.questions.forEach(q=>a[q.n]=q.ans);
  const wrong={1:3,4:1,9:2,38:1,33:1,57:1,59:1,24:2};
  Object.entries(wrong).forEach(([n,c])=>a[n]=c);
  this.answers=a; this.demo=true;
  this.idData=Object.assign(this.idData,{name:'홍길동',school:'대치중',grade:'2',date:new Date().toISOString().slice(0,10)});
  this.renderIdForm();
  this.exam.questions.forEach(q=>{const el=document.getElementById('ai_'+q.n);if(el){el.value=a[q.n];el.classList.add('filled');}});
  this.updateProg();
 },
 grade(persist){
  if(persist===undefined) persist=true;
  const id=this.exam.id, qs=this.exam.questions;
  if(persist && !this.demo){
   const missN=qs.length-Object.keys(this.answers).length;
   if(missN>0 && !confirm(`미입력 ${missN}문항은 0점(무응답)으로 처리됩니다. 계속할까요?`)) return;
   let run=1,mx=1,prev=null; for(const q of qs){const v=this.answers[q.n]||0; if(v&&v===prev){run++;mx=Math.max(mx,run);}else run=1; prev=v;}
   if(mx>=15 && !confirm(`같은 답이 ${mx}개 연속입니다. OMR 줄 밀림일 수 있어요. 그대로 진행할까요?`)) return;
  }
  const name=(this.idData.name||'').trim(); this.idData.name=name;
  let oneOff=false;
  if(persist && !this.demo && !name){
   if(confirm('이름이 비어 있어 기록에 누적되지 않습니다. 일회성 리포트로만 생성할까요?')) oneOff=true;
   else { const el=document.getElementById('id_name'); if(el)el.focus(); return; }
  }
  const answers=qs.map(q=>this.answers[q.n]||0).join('');
  if(persist && !this.demo && !oneOff){
   const examno=this.assignExamNo(id,name);
   this.idData.examno=examno;
   this.addSub(id,{name,date:this.idData.date||'',answers,examno,ts:Date.now()});
   this.clearDraft(id);
   const subN=this.subs(id).length; if(subN>0 && subN%20===0) this.toast('백업 권장: 내보내기로 데이터를 저장해 두세요');
  } else if(this.demo){ this.idData.examno=this.idData.examno||''; }
  const cohort=this.cohortFor(id);
  this.cohort=cohort; this.cohortN=cohort.length;
  this.curStats=(this.demo||this.shared)?{N:0,enough:false}:this.examStats(id);
  this.curTrend=(this.idData.examno&&!this.demo&&!this.shared)?this.studentSubs(id,this.idData.examno).map(s=>({date:s.date||'',total:this.subTotal(s)})):null;
  const r=analyze(this.exam,this.answers, cohort.length?cohort:null);
  this.lastR=r;
  const go=()=>{ renderReport(r,id); this.encodeHash(); if(persist && !this.demo && !oneOff) this.saveToSheet(r); this.updateRosterUI(); this.show('report'); if(!this.demo&&!this.shared)this.maybeHintGloss(); };
  if(persist) this.withLoading(go); else go();
 },
 maybeHintGloss(){
  try{ if(localStorage.getItem('chemistreal:hint:gloss'))return; }catch(e){ return; }
  if(!document.querySelector('#report .gloss'))return;
  try{ localStorage.setItem('chemistreal:hint:gloss','1'); }catch(e){}
  setTimeout(()=>this.toast('점선 친 용어(백분위·변별도 등)를 누르면 설명이 나옵니다'),900);
 },
 setAud(a){ this.aud=a; this.rerender(); },
 rerender(){ if(this.lastR&&this.exam){ renderReport(this.lastR,this.exam.id); } },
 revealCards(){
  const rep=document.getElementById('report'); if(!rep)return;
  const cards=rep.querySelectorAll('.sec,.detail,.note');
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce||!('IntersectionObserver' in window)){ rep.classList.remove('reveal'); cards.forEach(c=>c.classList.add('in')); return; }
  rep.classList.add('reveal');
  const io=new IntersectionObserver((ents)=>{ ents.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }); },{rootMargin:'0px 0px -8% 0px',threshold:.06});
  cards.forEach(c=>{ c.classList.remove('in'); io.observe(c); });
  clearTimeout(this._revT); this._revT=setTimeout(()=>cards.forEach(c=>c.classList.add('in')),1600);
 },
 withLoading(fn){
  let o=document.getElementById('loadOv');
  if(!o){o=document.createElement('div');o.id='loadOv';o.className='loadov';o.innerHTML='<div class="loadov__in"><div class="loadov__spin"></div><div class="loadov__t">분석 중</div></div>';document.body.appendChild(o);}
  o.classList.add('on'); setTimeout(()=>{ try{fn();}finally{ o.classList.remove('on'); } },480);
 },
 /* 답안 임시저장(새로고침 복원) */
 draftKey(id){ return 'chemistreal:draft:'+id; },
 saveDraft(){ if(this.demo||!this.exam)return; try{ sessionStorage.setItem(this.draftKey(this.exam.id), JSON.stringify({answers:this.answers,idData:this.idData})); }catch(e){} },
 clearDraft(id){ try{ sessionStorage.removeItem(this.draftKey(id)); }catch(e){} },
 restoreDraft(id){
  try{ const j=JSON.parse(sessionStorage.getItem(this.draftKey(id))); if(j&&j.answers&&Object.keys(j.answers).length){ this.answers=j.answers; this.idData=Object.assign(this.idData,j.idData||{}); this.toast('작성 중이던 답안을 복원했습니다'); return true; } }catch(e){}
  return false;
 },
 /* 구글 시트에서 명단 동기화(JSONP) */
 loadFromSheet(){
  if(!SHEET_ENDPOINT){ this.toast('시트 URL이 설정되지 않았습니다'); return; }
  const id=this.exam.id, cb='__sheetCb'+Date.now();
  const sc=document.createElement('script'); let done=false;
  window[cb]=(res)=>{ done=true; try{
    if(res&&res.ok===false){ this.toast('동기화 거부됨: 키 불일치 또는 권한 문제'); cleanup(); return; }
    const rows=(res&&res.students)||[]; let arr=this.subs(id); const tomb=this.deletedSet(id);
    const seen=new Set(arr.map(x=>this.sig(x)));
    let n=0; rows.forEach(rec=>{ if(!rec||!rec.answers)return; const a=String(rec.answers).replace(/[^0-4]/g,''); if(a.length<qsLen)return; rec.answers=a; const sg=this.sig(rec); if(seen.has(sg)||tomb.has(sg))return; seen.add(sg); rec.ts=rec.ts||Date.now()+n; arr.push(rec); n++; });
    this.saveSubs(id,arr); this.reconcile(id); this.updateRosterUI(); this.toast(n?`시트에서 ${n}건 동기화`:'시트와 이미 동일합니다');
   }catch(e){ this.toast('동기화 처리 오류'); } cleanup(); };
  const qsLen=this.exam.questions.length;
  const cleanup=()=>{ try{delete window[cb];}catch(e){window[cb]=undefined;} if(sc.parentNode)sc.parentNode.removeChild(sc); };
  sc.onerror=()=>{ if(!done){ this.toast('시트 연결 실패: 배포·권한을 확인하세요'); cleanup(); } };
  sc.src=SHEET_ENDPOINT+(SHEET_ENDPOINT.includes('?')?'&':'?')+'action=list&exam='+encodeURIComponent(id)+'&key='+encodeURIComponent(this.syncKey())+'&callback='+cb;
  document.body.appendChild(sc);
  setTimeout(()=>{ if(!done){ this.toast('시트 응답이 없습니다(타임아웃)'); cleanup(); } },8000);
 },
 saveToSheet(r){
  if(this.demo || this.shared || !SHEET_ENDPOINT) return;
  const qs=this.exam.questions;
  const payload={
   key:this.syncKey(),
   name:this.idData.name||'', examno:this.idData.examno||'', school:this.idData.school||'', grade:this.idData.grade||'',
   date:this.idData.date||'', exam:this.exam.title,
   total:r.total, max:r.maxTotal, pct100:+r.my100.toFixed(1),
   percentile:r.totalStat?+r.totalStat.pct.toFixed(1):(r.estPct!=null?+r.estPct.toFixed(1):''),
   rank:r.totalStat?r.totalStat.rank:'', n:r.totalStat?r.totalStat.n:'',
   correct:r.rawCorrect,
   areas:r.areaList.map(a=>`${a.name} ${a.pts}/${a.maxPts}`).join(', '),
   answers:qs.map(q=>this.answers[q.n]||0).join(''),
   link:this.shareLink()
  };
  try{
   fetch(SHEET_ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
    .then(()=>this.toast('구글 시트로 전송했습니다'))
    .catch(()=>{});
  }catch(e){}
 },
 toast(msg){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t);}
  t.textContent=msg; t.classList.add('on');
  clearTimeout(this._tt); this._tt=setTimeout(()=>t.classList.remove('on'),2200);
 },
 hashStr(){
  const qs=this.exam.questions; let num=0n;
  for(let i=qs.length-1;i>=0;i--){ num=num*5n+BigInt(this.answers[qs[i].n]||0); }
  const nm=encodeURIComponent((this.idData.name||'').trim()), no=this.idData.examno||'';
  return 'r='+this.exam.id+'.'+num.toString(36)+((nm||no)?('.'+no+'.'+nm):'');
 },
 shareLink(){ return location.origin+location.pathname+'#'+this.hashStr(); },
 encodeHash(){ location.hash=this.hashStr(); },
 share(btn){
  const done=()=>{const o=btn.textContent;btn.textContent='복사됨 ✓';setTimeout(()=>btn.textContent=o,1500);};
  if(navigator.clipboard){navigator.clipboard.writeText(location.href).then(done).catch(done);}
  else{const t=document.createElement('textarea');t.value=location.href;document.body.appendChild(t);t.select();try{document.execCommand('copy');}catch(e){}t.remove();done();}
 },
boot_hooks(){
  document.addEventListener('click',(e)=>this.glossPop(e));
  document.addEventListener('keydown',(e)=>{
   if(e.key==='Escape'){ const p=document.getElementById('glosspop'); if(p)p.classList.remove('on'); return; }
   if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('gloss')){ e.preventDefault(); this.glossPop({target:e.target,stopPropagation(){}}); }
  });
  window.addEventListener('beforeprint',()=>{ document.querySelectorAll('details:not([open])').forEach(d=>{ d.dataset.wasClosed='1'; d.open=true; }); document.querySelectorAll('#report .sec,#report .detail,#report .note').forEach(c=>c.classList.add('in')); });
  window.addEventListener('afterprint',()=>{ document.querySelectorAll('details[data-was-closed]').forEach(d=>{ d.open=false; delete d.dataset.wasClosed; }); });
 },
 boot(){
  this.boot_hooks();
  this.renderExamList();this.renderNav('select');
  this.loadExternalExams();
  const m=location.hash.match(/r=([^.]+)\.([0-9a-z]+)(?:\.([^.]*)\.(.*))?$/);
  if(m){const ex=EXAMS.find(e=>e.id===m[1]);if(ex&&!ex.disabled){this.openExam(ex.id);this.demo=false;this.shared=true;document.body.classList.add('shared-mode');let n=0n;for(const c of m[2])n=n*36n+BigInt(parseInt(c,36));ex.questions.forEach(q=>{const v=Number(n%5n);n=n/5n;if(v)this.setAns(q.n,v);});if(m[3])this.idData.examno=m[3];if(m[4])this.idData.name=decodeURIComponent(m[4]);this.renderIdForm();this.updateProg();this.grade(false);return;}}
  this.show('select');
 }
};
window.App=App;
App.boot();
</script>
