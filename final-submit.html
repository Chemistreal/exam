<title>조준모의고사 · 답안 제출 · Chemistreal</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<meta property="og:title" content="조준모의고사 · 답안 제출">
<meta property="og:description" content="이름·학교·답안을 입력하면 자동 채점되어 선생님께 제출됩니다.">

<style>
:root{--teal:#3A7A6B;--teal-d:#0c3a32;--cream:#F7F4EC;--ink:#23201b;--muted:#776f62;--line:#e7e1d4;--brass:#B08D57}
*{box-sizing:border-box}
body{margin:0;background:#efe9dc;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 60px}
.brand{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);font-weight:700;margin:6px 0 2px}
h1{font-size:20px;margin:2px 0 12px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin:10px 0;box-shadow:0 1px 2px rgba(28,24,18,.05)}
.exlist .g{margin:14px 0 4px;font-size:12px;font-weight:700;color:var(--muted)}
.exbtn{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin:7px 0;font-size:15px;color:var(--ink);cursor:pointer;font-weight:600}
.exbtn:active{background:var(--cream)}
.exbtn small{color:var(--muted);font-weight:500;font-size:12px}
label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px;font-weight:600}
input.txt{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:16px;background:#fff}
input.txt:focus{border-color:var(--teal);outline:none}
.row2{display:flex;gap:10px}.row2>div{flex:1}
.omr{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:7px 6px;margin-top:8px}
.qc{display:flex;flex-direction:column;align-items:center}
.qc__n{font-size:11.5px;color:var(--muted);margin-bottom:2px}
.qc input{width:100%;height:38px;text-align:center;font-size:17px;border:1.5px solid var(--line);border-radius:9px;background:#fff}
.qc input:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 3px rgba(58,122,107,.13)}
.qc input.on{border-color:var(--teal);background:var(--cream);color:var(--teal-d);font-weight:700}
.qc.allc input{background:#fdf6e3;border-style:dashed}.qc.allc .qc__n{color:var(--brass,#9a7b2f);font-weight:700}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;background:var(--teal);color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:16px}
.btn:disabled{background:#c3bdae;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--teal);border:1.5px solid var(--teal)}
.hint{font-size:12px;color:var(--muted);margin:8px 0}
.prog{font-size:12.5px;color:var(--muted);margin-top:6px}
.hero{background:linear-gradient(135deg,#3A7A6B 0%,#0c3a32 60%,#0f221e 100%);color:#F4F1E8;border-radius:16px;padding:22px 20px;margin:6px 0 14px}
.hero .tier{font-size:32px;font-weight:800;color:#EAC983;margin-bottom:4px}
.hero .stats{display:flex;flex-wrap:wrap;gap:0;margin-top:14px;border-top:1px solid rgba(255,255,255,.15);padding-top:12px}
.hero .st{padding:2px 18px;border-left:1px solid rgba(255,255,255,.15)}
.hero .st:first-child{padding-left:0;border-left:none}
.hero .st b{display:block;font-size:19px;color:#EAC983}
.hero .st span{font-size:11.5px;color:rgba(244,241,232,.72)}
.arow{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line)}
.ok{color:var(--teal);font-weight:700}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#23201b;color:#fff;padding:10px 16px;border-radius:9px;font-size:13px;z-index:99;opacity:0;transition:opacity .25s;max-width:88%;text-align:center}
.toast.on{opacity:1}
.back{background:none;border:none;color:var(--teal);font-size:14px;padding:6px 0;cursor:pointer}
footer{margin-top:26px;text-align:center;font-size:11.5px;color:var(--muted)}
.pdfcard{padding:12px 12px}
.pdfbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pdfbar label{margin:0}
.pdfopen{font-size:13px;font-weight:700;color:#fff;background:var(--teal);text-decoration:none;border-radius:9px;padding:8px 12px;white-space:nowrap}
.pdfopen:active{background:var(--teal-d)}
.pdfframe{width:100%;height:74vh;min-height:440px;border:1px solid var(--line);border-radius:10px;margin-top:9px;background:#f3efe6}
.pdftoggle{background:none;border:1.5px solid var(--line);border-radius:9px;color:var(--ink);font-size:13px;font-weight:600;padding:7px 11px;cursor:pointer}
.pdfhidden .pdfframe{display:none}
/* 시험을 본 뒤 받아 가는 자료. final.html 성적표와 같은 모양으로 둔다 —
   같은 학생이 두 화면에서 다른 것을 보면 어느 쪽이 진짜인지 모른다. */
a.pdf{display:inline-flex;align-items:center;gap:6px;color:var(--teal);font-weight:600;text-decoration:none;font-size:14px}
.assets{display:flex;flex-wrap:wrap;gap:14px;margin:8px 0 2px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--cream)}
.assets a.pdf{font-size:13.5px}
</style>

/* exams.json 이 최신이지만, 그 파일 하나가 늦게 온다고 앱 전체가 죽어서는 안 된다.
   실제로 배포 직후 CDN 전파 시차 때문에 성적표 링크로 들어온 학생이
   "시험 목록을 불러오지 못했습니다 · HTTP 404" 만 보고 끝난 일이 있었다.
   분리하기 전에는 이 파일이 자체 완결이라 없던 문제다. 세 겹으로 받는다.
     1) exams.json (짧게 두 번까지 다시 시도)
     2) 서비스워커가 캐시해 둔 것
     3) 이 파일에 심어 둔 예비본 FALLBACK_EXAMS
   예비본은 손으로 관리하는 사본이 아니다. tools/gen_exam_fallback.py 가
   exams.json 에서 심고 CI 가 매번 대조하므로 갈라질 수 없다. */
async function loadExams(){
  for(var attempt=0;attempt<2;attempt++){
    try{
      var res=await fetch('exams.json',{cache:'no-store'});
      if(res.ok){
        var list=await res.json();
        if(Array.isArray(list)&&list.length) return list;
      }
    }catch(e){}
    if(attempt===0) await new Promise(function(r){ setTimeout(r,600); });
  }
  try{
    if(window.caches){
      var hit=await caches.match('exams.json');
      if(!hit) hit=await caches.match(new URL('exams.json',location.href).pathname);
      if(hit){ var cached=await hit.json();
        if(Array.isArray(cached)&&cached.length){ console.warn('[exams] 캐시본 사용'); return cached; } }
    }
  }catch(e){}
  // const 로 선언한 것은 window 에 붙지 않으므로 이름으로 직접 본다.
  if(typeof FALLBACK_EXAMS!=='undefined'&&Array.isArray(FALLBACK_EXAMS)&&FALLBACK_EXAMS.length){
    console.warn('[exams] exams.json 을 받지 못해 예비본으로 진행');
    return FALLBACK_EXAMS.slice();
  }

function award(W,cut){let idx=cut.findIndex(c=>W<=c);const inA=idx!==-1;if(!inA)idx=5;const name=inA?TIERS[idx]:'수상권 밖';
  let nextTier=null,gap=null,reach=false;if(idx>0){const n=inA?idx-1:4;nextTier=TIERS[n];gap=W-cut[n];reach=gap>=1&&gap<=2;}return{name,idx,inA,nextTier,gap,reach};}
/* 이름은 URL 에 그대로 적지 않는다. final.html 의 encName/decName 과 같아야 한다
   (tests/final-submit-sync.js 가 hashStrFinal 이 갈라지는 것을 잡는다).
   base64 는 암호가 아니다 — 눈에 띄어 새는 것을 막을 뿐이다. */
function encName(nm){
  var s=(nm||'').trim(); if(!s) return '';
  try{
    var bytes=new TextEncoder().encode(s), bin='';
    for(var i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]);
    return '~'+btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }catch(e){ return encodeURIComponent(s); }
}
function hashStrFinal(cur,sel,nm,exno){ let num=0n; for(let q=cur.nQ;q>=1;q--){ num=num*5n+BigInt(sel[q]||0); } const en=encName(nm), no=(exno||''); return 'r='+cur.id+'.'+num.toString(36)+((en||no)?('.'+no+'.'+en):''); }
/* ======================================================================
   /SHARED — 아래는 학생 제출 페이지 전용
   ====================================================================== */
const GROUPS=[['JMChC','JMChC 모의고사'],['동형','기출 동형'],['산과염기','산·염기 집중'],['2026','KMChC 2026'],['2025','KMChC 2025'],['2024','KMChC 2024'],['이전','KMChC 이전 기출']];
const app=document.getElementById('app');
let cur=null, sel={}, LOCKED=false, SUBMITTING=false;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
/* ── 시험을 본 **뒤** 학생이 받아 가는 자료 (선생님 요청 2026-08-13) ────────
   이 화면은 학생이 답안을 내고 처음 보는 자리인데, 문제지도 해설도 없었다.
   틀린 문항을 다시 보려면 문제가 있어야 하는데, 답을 넣던 화면을 떠나는
   순간 손에서 사라졌다.

   ⚠ **채점이 끝난 뒤**에만 건다. 답을 넣기 전 화면(`problemPanel`)에는
   문제지만 걸린다 — 거기로 정답이 새면 시험이 시험이 아니다.

   ⚠ 아래 두 함수는 final.html 에 **글자 그대로 같은 것이 있다.** 한쪽만
   고치면 학생이 두 화면에서 다른 자료를 받는다 —
   tests/final-submit-sync.js 가 두 벌을 맞대어 본다. */
function examSolLabel(exam){
  return (exam && exam.solFull) ? '정답 · 문항별 해설' : '정답 · 개념표';
}
function examMaterialsHTML(exam){
  if(!exam) return '';
  var out=[];
  if(exam.pdf) out.push('<a class="pdf" href="'+esc(exam.pdf)+'" download>문제지 PDF ↓</a>');
  if(exam.answerPdf) out.push('<a class="pdf" href="'+esc(exam.answerPdf)+'" download>공식 정답 PDF ↓</a>');
  if(exam.bookPdf) out.push('<a class="pdf" href="'+esc(exam.bookPdf)+'" download>문제편·해설편 PDF ↓</a>');
  out.push('<a class="pdf" href="sol-final-'+esc(exam.id)+'.html" target="_blank" rel="noopener">'
    +examSolLabel(exam)+' ↗</a>');
  return '<div class="assets">'+out.join('')+'</div>';
}
/* ── 답안 임시저장/복원: 60문항을 풀다 새로고침·이탈해도 이어서 작성 ── */
const DRAFT_PFX='chemistreal:finalsubmit:draft:';
function draftKey(id){ return DRAFT_PFX+id; }
function saveDraft(){ try{ if(!cur)return;
  var nm=(document.getElementById('nm')||{}).value||'', sch=(document.getElementById('sch')||{}).value||'', grd=(document.getElementById('grd')||{}).value||'';
  var hasAny=Object.keys(sel).length||nm||sch||grd;
  if(!hasAny){ try{localStorage.removeItem(draftKey(cur.id));}catch(e){} return; }
  localStorage.setItem(draftKey(cur.id), JSON.stringify({sel:sel,nm:nm,sch:sch,grd:grd,ts:Date.now()}));
}catch(e){} }
function loadDraft(id){ try{ return JSON.parse(localStorage.getItem(draftKey(id))||'null'); }catch(e){ return null; } }
function clearDraft(id){ try{ localStorage.removeItem(draftKey(id)); }catch(e){} }
function toast(m){ let t=document.getElementById('toast'); if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t);} t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2600); }
function shareLink(cur,sel,nm,exno){ return location.origin+location.pathname.replace(/[^/]*$/,'final.html')+'#'+hashStrFinal(cur,sel,nm,exno); }

function renderList(){
  cur=null; sel={};
  let h='<div class="brand">Chemistreal · 조준모 화학</div><h1>답안 제출</h1>'
    +'<div class="hint">시험을 고르고 이름·학교·답안을 입력하면 자동 채점되어 선생님께 제출됩니다.</div><div class="exlist">';
  GROUPS.forEach(([g,label])=>{
    const list=FINAL_EXAMS.filter(e=>e.group===g);
    if(!list.length) return;
    h+='<div class="g">'+esc(label)+'</div>';
    list.forEach(e=>{ const nQ=e.nQ||(e.key?e.key.length:0);
      h+='<button class="exbtn" onclick="openExam(\''+e.id+'\')"><span>'+esc(e.title)+'</span><small>'+nQ+'문항</small></button>'; });
  });
  h+='</div><footer>Chemistreal Final · 학생 제출용</footer>';
  app.innerHTML=h; window.scrollTo(0,0);
}

/* 문제지 PDF 뷰어(있을 때만). 데스크톱은 인라인, 모바일은 '전체 화면으로 열기'로 네이티브 뷰어 */
function problemPanel(exam){
  if(!exam.pdf) return '';
  const url=esc(exam.pdf);
  return '<div class="card pdfcard" id="pdfcard">'
    +'<div class="pdfbar"><label>📄 문제지 · 먼저 풀어 보세요</label>'
    +'<span style="display:flex;gap:7px"><button type="button" class="pdftoggle" onclick="togglePdf()" id="pdftgl">접기</button>'
    +'<a class="pdfopen" href="'+url+'" target="_blank" rel="noopener">전체 화면 ↗</a></span></div>'
    +'<div class="hint">문제를 읽고 아래에 답안을 입력해 제출하세요. 휴대폰에서 문제가 안 보이면 <b>전체 화면 ↗</b>을 누르세요.</div>'
    +'<iframe class="pdfframe" src="'+url+'#view=FitH" title="문제지" loading="lazy"></iframe>'
    +'</div>';
}
function togglePdf(){ const c=document.getElementById('pdfcard'), b=document.getElementById('pdftgl');
  if(!c)return; const hid=c.classList.toggle('pdfhidden'); if(b)b.textContent=hid?'문제 보기':'접기'; }

function openExam(id){
  SUBMITTING=false;
  cur=FINAL_EXAMS.find(e=>e.id===id); sel={};
  const nQ=cur.nQ||cur.key.length; const ac=allcSet(cur);
  /* 전원정답(삭제·취소) 문항. 칸은 잠그지 않는다 — 답안을 한 번에 붙여 넣을 때
     잠긴 칸이 있으면 그 뒤 문항이 통째로 한 칸씩 밀린다. 비워 두어도 정답이다. */
  let omr='';
  for(let q=1;q<=nQ;q++){ const m=ac.has(q);
    omr+='<div class="qc'+(m?' allc':'')+'"'+(m?' title="전원정답 · 비워 두어도 됩니다"':'')+'><span class="qc__n">'+q+'</span>'
      +'<input aria-label="'+q+'번 답" id="a'+q+'" inputmode="numeric" maxlength="1" oninput="onIn('+q+',this)" onkeydown="onKey(event,'+q+')"></div>';
  }
  app.innerHTML=(LOCKED?'<div class="brand">Chemistreal · 조준모 화학</div>':'<button class="back" onclick="renderList()">‹ 시험 목록</button>')
    +'<h1 style="font-size:18px">'+esc(cur.title)+'</h1>'
    +problemPanel(cur)
    +'<div id="draftnote"></div>'
    +'<div class="card"><label for="nm">이름 *</label><input class="txt" id="nm" autocomplete="off" oninput="saveDraft()">'
    +'<div class="row2"><div><label for="sch">학교 *</label><input class="txt" id="sch" autocomplete="off" oninput="saveDraft()"></div>'
    +'<div><label for="grd">학년</label><input class="txt" id="grd" inputmode="numeric" placeholder="예: 2" autocomplete="off" oninput="saveDraft()"></div></div></div>'
    +'<div class="card"><label>답안 (1~4)</label><div class="hint">숫자를 입력하면 다음 칸으로 넘어갑니다. 답안 숫자열을 붙여넣으면 한 번에 채워집니다.</div>'
    +'<div class="omr" id="omr" onpaste="onPaste(event)">'+omr+'</div>'
    +'<div class="prog" id="prog"></div></div>'
    +'<button class="btn" id="submit" onclick="submitAns()">제출하기</button>';
  restoreDraft(id);
  updateProg(); window.scrollTo(0,0);
  const f=document.getElementById('nm'); if(f&&!f.value) f.focus();
}
/* 저장된 임시 답안을 화면에 복원(있을 때만) */
function restoreDraft(id){
  var d=loadDraft(id); if(!d) return;
  try{
    if(d.sel&&typeof d.sel==='object'){ Object.keys(d.sel).forEach(function(q){ var v=+d.sel[q]; if(v>=1&&v<=4){ sel[q]=v; var el=document.getElementById('a'+q); if(el){ el.value=v; el.classList.add('on'); } } }); }
    var nm=document.getElementById('nm'); if(nm&&d.nm) nm.value=d.nm;
    var sch=document.getElementById('sch'); if(sch&&d.sch) sch.value=d.sch;
    var grd=document.getElementById('grd'); if(grd&&d.grd) grd.value=d.grd;
  }catch(e){}
  var done=Object.keys(sel).length;
  var when=''; try{ when=new Date(d.ts).toLocaleString('ko-KR'); }catch(e){}
  var note=document.getElementById('draftnote');
  if(note) note.innerHTML='<div class="card" style="border-color:#B8912E;background:#fffdf3;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">'
    +'<span style="font-size:13px;color:#6b5a1f">작성하던 답안을 불러왔습니다 · '+done+'문항'+(when?' · '+esc(when):'')+'</span>'
    +'<button type="button" class="pdftoggle" onclick="discardDraft()">새로 시작</button></div>';
}
/* 저장된 임시 답안 폐기 후 빈 상태로 다시 시작 */
function discardDraft(){ if(!cur) return; if(!confirm('작성하던 답안을 지우고 새로 시작할까요?')) return; clearDraft(cur.id); var id=cur.id; openExam(id); }

function onIn(q,el){ let v=el.value.replace(/[^1-4]/g,''); v=v?v.slice(-1):''; el.value=v;
  if(v){ sel[q]=+v; el.classList.add('on'); const nx=document.getElementById('a'+nextQ(q)); if(nx&&nextQ(q)!==q)nx.focus(); }
  else { delete sel[q]; el.classList.remove('on'); } updateProg(); saveDraft(); }
function onKey(e,q){ if(e.key==='Backspace'&&!e.target.value){ const p=document.getElementById('a'+prevQ(q)); if(p){p.focus();e.preventDefault();} } }
function nextQ(q){ const nQ=cur.nQ||cur.key.length; return q<nQ?q+1:q; }
function prevQ(q){ return q>1?q-1:q; }
function onPaste(e){ e.preventDefault(); const raw=((e.clipboardData||window.clipboardData).getData('text')||'').replace(/[^0-4]/g,''); if(!raw)return;
  const nQ=cur.nQ||cur.key.length; let i=1;
  for(const ch of raw){ if(i>nQ)break; const v=+ch; const el=document.getElementById('a'+i);
    if(v>=1&&v<=4){ sel[i]=v; if(el){el.value=v;el.classList.add('on');} } i++; }
  updateProg(); saveDraft(); }
function updateProg(){ const nQ=cur.nQ||cur.key.length; const ac=allcSet(cur); let tot=0,done=0;
  /* 전원정답 문항은 비워 두어도 되므로 '작성해야 할 것' 에 넣지 않는다. */
  for(let q=1;q<=nQ;q++){ if(ac.has(q))continue; tot++; if(sel[q])done++; }
  const el=document.getElementById('prog'); if(el)el.textContent='작성 '+done+' / '+tot+' 문항'+(done<tot?' · 미작성 '+(tot-done)+'개':' · 모두 작성됨'); }

function submitAns(){
  if(SUBMITTING) return; // 이미 제출 진행/완료 — 중복 호출 무시(제출 후 DOM 교체 전 연타 방지)
  const nm=nameKey(document.getElementById('nm').value);
  const sch=(document.getElementById('sch').value||'').trim();
  const grd=(document.getElementById('grd').value||'').trim();
  if(!nm){ toast('이름을 입력하세요'); document.getElementById('nm').focus(); return; }
  if(!sch){ toast('학교를 입력하세요'); document.getElementById('sch').focus(); return; }
  const nQ=cur.nQ||cur.key.length; const ac=allcSet(cur);
  let unfilled=0; for(let q=1;q<=nQ;q++){ if(ac.has(q))continue; if(!sel[q])unfilled++; }
  if(unfilled && !confirm(unfilled+'문항이 비어 있습니다. 무응답으로 제출할까요?')) return;
  // 중복 제출 방지(검증 통과 후 잠금 — 버튼 연타·DOM 교체 전 재호출로 시트에 중복 행이 쌓이는 것을 막는다)
  SUBMITTING=true;
  var _btn=document.getElementById('submit'); if(_btn){ _btn.disabled=true; _btn.textContent='제출 중…'; }

  // ── 채점 (final.html scoreAuto와 동일 규칙) ──
  let correct=0,total=0; const wrong=[];
  for(let q=1;q<=nQ;q++){ total++; const a=sel[q]||0;
    if(okq(cur,q,a))correct++; else wrong.push({q,a}); }
  const pct=total?Math.round(correct/total*100):0;
  const rs=finalRawScore(cur,correct,wrong);
  const broad=a=>RX[a]?a:(RXMAP[a]||a); const ag={};
  if(cur.area) for(let q=1;q<=nQ;q++){ const bd=broad(cur.area[q-1]||''); if(!bd)continue; (ag[bd]=ag[bd]||{c:0,t:0}); ag[bd].t++; if(okq(cur,q,sel[q]||0))ag[bd].c++; }
  const areas=Object.keys(ag).map(d=>d+' '+ag[d].c+'/'+ag[d].t).join(', ');
  const ans=[]; for(let q=1;q<=nQ;q++) ans.push(sel[q]||0);

  // ── 시트 payload (final.html saveToSheetFinal과 동일 형식 · 학교 채움) ──
  const payload={ name:nm, examno:'', school:sch, grade:grd,
    date:new Date().toISOString().slice(0,10), exam:cur.title,
    total:correct, max:total, pct100:pct,
    percentile:'', rank:'', n:'',
    correct:correct, areas:areas, answers:ans.join(''), link:shareLink(cur,sel,nm) };
  try{ fetch(SHEET_ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
    toast('제출되었습니다 · '+nm);
  }catch(e){ toast('전송 호출 실패 — 다시 시도하세요'); }
  clearDraft(cur.id); // 제출 완료 → 임시저장 답안 삭제

  showResult(nm,sch,cur,correct,total,pct,rs,wrong);
}

function showResult(nm,sch,exam,correct,total,pct,rs,wrong){
  const W=wrong.length; const a=award(W,exam.cut||[0,4,9,13,18]);
  const broad=x=>RX[x]?x:(RXMAP[x]||x);
  // 영역 요약
  const ag2={}; if(exam.area){ const nQ=exam.nQ||exam.key.length;
    for(let q=1;q<=nQ;q++){ const bd=broad(exam.area[q-1]||''); if(!bd)continue; (ag2[bd]=ag2[bd]||{c:0,t:0}); ag2[bd].t++; if(okq(exam,q,sel[q]||0))ag2[bd].c++; } }
  const arows=Object.keys(ag2).sort((x,y)=>(ag2[x].c/ag2[x].t)-(ag2[y].c/ag2[y].t))
    .map(d=>'<div class="arow"><span>'+esc(d)+'</span><span>'+ag2[d].c+' / '+ag2[d].t+'</span></div>').join('');
  app.innerHTML='<div class="brand">Chemistreal · 조준모 화학</div>'
    +'<h1 style="font-size:18px">'+esc(exam.title)+' · 제출 완료</h1>'
    +'<div class="hint">'+esc(nm)+' · '+esc(sch)+' 학생, 선생님께 제출되었습니다.</div>'
    +'<div class="hero"><div class="tier">'+a.name+'</div>'
    +'<div class="stats">'
    +'<div class="st"><b>'+rs.score+' / '+(total*3)+'</b><span>원점수'+(rs.pen?' · 오답 −1':'')+'</span></div>'
    +'<div class="st"><b>'+correct+' / '+total+'</b><span>맞은 개수</span></div>'
    +'<div class="st"><b>'+pct+'%</b><span>정답률</span></div>'
    +'</div></div>'
    +(arows?'<div class="card"><label>영역별 정답 (약한 순)</label>'+arows+'</div>':'')
    +'<div class="card ok" style="text-align:center">✓ 답안이 선생님께 전송되었습니다</div>'
    +'<div class="card"><label>시험지 · 해설 내려받기</label>'
    +'<div class="hint">틀린 문항을 문제지에서 다시 읽고, 해설로 확인하세요.</div>'
    +examMaterialsHTML(exam)+'</div>'
    +(LOCKED?'':'<button class="btn ghost" onclick="renderList()">다른 시험 제출</button>')
    +'<footer>Chemistreal Final · 학생 제출용</footer>';
  window.scrollTo(0,0);
}

/* ?exam=<회차id> 로 특정 시험에 바로 진입(회차별 링크). 없으면 전체 목록 */
function boot(){
  let id=null;
  try{ id=new URLSearchParams(location.search).get('exam'); }catch(e){}
  if(!id){ const m=location.hash.match(/exam=([\w-]+)/); if(m)id=m[1]; }
  if(id && FINAL_EXAMS.some(e=>e.id===id)){ LOCKED=true; openExam(id); return; }
  /* 링크로 들어온 게 아니면, 쓰다 만 답안이 있는 시험을 자동으로 다시 연다.
     임시 저장은 원래도 있었지만 시험 **id 로** 저장돼서, 학생이 실수로 새로
     고치면 시험 목록으로 떨어지고 자기가 무슨 회차를 풀던 중이었는지 스스로
     기억해 다시 눌러야 복원됐다. 60문항 중간에 그건 사실상 잃어버린 것과 같다. */
  var last=lastDraftId();
  if(last){ openExam(last); return; }
  renderList();
}
/* 임시 답안이 남아 있는 시험 중 가장 최근 것. 없으면 null. */
function lastDraftId(){
  try{
    var best=null, bestTs=0;
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k.indexOf(DRAFT_PFX)!==0) continue;
      var id=k.slice(DRAFT_PFX.length);
      if(!FINAL_EXAMS.some(function(e){return e.id===id;})) continue;
      var d=JSON.parse(localStorage.getItem(k)||'null');
      if(d&&d.sel&&Object.keys(d.sel).length&&(d.ts||0)>bestTs){ bestTs=d.ts||0; best=id; }
    }
    return best;
  }catch(e){ return null; }
}
/* 시험 목록을 받아 온 뒤에 화면을 그린다. */
async function start(){
  FINAL_EXAMS=await loadExams();
  if(!FINAL_EXAMS){
    var app=document.getElementById('app');
    if(app) app.innerHTML='<div class="card" style="border-color:#B0512F;color:#8a2f1d">'
      +'시험 목록을 불러오는 중입니다… 잠시 뒤 자동으로 다시 시도합니다.</div>';
    setTimeout(start,5000);
    return;
  }
  boot();
}
start();

</script>
