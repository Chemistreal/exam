<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>조준모의고사 0회 · 자기채점 성적표</title>
<meta name="description" content="조준모의고사 0회 — 이름과 답안을 입력하면 바로 성적표가 나옵니다. 60문항·각 3점·총 180점.">
<meta property="og:title" content="조준모의고사 0회 · 자기채점 성적표">
<meta property="og:description" content="이름과 답안을 입력하면 바로 성적표가 나옵니다. 영역별 정오·취약 개념·문항별 해설.">
<meta property="og:image" content="https://chemistreal.github.io/exam/og.png">
<style>
:root{--paper:#F4EFE6;--paper-soft:#FBFAF6;--surface:#FBF8F1;--surface-2:#F6F1E7;--ink:#1C1812;--ink-2:#40392F;--ink-3:#796f61;--ink-4:#7a6f5d;--line:#E6DECF;--line-2:#EFE7D6;--line-3:#D6CAB3;--teal:#0E7A6E;--teal-d:#0A5C53;--teal-t:#E2EFEC;--brass:#A07E2B;--brass-d:#7A5E1C;--gold:#C9A24B;--emerald:#2E7D5B;--rose:#B23A6B;--amber:#BD7A12;
--serif:"Hahmlet","Noto Serif KR",Georgia,serif;--sans:"IBM Plex Sans KR","Noto Sans KR",-apple-system,system-ui,sans-serif;--mono:"IBM Plex Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);color:var(--ink);background:radial-gradient(130% 90% at 50% -12%,#FCFAF4 0%,var(--paper-soft) 34%,var(--paper) 100%) fixed;line-height:1.55;font-size:14px;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 120px}
.kick{font-family:var(--mono);font-size:11.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--brass-d);font-weight:600}
.h1{font-family:var(--serif);font-size:25px;font-weight:600;letter-spacing:-.015em;margin:4px 0 2px}
.sub{color:var(--ink-3);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 16px 38px -30px rgba(28,24,18,.4)}
label.fld{display:block;margin:0 0 10px}
label.fld span{display:block;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
input.txt{width:100%;font-family:var(--sans);font-size:15px;padding:11px 13px;border:1px solid var(--line-3);border-radius:10px;background:var(--paper-soft);color:var(--ink)}
input.txt:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-t)}
.row2{display:flex;gap:10px}.row2 .fld{flex:1}
.omr-h{font-size:12.5px;color:var(--ink-3);margin-bottom:12px}.omr-h b{color:var(--teal-d)}
.omr{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:8px 7px}
.omr-cell{display:flex;flex-direction:column;align-items:center;gap:3px}
.omr-n{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.omr-in{width:100%;max-width:46px;text-align:center;font-family:var(--mono);font-size:16px;padding:8px 0;border:1px solid var(--line-3);border-radius:8px;background:var(--paper-soft);color:var(--ink);-moz-appearance:textfield}
.omr-in:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-t)}
.omr-in.filled{background:var(--teal-t);border-color:var(--teal);color:var(--teal-d);font-weight:700}
.qc{padding:14px 15px;border:1px solid var(--line-2);border-radius:12px;background:var(--paper-soft);margin:11px 0}
.qc__h{display:flex;gap:9px;align-items:baseline;margin-bottom:7px}
.qc__no{font-family:var(--mono);font-weight:600;color:var(--brass-d);font-size:13px;min-width:26px}
.qc__area{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-4);border:1px solid var(--line-2);border-radius:5px;padding:1px 6px;white-space:nowrap}
.qc__stem{font-size:14.5px;color:var(--ink);white-space:pre-wrap}
.qc__fig{font-size:12px;color:var(--ink-3);font-style:italic;margin-top:5px;padding-left:9px;border-left:2px solid var(--line-2)}
.opts{display:grid;gap:7px;margin-top:11px}
.opt{display:flex;gap:9px;align-items:center;width:100%;text-align:left;font-family:var(--sans);font-size:14px;color:var(--ink-2);padding:9px 12px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);cursor:pointer;transition:.1s}
.opt:hover{border-color:var(--line-3)}
.opt.sel{border-color:var(--teal);background:var(--teal-t);color:var(--ink);font-weight:600}
.opt.sel .dot{background:var(--teal);color:#fff;border-color:var(--teal)}
.dot{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--line-3);display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(251,248,241,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:20}
.bar .in{max-width:760px;margin:0 auto;display:flex;gap:12px;align-items:center}
.prog{flex:1;font-size:12.5px;color:var(--ink-3)}
.prog b{color:var(--teal-d)}
.btn{font-family:var(--sans);font-weight:700;font-size:15px;padding:11px 22px;border-radius:11px;border:1px solid var(--teal-d);background:linear-gradient(180deg,var(--teal),var(--teal-d));color:#fff;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink-2);border-color:var(--line-3)}
.err{color:var(--rose);font-size:13px;margin-top:8px;font-weight:600}
/* 성적표 */
.hero{text-align:center;padding:22px 16px}
.hero .who{font-family:var(--serif);font-size:20px;font-weight:600}
.score{font-family:var(--serif);font-size:46px;font-weight:600;letter-spacing:-.02em;margin:8px 0 0;line-height:1}
.score small{font-size:20px;color:var(--ink-3)}
.pct{font-family:var(--mono);color:var(--brass-d);font-weight:600;margin-top:6px}
.grid3{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;justify-content:center}
.tile{flex:1;min-width:96px;background:var(--paper-soft);border:1px solid var(--line-2);border-radius:11px;padding:11px 8px;text-align:center}
.tile .k{font-family:var(--serif);font-size:22px;font-weight:600}
.tile .l{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.sec__h{display:flex;align-items:center;gap:8px;margin:2px 0 12px}
.sec__no{font-family:var(--mono);font-size:11.5px;color:var(--brass-d);border:1px solid var(--line-2);border-radius:5px;padding:2px 6px;font-weight:600}
.sec__t{font-family:var(--serif);font-size:16px;font-weight:600}
.arow{display:flex;align-items:center;gap:10px;margin:8px 0}
.arow .an{flex:none;width:118px;font-size:12.5px;color:var(--ink-2)}
.arow .track{flex:1;height:9px;background:var(--line-2);border-radius:5px;overflow:hidden}
.arow .fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--emerald),var(--teal))}
.arow .rn{flex:none;font-family:var(--mono);font-size:11.5px;color:var(--ink-3);min-width:40px;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:12.5px;background:#FBEEF2;color:var(--rose);border:1px solid #F1D8E1;border-radius:999px;padding:4px 11px}
.chip.ok{background:var(--teal-t);color:var(--teal-d);border-color:#CDE7E1}
.qr{border:1px solid var(--line-2);border-radius:11px;margin:9px 0;overflow:hidden;background:var(--paper-soft)}
.qr__h{display:flex;gap:9px;align-items:center;padding:11px 13px;cursor:pointer}
.qr__mk{flex:none;width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff}
.qr__mk.o{background:var(--emerald)}.qr__mk.x{background:var(--rose)}
.qr__no{font-family:var(--mono);font-weight:600;color:var(--ink-2);min-width:26px}
.qr__cc{flex:1;font-size:13px;color:var(--ink-2)}
.qr__av{font-family:var(--mono);font-size:12px;color:var(--ink-3);white-space:nowrap}
.qr__av b{color:var(--emerald)}.qr__av s{color:var(--rose);text-decoration:none}
.qr__d{display:none;padding:0 13px 13px;border-top:1px solid var(--line-2);font-size:13.5px;color:var(--ink-2)}
.qr.open .qr__d{display:block}
.qr__stem{white-space:pre-wrap;margin:11px 0 8px;color:var(--ink)}
.qr__sol{background:var(--surface);border:1px solid var(--line-2);border-radius:9px;padding:10px 12px;margin-top:8px}
.qr__sol b{color:var(--teal-d)}
.qr__mis{margin-top:8px;font-size:12.5px;color:var(--brass-d);background:#FBF4E6;border:1px solid #EFE1C4;border-radius:8px;padding:8px 11px}
.foot{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.lnk{font-family:var(--sans);font-weight:600;font-size:13.5px;color:var(--teal-d);text-decoration:none;border:1px solid var(--line-3);border-radius:10px;padding:9px 15px;background:var(--surface)}
.note{font-size:12px;color:var(--ink-4);text-align:center;margin-top:16px}
@media(max-width:480px){.arow .an{width:92px}}
.muted{color:var(--ink-4)}
.lecrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line-2)}
.lecrow:last-child{border-bottom:none}
.lecn{font-size:13.5px;color:var(--ink-2)}
.pdfhint{font-size:12.5px;color:var(--ink-3);text-align:center;margin:18px 0 6px}
.pdfhint b{color:var(--teal-d)}
@media print{
  :root{--paper:#fff;--paper-soft:#fff;--surface:#fff;--surface-2:#fff}
  body{background:#fff}
  .wrap{max-width:100%;padding:0 4px 4px}
  .printhide,.bar{display:none !important}
  .card{box-shadow:none;border:1px solid #ddd;break-inside:avoid;margin:8px 0}
  .qr{break-inside:avoid;border-color:#ddd}
  .qr__d{display:block !important}
  .qr__h{cursor:default}
  a{color:#0A5C53 !important;text-decoration:none}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const Q = [{"n":1,"area":"원자·기본입자","concept":"중성자수","type":"계산","stem":"다음에 있는 원소들의 중성자수를 모두 합하면? (자료: ²³⁸₉₂U, ⁴⁰₂₀Ca²⁺, ⁵¹₂₃V³⁺)","choices":["① 135","② 194","③ 324","④ 329"],"figures":"상자 안에 세 화학종의 원자번호·질량수 표기: 우라늄 ²³⁸₉₂U, 칼슘 이온 ⁴⁰₂₀Ca²⁺, 바나듐 이온 ⁵¹₂₃V³⁺.","ans":2,"solution":"중성자수 = 질량수 − 원자번호이며 이온화(전자 이동)는 중성자수에 영향이 없다. U: 238−92=146, Ca: 40−20=20, V: 51−23=28. 합 = 146+20+28 = 194.","mis":"이온이어도 중성자수는 양성자·전자와 무관 — 질량수−원자번호로만 계산한다"},{"n":2,"area":"원자·기본입자","concept":"원자·핵 크기","type":"개념","stem":"(원자 반지름)/(원자 핵 반지름)의 대략적인 비율은?","choices":["① 10²","② 10⁵","③ 10⁹","④ 10¹¹"],"figures":"","ans":2,"solution":"원자 반지름은 약 10⁻¹⁰ m, 원자핵 반지름은 약 10⁻¹⁵ m이다. 비는 10⁻¹⁰/10⁻¹⁵ = 10⁵ 정도이다.","mis":"원자는 대부분 빈 공간 — 핵은 원자보다 약 10만 배(10⁵) 작다"},{"n":3,"area":"열화학","concept":"열량·비열","type":"계산","stem":"36 g 황을 25°C부터 녹기 직전까지 가열하는데 2280 J의 열이 필요하다. 열손실이 없다고 가정할 때 황의 녹는점은 몇 도인가? (황의 비열을 0.70 J·g⁻¹·°C⁻¹로 가정하라.)","choices":["① 90°C","② 103°C","③ 115°C","④ 128°C"],"figures":"","ans":3,"solution":"Q = m·c·ΔT 에서 ΔT = Q/(m·c) = 2280/(36×0.70) = 2280/25.2 ≈ 90.5°C. 시작 온도 25°C를 더하면 녹는점 ≈ 115.5°C.","mis":"ΔT는 상승한 온도 — 시작 온도(25°C)를 더해야 녹는점이 나온다"},{"n":4,"area":"양적관계·실험식","concept":"순물질·혼합물","type":"자료해석","stem":"다음 중 순물질을 모두 고른 것은? (단, ●와 ○은 주기율표상 임의의 서로 다른 두 원소를 나타낸 것이다.)","choices":["① Ⅱ","② Ⅰ, Ⅱ","③ Ⅲ, Ⅳ","④ Ⅰ, Ⅲ, Ⅳ"],"figures":"네 상자 Ⅰ~Ⅳ의 입자 모형(●·○은 서로 다른 두 원소). Ⅰ: 동일한 ●○ 분자 2개만. Ⅱ: 동일한 ○○ 분자 2개만. Ⅲ: ○○ 분자 1개 + 낱개 ● 원자 3개. Ⅳ: 여러 종류의 분자·원자가 섞임.","ans":2,"solution":"순물질은 한 종류의 입자로만 이루어진다. Ⅰ은 ●○ 분자만, Ⅱ는 ○○ 분자만으로 각각 순물질(화합물·홑원소)이다. Ⅲ은 ○○ 분자와 낱개 ● 원자가, Ⅳ는 서로 다른 여러 입자가 섞여 혼합물이다. 따라서 순물질은 Ⅰ, Ⅱ.","mis":"순물질은 한 종류의 입자만 — 낱개 원자와 분자가 섞이면(Ⅲ) 혼합물"},{"n":5,"area":"원자량·동위원소","concept":"동위원소","type":"개념","stem":"탄소의 3가지 동위원소 ¹²C, ¹³C, ¹⁴C 에 대한 설명으로 옳은 것은?","choices":["① 양성자 수는 같고 전자 수는 다르다.","② 중성자 수는 같고 전자 수는 다르다.","③ 양성자 수는 같고 중성자 수는 다르다.","④ 양성자, 중성자, 전자 수는 같고, 원자량이 다르다."],"figures":"","ans":3,"solution":"동위원소는 원자번호(양성자)가 같아 중성 원자의 전자 수도 같지만 질량수가 달라 중성자 수가 다르다. ¹²C·¹³C·¹⁴C 모두 양성자 6·전자 6, 중성자는 6·7·8이다.","mis":"동위원소는 양성자(=전자) 같고 중성자만 다르다 — 전자 수가 다른 것은 이온"},{"n":6,"area":"원자량·동위원소","concept":"평균 원자량","type":"계산","stem":"자연에는 구리의 동위원소 두 종이 존재하고, 구리의 평균 원자량은 63.5 amu이다. 첫 번째 동위원소는 구리 원자의 69%를 차지하고, 질량이 62.9 amu이다. 다른 동위원소의 질량은 얼마인가?","choices":["① 63.2 amu","② 63.9 amu","③ 64.1 amu","④ 64.8 amu"],"figures":"","ans":4,"solution":"평균 원자량 = Σ(존재비×질량). 0.69×62.9 + 0.31×x = 63.5. 43.401 + 0.31x = 63.5, 0.31x = 20.099, x = 64.8 amu.","mis":"존재비를 가중치로 한 평균 — 두 번째 존재비는 31%(=100−69)"},{"n":7,"area":"몰·아보가드로수","concept":"밀도·몰·개수","type":"계산","stem":"아보가드로 수(N_A)를 이용하여 Ti 결정 1 cm³ 속에 들어 있는 원자의 수를 표시하면? (단, Ti 결정의 밀도는 4.5 g·cm⁻³이다.)","choices":["① (48/4.5) × N_A","② (4.5/48) × N_A","③ (4.5 × 48) × N_A","④ N_A / (4.5 × 48)"],"figures":"","ans":2,"solution":"부피 1 cm³·밀도 4.5 g/cm³ → 질량 4.5 g. Ti 원자량 48이므로 몰수 = 4.5/48 mol. 원자 수 = (4.5/48) × N_A.","mis":"개수 = (질량/원자량)×N_A — 밀도로 질량부터 구한다"},{"n":8,"area":"기체","concept":"기체 압력·팽창","type":"개념","stem":"수소 기체를 채운 풍선이 공중으로 올라가면 풍선이 커진다. 풍선이 커지는 주된 이유는?","choices":["① 풍선 속 수소 기체의 평균 운동에너지 증가","② 풍선 밖 공기의 평균 운동 에너지 감소","③ 풍선 속 수소 기체의 풍선 벽면에 대한 충돌 빈도 증가","④ 풍선 밖 공기의 풍선 벽면에 대한 충돌 빈도 감소"],"figures":"","ans":4,"solution":"고도가 높아지면 대기 밀도가 낮아져 외부 공기가 벽면에 충돌하는 빈도(외부 압력)가 줄어든다. 외부 압력이 낮아지면 내부 기체가 팽창해 풍선이 커진다.","mis":"상공에서 팽창은 외부 대기압 감소 때문 — 내부 온도·에너지 변화가 주원인이 아니다"},{"n":9,"area":"양적관계·실험식","concept":"연소·실험식","type":"계산","stem":"어떤 알코올 화합물은 탄소, 수소, 그리고 산소로 구성되어 있다. 이 화합물 92 g을 완전 연소하였을 때 이산화탄소 176 g와 물 108 g이 생성되었다. 이 알코올 화합물의 실험식은 무엇인가?","choices":["① C₂H₅O","② CH₃O","③ C₂H₆O","④ C₃H₈O"],"figures":"","ans":3,"solution":"CO₂ 176 g÷44 = 4 mol → C 4 mol(48 g). H₂O 108 g÷18 = 6 mol → H 12 mol(12 g). O = 92−48−12 = 32 g → 2 mol. C:H:O = 4:12:2 = 2:6:1 → C₂H₆O.","mis":"O는 직접 안 나오니 전체 질량−(C+H)로 구한다 — C·H는 CO₂·H₂O에서"},{"n":10,"area":"양적관계·실험식","concept":"화학반응식 계수","type":"계산","stem":"다음 화학반응의 계수 a+b+c+d 의 값은? (반응: 4NaCl + a SO₂ + b H₂O + c O₂ → d Na₂SO₄ + 4HCl)","choices":["① 5","② 7","③ 9","④ 11"],"figures":"화학반응식 4NaCl + a SO₂ + b H₂O + c O₂ → d Na₂SO₄ + 4HCl 에서 a,b,c,d가 미정 계수.","ans":2,"solution":"Na: 4=2d → d=2. S: a=d=2. H: 2b=4 → b=2. O: 2a+b+2c=4d → 4+2+2c=8 → c=1. a+b+c+d = 2+2+1+2 = 7.","mis":"원소별 균형을 순서대로 — Na→S→H→O로 미정계수를 하나씩 확정"},{"n":11,"area":"양적관계·실험식","concept":"양적관계·질량","type":"계산","stem":"글루코오스(C₆H₁₂O₆) 1.0 g 이 충분한 산소와 반응할 때 만들어지는 물의 양은?","choices":["① 0.20 g","② 0.40 g","③ 0.60 g","④ 1.0 g"],"figures":"","ans":3,"solution":"C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O. 분자량 180이므로 1.0/180 mol. 물은 6배 = 6/180 = 1/30 mol, 질량 = (1/30)×18 = 0.60 g.","mis":"몰비 1:6로 물 몰수를 구한 뒤 ×18 — 질량 그대로 비례시키면 안 된다"},{"n":12,"area":"기타","concept":"우주 원소 분포","type":"개념","stem":"다음 중 우주의 원소 분포와 가장 비슷한 원소 분포를 가진 것은?","choices":["① 물","② 인체","③ 지구","④ 태양"],"figures":"","ans":4,"solution":"우주는 수소(약 74%)와 헬륨(약 24%)이 대부분이다. 태양도 주로 수소·헬륨이라 우주 조성과 가장 유사하다. 물·인체·지구는 O·C·Si·Fe가 많아 다르다.","mis":"우주는 수소·헬륨이 대부분 — 별(태양)이 우주 평균 조성에 가깝다"},{"n":13,"area":"원자·기본입자","concept":"빛의 진동수","type":"개념","stem":"스트론튬 염을 연소시키면 빨강색의 불빛을 내며 탄다. 이 빛의 진동수보다 낮은 진동수를 갖는 것은?","choices":["① 노란빛","② 적외선","③ 자외선","④ x-선"],"figures":"","ans":2,"solution":"빨간빛은 가시광선 중 진동수가 가장 낮다(파장 최장). 노란빛·자외선·x-선은 더 높고, 적외선만 빨간빛보다 진동수가 낮다.","mis":"빨강 < 노랑·자외선·X선(진동수) — 빨강보다 낮은 것은 적외선뿐"},{"n":14,"area":"원자·기본입자","concept":"수소 스펙트럼","type":"개념","stem":"가시광선 영역의 수소원자스펙트럼 선들을 무슨 계열이라 부르는가?","choices":["① Lyman","② Balmer","③ Paschen","④ Bohr"],"figures":"","ans":2,"solution":"n=2로 전이할 때 나오는 선이 가시광선 영역이며 발머(Balmer) 계열이다. 라이먼=자외선, 파셴=적외선, Bohr는 계열명이 아니다.","mis":"가시광선=발머(n→2), 자외선=라이먼(n→1), 적외선=파셴(n→3)"},{"n":15,"area":"주기율·전자배치","concept":"오비탈 표기","type":"개념","stem":"다음 중 원자궤도함수와 전자배치 표현이 올바른 것은?","choices":["① 2s³","② 2d¹","③ 3f²","④ 4p⁵"],"figures":"","ans":4,"solution":"s는 최대 2개라 2s³ 불가, 2d·3f 오비탈은 존재하지 않는다(d는 n≥3, f는 n≥4). 4p는 존재하고 최대 6개라 4p⁵는 가능하다.","mis":"오비탈 존재 조건(l≤n−1)과 최대 전자수(s2·p6·d10) — 둘 다 만족해야 한다"},{"n":16,"area":"주기율·전자배치","concept":"전자배치","type":"개념","stem":"다음은 바닥 상태 원자의 전자배치이다. □에 해당하는 숫자의 합은?","choices":["① 8","② 9","③ 10","④ 11"],"figures":"O : [He]2s²□p⁴ (□=주양자수 2), Mg : [Ne]3s□ (□=전자 수 2), P : [Ne]3s²3p□ (□=전자 수 3), Mn : [Ar]4s²□d⁵ (□=주양자수 3).","ans":3,"solution":"각 □를 채우면 2(O의 2p), 2(Mg의 3s²), 3(P의 3p³), 3(Mn의 3d⁵)이다. 합 = 2+2+3+3 = 10.","mis":"□가 주양자수인지 전자 수인지 위치로 구분 — 섞어 읽지 않는다"},{"n":17,"area":"주기율·전자배치","concept":"원자 반지름","type":"개념","stem":"다음 중 원자 반지름이 가장 큰 것은?","choices":["① Si","② Mg","③ O","④ C"],"figures":"","ans":2,"solution":"같은 주기는 왼쪽일수록, 같은 족은 아래일수록 반지름이 크다. Si·Mg는 3주기이고 Mg가 더 왼쪽(2족), O·C는 2주기라 더 작다. 따라서 Mg가 가장 크다.","mis":"주기(아래로 큼)와 족(왼쪽으로 큼)을 함께 본다 — 3주기 왼쪽 Mg가 최대"},{"n":18,"area":"주기율·전자배치","concept":"순차 이온화 에너지","type":"자료해석","stem":"어떤 원소 X의 순차적 이온화 에너지(Iₙ)는 다음과 같다. 이 원소는 무엇인가?","choices":["① Be","② B","③ C","④ N"],"figures":"순차 이온화 에너지: I₁=801, I₂=2,427, I₃=3,660, I₄=25,025, I₅=32,822 kJ/mol.","ans":2,"solution":"I₃→I₄에서 급증(3,660→25,025)하므로 원자가전자가 3개인 13족이다. I₁=801은 붕소(B)의 값과 일치한다. 따라서 X=B.","mis":"급증 직전 개수 = 원자가전자 수 — 여기서 3개면 13족(B)"},{"n":19,"area":"주기율·전자배치","concept":"전기음성도","type":"개념","stem":"전기음성도가 가장 큰 원소는?","choices":["① 수소","② 산소","③ 플루오린","④ 염소"],"figures":"","ans":3,"solution":"전기음성도는 주기율표 오른쪽 위로 갈수록 크며, 플루오린(F, 약 4.0)이 모든 원소 중 가장 크다.","mis":"전기음성도 1위는 F — 오른쪽 위(비활성 기체 제외)로 갈수록 커진다"},{"n":20,"area":"열화학","concept":"보른-하버 순환","type":"자료해석","stem":"다음 그림은 리튬(Li)과 플루오린(F₂)으로부터 플루오린화리튬(LiF)이 생성될 때의 에너지 변화를 나타낸 에너지 준위도이다. 리튬의 이온화 에너지는 얼마인가?","choices":["① -328 kJ/mol","② 161 kJ/mol","③ 520 kJ/mol","④ 77 kJ/mol"],"figures":"보른-하버 순환 준위도. Li(s)+½F₂ → (승화 161) Li(g)+½F₂ → (이온화 520) Li⁺(g)+½F₂ → (F₂ 해리 77) Li⁺(g)+F(g) → (전자친화도 −328) Li⁺(g)+F⁻(g) → (격자에너지 −1047) LiF(s).","ans":3,"solution":"이온화 에너지는 Li(g)→Li⁺(g) 단계의 값이다. 준위도에서 이 단계에 표시된 값이 520 kJ이다.","mis":"승화(161)와 이온화(520)를 구분 — 이온화는 기체 원자→기체 양이온 단계"},{"n":21,"area":"화학결합·구조","concept":"옥텟 규칙","type":"개념","stem":"다음 화합물의 루이스 구조식에서 중심 원자가 옥테트(octet) 규칙을 만족하지 않는 것은?","choices":["① BH₃","② CO₂","③ NH₄⁺","④ CH₄"],"figures":"","ans":1,"solution":"CO₂·NH₄⁺·CH₄의 중심 원자는 주위 전자 8개로 옥텟을 만족한다. BH₃의 붕소는 결합 3개로 전자 6개뿐이라 옥텟을 만족하지 못한다.","mis":"B·Be는 옥텟 미만(전자 부족) 화합물 — 6개 전자로도 안정"},{"n":22,"area":"분자극성","concept":"분자의 극성","type":"개념","stem":"다음 물질들 중 극성 물질은 모두 몇 개인가?","choices":["① 1","② 2","③ 3","④ 4"],"figures":"물(H₂O), 암모니아(NH₃), 이산화탄소(CO₂), 사염화탄소(CCl₄) 나열.","ans":2,"solution":"H₂O(굽은형)·NH₃(삼각뿔)는 쌍극자가 상쇄되지 않아 극성, CO₂(직선)·CCl₄(정사면체)는 대칭이라 무극성이다. 극성은 2개.","mis":"결합이 극성이어도 분자 모양이 대칭이면 무극성(CO₂·CCl₄)"},{"n":23,"area":"기타","concept":"동소체","type":"개념","stem":"다음 중 원자번호 6인 탄소(C)의 동소체가 아닌 것은?","choices":["① 다이아몬드","② 흑연","③ 풀러렌","④ 아세틸렌"],"figures":"","ans":4,"solution":"동소체는 같은 원소로만 이루어진 서로 다른 홑원소물질이다. 다이아몬드·흑연·풀러렌은 탄소만으로 되어 있으나 아세틸렌(C₂H₂)은 화합물이다.","mis":"동소체는 홑원소물질끼리 — 아세틸렌은 C·H 화합물이라 제외"},{"n":24,"area":"양적관계·실험식","concept":"연소 반응식 계수","type":"계산","stem":"프로페인(C₃H₈) 가스의 완전 연소 과정에 대한 반응식의 계수들을 최소 정수들로 표시할 때 계수들의 합은 얼마인가?","choices":["① 12","② 13","③ 15","④ 17"],"figures":"","ans":2,"solution":"C₃H₈ + 5O₂ → 3CO₂ + 4H₂O. 계수 합 = 1+5+3+4 = 13.","mis":"반응물·생성물 계수 모두 더한다(1도 빠뜨리지 않음)"},{"n":25,"area":"화학결합·구조","concept":"결합 길이","type":"개념","stem":"다음 화합물들 중 탄소-탄소 결합이 가장 짧은 것은?","choices":["① C₂H₂","② C₂H₄","③ C₂H₆","④ C₆H₆"],"figures":"","ans":1,"solution":"결합 차수가 클수록 짧다. C₂H₂(삼중), C₂H₄(이중), C₂H₆(단일), C₆H₆(약 1.5차). 삼중결합인 C₂H₂가 가장 짧다.","mis":"결합 차수 ↑ → 결합 길이 ↓ — 삼중(C₂H₂)이 최단"},{"n":26,"area":"기체","concept":"기체 밀도","type":"추론","stem":"C₆H₁₂의 두 개의 구조 이성질체(cyclohexane과 2-hexene)가 동일한 온도와 압력 하에서 존재할 때, 다음 양 중 가장 비슷한 값을 가질 것으로 예상되는 것은?","choices":["① 끓는점","② 녹는점","③ 기체 밀도","④ 증발열"],"figures":"","ans":3,"solution":"두 이성질체는 분자식이 같아 몰질량이 84 g/mol로 동일하다. 같은 T·P에서 기체 밀도 d = PM/RT는 몰질량에만 의존하므로 거의 같다. 끓는점·녹는점·증발열은 분자간 힘 차이로 달라진다.","mis":"같은 T·P·몰질량이면 기체 밀도 동일 — 상변화량은 분자간 힘에 의존"},{"n":27,"area":"산화환원","concept":"산화 경향","type":"자료해석","stem":"아래 주기율표에 표시된 네 영역의 원소 중에서 산화가 가장 잘되는 영역과 산화되기 가장 어려운 영역을 순서대로 나타낸 것은?","choices":["① D-A","② A-B","③ A-D","④ D-B"],"figures":"주기율표에 A(좌상단 알칼리 금속), B(중앙 전이금속), C(우측 준금속 경계), D(우상단 비활성 기체/할로겐) 영역 표시.","ans":3,"solution":"산화가 잘된다=전자를 잘 잃는다=이온화 에너지가 작다. A(알칼리 금속)가 가장 잘 산화되고, D(비활성 기체·비금속)가 가장 어렵다. 순서 A-D.","mis":"산화=전자 잃음 — 금속(왼쪽 아래)이 잘 되고 비금속(오른쪽 위)이 어렵다"},{"n":28,"area":"산화환원","concept":"산화수","type":"계산","stem":"다음 산에서 염소의 산화수가 가장 큰 것은?","choices":["① HCl","② HClO","③ HClO₂","④ HClO₃"],"figures":"","ans":4,"solution":"H=+1, O=−2로 두고 중성이 되도록 Cl을 구하면 HCl −1, HClO +1, HClO₂ +3, HClO₃ +5. 산소가 많을수록 크며 HClO₃에서 +5로 최대.","mis":"산화수 = 전체 0 되도록 배분 — O가 많을수록 Cl 산화수 커짐"},{"n":29,"area":"산화환원","concept":"금속 반응성","type":"추론","stem":"다음 반응들이 자발적으로 일어난다. 4가지 금속(Tl, Ru, Pu, Pt) 중 산화가 가장 잘 되는 금속은 어떤 것인가?","choices":["① Pu","② Ru","③ Tl","④ Pt"],"figures":"자발 반응: 2Pu + 3Ru²⁺ → 2Pu³⁺ + 3Ru, 2Tl + Pt²⁺ → 2Tl⁺ + Pt, Pu + 3Tl⁺ → Pu³⁺ + 3Tl.","ans":1,"solution":"자발 반응에서 산화되는(전자 잃는) 금속이 더 반응성이 크다. Pu>Ru, Tl>Pt, Pu>Tl이므로 순서는 Pu>Tl>Pt(및 Pu>Ru). Pu가 가장 잘 산화된다.","mis":"자발반응에서 산화되는 쪽이 반응성 큼 — 여러 식을 이어 서열을 세운다"},{"n":30,"area":"산화환원","concept":"탄소 산화수 변화","type":"개념","stem":"다음 설명에 관한 내용으로 옳지 않은 것은? ((가) 발효: 글루코스→CO₂+알코올, (나) CaCO₃+염산→CO₂, (다) 메테인+수증기→CO₂)","choices":["① (가), (나), (다) 모든 반응에서 탄소는 산화된다.","② (나)에서 염산 대신 같은 농도의 아세트산을 가하면 CO₂가 더 느리게 생성된다.","③ (나)의 화학 반응식은 CaCO₃ + 2HCl → CaCl₂ + CO₂ + H₂O 이다.","④ (다)의 전체 화학 반응식은 CH₄ + 2H₂O → CO₂ + 4H₂ 이다."],"figures":"","ans":1,"solution":"(나) CaCO₃+2HCl 반응에서 탄소는 +4→+4로 산화수 불변(산-염기 반응). (가)·(다)는 탄소 산화수가 변한다. 따라서 '모든 반응에서 탄소가 산화된다'는 ①이 옳지 않다. ②(약산이라 느림)·③·④는 옳다.","mis":"탄산염 CaCO₃의 C는 +4로 이미 최고 산화수 — 산과의 반응에서 산화 안 됨"},{"n":31,"area":"화학결합·구조","concept":"결합 세기","type":"개념","stem":"다음 중 가장 강한 결합을 가진 분자는?","choices":["① H₂O","② H₂S","③ H₂Se","④ H₂Te"],"figures":"","ans":1,"solution":"같은 16족 수소화물에서 중심 원자가 작을수록 결합이 짧고 강하다. O가 가장 작아 O-H 결합이 가장 강하다.","mis":"중심 원자 반지름 ↓ → 결합 길이 ↓ → 결합 세기 ↑ (O-H 최강)"},{"n":32,"area":"화학결합·구조","concept":"분자간 힘","type":"개념","stem":"얼음에 존재하는 분자간 힘을 모두 고른 것으로 옳은 것은? (가. 쌍극자 힘, 나. 분산력, 다. 수소결합, 라. 이온-쌍극자 힘)","choices":["① 다","② 가, 라","③ 나, 라","④ 가, 나, 다"],"figures":"보기: 가. 쌍극자 힘 / 나. 분산력 / 다. 수소결합 / 라. 이온-쌍극자 힘.","ans":4,"solution":"얼음은 극성 분자 H₂O로 쌍극자 힘(가)·분산력(나)·수소결합(다)이 모두 작용한다. 이온이 없어 이온-쌍극자 힘(라)은 없다. 따라서 가, 나, 다.","mis":"분산력은 모든 분자에 존재 — 극성 분자엔 쌍극자·수소결합도 더해진다"},{"n":33,"area":"기체","concept":"평균 속도·운동에너지","type":"개념","stem":"300K에서 수소기체(H₂)와 질소기체(N₂)가 밀폐된 용기 안에 섞여 있다. 두 기체의 평균 분자속도와 평균분자운동에너지를 비교한 다음의 설명 중 옳은 것은?","choices":["① 평균분자속도는 평균분자운동에너지는 두 기체 모두 같다.","② 평균분자속도는 수소가 더 크고 평균분자운동에너지는 같다.","③ 평균분자속도는 같고 평균분자운동에너지는 질소가 더 크다.","④ 평균분자속도와 평균분자운동에너지 모두 수소가 더 크다."],"figures":"","ans":2,"solution":"온도가 같으면 평균 병진 운동에너지(3/2 kT)는 분자 종류와 무관하게 같다. (1/2)mv²이 같으려면 가벼운 H₂가 더 빠르다. 따라서 속도는 H₂가 크고 에너지는 같다.","mis":"같은 온도=같은 평균 운동에너지 — 가벼운 분자가 더 빠름"},{"n":34,"area":"기체","concept":"이상기체 조건","type":"개념","stem":"기체를 가장 이상적인 상태로 만들어 주는 압력 P, 온도 T, 몰수 n의 조건은?","choices":["① 낮은 P, 높은 T, 큰 n","② 낮은 P, 높은 T, 큰 n","③ 높은 P, 낮은 T, 작은 n","④ 낮은 P, 높은 T, 작은 n"],"figures":"","ans":4,"solution":"분자간 인력·자체 부피 효과가 작아야 이상기체에 가깝다. 낮은 P·높은 T에서 상호작용이 무시되고, 작은 n으로 밀도가 낮아 부피 효과도 줄어든다.","mis":"이상기체 근접 = 낮은 압력·높은 온도(·낮은 밀도) — 분자간 힘/부피 무시"},{"n":35,"area":"기체","concept":"수은 압력계","type":"자료해석","stem":"아래 그림과 같은 장치에서 1.0기압의 대기압에서 측정된 수은 기둥의 높이 차이(h)가 19 cm이다. 기체의 압력은 얼마인가?","choices":["① 0.25 기압","② 0.75 기압","③ 1.25 기압","④ 1.75 기압"],"figures":"열린관 수은 압력계. 기체 구가 왼쪽에 연결되고 열린관 쪽 수은이 기체 쪽보다 h=19 cm 더 높다.","ans":3,"solution":"열린관 쪽 수은이 h=19 cm 더 높으므로 기체 압력이 대기압보다 크다. 19 cmHg = 19/76 = 0.25 기압. 기체 압력 = 1.0 + 0.25 = 1.25 기압.","mis":"열린관 쪽이 높으면 기체 압력>대기압 — h를 더한다(76 cmHg=1 atm)"},{"n":36,"area":"용액·농도","concept":"증기압·삼투","type":"추론","stem":"아래 그림과 같이 증류수와 바닷물이 각각 50 mL씩 들어있는 두 비커를 한 용기에 넣고 밀폐한 후 변화를 관찰하였다. 충분한 시간이 지난 후 예상되는 결과는?","choices":["① 수위의 변화가 없다.","② 증류수가 거의 다 바닷물 쪽으로 이동한다.","③ 바닷물이 거의 다 증류수 쪽으로 이동한다.","④ 바닷물에 들어 있는 염분은 그대로 남고 물만 증류수 쪽으로 이동한다."],"figures":"밀폐 용기 안에 증류수 비커와 바닷물 비커가 나란히 놓여 있다.","ans":2,"solution":"증류수는 증기압이 높고 바닷물은 용질 때문에 증기압이 낮다. 밀폐 공간에서 증류수의 물이 증발해 증기압 낮은 바닷물 쪽에 응축되어 이동하므로 증류수가 거의 다 옮겨간다.","mis":"용질이 있으면 증기압 ↓ — 순수한 물(높은 증기압)에서 용액 쪽으로 증발 이동"},{"n":37,"area":"화학결합·구조","concept":"분자간 힘·증기압","type":"개념","stem":"다음 중 분자간의 인력이 증가할 때 감소하는 것은?","choices":["① 기화열","② 끓는점","③ 증기압","④ 승화점"],"figures":"","ans":3,"solution":"분자간 인력이 커지면 분자를 떼기 어려워 기화열·끓는점·승화점은 증가한다. 반면 표면에서 분자가 잘 못 빠져나와 증기압은 감소한다.","mis":"분자간 힘 ↑ → 끓는점·기화열 ↑, 증기압만 ↓"},{"n":38,"area":"화학결합·구조","concept":"단위세포·화학식","type":"자료해석","stem":"다음은 Cu(흰색 구)와 Au(검은색 구)로 이루어진 합금의 단위세포 구조를 나타낸 것이다. 이 합금의 화학식은?","choices":["① CuAu","② Cu₃Au","③ Cu₃Au₄","④ Cu₄Au₃"],"figures":"입방 단위세포. Au(검은 구)가 8개 꼭짓점, Cu(흰 구)가 6개 면심에 위치.","ans":2,"solution":"꼭짓점 Au = 8×1/8 = 1개, 면심 Cu = 6×1/2 = 3개. Cu:Au = 3:1이므로 화학식은 Cu₃Au.","mis":"꼭짓점 ×1/8, 면심 ×1/2로 단위세포 내 개수를 센다"},{"n":39,"area":"용액·농도","concept":"몰농도·밀도","type":"계산","stem":"98 % 황산 수용액의 몰농도는 18.0 M이다. 이 황산 용액의 밀도(g/mL)는?","choices":["① 1.2","② 1.5","③ 1.8","④ 2.1"],"figures":"","ans":3,"solution":"M = (밀도 d×1000×질량분율)/분자량. H₂SO₄ 분자량 98이므로 18.0 = (d×1000×0.98)/98. d = 18.0×98/(1000×0.98) = 1.8 g/mL.","mis":"몰농도↔밀도 변환식 M=1000·d·(질량%)/분자량 — 질량분율·분자량 대입"},{"n":40,"area":"용액·농도","concept":"삼투 현상","type":"개념","stem":"삼투 현상에 대한 설명으로 옳지 않은 것은?","choices":["① 평형 과정으로 볼 수 있다.","② 삼투 현상이 생기면 반투막에 압력이 미친다.","③ 두 용액의 농도가 같아지려는 경향으로 일어난다.","④ 용질 분자는 진한 용액에서 묽은 용액으로 이동한다."],"figures":"","ans":4,"solution":"삼투는 반투막을 통해 용매(물)가 묽은 쪽→진한 쪽으로 이동해 농도를 같게 하려는 평형 경향이다. 반투막은 용질을 통과시키지 않으므로 이동하는 것은 용매이지 용질이 아니다. 따라서 ④가 옳지 않다.","mis":"삼투는 용매(물)가 이동 — 용질은 반투막을 못 지난다"},{"n":41,"area":"기타","concept":"온실기체","type":"개념","stem":"다음 분자들 중 온실효과(greenhouse effect)를 유발할 수 있는 기체가 아닌 것은?","choices":["① H₂","② CO","③ H₂O","④ CH₄"],"figures":"","ans":1,"solution":"온실기체는 진동 시 쌍극자모멘트 변화가 있어 적외선을 흡수한다. CO·H₂O·CH₄는 흡수하지만 H₂는 등핵 이원자라 쌍극자 변화가 없어 온실기체가 아니다.","mis":"등핵 이원자(H₂·N₂·O₂)는 적외선을 못 흡수 — 온실효과 없음"},{"n":42,"area":"열화학","concept":"헤스 법칙","type":"계산","stem":"고체 브로민의 표준 승화 엔탈피가 +40.1 kJ/mol 이고, 표준 용융 엔탈피가 +10.6 kJ/mol 일 때, 액체 브로민의 표준 증발 엔탈피는?","choices":["① - 29.5 kJ/mol","② - 50.7 kJ/mol","③ + 29.5 kJ/mol","④ + 50.7 kJ/mol"],"figures":"","ans":3,"solution":"헤스 법칙: 승화 = 용융 + 증발. ΔH_증발 = 40.1 − 10.6 = 29.5 kJ/mol. 증발은 흡열이라 +29.5 kJ/mol.","mis":"승화 = 용융 + 증발 — 증발 = 승화 − 용융(흡열이라 +)"},{"n":43,"area":"열화학","concept":"엔트로피","type":"개념","stem":"다음 중 엔트로피가 감소하는 과정은?","choices":["① 따뜻한 봄이 되어 눈이 녹는 과정","② 바람에 종이뭉치가 흩어져 날아가는 과정","③ 구멍이 생긴 물통으로부터 물이 흘러나오는 과정","④ 컴퓨터가 실리콘, 구리, 탄소, 철 등으로부터 만들어지는 과정"],"figures":"","ans":4,"solution":"눈이 녹고, 종이가 흩어지고, 물이 퍼지는 것은 무질서도가 증가한다. 반면 여러 원소로 정교하게 배열된 컴퓨터를 조립하는 것은 질서화 과정이라 엔트로피가 감소한다.","mis":"엔트로피=무질서도 — 흩어짐은 증가, 조립·정렬은 감소"},{"n":44,"area":"열화학","concept":"기화·엔트로피","type":"개념","stem":"1 기압 하에서 물의 기화 [ H₂O(l) → H₂O(g) ]에 대한 설명으로 옳은 것을 <보기>에서 고르면? (a. 발열, b. 흡열, c. 엔트로피 증가, d. 엔트로피 감소)","choices":["① a, c","② a, d","③ b, c","④ b, d"],"figures":"보기: a. 발열 과정 / b. 흡열 과정 / c. 엔트로피 증가 / d. 엔트로피 감소.","ans":3,"solution":"기화는 분자간 인력을 끊어야 하므로 흡열(b)이고, 기체는 액체보다 무질서도가 커 엔트로피가 증가(c)한다. 따라서 b, c.","mis":"기화는 흡열 + 엔트로피 증가 — 액체→기체는 무질서도 급증"},{"n":45,"area":"반응속도·평형","concept":"반응지수 Q와 K","type":"개념","stem":"화학 반응의 진행 정도나 방향에 대해서 알려주는 반응지수(reaction quotient, Q)와 평형상수(K)에 관한 내용 중 옳지 않은 것은?","choices":["① Q=K인 상태는 평형 상태이다.","② Q>K일 때, 정반응이 우세하게 일어난다.","③ 반응 초기에 반응물만 존재할 때 Q 값은 0이다.","④ 높은 온도일수록 Q값이 K값과 같아지는데 걸리는 시간이 줄어든다."],"figures":"","ans":2,"solution":"Q=K는 평형(①옳음), 초기 생성물 없으면 Q=0(③옳음), 고온이면 반응이 빨라 평형 도달이 빠름(④옳음). Q>K이면 생성물 과잉이라 역반응이 우세하므로 '정반응 우세'라는 ②가 틀렸다.","mis":"Q>K → 역반응, Q<K → 정반응 — 부등호 방향을 헷갈리지 말 것"},{"n":46,"area":"반응속도·평형","concept":"르샤틀리에","type":"개념","stem":"N₂O₄와 NO₂는 다음과 같은 평형 반응식을 가진다. 다음 설명 중 옳지 않은 것은? [ N₂O₄(g) ⇌ 2NO₂(g), ΔH° = 57.2 kJ/mol ]","choices":["① 이 반응은 흡열반응이다.","② 온도가 높아지면 평형상수는 증가한다.","③ 촉매를 첨가해도 평형상수는 변하지 않는다.","④ 일정 온도에서, 부피를 감소시켜 압력을 증가시키면 반응물의 농도는 감소한다."],"figures":"박스: N₂O₄(g) ⇌ 2NO₂(g), ΔH° = 57.2 kJ/mol.","ans":4,"solution":"ΔH°>0이라 흡열(①옳음), 흡열은 온도↑ 시 K 증가(②옳음), 촉매는 K 불변(③옳음). 부피를 줄여 압력을 높이면 몰수 적은 반응물(N₂O₄, 1몰) 쪽으로 이동해 반응물 농도는 오히려 증가하므로 ④가 틀렸다.","mis":"압력 ↑ → 기체 몰수 적은 쪽으로 이동 — 여기선 반응물(N₂O₄)이 늘어남"},{"n":47,"area":"기타","concept":"상전이·압력","type":"개념","stem":"일정 온도에서 어떤 순수한 물질에 압력을 가할 때 일어날 가능성이 가장 낮은 상전이는?","choices":["① 고체 → 기체","② 액체 → 고체","③ 기체 → 고체","④ 기체 → 액체"],"figures":"","ans":1,"solution":"압력을 가하면 부피가 작은(밀도 큰) 상으로 전이가 유리하다. 기체→액체·고체, 액체→고체는 부피가 줄어 유리하나 고체→기체(승화)는 부피가 크게 늘어 가장 어렵다.","mis":"압력 ↑ → 부피 작은 상 유리 — 승화(고체→기체)는 부피 급증이라 불리"},{"n":48,"area":"기타","concept":"상평형도","type":"자료해석","stem":"아래 상평형도에 나타난 것과 같이 비스무트(Bi)에는 여러 가지 고체 상태 [I~V]가 있어서, 비스무트는 고압 연구에 사용하는 장비들을 보정하는 데 사용된다. 비스무트의 상평형도에 관한 설명으로 옳은 것은?","choices":["① 삼중점이 3개만 존재한다.","② 1 katm에서 끓는점은 200°C 이하이다.","③ 0°C에서 300°C까지 가열할 때 상이 한 번만 바뀌는 압력 조건은 없다.","④ 100°C, 1~100 katm 범위에서 비스무트의 액체 상태는 존재하지 않는다."],"figures":"Bi 상평형도(가로 온도 0~300°C, 세로 압력 1~100 katm 로그축). 고체상 I~V 영역과 오른쪽 고온부(약 200°C 이상) Liquid 영역.","ans":4,"solution":"액체 영역은 고온부(약 200°C 이상)에 있다. 온도 100°C·압력 1~100 katm 세로선은 고체 영역만 지나므로 액체가 나타나지 않는다. 나머지는 도표와 맞지 않아 ④가 옳다.","mis":"상평형도는 세로/가로선을 그어 지나는 영역을 읽는다 — 100°C선은 고체만 통과"},{"n":49,"area":"용액·농도","concept":"용해도·결정수","type":"계산","stem":"흰색 분말인 무수화물 황산구리(CuSO₄)의 물에 대한 용해도는 18°C에서 20g이다. 같은 조건에서 물 100g에 녹일 수 있는 황산구리 결정[CuSO₄·5H₂O]의 최대량과 가장 가까운 값은?","choices":["① 30 g","② 35 g","③ 40 g","④ 45 g"],"figures":"","ans":2,"solution":"CuSO₄ 몰질량 160, CuSO₄·5H₂O 250. 결정 x g 중 CuSO₄=0.64x, 결정수=0.36x가 물에 더해진다. 포화 CuSO₄/물 = 20/100 = 0.2이므로 0.64x = 0.2(100+0.36x) → 0.568x = 20 → x ≈ 35.2 g.","mis":"결정수는 용매(물)에 합산 — 무수물 기준 용해도로 식을 세운다"},{"n":50,"area":"용액·농도","concept":"헨더슨-하셀바흐","type":"계산","stem":"지시약으로 사용되는 티몰블루(HIn, pKₐ=8.9)는 pH값이 8.9 이하인 용액에서는 노란색을 띠는 HIn 형태로 주로 존재한다. 반면에 8.9 이상인 용액에서는 파란색을 띠는 In⁻ 형태로 주로 존재한다. pH 7.9인 용액에서 [HIn] : [In⁻]의 비는?","choices":["① 1 : 10","② 1 : 1","③ 2 : 1","④ 10 : 1"],"figures":"","ans":4,"solution":"pH = pKₐ + log([In⁻]/[HIn]). 7.9 = 8.9 + log([In⁻]/[HIn]) → log = −1 → [In⁻]/[HIn] = 0.1. 따라서 [HIn]:[In⁻] = 10:1.","mis":"pH < pKₐ면 산형(HIn)이 우세 — 1 낮으면 10:1"},{"n":51,"area":"용액·농도","concept":"약산·완충","type":"개념","stem":"아세트산(CH₃COOH)에 관련해서 맞는 것은?","choices":["① 아세트산의 수용액을 묽히면 % 해리도는 감소한다.","② 메탄올이 산화되면 아세트산이 얻어진다.","③ 아세트산은 강산이다.","④ 아세트산은 pH 5 정도의 완충용액을 만드는데 유용하다."],"figures":"","ans":4,"solution":"약산은 묽힐수록 % 해리도가 증가하므로 ① 틀림, 아세트산은 에탄올 산화 생성물이라 ② 틀림, 약산이므로 ③ 틀림. pKₐ≈4.76이라 pH 5 완충용액에 유용하므로 ④가 맞다.","mis":"완충은 pH ≈ pKₐ 부근에서 유효 — 아세트산(pKₐ4.76)은 pH 5 완충에 적합"},{"n":52,"area":"용액·농도","concept":"염의 액성","type":"개념","stem":"다음 중 물에 녹았을 때 수용액을 산성으로 만드는 것은?","choices":["① KBr","② Na₂CO₃","③ NH₄Cl","④ NaF"],"figures":"","ans":3,"solution":"KBr은 강산·강염기 염으로 중성, Na₂CO₃·NaF는 약산의 짝염기라 염기성이다. NH₄Cl은 강산·약염기 염으로 NH₄⁺가 가수분해해 산성을 띤다.","mis":"강산+약염기 염(NH₄Cl)은 산성 — 짝이온의 가수분해로 액성 판단"},{"n":53,"area":"용액·농도","concept":"pH 크기 비교","type":"개념","stem":"다음 용액들을 pH가 증가하는 순서대로 나열한 것은? (가. 0.1 M NaCl, 나. 0.1 M CH₃COONa, 다. 0.1 M NH₄Cl, 라. 0.1 M NaOH)","choices":["① 다 < 나 < 가 < 라","② 다 < 가 < 나 < 라","③ 라 < 가 < 나 < 다","④ 라 < 나 < 가 < 다"],"figures":"박스: 가. 0.1 M NaCl / 나. 0.1 M CH₃COONa / 다. 0.1 M NH₄Cl / 라. 0.1 M NaOH.","ans":2,"solution":"다(NH₄Cl)는 산성, 가(NaCl)는 중성, 나(CH₃COONa)는 약염기성, 라(NaOH)는 강염기다. pH 증가순은 다 < 가 < 나 < 라.","mis":"산성(가수분해)<중성<약염기성<강염기 순으로 pH 배열"},{"n":54,"area":"용액·농도","concept":"약염기 적정","type":"자료해석","stem":"다음은 각각 0.10 M 인 약염기 용액을 센 산으로 적정한 적정곡선이다. 당량점에서 pH 값이 가장 큰 것은 어느 것인가? [화학올림피아드 2013년 37번]","choices":["① A","② B","③ C","④ 알 수 없다."],"figures":"pH-적정곡선. 초기 pH가 높은 순 A(약 12)>B(약 10)>C(약 9), 세 곡선 모두 약 50 mL에서 급락.","ans":1,"solution":"약염기를 강산으로 적정하면 당량점에서 짝산 때문에 산성이다. 초기 pH가 높을수록 염기가 강해(Kb 큼) 짝산이 약해 당량점 pH가 높다. 초기 pH가 가장 높은 A가 당량점 pH도 가장 크다.","mis":"강한 약염기일수록 짝산이 약해 당량점 pH가 높다 — 초기 pH가 단서"},{"n":55,"area":"산화환원","concept":"갈바니 전지","type":"개념","stem":"다음은 갈바니전지 그림과 표준 환원전위값이다.(전지의 온도는 25°C 이다.) 환원전극과 산화전극에서 일어나는 반응을 올바르게 짝지은 것은?","choices":["① 환원전극 Zn²⁺+2e⁻→Zn / 산화전극 Cu→Cu²⁺+2e⁻","② 환원전극 Cu→Cu²⁺+2e⁻ / 산화전극 Zn²⁺+2e⁻→Zn","③ 환원전극 Cu²⁺+2e⁻→Cu / 산화전극 Zn→Zn²⁺+2e⁻","④ 환원전극 Zn→Zn²⁺+2e⁻ / 산화전극 Cu²⁺+2e⁻→Cu"],"figures":"Zn|ZnSO₄(1.0 M), Cu|CuSO₄(1.0 M)를 다공성판으로 연결한 갈바니전지. 표: Cu²⁺+2e⁻→Cu E°=0.34 V, Zn²⁺+2e⁻→Zn E°=−0.76 V.","ans":3,"solution":"E°가 큰 Cu²⁺/Cu가 환원전극(cathode)으로 Cu²⁺+2e⁻→Cu, E°가 작은 Zn이 산화전극(anode)으로 Zn→Zn²⁺+2e⁻이다. 짝을 맞춘 것은 ③.","mis":"환원전극(cathode)=E° 큰 쪽에서 환원 — 산화전극에서 산화"},{"n":56,"area":"산화환원","concept":"기전력·산화제","type":"개념","stem":"다음은 아연(Zn)과 구리(Cu)의 표준 환원전극전위 값이다. Zn²⁺+2e⁻→Zn, E°=−0.76 V; Cu²⁺+2e⁻→Cu, E°=+0.34 V. 아연과 구리를 사용하여 갈바니전지를 만든다고 할 때, 다음 설명 중 틀린 것은?","choices":["① 아연이 구리보다 산화가 잘 된다.","② 이 전지의 표준전지전위(기전력)는 1.10V이다.","③ 구리는 환원전극으로 아연은 산화전극으로 작용한다.","④ 아연은 산화제로 구리는 환원제로 작용한다."],"figures":"박스: Zn²⁺+2e⁻→Zn, E°=−0.76 V / Cu²⁺+2e⁻→Cu, E°=+0.34 V.","ans":4,"solution":"Zn이 더 잘 산화(①옳음), 기전력 = 0.34−(−0.76) = 1.10 V(②옳음), Cu가 환원전극·Zn이 산화전극(③옳음). 그러나 Zn은 자신이 산화되며 상대를 환원시키는 환원제이고 Cu²⁺이 산화제이므로 ④가 틀렸다.","mis":"산화되는 물질=환원제 — Zn은 환원제, 산화제와 혼동 주의"},{"n":57,"area":"산화환원","concept":"물의 전기분해","type":"개념","stem":"물의 전기분해와 관련한 설명 중 맞는 것은?","choices":["① 얻어진 수소와 산소의 질량비는 2:1이다.","② 얻어진 수소와 산소의 부피 비는 아보가드로의 원리를 반영한다.","③ (-)극에서는 수산화이온이 산화된다.","④ (+)극에서는 수소가 환원된다."],"figures":"","ans":2,"solution":"물의 전기분해로 H₂:O₂ = 2:1(몰비=부피비)이다. 질량비는 4:32=1:8이라 ① 틀림, (−)극은 환원으로 H₂ 생성·(+)극은 산화로 O₂ 생성이라 ③④ 틀림. 부피비 2:1은 아보가드로 원리를 반영하므로 ②가 맞다.","mis":"H₂:O₂ 부피비 2:1(몰비), 질량비는 1:8 — 부피와 질량 혼동 주의"},{"n":58,"area":"반응속도·평형","concept":"반응 속도식","type":"자료해석","stem":"다음 반응의 속도식을 결정하기 위하여 반응물의 농도를 달리하면서 반응속도를 측정한 결과이다. A(g) + 3B(g) ⇌ 2C(g) + D(g). 올바른 반응속도 식은?","choices":["① 속도=k[A]²[B]","② 속도=k[A][B]³","③ 속도=k[A][B]","④ 속도=k"],"figures":"표: 실험1 [A]=0.04 [B]=0.04 속도=4.95 / 실험2 [A]=0.02 [B]=0.04 속도=2.48 / 실험3 [A]=0.02 [B]=0.08 속도=4.99.","ans":3,"solution":"실험1→2: [A] 절반, [B] 고정 시 속도 절반 → A 1차. 실험2→3: [A] 고정, [B] 2배 시 속도 2배 → B 1차. 따라서 속도=k[A][B].","mis":"속도식 차수는 실험으로 결정 — 계수(3B)를 그대로 쓰지 않는다"},{"n":59,"area":"열화학","concept":"활성화 에너지·촉매","type":"계산","stem":"A + B ⇌ C인 반응에서 정반응의 반응엔탈피는 -450 kJ/mol이고 활성화 에너지는 31 kJ/mol이다. 정촉매를 사용하여 활성화 에너지가 10 kJ/mol 만큼 낮아졌다면, 정촉매 하에서 역반응의 반응엔탈피와 활성화 에너지는? 단, 역반응은 정반응의 역으로 진행된다고 가정한다.","choices":["① -440 kJ/mol, -471 kJ/mol","② 450 kJ/mol, 471 kJ/mol","③ 440 kJ/mol, 481 kJ/mol","④ -450 kJ/mol, 491 kJ/mol"],"figures":"","ans":2,"solution":"역반응 반응엔탈피는 부호 반대라 +450 kJ/mol. 촉매 하 정반응 Ea = 31−10 = 21 kJ/mol. ΔH_정 = Ea,정 − Ea,역 → −450 = 21 − Ea,역 → Ea,역 = 471 kJ/mol. 따라서 450, 471.","mis":"촉매는 ΔH 불변, Ea만 감소 — 역반응 Ea = 정반응 Ea − ΔH_정"},{"n":60,"area":"반응속도·평형","concept":"아레니우스 식","type":"개념","stem":"반응속도상수는 온도뿐만 아니라 반응의 활성화에너지에도 의존한다. 다음의 조건들 중에서 반응속도상수가 가장 크게 나타나는 경우는?","choices":["① 온도가 높고 활성화에너지가 클 때","② 온도가 낮고 활성화에너지가 클 때","③ 온도가 높고 활성화에너지가 작을 때","④ 온도가 낮고 활성화에너지가 작을 때"],"figures":"","ans":3,"solution":"k = A·e^(−Ea/RT)에서 온도 T가 높고 활성화에너지 Ea가 작을수록 지수부가 커져 k가 크다.","mis":"k ∝ e^(−Ea/RT) — 고온·낮은 Ea에서 반응속도상수 최대"}];
var PER = 3, TOTAL = Q.length * PER;
var S = { name:'', school:'', grade:'', ans:{} , view:'entry' };
try{ S.name = localStorage.getItem('j0_name')||''; S.school=localStorage.getItem('j0_school')||''; S.grade=localStorage.getItem('j0_grade')||''; }catch(e){}
var CIRC = ['','①','②','③','④','⑤'];
// index.html 과 같은 구글 시트 저장 엔드포인트 ('성적기록' 탭). doPost 가 이 형식을 받는다.
var SHEET_ENDPOINT = 'https://script.google.com/macros/s/AKfycbxGmSCkip0cQCyOH_JA2SiAMSxri00XObLmHyXlyXwxhG7u7w-x0FH02VN4DQySiUsv9Q/exec';
var EXAM_TITLE = '조준모의고사 0회';   // 시트 '시험' 열 값 (index.html EXAMS 의 j0 title 과 동일)
var SAVED = false;
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function count(){ return Object.keys(S.ans).length; }
// 공유 링크: 이름·학교·학년·답안(60자)을 URL에 담아, 열면 성적표를 그대로 다시 보여준다(백엔드 불필요).
function b64e(str){ try{ return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }catch(e){ return ''; } }
function b64d(s){ try{ s=String(s).replace(/-/g,'+').replace(/_/g,'/'); return decodeURIComponent(escape(atob(s))); }catch(e){ return ''; } }
function shareLink(){
  var a=Q.map(function(q){return S.ans[q.n]||0;}).join('');
  var pl=b64e(JSON.stringify({n:S.name||'',s:S.school||'',g:S.grade||'',a:a}));
  return location.href.split('#')[0].split('?')[0]+'?r='+pl;
}
function copyShare(btn){
  var url=shareLink();
  var done=function(){ var t=btn.textContent; btn.textContent='링크 복사됨 ✓'; setTimeout(function(){btn.textContent=t;},1500); };
  try{ navigator.clipboard.writeText(url).then(done,function(){ window.prompt('결과 링크', url); }); }
  catch(e){ window.prompt('결과 링크', url); }
}
// 학부모 성적 문자 (모의고사용: 시험명·원점수·백점환산·정답수 + 링크)
function msgText(){
  var R=computeResult(), CS=cohortStat(R.score);
  return '[다원교육 영재관 · 화학 조준모]\n'
    + (S.name||'') + ' 학생 ' + EXAM_TITLE + ' 성적표입니다.\n'
    + '· 원점수 ' + R.score + '/' + TOTAL + '점 · 백점환산 ' + R.pct + '점\n'
    + '· 정답 ' + R.correct + '/' + Q.length + '문항\n'
    + '· 백분위 ' + CS.pct + ' · 석차 ' + CS.rank + '/' + CS.n + '\n'
    + '아래 링크에서 영역별 정오와 취약 개념을 확인하세요.\n'
    + shareLink();
}
function copyMsg(btn){
  var m=msgText();
  var done=function(){ var t=btn.textContent; btn.textContent='문자 복사됨 ✓'; setTimeout(function(){btn.textContent=t;},1600); };
  try{ navigator.clipboard.writeText(m).then(done,function(){ window.prompt('학부모 성적 문자', m); }); }
  catch(e){ window.prompt('학부모 성적 문자', m); }
}
function computeResult(){
  var correct=0, byArea={}, order=[];
  Q.forEach(function(q){ var my=S.ans[q.n]||0, ok=(my===q.ans); if(ok)correct++;
    var a=byArea[q.area]||(byArea[q.area]={c:0,t:0}); a.t++; if(ok)a.c++; if(order.indexOf(q.area)<0)order.push(q.area); });
  var score=correct*PER;
  return { correct:correct, score:score, pct:Math.round(score/TOTAL*100), byArea:byArea, order:order };
}
// 성적을 선생님 구글 시트로 전송(1회). no-cors라 응답은 못 읽지만 시트에는 기록된다.
function saveSheet(){
  if(SAVED || !SHEET_ENDPOINT) return;
  var R=computeResult();
  var t=new Date(), ymd=t.getFullYear()+'-'+('0'+(t.getMonth()+1)).slice(-2)+'-'+('0'+t.getDate()).slice(-2);
  var areas=R.order.map(function(a){return a+' '+(R.byArea[a].c*PER)+'/'+(R.byArea[a].t*PER);}).join(', ');
  var answers=Q.map(function(q){return S.ans[q.n]||0;}).join('');

// 실제 응시자(조준모의고사 0회) 점수 분포 → 석차·백분위 (엑셀 반영, 익명)
// 기준 코호트(엑셀 응시자 40명 총점 분포). 실제 응시자는 시트에서 실시간으로 합쳐 인원을 늘린다.
var COHORT={ avg:83.2, natAvg:57.4, totals:[12,21,32,37,40,44,54,54,54,59,59,60,60,63,69,69,71,75,78,82,86,87,87,93,93,96,99,100,102,105,108,111,112,117,126,129,129,141,144,171] };
var LIVE_TOTALS=null;   // 시트에서 불러온 실시간 응시자 [{name,total}]
function normName(s){ return String(s==null?'':s).replace(/s+/g,''); }
// 전체 인원 = 기준 40명 + 시트의 다른 응시자(현재 학생 제외; 아래에서 본인 점수 별도 포함)
function popFor(){
  var me=normName(S&&S.name);
  var others=(LIVE_TOTALS||[]).filter(function(t){return normName(t.name)!==me;}).map(function(t){return t.total;});
  return COHORT.totals.concat(others);
}
function cohortStat(score){
  var pop=popFor().concat([score]), n=pop.length, below=0, above=0, i;
  for(i=0;i<n;i++){ if(pop[i]<score)below++; else if(pop[i]>score)above++; }
  return { n:n, avg:COHORT.avg, natAvg:COHORT.natAvg, pct:Math.round(below/n*100), rank:above+1, live:!!LIVE_TOTALS };
}
// JSONP (Apps Script는 CORS 미지원이라 스크립트 태그로 불러온다)
function jsonp(url,cb){
  var nm='__j0'+(jsonp._i=(jsonp._i||0)+1), s=document.createElement('script'), done=false;
  function fin(d){ if(done)return; done=true; try{delete window[nm];}catch(e){} if(s.parentNode)s.parentNode.removeChild(s); cb(d); }
  window[nm]=function(d){ fin(d); };
  s.onerror=function(){ fin(null); };
  s.src=url+(url.indexOf('?')>=0?'&':'?')+'callback='+nm;
  document.head.appendChild(s);
  setTimeout(function(){ fin(null); },7000);
}
// 시트에서 조준모의고사 0회 응시자 답안을 불러와 총점 분포를 만든다(실시간 인원)
function loadCohort(cb){
  if(!SHEET_ENDPOINT){ cb&&cb(); return; }
  jsonp(SHEET_ENDPOINT+'?action=list&exam=j0&key=', function(d){
    if(d&&d.students&&d.students.length){
      var t=[]; d.students.forEach(function(st){
        var a=String(st.answers||'').replace(/[^0-4]/g,''); if(a.length<Q.length) return;
        var sc=0; for(var i=0;i<Q.length;i++){ if(Number(a.charAt(i))===Q[i].ans) sc+=PER; }
        t.push({ name:st.name||'', total:sc });
      });
      if(t.length) LIVE_TOTALS=t;
    }
    cb&&cb();
  });
}
