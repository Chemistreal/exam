# 채점 규칙·데이터 정합성 검사. 어긋나면 빨간불.
#
# 문항 데이터는 사람이 매번 훑을 수 있는 양이 아니다(2400문항). 그래서 눈으로
# 못 보는 것만 골라 기계가 매번 본다. 화학 내용의 옳고 그름은 검사하지 않는다 —
# 그건 집필·검수에서 사람이 한다.
name: 채점 · 데이터 검사

on:
  # 예전에는 '이 파일들이 바뀌면 돈다' 는 목록이었다. 그런데 목록에 없는 파일이
  # 생기면 그 파일은 **아무 검사도 안 받고 지나간다.** hub.html 이 그랬다 —
  # 목록에 없어서, 셸만 고친 PR 은 검사 없이 초록불이었다.
  # 그래서 뒤집는다: 기본은 '돈다', 검사와 상관없는 것만 뺀다.
  # YAML 앵커(&/*)는 GitHub Actions 에서 되기도 안 되기도 해서 쓰지 않는다.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  # ⚠ 그리고 **아무도 안 밀어도 하루 한 번** 돈다.
  #
  # 2026-08-03 04:52 에 기준 기록 자동 갱신이 데이터를 지우면서 main 이 빨간불이
  # 됐다. 그 커밋의 검사는 실패했지만 자동 커밋이라 아무도 안 봤고, 뒤이은 PR
  # 둘이 문서만 바꿔 paths-ignore 에 걸리는 바람에 **네 시간 동안 빨간 채로**
  # 있었다. 또래 정답률이 열 회차에서 사라진 상태로 그대로 나가고 있었다.
  #
  # 사람이 안 미는 날에도 한 번은 봐야 한다. 실패하면 깃허브가 저장소 주인에게
  # 메일을 보낸다(창구 점검과 같다).
  schedule:
    - cron: '17 21 * * *'     # 매일 06:17 KST (창구 점검보다 조금 먼저)
  workflow_dispatch:

# 한 브랜치에서 앞 검사가 끝나기도 전에 다음 커밋이 오면, 앞 것은 이미 낡은
# 답이다. 그런데 끝까지 돌아 실패하면 **메일은 그대로 간다.** 취소된 검사는
# 메일을 안 보낸다 — 낡은 답을 지우면 그만큼 조용해지고 시간도 아낀다.
# main 에서는 안 지운다. 거기서 취소하면 어느 커밋도 검사받지 않은 채 남는다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 브라우저 검사가 '조용히 건너뜀' 으로 빠져나가지 못하게 한다. 아래에서
    # playwright 를 깔고, 못 찾으면 검사들이 0 이 아니라 1 로 끝난다.
    env:
      REQUIRE_BROWSER: '1'
      NODE_PATH: tests/node_modules
      PORT: '8931'
      # 멈추는 검사는 실패하는 검사보다 나쁘다. 브라우저 검사에는 영원히
      # 기다리는 자리가 많고(serviceWorker.ready·waitForFunction), 하나가
      # 멈추면 30분 타임아웃까지 붙들려 있다가 죽는다 — 통나무에는 "진행 중"
      # 한 줄뿐이라 무엇이 잘못됐는지 알 수 없다. 두 번 겪었다(offline·hub-live).
      # 여기서 가장 오래 걸리는 검사가 65초다. 240초면 넉넉하다.
      TEST_MAX_SEC: '240'
      # ⚠ 위 TEST_MAX_SEC 은 `tests/run.js` 가 검사들을 **자기가 돌릴 때** 쓰는
      #   값이다. CI 는 검사마다 별도의 단계로 node 를 직접 부르므로 그 보호가
      #   여기까지 오지 않는다. 2026-08-07 에 '통합 셸 · 실제 브라우저' 가
      #   그대로 멈춰 30분 작업 한도를 통째로 먹고 죽었다 — 통나무에는 그 단계가
      #   "진행 중" 인 것뿐이라, 뒤에 있던 검사 서른일곱 개는 아예 돌지도 않았다.
      #   그래서 **단계마다** timeout-minutes 를 붙였다. 멈추면 몇 분 만에,
      #   어느 단계에서 멈췄는지 이름과 함께 빨간불이 켜진다.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # wrongbook-assets.py 가 크롭 PNG 2400장이 실제로 열리는지 확인할 때 쓴다.
      - name: Pillow 설치
        timeout-minutes: 5
        run: python3 -m pip install --quiet Pillow

      # ── 브라우저 ──────────────────────────────────────────
      # 여태 CI 에는 브라우저가 없었다. 그래서 브라우저가 필요한 검사 열두 개가
      # **매번 조용히 건너뛰고 초록불** 이었다 — 통합 셸의 실제 브라우저 검사는
      # 한 번도 CI 에서 돈 적이 없다. 초록불이 거짓말을 하면 검사는 없느니만 못하다.
      - name: playwright 설치
        timeout-minutes: 5
        run: npm install --prefix tests
      - name: chromium 설치
        timeout-minutes: 10
        run: npx --prefix tests playwright install --with-deps chromium
      # 브라우저 검사는 정적 서버가 있어야 한다(file:// 로는 localStorage 오리진이
      # 갈려서 앱끼리 기록을 못 나눈다 — 이 셸이 기대는 바로 그 성질이다).
      # ⚠ `python3 -m http.server` 는 한 번에 한 요청만 받는다. 서비스워커가
      # 설치하며 파일을 한꺼번에 받아 갈 때 화면의 요청과 엉켜 서로를 기다린다.
      # 오프라인 검사가 그것 때문에 CI 를 40분 붙들고 있었다. 여러 줄로 받는다.
      - name: 정적 서버 (검사용)
        timeout-minutes: 3
        run: |
          nohup python3 -c 'from http.server import SimpleHTTPRequestHandler,ThreadingHTTPServer; ThreadingHTTPServer(("",8931),SimpleHTTPRequestHandler).serve_forever()' >/dev/null 2>&1 &
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://127.0.0.1:8931/hub.html && exit 0
            sleep 0.5
          done
          echo "::error::정적 서버가 뜨지 않았습니다"; exit 1

      # ── 채점 ──────────────────────────────────────────────
      - name: 원점수 채점 규칙
        timeout-minutes: 5
        run: node tests/final-score.js
      # 오답 −1 인 회차에서 비우면 0점, 찍고 틀리면 −1점이다. 채점은 갈라 세고
      # 있었는데 **화면만 둘을 '틀린 문항' 으로 묶어** 보여 주고 있었다.
      # (2026-08-10, 선생님이 짚으셨다)
      - name: 무응답과 오답을 갈라 적는다
        timeout-minutes: 5
        run: node tests/blank-vs-wrong.js
      # 「분자간인력 1/1 · 100%」 이 아무 딱지 없이 나오니 "성취도 100인데 왜
      # 강점이 아니냐" 가 됐다. 규칙(문항 2개 이상만 판정)은 맞았는데 그 규칙이
      # 화면 어디에도 없었다. (2026-08-10, 선생님이 짚으셨다)
      - name: 판정 기준이 적혀 있다 · 오답 노트가 유형으로 묶인다
        timeout-minutes: 5
        run: node tests/area-verdict.js
      - name: 학생제출 ↔ 교사용 동기화
        timeout-minutes: 5
        run: node tests/final-submit-sync.js

      # ── 데이터 정합성 ─────────────────────────────────────
      - name: 통계 풀 병합 · 동형문제 세트
        timeout-minutes: 5
        run: node tests/final-cohort-alias.js
      - name: 시트 동기화 시험 제목 표
        timeout-minutes: 5
        run: node tests/appsscript-sync.js
      - name: 성적표 문자 문장 다양화
        timeout-minutes: 5
        run: node tests/message-variety.js
      - name: 전원정답 문항 (답을 안 써도 정답 · 분모에서 안 뺀다)
        timeout-minutes: 5
        run: node tests/allcorrect.js
      - name: 갈라진 이름표 (응시했는데 안 한 것처럼 보이는 회차)
        timeout-minutes: 5
        run: node tests/split-name.js
      - name: 응시 이력 (브라우저가 아니라 학생에게 붙는다)
        timeout-minutes: 5
        run: node tests/history.js
      - name: 연도누적 총석차 · 당해년도 반석차
        timeout-minutes: 5
        run: node tests/rank-year.js
      - name: 깃허브 자동 저장 (이름 대신 코드 · 손으로 넣은 기준을 안 덮는다)
        timeout-minutes: 5
        run: node tests/backup-gs.js
      - name: 시트 수정 창구 (지목한 행만 바뀐다)
        timeout-minutes: 5
        run: node tests/sheet-edit.js
      - name: 시트 석차 재계산 (나중 학생이 앞사람 인원을 늘린다)
        timeout-minutes: 5
        run: node tests/rank-recompute.js
      - name: 또래 정답률 모집단 (기준 기록을 합쳐 센다)
        timeout-minutes: 5
        run: node tests/peer-rate.js
      - name: 시험 제목 표가 시험 목록과 일치
        timeout-minutes: 5
        run: python3 tools/gen_exam_titles.py
      - name: 기준 코호트 표가 시험 목록·기준 기록과 일치
        timeout-minutes: 5
        run: python3 tools/gen_gas_cohort.py
      - name: 문자 범위 문구가 시험 목록·영역 데이터와 일치
        timeout-minutes: 5
        run: python3 tools/gen_gas_msgexams.py
      - name: 동형문제 자산 (전 시험 전 문항)
        timeout-minutes: 5
        run: python3 tests/wrongbook-assets.py
      - name: 표기 · 정답 분포 · 문항 형식
        timeout-minutes: 5
        run: python3 tools/dh_lint.py
      - name: 개념 색인이 문항 데이터와 일치
        timeout-minutes: 5
        run: python3 tools/gen_pool_index.py --check
      # exams.json 이 늦게 와도 앱이 죽지 않도록 파일 안에 심어 둔 예비본.
      # 손으로 고치는 사본이 아니라 exams.json 에서 생성한 것이라, 어긋나면 빨간불.
      - name: 회차 자료 링크 (문제지·해설이 실제로 있다)
        timeout-minutes: 5
        run: node tests/exam-assets.js
      # 눈으로 보면 "좀 흐린가?" 로 끝나고 흐린 채로 남는다. 숫자로 박아 둔다.
      # (--muted 가 셸에서는 고쳐졌는데 파이널에는 옛 값이 남아 갈렸던 적이 있다)
      - name: 색 대비 · 글씨 크기 (두 앱이 갈리지 않게)
        timeout-minutes: 5
        run: node tests/contrast.js
      # 위 검사는 파이널·셸 두 장만 본다. 화면은 261장이다 — 나머지 259장은
      # 아무도 안 봤고, 재어 보니 218곳이 대비 미달, 706곳이 11px 미만이었다.
      # ⚠ 이 줄은 오랫동안 `--check` 없이 불렸다. 자는 `--check` 일 때만 1 을
      #   내므로, **결함이 몇 장이 걸리든 초록불**이었다. 재는 것과 막는 것은
      #   다르다. DT 저장소에서 같은 자리가 152장을 걸어 놓고도 초록불이었다.
      - name: 화면 전수 검수 (대비 · 글씨 · 안전장치)
        timeout-minutes: 5
        run: python3 tools/audit_pages.py --check
      # 낭독기는 이름 없는 입력칸을 그냥 '편집' 이라고 읽는다 — 열 칸이
      # 나란히 있으면 열 번 다 '편집' 이다. 눈에 보이는 <label> 이 이미
      # 있는데 이어지지 않은 자리는 사람 판단 없이 이어 줄 수 있다.
      - name: 입력칸에 이름이 붙어 있다
        timeout-minutes: 5
        run: python3 tools/input_labels.py --check
      # kmchc/분석_v2.html 은 표 머리에 `scope="col"` 을 붙이던 손질이 큰따옴표로
      # 묶인 글자열 **안쪽**에 큰따옴표를 넣는 바람에, 화면을 열면 자바스크립트가
      # 첫 줄에서 죽어 통째로 아무 일도 안 했다. 파일만 보면 멀쩡했고 검사도 다
      # 통과했다 — 아무도 그 화면을 안 열어 봤기 때문이다. 이제 기계가 연다.
      - name: 화면 안 자바스크립트가 안 깨졌다
        timeout-minutes: 5
        run: python3 tools/js_syntax.py --check
      # 해설지 77장 중 52장이 26쌍의 복사본이다(바이트 단위로 같다 · 1.64MB).
      # 지금은 같으니 아무 일도 안 일어난다. 무서운 것은 **다음 손질**이다 —
      # 해설 오타 하나를 고치면 그 고침은 한쪽에만 닿고, 화면도 검사도 멀쩡하다.
      # 어느 쪽을 연 학생이 틀린 해설을 보는지는 그때 가서도 모른다.
      # 지우지는 않는다(어느 이름을 남길지는 선생님이 정한다). 갈라지는 것만 막는다.
      - name: 같은 화면 두 벌이 갈라지지 않았다
        timeout-minutes: 5
        run: python3 tools/dupe_pages.py --check
      # 팔레트가 261번 따로 적혀 있었고, 그러는 동안 값이 갈라졌다 —
      # --line 8가지 · --ink 6가지 · --teal 5가지 · --paper 2가지.
      # 한 장씩 보면 다 멀쩡하고, 나란히 놓을 일이 없으니 아무도 몰랐다.
      # 이제 한 곳(tools/theme.py)에서 찍어 넣고, 어긋난 장이 있으면 막는다.
      - name: 모든 화면이 같은 옷을 입고 있다
        timeout-minutes: 5
        run: python3 tools/theme.py --check
      # 그 옷에는 그림이 두 겹 깔린다(머리띠 문양 · 여백의 벤젠 고리).
      # 글로만 읽는 검사는 겹쳐진 결과를 못 본다 — 색 이름표만 재면 문양이
      # 아무리 진해도 초록불이다. 그래서 **화면을 찍어 화소를 읽는다.**
      # 이 검사를 만들면서 원래 있던 대비 미달 여섯 자리가 드러나 같이 고쳤다.
      - name: 그림 위에서도 글씨가 읽힌다 (실제 브라우저)
        timeout-minutes: 5
        run: node tests/theme.js
      # 낱개 검사는 저마다 한 화면의 한 가지 일을 본다. 그런데 화면이
      # **열리다가 터지는 것**은 아무도 안 봤다. 자바스크립트가 한 줄
      # 어긋나면 그 아래가 통째로 안 돌아가는데, 파일은 멀쩡히 있고 링크도
      # 살아 있어서 정적 검사는 전부 초록불이다. 258장을 다 열어 본다.
      - name: 화면 258장이 조용히 열린다 (실제 브라우저)
        timeout-minutes: 10
        run: node tests/page-health.js
      # 화학1 일6-10 반에 김지완(내정중)·김지완(대청중) 두 학생이 있다.
      # 명단이 이름 글자열이라 한 명만 등록돼 반 인원이 모자랐고, 한 명이
      # 시험을 보면 **둘 다 응시한 것**이 되어 미응시 문자가 안 나갔다.
      # ⚠ 학교는 **가르는 데만** 쓴다 — 문자는 그대로 '김지완 학생' 이다.
      #   그 값이 순수한 이름인지 여기서 못박는다(객체가 들어가면 학부모에게
      #   '[object Object] 학생' 이라고 나간다).
      - name: 같은 반 동명이인이 갈린다 (문자는 이름만)
        timeout-minutes: 5
        run: node tests/dupe-name.js
      # 2026-08-05, JMChC 11회를 열 명 이어서 채점했는데 셋이 사라졌다
      # (김규민·전준·최민준). 저장은 한 줄 덧붙인 뒤 시트를 통째로 읽어
      # 다시 계산하고 통째로 되쓰는데, 잠금을 20초 안에 못 얻으면 잠금 없이
      # 진행하게 되어 있었다 — 채점이 몰리자 **뒤늦게 끝난 옛 사진**이
      # 그 사이에 들어온 줄을 덮었다. 되쓰기 직전에 줄 수를 견줘 막는다.
      - name: 채점이 몰려도 방금 저장한 줄이 안 사라진다
        timeout-minutes: 5
        run: node tests/concurrent-save.js
      # 그림은 재기 어렵다 — "좀 화려한가?" 로는 아무것도 안 고쳐진다. 대신
      # **띠를 사진으로 찍어** 글자가 앉은 자리의 화소를 읽고 대비를 잰다.
      # 팔레트만 재면 셰이더가 아무리 밝아도 초록불이 나온다(셰이더는 CSS 에
      # 안 걸린다). 그림이 유일한 통로가 아닌지, WebGL 이 없는 기기에서 빈
      # 구멍이 안 남는지, 안 보일 때 프레임을 멈추는지도 같이 본다.
      - name: 3D 가 글씨를 먹지 않는다 (실제 브라우저)
        timeout-minutes: 5
        run: node tests/hero3d.js
      # 해설지·문제지는 화면으로도 보지만 **종이로 나가는 것이 본업**이다.
      # 인쇄 규칙이 없으면 바탕색이 A4 를 덮어 잉크를 먹고, 문항이 페이지
      # 경계에서 반으로 잘린다(발문은 앞장·보기는 뒷장). 216장 중 211장이
      # 그랬다 — 해설지 생성기에는 있는데 옛 수작업 해설지는 검사 밖이었다.
      # 강의록 125장은 더 나빴다. 브라우저는 인쇄할 때 배경을 기본으로 안
      # 찍는데, 머리띠와 절 번호가 **색 배경 위의 흰 글씨**였다. 그래서
      # 종이에서는 강의록 제목이 통째로 안 보였다 — 125장 전부, 절 번호
      # 601곳. 화면으로 보면 멀쩡하니 아무도 몰랐다.
      - name: 인쇄해서 쓰는 화면에 인쇄 규칙이 있다
        timeout-minutes: 5
        run: python3 tools/print_styles.py --check
      - name: 통합 셸 (명단 합치기 · 회차 집계 · 남의 데이터를 안 건드린다)
        timeout-minutes: 5
        run: node tests/hub.js
      # 브라우저가 없으면 저절로 건너뛴다(파이널 앱과 맞물리는 자리를 본다)
      - name: 통합 셸 · 실제 브라우저
        timeout-minutes: 5
        run: node tests/hub-live.js
      # 앱스크립트는 실행을 **한 줄로 세운다** — 몇 번 부르나가 곧 얼마나
      # 기다리나다. 셸을 여는 것만으로 DT 창구를 여덟 번 불렀다(그중 셋은
      # 앞엣것이 와야 다음이 나가는 폭포였다). 묶어 보내 두 번이 됐다.
      # 숫자가 도로 늘면 여기서 걸린다. 묶음 창구가 없는 옛 배포에서도
      # 화면이 사는지(하나씩 다시 묻는 길) 같이 본다.
      - name: 통합 셸이 창구를 몇 번 두드리나
        timeout-minutes: 5
        env:
          PORT: '8934'
        run: node tests/hub-batch.js
      # 선생님은 수업 사이에 **휴대폰으로** 허브를 연다. 재어 보니 누르는
      # 자리가 28px 인 것이 25개였고('문자 복사'·'무시' 처럼 제일 많이 누르는
      # 것들), 키보드 단축키 안내가 첫 화면의 110px 을 먹고 있었다 — 휴대폰에는
      # 키보드가 없다. 손가락 기기에서만 키우고 접는다.
      # ⚠ 마우스 화면은 그대로여야 한다. 거기까지 키우면 한 화면에 들어가던
      #   목록이 밀려난다 — 그건 고치는 것이 아니라 망치는 것이다.
      - name: 휴대폰에서 허브가 눌린다 (마우스 화면은 그대로)
        timeout-minutes: 5
        env:
          PORT: '8936'
        run: node tests/hub-touch.js
      # 허브 검사가 833개였는데 이름에 aria·tabindex·낭독·화살표·색약이 든 것이
      # 하나도 없었다. 833개가 전부 '동작과 자료' 를 본다 — 화면을 **쓰는 방법**은
      # 아무도 안 보고 있었다. 안 보니 새고 있었다: 탭 12개에 tabindex 0개(화살표가
      # 안 먹고 Tab 을 열두 번 눌러야 탭 줄을 지난다) · aria-live 0개(바뀌는 숫자를
      # 낭독기가 모른다).
      - name: 허브를 키보드와 낭독기로 쓸 수 있다
        timeout-minutes: 5
        env:
          PORT: '8938'
        run: node tests/hub-a11y.js
      # 허브의 '0회차 표'(docs/허브-200턴.md)는 사람이 손으로 잰 값이다. 손으로 잰
      # 값은 여섯 달 뒤에 아무도 다시 안 잰다 — 좋아졌는지 나빠졌는지 모르는 채로
      # 계획만 남는다. 글에서 알 수 있는 것만 빠르게 다시 잰다(브라우저 안 띄운다).
      - name: 허브가 잰 값에서 되돌아가지 않았다
        timeout-minutes: 5
        run: python3 tools/hub_audit.py --check
      # 앱스크립트는 실행을 한 줄로 세운다. 창구 호출 수는 곧 기다리는 시간이고,
      # 더 나쁘게는 다른 화면의 실패다 — 셸이 여덟 번을 한꺼번에 두드리는 동안
      # 명단 화면이 자기 요청을 줄에서 놓쳐 기본 명단으로 되돌아간 적이 있다.
      # 열 번을 네 번으로 줄여 뒀는데, 되돌아가는 줄은 한 줄이고 화면은 멀쩡해
      # 보인다. 숫자로 박는다.
      - name: 허브가 창구를 몇 번 두드리는가
        timeout-minutes: 5
        env:
          PORT: '8940'
        run: node tests/hub-calls.js
      # 이 저장소의 셋째 원칙은 "자가 이상하다고 하면 코드보다 자를 먼저 본다" 다.
      # 그 원칙이 왜 있는지는 기록으로 남아 있다 — 두 계획서에 열한 번, 전부 자가
      # 틀렸다. 매번 사람이 손으로 알아냈다. 자마다 맞혀야 할 참·거짓 예시를
      # 붙여 두고, 자를 고치다가 넓히거나 좁히면 여기서 걸리게 한다.
      - name: 자가 참·거짓 예시를 맞힌다
        timeout-minutes: 5
        run: python3 tools/lie_check.py --check
      # 이 앱은 **채점을 하는 앱**이라 창구가 죽어도 그 자리에서 채점이 끝나야
      # 한다. 그래서 명단·응답이 브라우저에 남는다 — DT 처럼 "비워도 아무것도
      # 안 잃는다" 를 말할 수 없다. 그러면 더더욱 무엇이 남는지 적혀 있어야
      # 한다. 새 칸이 생기면 한 번 묻게 하고, 까닭 없이 남의 기록 이름이
      # 생기면 막는다(까닭이 있으면 FORBIDDEN_OK 에 그 까닭과 함께 적는다).
      - name: 브라우저에 남기는 칸이 적어 둔 것뿐이다
        timeout-minutes: 5
        run: python3 tools/store_ledger.py --check
      # 화면이 258장이다. 회차마다 문제지·해설·채점판이 따로 있고 그것들을
      # hub·index·회차 첫 장이 서로 건다. 그 그물에서 한 칸이 빠지면 그 장은
      # **주소를 아는 사람만 열 수 있다** — 258장을 눈으로 훑을 수는 없다.
      # DT 에서 처음 세어 보니 여섯 장이 그랬고 그중 셋은 1MB 짜리였다.
      - name: 모든 화면에 문이 있다
        timeout-minutes: 5
        run: python3 tools/page_doors.py --check
      # 네 앱이 다 GitHub Pages 로 나가는데 **거기에 한도가 있다는 것을 아무도
      # 안 재고 있었다**(사이트 1GB · 파일 하나 100MB). 이 한도는 벽에 닿아야
      # 알게 된다 — 어느 날 배포가 멈추고, 그때서야 무엇이 무거운지 찾는다.
      # 그래서 벽이 아니라 **문턱(700MB)** 에서 켠다. 급하면 지우면 안 될 것을
      # 지우게 되므로, 고를 시간이 남아 있을 때 알린다.
      - name: 배포 한도에 여유가 있다
        timeout-minutes: 5
        run: python3 tools/pages_budget.py --check
      # 네 앱이 같은 학생을 다루는데 이름을 어떻게 **맞춰 보는지**가 갈려 있다
      # (exam·DT 는 공백을 모두 지우고, KMChC·study64 는 맞춰 보는 자리가 없다).
      # 다듬는 방식을 바꾸는 것은 자료를 옮기는 일이라 선생님이 정할 칸이다 —
      # 정하기 전까지 이 자는 **세기만 하고 조용하다**(term_drift 와 같은 자리).
      - name: 학생 이름을 맞춰 보는 규칙이 정한 대로다
        timeout-minutes: 5
        run: python3 tools/name_key.py --check
      # 여태 아무도 **휴대폰 폭**을 안 쟀다. audit_pages 는 viewport 태그가
      # 있는지만 본다 — 태그가 있어도 안이 넘치면 화면은 옆으로 밀린다.
      # 처음 재어 258장 가운데 **열여섯 장**이 걸렸다. 학생이 휴대폰으로 읽는
      # 강의였고, 수식(span.fm)이 한 줄로 뻗어 문서가 598px 까지 벌어졌다.
      # 수식과 표는 그대로 두고 제자리에서 구르게 고쳤다.
      - name: 휴대폰 폭에서 화면이 옆으로 밀리지 않는다
        timeout-minutes: 15
        env:
          REQUIRE_BROWSER: '1'
          PORT: '8947'
        run: node tests/narrow.js
      # 선생님이 알려 주셨다(2026-08-10) — 문제지에 정답이 문제 바로 옆에
      # 적혀 있다. 열어 보니 서른아홉 개 가운데 **스물여섯 개**가 그랬다.
      # 스물셋은 뒤에 정답표가 통째로 붙어 있었고(그 쪽만 잘라 냈다),
      # 셋(2017·2018·2019)은 아예 **문제지가 아니라 해설편**이었다 —
      # 크롭 예순 장이 전부 거기서 잘려 나왔다.
      # final.html 은 이 링크를 **답안지 바로 위**에 놓는다. 채점 뒤가 아니라
      # 답을 넣기 전 화면이다.
      - name: 문제지에 답이 실려 있지 않다
        timeout-minutes: 5
        run: python3 tools/pdf_answer_leak.py --check
      # 파일 쪽만 고치면 반만 고친 것이다. 화면 쪽에도 같은 구멍이 있었다 —
      # 답안지 바로 위에 '공식 정답 PDF ↓' 를 같이 걸고 있었다. 없애는 게
      # 아니라 자리를 옮긴 것이라, 성적표에는 있는지도 같이 본다.
      - name: 답을 넣기 전 화면에 정답이 없다
        timeout-minutes: 5
        env:
          PORT: '8931'
        run: node tests/answer-not-before.js
      # 화면이 **사람에게 하는 말**은 여태 아무도 안 셌다. 글자 크기와 대비는
      # 재면서, 그 자리에 무엇이 적혀 있는지는 안 본 것이다. 학생이 가져가는
      # 것은 그 문장이다. 여기서는 고치지 않고 **줄어드는 것만** 막는다 —
      # 문장이 조용히 사라지면 학생이 읽던 말이 없어진 것이다.
      - name: 사람에게 하는 말이 조용히 사라지지 않았다
        timeout-minutes: 5
        run: python3 tools/msg_ledger.py --check --quiet
      # 본문이 같은 말을 두 가지로 적고 있다. `type_norm.py` 는 유형 **이름**만
      # 보고 글은 안 봤다. 처음 세어 보니 여덟 짝이 갈려 있었고, 두 저장소가
      # 서로 **반대 방향**으로 굳어 있기도 했다(이온화에너지 592 : 이온화 에너지 316).
      # 어느 쪽이 맞느냐가 아니라 한 벌이냐가 문제라, 고르는 것은 선생님 몫이다.
      # 고르기 전까지 이 자는 조용하고, 고른 뒤에는 반대쪽을 막는다.
      - name: 본문 용어가 정한 표기를 지킨다
        timeout-minutes: 5
        run: python3 tools/term_drift.py --check
      # 인출(스스로 꺼내 보기)은 **맞았는지 알 수 있어야** 값을 한다. 이 저장소의
      # 숙제는 답안지 대신 "입으로 말해 봐" 로 확인시킨다 — 숙제가 대개 계산이
      # 아니라 절차라서 그 쪽이 맞다. 125장 중 118장이 이미 그렇게 하고 있었고
      # 일곱 장만 빠져 있었다. 새 강의가 그 일곱 장처럼 되지 않게 막는다.
      - name: 숙제에 스스로 확인할 기준이 있다
        timeout-minutes: 5
        run: python3 tools/lec_selfcheck.py --check
      # 오개념이 세 자리에 적혀 있다 — 카탈로그 · 강의의 함정 칸 · 오답 카드.
      # 따로 자라면 "카탈로그는 아는데 강의는 말 안 해 주는" 오개념이 생긴다.
      # 실제로 다섯 개념(036·043·061·097·105)이 그랬다.
      - name: 오개념 카탈로그와 강의 함정이 같은 목록을 든다
        timeout-minutes: 5
        run: python3 tools/mis_sync.py --check
      # 한 회차 안에서 문제지와 해설이 다른 상수를 쓰면 학생이 계산을 못 맞춘다.
      # 저장소 전체 통일은 강요하지 않는다 — 회차마다 시험지 표지 값이 다르다.
      - name: 한 회차 안에서 상수가 갈리지 않는다
        timeout-minutes: 5
        run: python3 tools/const_sync.py --check
      # 진단 R&D 화면 서른둘 가운데 어떤 것은 실제 데이터로 돌고 어떤 것은
      # 데이터를 기다린다. 겉모습은 똑같다 — 표가 있고 숫자가 있고 색이 있다.
      # 시제품을 완성품처럼 보여 주면, 나중에 진짜가 와도 못 믿는다.
      - name: R&D 화면이 자기 상태를 말한다
        timeout-minutes: 5
        run: python3 tools/page_honesty.py --check
      # 시작 전에 "10분" 이라고 알면 시작하고, 모르면 미룬다. 강의는 성적표에서
      # "이 개념이 약하다" 는 말과 함께 열리는데, 그 순간 학생이 하는 계산은
      # "지금 열면 얼마나 걸리지?" 하나다. **어림값이라고 같이 적는다.**
      # 글을 고치면 값이 어긋나므로 여기서 다시 잰다.
      - name: 강의에 적힌 읽는 시간이 글과 맞는다
        timeout-minutes: 5
        run: python3 tools/lec_readtime.py --check
      # 브라우저는 바깥 stylesheet 를 만나면 **그리기를 멈추고 기다린다.**
      # 구글 글꼴이 늦거나 안 닿으면 화면은 '글꼴만 못생긴 상태' 가 아니라
      # 아무것도 없는 흰 종이다. 재어 보니 첫 그림이 13.2초였다 — 같은 망에서
      # 허브는 0.5초, 파이널은 0.6초다(둘은 이 줄이 없다). 고친 뒤 0.86초.
      - name: 바깥 글꼴이 첫 화면을 막지 않는다
        timeout-minutes: 5
        run: python3 tools/font_block.py --check
      # 성적표 링크는 **암호를 묻지 않는다**(선생님 결정 · tests/gate.js).
      # 그러면 남는 보호막은 주소를 남이 모른다는 것 하나뿐이라, 그 주소가
      # 검색에 잡히면 보호막이 통째로 사라진다 — 아이 이름·점수·등수가
      # 검색되는 것이다. 개인 성적이 뜨는 화면만 골라 막는다(대문은 그대로).
      - name: 개인 성적 화면이 검색에 열려 있지 않다
        timeout-minutes: 5
        run: python3 tools/noindex.py --check
      # 규칙이 '있다' 는 것과 '실제로 안 기다린다' 는 것은 다르다. 구글이 아예
      # 대답하지 않는 망을 만들어 첫 그림을 재고, 대답하는 망에서는 글꼴이
      # 그대로 오는지도 본다 — 빠르기만 재면 '글꼴을 통째로 빼는 것' 이 만점이다.
      - name: 글꼴 창구가 죽어도 첫 화면이 뜬다
        timeout-minutes: 5
        env:
          PORT: '8935'
        run: node tests/first-paint.js
      - name: 해설 유무 표시가 해설 데이터와 일치
        timeout-minutes: 5
        run: python3 tools/gen_exam_solflag.py
      - name: 해설지가 해설 데이터와 일치
        timeout-minutes: 5
        run: python3 tools/gen_sol_page.py --check
      - name: 시험 목록 예비본이 exams.json 과 일치
        timeout-minutes: 5
        run: python3 tools/gen_exam_fallback.py --check
      - name: 시험끼리 겹치는 문항 (기준 목록 대비 새로 생긴 것)
        timeout-minutes: 5
        run: python3 tools/dh_dupe_scan.py --cross --baseline

      # ── 브라우저가 있어야 하는 검사 ────────────────────────
      # 이제 CI 에서도 **실제로 돈다**(위에서 chromium 을 깐다). REQUIRE_BROWSER 가
      # 켜져 있어 playwright 를 못 찾으면 건너뛰지 않고 빨간불이 된다.
      # 목록에서 빠지면 아무도 안 돌린다(실제로 rank-baseline 이 그랬다) —
      # tests/run.js 가 이 목록을 그대로 읽어 로컬에서도 같은 것을 돌린다.
      - name: 석차 모집단 (기준표 + 채점 기록)
        timeout-minutes: 5
        run: node tests/rank-baseline.js
      # 기준 기록은 석차의 분모다. 자동 갱신이 **두 번** 이것을 지웠다 —
      # 8/3 에 문항별 통계가 열 회차에서, 8/4 에 모집단이 387명→225명으로
      # (jmchc-1 은 46명→11명). 그 분모로 성적표가 나가고 있었다.
      # '손입력 깃발' 하나에 기댄 것이 화근이라, 이제 내용을 보고 막는다.
      - name: 자동 갱신이 못 만드는 것을 지우지 않는다
        timeout-minutes: 5
        run: node tests/baseline-guard.js
      - name: 성적표 Word 문서
        timeout-minutes: 5
        run: node tests/docx-report.js
      - name: 오답노트 상호작용
        timeout-minutes: 5
        run: node tests/wrongbook-interactive.js
      - name: 링크 열람에 암호를 묻지 않는다
        timeout-minutes: 5
        run: node tests/gate.js
      # 규칙이 '있다' 는 것과 '종이에서 읽힌다' 는 것은 다르다. 실제 브라우저에
      # 인쇄 매체를 씌워 제목·절 번호가 흰 글씨가 아닌지 본다. 그리고 화면
      # 매체에서는 원래대로 흰 글씨인지도 본다 — 화면을 건드리면 안 된다.
      - name: 강의록이 종이에서 읽힌다
        timeout-minutes: 5
        env:
          PORT: '8933'
        run: node tests/print-lec.js
      # 이 검사만 자기 서버를 띄운다. 위에서 띄운 것과 같은 포트를 쓰면 부딪힌다.
      # 포트는 step env 로 준다 — run: 줄을 'node tests/…' 꼴로 두어야
      # tests/run.js 가 이 목록을 읽어 로컬에서도 같은 것을 돌린다.
      # ⚠ 이걸 안 보면 **고쳐서 배포해도 아무한테도 안 간다.** 서비스워커가
      # 옛 화면을 캐시에서 꺼내 쓰기 때문이다. 2026-08-03 에 성적표 인원
      # 고침이 그렇게 하루를 날렸다 — 페이지에도 올라갔고 창구도 새 숫자를
      # 주는데 화면만 그대로였다. 캐시 이름을 껍데기 내용에서 짓는다.
      - name: 서비스워커 캐시 이름이 화면 내용과 맞는다
        timeout-minutes: 5
        run: python3 tools/gen_sw_version.py --check
      - name: 오프라인 캐시
        timeout-minutes: 10
        env:
          PORT: '8932'
        run: node tests/offline.js
      - name: 웹이 원본 (열 때마다 맞추고 · 못 보낸 것은 다시 보낸다)
        timeout-minutes: 5
        run: node tests/web-store.js

      # ── 브라우저 없이 도는 나머지 ──────────────────────────
      - name: 시험 목록 예비본 (앱 안에 심어 둔 사본)
        timeout-minutes: 5
        run: node tests/exams-fallback.js
      - name: 선수 개념 드릴
        timeout-minutes: 5
        run: node tests/prereq-drill.js
      - name: 동형 미니 시험지 · 시트 기록
        timeout-minutes: 5
        run: node tests/retest-sheet.js
      - name: 강의 125장에 돌아가는 자리가 붙어 있는가
        timeout-minutes: 5
        run: python3 tools/lec_back.py --check
      # 학생은 자기 오답이 가리키는 **한 강만** 연다. 그런데 강의를 쓸 때는
      # 앞뒤를 다 아는 사람이 쓰므로 "앞에서 배운 Ka·Kb(087)" 같은 문장이
      # 나온다 — 087을 안 본 학생에게는 모르는 말을 아는 것처럼 다루는 말이다.
      - name: 강의 전수 검사 (처음 보는 학생이 알아듣는가)
        timeout-minutes: 5
        run: python3 tools/lec_audit.py --check
      # 얼개가 아니라 **글 안의 화학**을 본다 — 반응식이 실제로 맞춰져 있는가,
      # 상수가 장마다 같은가, 뼈대가 갖춰져 있는가, 표기가 안 깨졌는가.
      # 사람이 125장을 매번 훑을 수 없고, 훑어도 계수 하나는 눈에 안 잡힌다.
      - name: 강의 내용 검사 (반응식 균형 · 상수 · 뼈대)
        timeout-minutes: 5
        run: python3 tools/lec_content.py --check
      # 오답 카드는 문항별 오개념 → OMLIB 의 유형별 줄 → 영역 기본값 순으로
      # 말을 고른다. 앞엣것이 없으면 뒤엣것이 받되, 둘 다 없으면 **윗줄만 뜨고**
      # **아래가 조용히 빈다** — 한때 2220문항 가운데 981문항이 그랬다.
      - name: 오답 카드의 오개념이 비지 않는가 (문항별 2220 · 유형별 715)
        timeout-minutes: 5
        run: python3 tools/om_cover.py --check
      # '네른스트 식' 과 '네른스트식' 은 기계에게 다른 유형이다. 갈리면 통계가
      # 둘로 쪼개지고, OMLIB 에 한쪽만 넣어 두고 나머지가 빈 것을 모른다.
      - name: 같은 유형을 두 가지로 적고 있지 않은가
        timeout-minutes: 5
        run: python3 tools/type_norm.py --check
      # 시상 컷은 회차마다 같은데 난이도는 그렇지 않다. 기준 기록으로 재면
      # 4회는 동상 이상 36%, 11회는 0% 다 — 같은 컷인데 한쪽은 셋에 하나가
      # 받고 한쪽은 아무도 못 받는다. 학생이 보는 수상 확률이 그 회차가 얼마나
      # 어려웠는지를 담지 못한다는 뜻이다.
      # ⚠ 빨간불로 막지 않는다. 이 검사는 **늦추기 전의 날 컷**을 재는 자리라,
      #    아래 cutAdj 가 붙어도 숫자가 그대로다. 회차 난이도를 있는 그대로
      #    보려고 남겨 둔다.
      - name: 시상 컷이 회차 난이도와 맞는가 (알림만)
        timeout-minutes: 5
        run: python3 tools/cut_fit.py
      # 위 검사가 재어 놓은 차이를 실제로 메우는 값이 exams.json 의 cutAdj 다.
      # 어려운 회차만, 기록이 쌓인 만큼만(w=N/(N+K)) 늦춘다. 손으로 고치거나
      # 기준 기록이 늘면 값이 어긋나므로 여기서 다시 셈해 맞는지 본다.
      - name: 늦춘 시상 기준(cutAdj)이 기준 기록과 맞는가
        timeout-minutes: 5
        run: python3 tools/gen_cut_adj.py --check
      # 수상 비율에는 시험지 난이도와 응시자 실력이 섞여 있다. 11회 수상률이
      # 0% 인 것이 시험지 탓인지 그날 본 열여섯 명 탓인지 비율만으로는 안
      # 갈린다 — 뒤엣것이면 늦추는 것은 보상이 아니라 봐주기다.
      # 여러 회차를 본 학생으로 실력을 떼어 내고 시험지만 남겨 되짚는다.
      - name: 늦춘 회차가 사람이 아니라 시험지 때문에 어려웠는가
        timeout-minutes: 5
        run: python3 tools/cut_link.py --check
      # 브라우저 검사가 "이쯤이면 됐겠지" 하고 재우면, 빠른 기계에서는 시간을
      # 버리고 느린 기계에서는 아직 안 끝난 화면을 본다. 코드는 그대로인데
      # 이따금 빨간불이 뜨는 뿌리가 여기다 — 사람이 빨간불을 안 믿게 되면
      # 진짜 고장도 같이 묻힌다. 파일마다 천장을 두고 도로 늘지 않게 막는다.
      # 화올 문제지 원본(HWP)에는 문항마다 실제 정답률이 적혀 있다. 전국
      # 응시자가 푼 결과라, 응시 기록이 없는 회차의 난이도를 짐작하는 자리를
      # 이 값이 대신한다. 원본 문제지는 대회 문제라 저장소에 두지 않으므로
      # **다시 만들 수 없다** — 지워지거나 어긋나면 되돌릴 길이 없다.
      # 성적표와 통합 셸은 회차 목록을 한 곳(exams.json·예비본)에서 읽는데,
      # 분석 화면 열여덟 장은 각자 EXAMS=[…] 를 통째로 품고 있고 맞춰 주는
      # 것이 없었다. 그래서 갈라졌다 — 없는 회차(kmchc-2024-1 등) 셋이 남아
      # 있었고, 화올 열두 회차의 제목이 '화올 2013' 인 채로 굳어 있었다.
      # 고르는 칸에 같은 시험이 두 이름으로 뜨고, 한쪽은 빈 화면이 나온다.
      - name: 분석 화면의 회차 목록이 시험 목록과 맞는가
        timeout-minutes: 5
        run: python3 tools/page_exams.py --check
      # '전원정답' 은 두 가지 다른 일에 붙어 있었다 — 답이 갈려 모두 인정한
      # 문항과, 출제 뒤 문제 자체가 폐기된 문항. 학생이 보는 것은 둘 다
      # '전원정답' 이라 "이건 왜 다 맞았지" 가 된다. 폐기된 것은 그렇다고
      # 적어 주되, 폐기 문항이 전원정답 처리에서 빠지면 학생이 틀린다.
      - name: 폐기된 문항이 제대로 처리돼 있는가
        timeout-minutes: 5
        run: python3 tools/void_check.py --check
      - name: 문제지의 공식 정답률이 성한가
        timeout-minutes: 5
        run: python3 tools/rate_check.py --check
      - name: 검사가 짐작으로 재우는 시간이 늘지 않았는가
        timeout-minutes: 5
        run: python3 tools/blind_wait.py --check
      # 글자와 바탕의 대비. 오래도록 262장 가운데 261장이 빨간불이라
      # 아무도 안 봤는데, 그 261장은 --ok-bg(맞은 문항의 연둣빛 띠) 위에
      # 엉뚱한 글자색을 얹어 잰 헛것이었다. 자를 고치고 진짜 모자란 넷을
      # 고쳐 0장이 되었다 — 이제 하나라도 생기면 걸린다.
      - name: 글자와 바탕의 대비가 4.5:1 아래로 안 내려가는가
        timeout-minutes: 5
        run: python3 tools/audit_pages.py --check
      # 문항의 영역 이름이 성적표가 아는 이름이 아니면 그 문항은 처방 없이
      # 흘러간다. 화면은 멀쩡하고 점수도 맞아서 아무도 모른다 — 열다섯 문항이
      # 그랬다. 회차를 넣는 자리에서 바로 걸리게 한다.
      - name: 문항의 영역 이름을 성적표가 아는가
        timeout-minutes: 5
        run: python3 tools/area_tag.py --check
      # 같은 문항의 정답이 두 곳에 있다 — exams.json(채점)과 answers/(해설).
      # 갈리면 학생은 맞았다고 채점된 문항의 해설에서 다른 답을 본다. 점수는
      # 맞으니 아무도 안 걸린다. jmchc-9 50번이 그랬다.
      - name: 채점하는 정답과 해설이 말하는 정답이 같은가
        timeout-minutes: 5
        run: python3 tools/answer_sync.py --check
      # 기출동형 2490문항의 구조. 낱개로만 부를 수 있어 CI 에 못 걸었고,
      # 안 걸려 있으니 아무도 안 돌렸다 — 보기 넷이 모두 '①' 인 문항이 그대로
      # 나가 있었다(문두에 적어 둔 보기를 choices 로 옮기지 않은 자리).
      - name: 기출동형 문항의 구조가 성한가
        timeout-minutes: 5
        run: python3 tools/dh_validate.py --all
      # 구조가 성해도 셈이 답에 안 닿을 수 있다. 해설은 4.44 를 내놓는데 고른
      # 보기가 1.35 이면 학생은 해설을 따라가다 제가 틀린 줄 안다. 보기가
      # 숫자 넷인 문항만 골라 해설이 그 값에 닿는지 본다.
      - name: 기출동형 해설의 셈이 고른 답에 닿는가
        timeout-minutes: 5
        run: python3 tools/dh_number.py --check
      # 해설 목차는 손으로 카드를 붙여 온 장이라, 회차를 넣어도 여기까지 오는
      # 길이 없었다. 화올 네 회차가 목차에 없었고, 전원정답 표기도 넷이
      # 빠져 있었다.
      - name: 해설 목차가 실제 회차와 맞는가
        timeout-minutes: 5
        run: python3 tools/haeseol_index.py --check
      # '전체 파일 인덱스' 라고 적어 둔 장인데 손으로 카드를 붙여 왔다. 새
      # 화면을 만들어도 여기까지 오는 길이 없어 여덟 장이 빠져 있었고, 구획
      # 머리의 숫자도 셋이 어긋나 있었다.
      - name: 파일 인덱스가 실제 파일과 맞는가
        timeout-minutes: 5
        run: python3 tools/start_index.py --check
      # 문제지에는 문항 딱지가 아닌 회색 상자가 섞여 있다(묶음 문두, 잘못 박힌
      # 딱지). 문항으로 세면 그 뒤 크롭이 통째로 한 칸씩 밀린다 — hwol-2018 은
      # 26번부터 서른다섯 장이 밀려 있었다. 딱지 셈과 남는 상자를 본다.
      - name: 크롭이 제 문항 자리에서 잘리는가
        timeout-minutes: 5
        run: python3 tools/crop_align.py --check
      # Q-행렬 편집기는 유형 태그 목록을 화면 안에 통째로 품고 있는데 다시 뽑아
      # 주는 것이 없었다. 태그 160종이 목록에 아예 없어 선생님이 이을 수가
      # 없었고, 덮임 비율도 옛 분모(1860)로 셈하고 있었다.
      - name: Q-행렬 편집기의 유형 태그가 exams.json 과 맞는가
        timeout-minutes: 5
        run: python3 tools/gen_qmatrix_tags.py --check
      # 오개념 라이브러리가 final.html 과 index.html 에 따로 적혀 있었다.
      # 같은 함수로 쓰이는데 index 쪽은 여든셋뿐이었고 두 줄은 아예 다른 말을
      # 하고 있었다. final.html 을 원본으로 두고 한 벌로 맞춘다.
      - name: 오개념 라이브러리가 두 화면에서 한 벌인가
        timeout-minutes: 5
        run: python3 tools/gen_omlib.py --check
      # 125 개념표가 화면 스물넷에 따로 적혀 있다. 이름을 한 장에서만 고치면
      # 나머지 스물셋이 옛 이름을 든 채 남고, 학생은 같은 개념을 화면마다 다른
      # 이름으로 만난다. 강의 파일이 실제로 있는지도 같이 본다.
      - name: 125 개념표가 화면 스물넷에서 같은 말을 하는가
        timeout-minutes: 5
        run: python3 tools/concept_table.py --check
      # index.html 의 두 코호트. 문항통계는 답이 온전한 학생만 세므로 늘
      # 영역벡터 무리 안에 있어야 한다. 뒤집히면 둘 중 하나가 낡은 것이다.
      - name: 문항통계 무리가 영역벡터 무리 안에 있는가
        timeout-minutes: 5
        run: python3 tools/seed_stats.py --check
      # 자가 예순이다. 어느 자가 무엇을 재는지 한자리에 없으면 있는 자를 못
      # 찾고 새로 만들거나, 이미 막아 둔 결함을 다시 판다. 자마다의 설명 첫
      # 줄을 모아 차례를 만든다 — 두 벌로 적지 않는다.
      - name: tools 차례가 자들과 맞는가
        timeout-minutes: 5
        run: python3 tools/gen_tool_index.py --check
      # 학생이 읽는 글의 과학 표기. 아래첨자·전하까지 기계로 고치려다
      # 'H2Y->HY^2-' 의 '->' 가 화살표가 아니라 음전하와 부등호인 것을 봤다.
      # 앞뒤가 정해진 곱셈 기호 한 갈래만 자물쇠로 건다.
      - name: 윗첨자 지수 앞의 곱셈 기호가 × 인가
        timeout-minutes: 5
        run: python3 tools/sci_notation.py --check
      # 낱개 검사는 저마다 한 조각만 본다. 성적표는 시험 데이터·오답 카드·강의
      # 링크·확률이 한 화면에서 만나는 자리라, 조각이 다 멀쩡해도 합치면 깨질
      # 수 있다 — 회차를 새로 넣을 때 특히 그렇다. 그래서 전 회차를 실제로 채점한다.
      - name: 전 회차 성적표가 끝까지 나온다 (39회차 실제 채점)
        timeout-minutes: 10
        run: node tests/report-all.js
      # 해설지 생성기는 explanationHtml 만 읽는다. 글(explanation)만 써 넣고
      # 이것을 빠뜨리면 해설지가 통째로 비어 나오는데, 파일은 만들어지고
      # 검사도 지나가서 아무도 모른다 — 2026-08-07 에 실제로 그랬다.
      # 이제 '꼴이 있나' 만이 아니라 '글과 같은 말을 하나' 까지 본다. 글만
      # 고치고 꼴을 안 고치면 성적표와 해설지가 서로 다른 말을 하는데,
      # 예전 검사는 '이미 있으니 건너뛴다' 로 지나갔다.
      - name: 해설 글이 해설지 꼴까지 갖췄는가 (낡은 꼴 포함)
        timeout-minutes: 5
        run: python3 tools/gen_expl_html.py --check
      # 답지를 정리하다 보면 '정답표 오류', '원본 렌더 누락', '최종 확정 예정'
      # 같은 말을 적게 된다. 선생님이 판단할 일이지 학생에게 할 말이 아닌데,
      # 적어 넣은 자리가 misconception·explanation 이라 오답 카드와 해설지에
      # 그대로 실려 나갔다 — 35문항이 그랬다. 자리는 editorNote 다.
      - name: 선생님께 남긴 메모가 학생 화면으로 새지 않는가
        timeout-minutes: 5
        run: python3 tools/editor_note.py --check
      - name: 명단 관리 (이름 고침 · 합치기)
        timeout-minutes: 5
        run: node tests/roster-admin.js
      # 답안을 치는 중에 인원 응답이 도착해도 화면을 갈아엎거나 저절로
      # 저장하면 안 된다 — 2026-08-06 에 실제로 그랬다.
      - name: 채점 입력 (치는 중에 갈아엎히지 않는다)
        timeout-minutes: 5
        run: node tests/grading-input.js
      # 성적표에서 개념강의를 열면 돌아오는 단추가 **그 성적표**를 가리켜야
      # 한다. 목록으로 보내면 학생은 코드를 몰라 잠금 화면에 갇힌다.
      - name: 강의에서 돌아가기 (성적표로 · 목록 아님)
        timeout-minutes: 5
        run: node tests/lec-back.js
      # 매일 도는 점검이 매일 같은 실패를 알리면, 사람이 알림을 안 보게 된다.
      # 알릴 것과 안 알릴 것을 가르는 규칙을 여기서 잰다(창구는 안 두드린다).
      - name: 점검 알림 (같은 소식을 두 번 말하지 않는다)
        timeout-minutes: 5
        run: node tests/health-quiet.js
      - name: 공유 링크 (답안 · 또래 통계)
        timeout-minutes: 5
        run: node tests/share-link.js

      # 개념 이름 오타 후보. 후보의 대부분은 둘 다 맞는 말이라(중합반응/중화반응)
      # 빨간불을 낼 수 없다 — 사람이 보고 정한다. 알림만 남긴다.
      - name: 개념 이름 오타 후보 (사람이 판단)
        timeout-minutes: 5
        run: python3 tools/label_typo.py

      # 떠 있는 자산은 빨간불까지 낼 일은 아니라 알림만 남긴다.
      # (지울지는 남긴 쪽과 같은 내용인지 사람이 보고 정한다)
      - name: 아무도 읽지 않는 자산
        timeout-minutes: 5
        run: python3 tools/orphan_scan.py
