# 채점 규칙·데이터 정합성 검사. 어긋나면 빨간불.
#
# 문항 데이터는 사람이 매번 훑을 수 있는 양이 아니다(2400문항). 그래서 눈으로
# 못 보는 것만 골라 기계가 매번 본다. 화학 내용의 옳고 그름은 검사하지 않는다 —
# 그건 집필·검수에서 사람이 한다.
name: 채점 · 데이터 검사

on:
  # 예전에는 '이 파일들이 바뀌면 돈다' 는 목록이었다. 그런데 목록에 없는 파일이
  # 생기면 그 파일은 **아무 검사도 안 받고 지나간다.** hub.html 이 그랬다 —
  # 목록에 없어서, 셸만 고친 PR 은 검사 없이 초록불이었다.
  # 그래서 뒤집는다: 기본은 '돈다', 검사와 상관없는 것만 뺀다.
  # YAML 앵커(&/*)는 GitHub Actions 에서 되기도 안 되기도 해서 쓰지 않는다.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  # ⚠ 그리고 **아무도 안 밀어도 하루 한 번** 돈다.
  #
  # 2026-08-03 04:52 에 기준 기록 자동 갱신이 데이터를 지우면서 main 이 빨간불이
  # 됐다. 그 커밋의 검사는 실패했지만 자동 커밋이라 아무도 안 봤고, 뒤이은 PR
  # 둘이 문서만 바꿔 paths-ignore 에 걸리는 바람에 **네 시간 동안 빨간 채로**
  # 있었다. 또래 정답률이 열 회차에서 사라진 상태로 그대로 나가고 있었다.
  #
  # 사람이 안 미는 날에도 한 번은 봐야 한다. 실패하면 깃허브가 저장소 주인에게
  # 메일을 보낸다(창구 점검과 같다).
  schedule:
    - cron: '17 21 * * *'     # 매일 06:17 KST (창구 점검보다 조금 먼저)
  workflow_dispatch:

# 한 브랜치에서 앞 검사가 끝나기도 전에 다음 커밋이 오면, 앞 것은 이미 낡은
# 답이다. 그런데 끝까지 돌아 실패하면 **메일은 그대로 간다.** 취소된 검사는
# 메일을 안 보낸다 — 낡은 답을 지우면 그만큼 조용해지고 시간도 아낀다.
# main 에서는 안 지운다. 거기서 취소하면 어느 커밋도 검사받지 않은 채 남는다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 브라우저 검사가 '조용히 건너뜀' 으로 빠져나가지 못하게 한다. 아래에서
    # playwright 를 깔고, 못 찾으면 검사들이 0 이 아니라 1 로 끝난다.
    env:
      REQUIRE_BROWSER: '1'
      NODE_PATH: tests/node_modules
      PORT: '8931'
      # 멈추는 검사는 실패하는 검사보다 나쁘다. 브라우저 검사에는 영원히
      # 기다리는 자리가 많고(serviceWorker.ready·waitForFunction), 하나가
      # 멈추면 30분 타임아웃까지 붙들려 있다가 죽는다 — 통나무에는 "진행 중"
      # 한 줄뿐이라 무엇이 잘못됐는지 알 수 없다. 두 번 겪었다(offline·hub-live).
      # 여기서 가장 오래 걸리는 검사가 65초다. 240초면 넉넉하다.
      TEST_MAX_SEC: '240'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # wrongbook-assets.py 가 크롭 PNG 2400장이 실제로 열리는지 확인할 때 쓴다.
      - name: Pillow 설치
        run: python3 -m pip install --quiet Pillow

      # ── 브라우저 ──────────────────────────────────────────
      # 여태 CI 에는 브라우저가 없었다. 그래서 브라우저가 필요한 검사 열두 개가
      # **매번 조용히 건너뛰고 초록불** 이었다 — 통합 셸의 실제 브라우저 검사는
      # 한 번도 CI 에서 돈 적이 없다. 초록불이 거짓말을 하면 검사는 없느니만 못하다.
      - name: playwright 설치
        run: npm install --prefix tests
      - name: chromium 설치
        run: npx --prefix tests playwright install --with-deps chromium
      # 브라우저 검사는 정적 서버가 있어야 한다(file:// 로는 localStorage 오리진이
      # 갈려서 앱끼리 기록을 못 나눈다 — 이 셸이 기대는 바로 그 성질이다).
      # ⚠ `python3 -m http.server` 는 한 번에 한 요청만 받는다. 서비스워커가
      # 설치하며 파일을 한꺼번에 받아 갈 때 화면의 요청과 엉켜 서로를 기다린다.
      # 오프라인 검사가 그것 때문에 CI 를 40분 붙들고 있었다. 여러 줄로 받는다.
      - name: 정적 서버 (검사용)
        run: |
          nohup python3 -c 'from http.server import SimpleHTTPRequestHandler,ThreadingHTTPServer; ThreadingHTTPServer(("",8931),SimpleHTTPRequestHandler).serve_forever()' >/dev/null 2>&1 &
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://127.0.0.1:8931/hub.html && exit 0
            sleep 0.5
          done
          echo "::error::정적 서버가 뜨지 않았습니다"; exit 1

      # ── 채점 ──────────────────────────────────────────────
      - name: 원점수 채점 규칙
        run: node tests/final-score.js
      - name: 학생제출 ↔ 교사용 동기화
        run: node tests/final-submit-sync.js

      # ── 데이터 정합성 ─────────────────────────────────────
      - name: 통계 풀 병합 · 동형문제 세트
        run: node tests/final-cohort-alias.js
      - name: 시트 동기화 시험 제목 표
        run: node tests/appsscript-sync.js
      - name: 성적표 문자 문장 다양화
        run: node tests/message-variety.js
      - name: 전원정답 문항 (답을 안 써도 정답 · 분모에서 안 뺀다)
        run: node tests/allcorrect.js
      - name: 갈라진 이름표 (응시했는데 안 한 것처럼 보이는 회차)
        run: node tests/split-name.js
      - name: 응시 이력 (브라우저가 아니라 학생에게 붙는다)
        run: node tests/history.js
      - name: 연도누적 총석차 · 당해년도 반석차
        run: node tests/rank-year.js
      - name: 깃허브 자동 저장 (이름 대신 코드 · 손으로 넣은 기준을 안 덮는다)
        run: node tests/backup-gs.js
      - name: 시트 수정 창구 (지목한 행만 바뀐다)
        run: node tests/sheet-edit.js
      - name: 시트 석차 재계산 (나중 학생이 앞사람 인원을 늘린다)
        run: node tests/rank-recompute.js
      - name: 또래 정답률 모집단 (기준 기록을 합쳐 센다)
        run: node tests/peer-rate.js
      - name: 시험 제목 표가 시험 목록과 일치
        run: python3 tools/gen_exam_titles.py
      - name: 기준 코호트 표가 시험 목록·기준 기록과 일치
        run: python3 tools/gen_gas_cohort.py
      - name: 문자 범위 문구가 시험 목록·영역 데이터와 일치
        run: python3 tools/gen_gas_msgexams.py
      - name: 동형문제 자산 (전 시험 전 문항)
        run: python3 tests/wrongbook-assets.py
      - name: 표기 · 정답 분포 · 문항 형식
        run: python3 tools/dh_lint.py
      - name: 개념 색인이 문항 데이터와 일치
        run: python3 tools/gen_pool_index.py --check
      # exams.json 이 늦게 와도 앱이 죽지 않도록 파일 안에 심어 둔 예비본.
      # 손으로 고치는 사본이 아니라 exams.json 에서 생성한 것이라, 어긋나면 빨간불.
      - name: 회차 자료 링크 (문제지·해설이 실제로 있다)
        run: node tests/exam-assets.js
      # 눈으로 보면 "좀 흐린가?" 로 끝나고 흐린 채로 남는다. 숫자로 박아 둔다.
      # (--muted 가 셸에서는 고쳐졌는데 파이널에는 옛 값이 남아 갈렸던 적이 있다)
      - name: 색 대비 · 글씨 크기 (두 앱이 갈리지 않게)
        run: node tests/contrast.js
      # 위 검사는 파이널·셸 두 장만 본다. 화면은 261장이다 — 나머지 259장은
      # 아무도 안 봤고, 재어 보니 218곳이 대비 미달, 706곳이 11px 미만이었다.
      - name: 화면 전수 검수 (대비 · 글씨 · 안전장치)
        run: python3 tools/audit_pages.py
      # 낭독기는 이름 없는 입력칸을 그냥 '편집' 이라고 읽는다 — 열 칸이
      # 나란히 있으면 열 번 다 '편집' 이다. 눈에 보이는 <label> 이 이미
      # 있는데 이어지지 않은 자리는 사람 판단 없이 이어 줄 수 있다.
      - name: 입력칸에 이름이 붙어 있다
        run: python3 tools/input_labels.py --check
      # kmchc/분석_v2.html 은 표 머리에 `scope="col"` 을 붙이던 손질이 큰따옴표로
      # 묶인 글자열 **안쪽**에 큰따옴표를 넣는 바람에, 화면을 열면 자바스크립트가
      # 첫 줄에서 죽어 통째로 아무 일도 안 했다. 파일만 보면 멀쩡했고 검사도 다
      # 통과했다 — 아무도 그 화면을 안 열어 봤기 때문이다. 이제 기계가 연다.
      - name: 화면 안 자바스크립트가 안 깨졌다
        run: python3 tools/js_syntax.py --check
      # 해설지 77장 중 52장이 26쌍의 복사본이다(바이트 단위로 같다 · 1.64MB).
      # 지금은 같으니 아무 일도 안 일어난다. 무서운 것은 **다음 손질**이다 —
      # 해설 오타 하나를 고치면 그 고침은 한쪽에만 닿고, 화면도 검사도 멀쩡하다.
      # 어느 쪽을 연 학생이 틀린 해설을 보는지는 그때 가서도 모른다.
      # 지우지는 않는다(어느 이름을 남길지는 선생님이 정한다). 갈라지는 것만 막는다.
      - name: 같은 화면 두 벌이 갈라지지 않았다
        run: python3 tools/dupe_pages.py --check
      # 팔레트가 261번 따로 적혀 있었고, 그러는 동안 값이 갈라졌다 —
      # --line 8가지 · --ink 6가지 · --teal 5가지 · --paper 2가지.
      # 한 장씩 보면 다 멀쩡하고, 나란히 놓을 일이 없으니 아무도 몰랐다.
      # 이제 한 곳(tools/theme.py)에서 찍어 넣고, 어긋난 장이 있으면 막는다.
      - name: 모든 화면이 같은 옷을 입고 있다
        run: python3 tools/theme.py --check
      # 그 옷에는 그림이 두 겹 깔린다(머리띠 문양 · 여백의 벤젠 고리).
      # 글로만 읽는 검사는 겹쳐진 결과를 못 본다 — 색 이름표만 재면 문양이
      # 아무리 진해도 초록불이다. 그래서 **화면을 찍어 화소를 읽는다.**
      # 이 검사를 만들면서 원래 있던 대비 미달 여섯 자리가 드러나 같이 고쳤다.
      - name: 그림 위에서도 글씨가 읽힌다 (실제 브라우저)
        run: node tests/theme.js
      # 화학1 일6-10 반에 김지완(내정중)·김지완(대청중) 두 학생이 있다.
      # 명단이 이름 글자열이라 한 명만 등록돼 반 인원이 모자랐고, 한 명이
      # 시험을 보면 **둘 다 응시한 것**이 되어 미응시 문자가 안 나갔다.
      # ⚠ 학교는 **가르는 데만** 쓴다 — 문자는 그대로 '김지완 학생' 이다.
      #   그 값이 순수한 이름인지 여기서 못박는다(객체가 들어가면 학부모에게
      #   '[object Object] 학생' 이라고 나간다).
      - name: 같은 반 동명이인이 갈린다 (문자는 이름만)
        run: node tests/dupe-name.js
      # 2026-08-05, JMChC 11회를 열 명 이어서 채점했는데 셋이 사라졌다
      # (김규민·전준·최민준). 저장은 한 줄 덧붙인 뒤 시트를 통째로 읽어
      # 다시 계산하고 통째로 되쓰는데, 잠금을 20초 안에 못 얻으면 잠금 없이
      # 진행하게 되어 있었다 — 채점이 몰리자 **뒤늦게 끝난 옛 사진**이
      # 그 사이에 들어온 줄을 덮었다. 되쓰기 직전에 줄 수를 견줘 막는다.
      - name: 채점이 몰려도 방금 저장한 줄이 안 사라진다
        run: node tests/concurrent-save.js
      # 그림은 재기 어렵다 — "좀 화려한가?" 로는 아무것도 안 고쳐진다. 대신
      # **띠를 사진으로 찍어** 글자가 앉은 자리의 화소를 읽고 대비를 잰다.
      # 팔레트만 재면 셰이더가 아무리 밝아도 초록불이 나온다(셰이더는 CSS 에
      # 안 걸린다). 그림이 유일한 통로가 아닌지, WebGL 이 없는 기기에서 빈
      # 구멍이 안 남는지, 안 보일 때 프레임을 멈추는지도 같이 본다.
      - name: 3D 가 글씨를 먹지 않는다 (실제 브라우저)
        run: node tests/hero3d.js
      # 해설지·문제지는 화면으로도 보지만 **종이로 나가는 것이 본업**이다.
      # 인쇄 규칙이 없으면 바탕색이 A4 를 덮어 잉크를 먹고, 문항이 페이지
      # 경계에서 반으로 잘린다(발문은 앞장·보기는 뒷장). 216장 중 211장이
      # 그랬다 — 해설지 생성기에는 있는데 옛 수작업 해설지는 검사 밖이었다.
      # 강의록 125장은 더 나빴다. 브라우저는 인쇄할 때 배경을 기본으로 안
      # 찍는데, 머리띠와 절 번호가 **색 배경 위의 흰 글씨**였다. 그래서
      # 종이에서는 강의록 제목이 통째로 안 보였다 — 125장 전부, 절 번호
      # 601곳. 화면으로 보면 멀쩡하니 아무도 몰랐다.
      - name: 인쇄해서 쓰는 화면에 인쇄 규칙이 있다
        run: python3 tools/print_styles.py --check
      - name: 통합 셸 (명단 합치기 · 회차 집계 · 남의 데이터를 안 건드린다)
        run: node tests/hub.js
      # 브라우저가 없으면 저절로 건너뛴다(파이널 앱과 맞물리는 자리를 본다)
      - name: 통합 셸 · 실제 브라우저
        run: node tests/hub-live.js
      # 앱스크립트는 실행을 **한 줄로 세운다** — 몇 번 부르나가 곧 얼마나
      # 기다리나다. 셸을 여는 것만으로 DT 창구를 여덟 번 불렀다(그중 셋은
      # 앞엣것이 와야 다음이 나가는 폭포였다). 묶어 보내 두 번이 됐다.
      # 숫자가 도로 늘면 여기서 걸린다. 묶음 창구가 없는 옛 배포에서도
      # 화면이 사는지(하나씩 다시 묻는 길) 같이 본다.
      - name: 통합 셸이 창구를 몇 번 두드리나
        env:
          PORT: '8934'
        run: node tests/hub-batch.js
      # 선생님은 수업 사이에 **휴대폰으로** 허브를 연다. 재어 보니 누르는
      # 자리가 28px 인 것이 25개였고('문자 복사'·'무시' 처럼 제일 많이 누르는
      # 것들), 키보드 단축키 안내가 첫 화면의 110px 을 먹고 있었다 — 휴대폰에는
      # 키보드가 없다. 손가락 기기에서만 키우고 접는다.
      # ⚠ 마우스 화면은 그대로여야 한다. 거기까지 키우면 한 화면에 들어가던
      #   목록이 밀려난다 — 그건 고치는 것이 아니라 망치는 것이다.
      - name: 휴대폰에서 허브가 눌린다 (마우스 화면은 그대로)
        env:
          PORT: '8936'
        run: node tests/hub-touch.js
      # 브라우저는 바깥 stylesheet 를 만나면 **그리기를 멈추고 기다린다.**
      # 구글 글꼴이 늦거나 안 닿으면 화면은 '글꼴만 못생긴 상태' 가 아니라
      # 아무것도 없는 흰 종이다. 재어 보니 첫 그림이 13.2초였다 — 같은 망에서
      # 허브는 0.5초, 파이널은 0.6초다(둘은 이 줄이 없다). 고친 뒤 0.86초.
      - name: 바깥 글꼴이 첫 화면을 막지 않는다
        run: python3 tools/font_block.py --check
      # 성적표 링크는 **암호를 묻지 않는다**(선생님 결정 · tests/gate.js).
      # 그러면 남는 보호막은 주소를 남이 모른다는 것 하나뿐이라, 그 주소가
      # 검색에 잡히면 보호막이 통째로 사라진다 — 아이 이름·점수·등수가
      # 검색되는 것이다. 개인 성적이 뜨는 화면만 골라 막는다(대문은 그대로).
      - name: 개인 성적 화면이 검색에 열려 있지 않다
        run: python3 tools/noindex.py --check
      # 규칙이 '있다' 는 것과 '실제로 안 기다린다' 는 것은 다르다. 구글이 아예
      # 대답하지 않는 망을 만들어 첫 그림을 재고, 대답하는 망에서는 글꼴이
      # 그대로 오는지도 본다 — 빠르기만 재면 '글꼴을 통째로 빼는 것' 이 만점이다.
      - name: 글꼴 창구가 죽어도 첫 화면이 뜬다
        env:
          PORT: '8935'
        run: node tests/first-paint.js
      - name: 해설 유무 표시가 해설 데이터와 일치
        run: python3 tools/gen_exam_solflag.py
      - name: 해설지가 해설 데이터와 일치
        run: python3 tools/gen_sol_page.py --check
      - name: 시험 목록 예비본이 exams.json 과 일치
        run: python3 tools/gen_exam_fallback.py --check
      - name: 시험끼리 겹치는 문항 (기준 목록 대비 새로 생긴 것)
        run: python3 tools/dh_dupe_scan.py --cross --baseline

      # ── 브라우저가 있어야 하는 검사 ────────────────────────
      # 이제 CI 에서도 **실제로 돈다**(위에서 chromium 을 깐다). REQUIRE_BROWSER 가
      # 켜져 있어 playwright 를 못 찾으면 건너뛰지 않고 빨간불이 된다.
      # 목록에서 빠지면 아무도 안 돌린다(실제로 rank-baseline 이 그랬다) —
      # tests/run.js 가 이 목록을 그대로 읽어 로컬에서도 같은 것을 돌린다.
      - name: 석차 모집단 (기준표 + 채점 기록)
        run: node tests/rank-baseline.js
      # 기준 기록은 석차의 분모다. 자동 갱신이 **두 번** 이것을 지웠다 —
      # 8/3 에 문항별 통계가 열 회차에서, 8/4 에 모집단이 387명→225명으로
      # (jmchc-1 은 46명→11명). 그 분모로 성적표가 나가고 있었다.
      # '손입력 깃발' 하나에 기댄 것이 화근이라, 이제 내용을 보고 막는다.
      - name: 자동 갱신이 못 만드는 것을 지우지 않는다
        run: node tests/baseline-guard.js
      - name: 성적표 Word 문서
        run: node tests/docx-report.js
      - name: 오답노트 상호작용
        run: node tests/wrongbook-interactive.js
      - name: 링크 열람에 암호를 묻지 않는다
        run: node tests/gate.js
      # 규칙이 '있다' 는 것과 '종이에서 읽힌다' 는 것은 다르다. 실제 브라우저에
      # 인쇄 매체를 씌워 제목·절 번호가 흰 글씨가 아닌지 본다. 그리고 화면
      # 매체에서는 원래대로 흰 글씨인지도 본다 — 화면을 건드리면 안 된다.
      - name: 강의록이 종이에서 읽힌다
        env:
          PORT: '8933'
        run: node tests/print-lec.js
      # 이 검사만 자기 서버를 띄운다. 위에서 띄운 것과 같은 포트를 쓰면 부딪힌다.
      # 포트는 step env 로 준다 — run: 줄을 'node tests/…' 꼴로 두어야
      # tests/run.js 가 이 목록을 읽어 로컬에서도 같은 것을 돌린다.
      # ⚠ 이걸 안 보면 **고쳐서 배포해도 아무한테도 안 간다.** 서비스워커가
      # 옛 화면을 캐시에서 꺼내 쓰기 때문이다. 2026-08-03 에 성적표 인원
      # 고침이 그렇게 하루를 날렸다 — 페이지에도 올라갔고 창구도 새 숫자를
      # 주는데 화면만 그대로였다. 캐시 이름을 껍데기 내용에서 짓는다.
      - name: 서비스워커 캐시 이름이 화면 내용과 맞는다
        run: python3 tools/gen_sw_version.py --check
      - name: 오프라인 캐시
        env:
          PORT: '8932'
        run: node tests/offline.js
      - name: 웹이 원본 (열 때마다 맞추고 · 못 보낸 것은 다시 보낸다)
        run: node tests/web-store.js

      # ── 브라우저 없이 도는 나머지 ──────────────────────────
      - name: 시험 목록 예비본 (앱 안에 심어 둔 사본)
        run: node tests/exams-fallback.js
      - name: 선수 개념 드릴
        run: node tests/prereq-drill.js
      - name: 동형 미니 시험지 · 시트 기록
        run: node tests/retest-sheet.js
      - name: 명단 관리 (이름 고침 · 합치기)
        run: node tests/roster-admin.js
      # 답안을 치는 중에 인원 응답이 도착해도 화면을 갈아엎거나 저절로
      # 저장하면 안 된다 — 2026-08-06 에 실제로 그랬다.
      - name: 채점 입력 (치는 중에 갈아엎히지 않는다)
        run: node tests/grading-input.js
      # 매일 도는 점검이 매일 같은 실패를 알리면, 사람이 알림을 안 보게 된다.
      # 알릴 것과 안 알릴 것을 가르는 규칙을 여기서 잰다(창구는 안 두드린다).
      - name: 점검 알림 (같은 소식을 두 번 말하지 않는다)
        run: node tests/health-quiet.js
      - name: 공유 링크 (답안 · 또래 통계)
        run: node tests/share-link.js

      # 개념 이름 오타 후보. 후보의 대부분은 둘 다 맞는 말이라(중합반응/중화반응)
      # 빨간불을 낼 수 없다 — 사람이 보고 정한다. 알림만 남긴다.
      - name: 개념 이름 오타 후보 (사람이 판단)
        run: python3 tools/label_typo.py

      # 떠 있는 자산은 빨간불까지 낼 일은 아니라 알림만 남긴다.
      # (지울지는 남긴 쪽과 같은 내용인지 사람이 보고 정한다)
      - name: 아무도 읽지 않는 자산
        run: python3 tools/orphan_scan.py
