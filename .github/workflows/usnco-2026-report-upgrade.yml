name: USNCO 2026 report upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/usnco-2026-report-upgrade.yml'
      - 'tools/upgrade_usnco_2026_report.py'
      - 'tools/restore_next_student_button.py'
      - 'tools/install_usnco_2026_practice.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore original detailed USNCO solution data
        run: |
          git show b720ca70edf465f7201c09a9f8e3bb661190dac2:answers/usnco-2026-natl-1.json > answers/usnco-2026-natl-1.json

      - name: Apply USNCO integration
        run: |
          python3 tools/upgrade_usnco_2026_report.py
          python3 tools/restore_next_student_button.py
          python3 tools/install_usnco_2026_practice.py
          python3 tools/gen_pool_index.py --write
          python3 tools/gen_exam_solflag.py --write
          python3 tools/gen_sol_page.py usnco-2026-natl-1 --write
          python3 tools/gen_exam_fallback.py --write

      - name: Validate shared report system
        run: |
          python3 tools/gen_exam_fallback.py --check
          python3 tools/gen_pool_index.py --check
          python3 tools/gen_exam_solflag.py
          python3 tests/wrongbook-assets.py
          node tests/final-submit-sync.js
          node tests/final-score.js
          node tests/exam-materials.js
          node tests/gate.js

      - name: Commit generated integration
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .tmp-usnco-practice donghyung/usnco-2026-natl-1.json donghyung/index.json tests/wrongbook-assets.py
          git add exams.json final.html final-submit.html answers/usnco-2026-natl-1.json sol-final-usnco-2026-natl-1.html
          git commit -m 'Complete USNCO 2026 report and practice workflow'
          git push