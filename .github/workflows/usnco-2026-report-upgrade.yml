name: USNCO 2026 report upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/usnco-2026-report-upgrade.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply USNCO integration
        run: |
          python3 tools/upgrade_usnco_2026_report.py
          python3 tools/gen_sol_page.py usnco-2026-natl-1 --write
          python3 tools/gen_exam_fallback.py --write

      - name: Validate shared report system
        run: |
          python3 tools/gen_exam_fallback.py --check
          node tests/final-submit-sync.js
          node tests/final-score.js
          node tests/exam-materials.js
          node tests/gate.js

      - name: Commit generated integration
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exams.json final.html final-submit.html answers/usnco-2026-natl-1.json sol-final-usnco-2026-natl-1.html
          git commit -m 'Integrate USNCO 2026 with full final report'
          git push
