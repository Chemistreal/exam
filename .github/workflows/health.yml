# 세 앱의 창구가 실제로 대답하는지 매일 확인한다.
#
# DT 는 **한 해 내내 대답하지 않고 있었다.** 통합 셸이 JSONP 로 부르는데 저쪽이
# 콜백을 무시하고 순수 JSON 을 줘서, 받는 쪽 브라우저가 그걸 자바스크립트로
# 실행하려다 죽었다. 화면에는 '…' 와 '—' 만 남았고, 그게 '아직 불러오는 중'
# 인지 '고장' 인지 알 길이 없어 아무도 눈치채지 못했다.
#
# 사람이 화면을 봐야 아는 고장은 안 고쳐진다. 기계가 매일 본다.
# 실패하면 깃허브가 저장소 주인에게 메일을 보낸다(별도 설정 필요 없음).
name: 앱 창구 점검

on:
  schedule:
    - cron: '0 22 * * *'      # 매일 07:00 KST (UTC 22:00)
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 창구가 대답하는지
        run: node tools/health_check.js

      # ── 배포 열쇠가 아직 살아 있는지 ──────────────────────────
      # 2026-08-03 에 .gs 를 고쳐 병합했는데 자동 배포가 `invalid_grant` 로
      # 죽었다. 저장소에는 고친 코드가 들어갔지만 **앱스크립트에는 안 올라갔다** —
      # 화면은 옛 코드로 돌고 있었다.
      #
      # 배포는 .gs 가 바뀔 때만 돈다. 그래서 열쇠가 만료돼도 다음에 .gs 를
      # 고칠 때까지, 몇 주라도 아무도 모른다. 여기서 매일 한 번 확인한다.
      # (읽기만 한다 — clasp status 는 아무것도 올리지 않는다)
      - name: 배포 열쇠가 살아 있는지
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$GAS_SCRIPT_ID" ]; then
            echo "::warning title=배포 미설정::자동배포 시크릿이 없습니다 — .gs 를 고쳐도 반영되지 않습니다."
            exit 0
          fi
          npm i -g @google/clasp@2.4.2 >/dev/null 2>&1
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"gas"}' "$GAS_SCRIPT_ID" > .clasp.json
          mkdir -p gas
          if clasp status >/dev/null 2>&1; then
            echo "배포 열쇠 살아 있음"
          else
            echo "::error title=배포 열쇠 만료::clasp 인증이 만료됐습니다(invalid_grant). .gs 를 고쳐도 앱스크립트에 안 올라갑니다 — AUTODEPLOY.md 의 CLASPRC_JSON 을 다시 발급하세요."
            exit 1
          fi
