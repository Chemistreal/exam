# AppsScript-Code.gs가 main에 머지되면 Google Apps Script에 자동 반영 + 같은 URL로 재배포.
# 최초 1회 설정 방법은 저장소 루트의 AUTODEPLOY.md 참고.
#
# ── 2026-09-07: 배포 앞에 문을 둘 두었다 ─────────────────────────────────
# 여태 이 워크플로는 main 에 .gs 가 올라가기만 하면 **검사도 안 보고 곧바로**
# 운영 백엔드를 갈아치웠다. 그 백엔드는 학생 성적 시트를 읽고 쓴다. 사람이든
# 자동화든 main 에 직접 미는 지금 방식에서는, 잘못 민 한 줄이 그대로 학생
# 데이터를 만진다.
#
#   문 하나 — 창구 검사(node tests/*.js)가 통과해야 배포로 넘어간다.
#             안 그러면 깨진 창구가 초록불을 달고 배포된다.
#   문 둘 — `environment: production`. 저장소 설정에서 그 환경에 검토자를
#            한 명 넣으면, 배포 직전에 사람이 눌러야 나간다.
#            **안 넣으면 지금 그대로 자동으로 나간다** — 켜는 시점을
#            선생님이 고르시게 두려는 것이다(설정 → Environments →
#            production → Required reviewers).
name: Apps Script 자동 배포

on:
  push:
    branches: [main]
    paths: ['AppsScript-Code.gs']
  workflow_dispatch:

jobs:
  # 창구가 성한지부터 본다. 여기서 걸리면 배포는 아예 안 돈다.
  검사:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 창구 검사
        run: |
          python3 tools/gen_gas_keys.py
          for t in jsonp-callback admin-token server-regrade backup-shape \
                   history sheet-edit backup-gs \
                   rank-recompute sheet-recall concurrent-save resend-idempotent \
                   rank-year appsscript-sync; do
            echo "── $t"
            node "tests/$t.js"
          done

  deploy:
    needs: 검사
    runs-on: ubuntu-latest
    # 이 환경에 검토자를 넣기 전까지는 예전처럼 바로 나간다.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: 설정 확인
        id: check
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
          GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$GAS_SCRIPT_ID" ] || [ -z "$GAS_DEPLOYMENT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            # 건너뛰고도 초록불이면 "배포됐다" 로 읽힌다. 실제로 KMChC 가 그랬다 —
            # 창구를 새로 열고 병합했는데 배포가 안 돼서, 통합 셸의 그 칸이 계속 비어 있었다.
            echo "::warning title=배포 안 됨::자동배포 미설정 — 이 커밋은 Apps Script 에 반영되지 않았습니다. AUTODEPLOY.md 의 시크릿 3개(CLASPRC_JSON, GAS_SCRIPT_ID, GAS_DEPLOYMENT_ID)를 등록해야 합니다."
            echo "### ⚠ 배포 안 됨 — 시크릿 미설정" >> "$GITHUB_STEP_SUMMARY"
            echo "이 커밋의 .gs 변경은 **아직 Apps Script 에 반영되지 않았습니다.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 20

      - name: clasp 설치 · 인증
        if: steps.check.outputs.ready == 'true'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          npm i -g @google/clasp@2.4.2
          # clasp 는 인증 파일을 두 자리에서 찾는다.
          #   ~/.clasprc.json   `clasp login` (clasp 자신의 OAuth 클라이언트)
          #   ./.clasprc.json   `clasp login --creds` (내 OAuth 클라이언트)
          # 어느 쪽으로 만든 열쇠든 받아들이도록 둘 다에 쓴다. 파일 모양은 같다
          # ({token, oauth2ClientSettings, isLocalCreds}) — 안에 클라이언트 정보가
          # 함께 들어 있어서, 자리만 맞으면 그대로 새로고침된다.
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '%s' "$CLASPRC_JSON" > .clasprc.json

      - name: 코드 반영 (clasp push)
        if: steps.check.outputs.ready == 'true'
        env:
          GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
        run: |
          printf '{"scriptId":"%s","rootDir":"gas"}' "$GAS_SCRIPT_ID" > .clasp.json
          mkdir -p gas
          clasp pull                     # 기존 매니페스트(appsscript.json) 보존
          find gas -name '*.js' -delete  # 기존 코드 파일 제거(매니페스트는 유지)
          cp AppsScript-Code.gs gas/AppsScript-Code.js
          clasp push -f

      - name: 재배포 (같은 URL 유지)
        if: steps.check.outputs.ready == 'true'
        env:
          GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
        run: |
          clasp deploy -i "$GAS_DEPLOYMENT_ID" -d "auto-deploy $GITHUB_SHA"
          echo "::notice::Apps Script 재배포 완료 — 웹앱 URL은 그대로 유지됩니다."
