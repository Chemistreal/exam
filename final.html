<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5"><title>파이널 · 수상권 진단 · Chemistreal</title><style>
:root{--cream:#FBFAF6;--paper:#fff;--ink:#23201b;--ink-2:#5a564d;--muted:#8a8578;--teal:#0E5A4C;--teal-d:#3A7A6B;--brass:#B08D57;--line:#E8E4DA;--ms:#C0603A;--ok-bg:#eef5f2;--no-bg:#f7ece7;--cobalt:#3F5C8C;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;line-height:1.62;-webkit-text-size-adjust:100%}
.serif{font-family:"Nanum Myeongjo",Georgia,serif}
header{background:linear-gradient(180deg,#0E5A4C,#0b4a3f);color:#fff;padding:24px 20px 20px;text-align:center}
header .logo{font-size:12.5px;letter-spacing:.18em;opacity:.82;font-weight:600}
header h1{margin:6px 0 3px;font-size:24px;font-weight:700}
header .sub{font-size:12.5px;opacity:.85}
main{max-width:780px;margin:0 auto;padding:16px 15px 60px}
.back{display:inline-flex;align-items:center;gap:5px;color:var(--teal);background:none;border:none;font-size:14px;cursor:pointer;padding:8px 0;font-weight:600}
.note{background:#fff;border:1px solid var(--line);border-left:3px solid var(--brass);border-radius:8px;padding:11px 14px;font-size:13px;color:var(--ink-2);margin:13px 0}
.grp{margin:22px 0 8px;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.grp .gt{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;background:#eef5f2;color:var(--teal)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:11px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 16px;cursor:pointer;transition:.13s;display:flex;flex-direction:column;gap:7px}
.card:hover{border-color:var(--teal-d);box-shadow:0 3px 14px rgba(14,90,76,.08);transform:translateY(-1px)}
.card__t{font-size:15.5px;font-weight:700}
.card__m{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{position:relative}
.slink{position:absolute;top:10px;right:10px;font-size:11px;color:var(--teal,#3A7A6B);background:rgba(58,122,107,.08);border:1px solid rgba(58,122,107,.25);border-radius:7px;padding:4px 8px;cursor:pointer;font-weight:600}
.slink:active{background:rgba(58,122,107,.18)}
#repPDF.pdfing{background:#fff;padding:10px 12px;border-radius:0}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--ok-bg);color:var(--teal)}
.tag.s{background:#f3edff;color:#6b4fb0}
.idbar{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 4px}
.idbar input{flex:1;min-width:110px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit}
.omr{margin:13px 0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 6px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px}
.row{display:flex;align-items:center;gap:7px;padding:4px 8px;border-radius:8px}
.row .qn{width:26px;text-align:right;font-family:var(--mono);font-size:13px;color:var(--ink-2);font-weight:600}
.bub{width:27px;height:27px;border-radius:50%;border:1.6px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12.5px;cursor:pointer;color:var(--muted);user-select:none;transition:.1s}
.bub.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700}.bub.miss{opacity:.4}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:8px 0}
.btn{background:var(--teal);color:#fff;border:none;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.btn:active{transform:translateY(1px)}.btn.ghost{background:#fff;color:var(--teal);border:1.5px solid var(--teal)}.btn.sm{padding:8px 14px;font-size:13px}
.paste{width:100%;min-height:52px;border:1px dashed var(--line);border-radius:9px;padding:9px 12px;font-family:var(--mono);font-size:14px;resize:vertical}
.qinput{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin:10px 0}
.qinput label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-2);font-weight:600}
.qinput input{width:120px;padding:10px 13px;border:1.5px solid var(--line);border-radius:10px;font-size:17px;font-family:var(--mono);text-align:center}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:13px 0}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;text-align:center}
.kpi b{display:block;font-size:25px;color:var(--teal);font-weight:800;line-height:1.1}.kpi span{font-size:12px;color:var(--muted)}
.sec{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px 18px;margin:13px 0}
.sec__h{display:flex;align-items:center;gap:9px;margin:0 0 11px}
.sec__no{font-family:var(--mono);font-size:12px;font-weight:700;color:#fff;background:var(--teal);width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center}
.sec__t{font-size:15px;font-weight:700}
.sub{font-size:12.5px;color:var(--muted);margin:-4px 0 8px}
.wrong{display:flex;flex-wrap:wrap;gap:7px}
.wq{display:inline-flex;align-items:center;gap:6px;background:var(--no-bg);border:1px solid #e8d4ca;border-radius:8px;padding:5px 10px;font-size:13px}
.wq .n{font-family:var(--mono);font-weight:700}.wq .x{color:var(--ms)}.wq .o{color:var(--teal);font-weight:700}
.muted{color:var(--muted);font-size:13px}
.barrow{display:flex;align-items:center;gap:9px;margin:5px 0;font-size:13px}
.barrow .ba{width:96px;color:var(--ink-2);font-weight:600;font-size:12.5px}
.barrow .bar{flex:1;height:9px;background:#f0ece2;border-radius:5px;overflow:hidden}.barrow .bar i{display:block;height:100%}
.barrow .bp{width:46px;text-align:right;font-family:var(--mono);font-size:12px;color:var(--ink-2)}
a.pdf{display:inline-flex;align-items:center;gap:6px;color:var(--teal);font-weight:600;text-decoration:none;font-size:14px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:24px 16px}
.award{border-radius:16px;padding:22px 20px;text-align:center;margin:14px 0;border:1.5px solid}
.award .lab{font-size:12px;letter-spacing:.1em;font-weight:700;opacity:.7}
.award .tier{font-size:40px;font-weight:800;margin:6px 0 2px;line-height:1.05}
.award .reach{display:inline-block;font-size:13px;font-weight:700;padding:3px 12px;border-radius:999px;background:rgba(255,255,255,.6);margin-top:4px}
.award .mot{font-size:14px;margin-top:10px;font-weight:600}
.t0{background:#FBF3DD;border-color:#E4C45B;color:#8a6d12}.t1{background:#FBF6E3;border-color:#D9BE54;color:#9a7c14}
.t2{background:#F0F2F4;border-color:#C2C8CE;color:#5e656c}.t3{background:#F6EFE3;border-color:#CDB081;color:#86663a}
.t4{background:#EDF3F0;border-color:#A9C4B7;color:#3f6b59}.t5{background:#F2F0EB;border-color:#D8D2C6;color:#7a756a}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.lchip{font-size:12px;padding:4px 10px;border-radius:8px;border:1px solid var(--line);color:var(--ink-2);font-weight:600}
.lchip.cur{border-width:2px;border-color:var(--teal);color:var(--teal);background:var(--ok-bg)}
table.gtbl{width:100%;border-collapse:collapse;font-size:13px}
table.gtbl th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:6px 8px;border-bottom:1.5px solid var(--line)}
table.gtbl td{padding:6px 8px;border-bottom:1px solid #f1ede4}
table.gtbl td.mono{font-family:var(--mono)}
.ox{font-weight:800}.ox.o{color:var(--teal)}.ox.x{color:var(--ms)}
.pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;background:#f1ede4;color:var(--ink-2)}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.qcell{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.qcell .qt{font-size:12px;font-weight:700;margin-bottom:4px}
.qcell .qn2{font-family:var(--mono);font-size:12px;color:var(--ink-2);line-height:1.8}
.distbar{display:flex;height:22px;border-radius:6px;overflow:hidden;border:1px solid var(--line);font-size:11px}
.distbar div{display:flex;align-items:center;justify-content:center;color:#fff}
@media(max-width:480px){
.omr{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.award .tier{font-size:34px}
.quad{grid-template-columns:1fr}
main{padding:12px 11px 50px}
.sec{padding:13px 12px;border-radius:11px;margin:11px 0}
.award{padding:18px 14px}
h1{font-size:21px}
.kpis{gap:7px}
.kpi{padding:11px 5px}
.kpi b{font-size:21px}
.kpi span{font-size:10.5px}
.ba{width:80px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bp{width:38px;font-size:11px}
.barrow{gap:6px}
.note{padding:10px 11px}
.sub{font-size:12px}
th,td{padding:5px 5px;font-size:11.5px}
}
@media(max-width:360px){
.kpi b{font-size:19px}
.tier{font-size:30px}
.ba{width:70px}
}

@media print{
@page{margin:14mm}
body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.back,.toolbar{display:none!important}
main{max-width:100%;padding:0 0 10px}
.sec{box-shadow:none;margin:9px 0}
.award,.kpis,.kpi,.note,.qcell,.omr,svg{break-inside:avoid;page-break-inside:avoid}
.sec{break-inside:auto}
h1,h2,.sec__h,.sub{break-after:avoid}
summary{list-style:none;cursor:default}
summary::-webkit-details-marker{display:none}
}

.kbhint{font-size:12.5px;color:var(--ink-2);background:var(--cream);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:8px 0;line-height:1.6}
.prog{position:sticky;top:0;z-index:5;background:var(--cream);padding:8px 0 9px;margin-bottom:6px}
.prog__bar{height:6px;background:#f0ece2;border-radius:99px;overflow:hidden}
.prog__fill{height:100%;background:var(--teal);width:0;transition:width .25s}
.prog__meta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);margin-top:5px;font-family:var(--mono)}
.omrbox{margin:6px 0 4px}
.omr-group{margin:12px 0}
.omr-group__h{font-size:11.5px;color:var(--muted);font-weight:700;margin:0 0 6px;letter-spacing:.02em}
.omr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:7px 6px}
.qrow{display:flex;align-items:center;gap:5px}
.qrow__n{font-size:12px;color:var(--ink-2);min-width:20px;text-align:right;font-family:var(--mono)}
.ansin{width:36px;height:40px;text-align:center;font-size:17px;font-weight:700;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-family:var(--mono);padding:0;-webkit-appearance:none;appearance:none}
.ansin::placeholder{color:#cfc9bb;font-weight:400}
.ansin:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(14,90,76,.13)}
.ansin.filled{border-color:var(--teal);background:var(--cream);color:var(--teal-d)}
.qrow.miss .ansin{background:#f0ece2;color:var(--muted);border-style:dashed}
@media(max-width:480px){.omr-grid{grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px 5px}.ansin{width:32px;height:36px;font-size:16px}.qrow__n{min-width:18px;font-size:11px}}

/* 다크 히어로 (핵심 진단) · 성적표와 동일 톤 */
.fhero{position:relative;background:radial-gradient(120% 140% at 78% 8%,#13726655 0%,rgba(0,0,0,0) 42%),radial-gradient(90% 120% at 12% 100%,#0a5c5340 0%,rgba(0,0,0,0) 46%),linear-gradient(135deg,#3A7A6B 0%,#0c3a32 55%,#0f221e 100%);border-radius:18px;padding:28px 30px;margin:14px 0 18px;color:#F4F1E8;box-shadow:0 1px 2px rgba(28,24,18,.06),0 26px 60px -34px rgba(10,70,59,.85);overflow:hidden}
.fhero::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 50% at 80% 0%,rgba(234,201,131,.16),rgba(0,0,0,0) 70%);pointer-events:none}
.fhero__ey{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#D8B978;margin-bottom:12px}
.fhero__tier{font-family:'Nanum Myeongjo',Georgia,serif;font-size:40px;font-weight:700;color:#EAC983;line-height:1.1;margin-bottom:8px}
.fhero__head{font-family:'Nanum Myeongjo',Georgia,serif;font-size:22px;font-weight:600;line-height:1.45;color:#FBFAF6}
.fhero__head b{color:#EAC983;font-weight:700}
.fhero__stats{display:flex;gap:0;margin-top:20px;border-top:1px solid rgba(255,255,255,.13);padding-top:16px;flex-wrap:wrap}
.fhds{padding:4px 24px;border-left:1px solid rgba(255,255,255,.13)}
.fhds:first-child{padding-left:0;border-left:none}
.fhds b{display:block;font-family:'Nanum Myeongjo',Georgia,serif;font-size:21px;color:#EAC983}
.fhds span{font-size:11px;color:rgba(244,241,232,.72)}
@media(max-width:560px){.fhero{padding:20px 18px}.fhero__tier{font-size:30px}.fhero__head{font-size:17px}.fhds{padding:4px 14px}}
@media print{.fhero{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
/* 학부모님께 · 총평 */
.fpn{background:linear-gradient(135deg,rgba(63,92,140,.06),rgba(14,90,76,.05));border:1px solid #cdd6e4;border-radius:14px;padding:20px 22px;margin:14px 0}
.fpn__lab{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;color:#3F5C8C;background:rgba(63,92,140,.1);padding:3px 9px;border-radius:6px;margin-bottom:10px}
.fpn p{margin:8px 0;font-size:13.5px;line-height:1.75;color:var(--ink-2)}
.fpn .cmt{background:#fff;border-left:3px solid var(--brass);border-radius:0 9px 9px 0;padding:11px 14px;margin-top:10px;font-size:13.5px;line-height:1.7}
.fpn .cmt .clab{font-size:11px;font-weight:700;color:#7a5d20;display:block;margin-bottom:4px}
.fclosing{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin:14px 0}
.fclosing h3{font-family:'Nanum Myeongjo',Georgia,serif;font-size:16px;margin:0 0 12px;color:var(--teal)}
.fclosing p{font-size:13.5px;line-height:1.8;color:var(--ink-2);margin:10px 0}

    else { e.key.forEach((k,idx)=>{ if([0,1,2,3,4].indexOf(k)<0) add(e.id,'err','문항 '+(idx+1)+' 정답키 범위 이탈: '+k); });

    const mc={}; (e.miss||[]).forEach(q=>{ if(mc[q]) add(e.id,'warn','채점제외 중복: '+q); mc[q]=1; });

}

function cleanCohort(exam,arr){
  const clean=[], flagged=[]; const seen=new Set();
  arr.forEach(r=>{ const ans=r.ans; let bad=null;
    const cnt=[0,0,0,0]; let answered=0;
    ans.forEach(a=>{if(a>=1&&a<=4){cnt[a-1]++;answered++;}});
    if(answered>=10 && Math.max(cnt[0],cnt[1],cnt[2],cnt[3])/answered>=0.85) bad='단일 보기 반복';
    const key=ans.join(',');
    if(!bad && seen.has(key)) bad='답안 패턴 복제';
    seen.add(key);
    if(bad) flagged.push({rec:r,reason:bad}); else clean.push(r); });
  return {clean, flagged};
}
function globalDomainPrior(excludeId){
  const ag={}; let aS=0,aN=0;
  FINAL_EXAMS.forEach(e=>{ if(e.id===excludeId||!e.area||e.area.length!==e.nQ)return; const a=cleanCohort(e,subs(e.id).filter(r=>r.ans&&r.ans.length===e.nQ)).clean; if(a.length<3)return; const miss=new Set(e.miss||[]);
    for(let q=1;q<=e.nQ;q++){ if(miss.has(q))continue; let c=0; a.forEach(r=>{if(okq(e,q,r.ans[q-1]))c++;}); const rate=c/a.length*100; const dm=RX[e.area[q-1]]?e.area[q-1]:(RXMAP[e.area[q-1]]||e.area[q-1]); (ag[dm]=ag[dm]||{s:0,n:0}); ag[dm].s+=rate*a.length; ag[dm].n+=a.length; aS+=rate*a.length; aN+=a.length; }});
  const dom={}; for(const d in ag)dom[d]=ag[d].s/ag[d].n;
  return {dom, overall:aN?aS/aN:60, has:aN>0};
}
function cohortStats(exam){
  const _raw=subs(exam.id).filter(r=>r.ans&&r.ans.length===exam.nQ); const _cc=cleanCohort(exam,_raw); const arr=_cc.clean; const N=arr.length; const _flag=_cc.flagged.length;
  const miss=new Set(exam.miss||[]); const totals=arr.map(r=>r.correct);
  if(N>=MINP){
    const qp=[], qopt=[], qdisc=[];
    const idxSorted=arr.map((r,i)=>({i,t:r.correct})).sort((a,b)=>b.t-a.t);
    const g=Math.max(1,Math.floor(N*0.27)); const hi=idxSorted.slice(0,g).map(x=>x.i), lo=idxSorted.slice(-g).map(x=>x.i);
    for(let q=1;q<=exam.nQ;q++){ if(miss.has(q)){qp.push(null);qopt.push(null);qdisc.push(null);continue;}
      let c=0; const opt=[0,0,0,0];
      arr.forEach(r=>{const a=r.ans[q-1]; if(a>=1&&a<=4)opt[a-1]++; if(okq(exam,q,a))c++;});
      qp.push(Math.round(c/N*100)); qopt.push(opt.map(x=>Math.round(x/N*100)));
      const hc=hi.filter(i=>okq(exam,q,arr[i].ans[q-1])).length/g, lc=lo.filter(i=>okq(exam,q,arr[i].ans[q-1])).length/g;
      qdisc.push(+(hc-lc).toFixed(2)); }
    return {N,ready:true,estimated:false,percReady:true,qp,qopt,qdisc,totals,flagged:_flag};
  }
  // 소표본: 글로벌 도메인 prior로 난이도 추정 (수축)
  const GP=globalDomainPrior(exam.id);
  if(!GP.has) return {N,ready:false,percReady:false,flagged:_flag};
  const K=5; const qp=[], qopt=[];
  for(let q=1;q<=exam.nQ;q++){ if(miss.has(q)){qp.push(null);qopt.push(null);continue;}
    let c=0; const opt=[0,0,0,0]; arr.forEach(r=>{const a=r.ans[q-1]; if(a>=1&&a<=4)opt[a-1]++; if(okq(exam,q,a))c++;});
    const obs = N>0? c/N*100 : null;
    const dm = exam.area? (RX[exam.area[q-1]]?exam.area[q-1]:(RXMAP[exam.area[q-1]]||exam.area[q-1])) : null;
    const prior = (dm&&GP.dom[dm]!=null)?GP.dom[dm]:GP.overall;
    const est = obs==null? prior : (N*obs+K*prior)/(N+K);
    qp.push(Math.round(est)); qopt.push(N>0?opt.map(x=>Math.round(x/N*100)):null); }
  return {N,ready:true,estimated:true,percReady:false,qp,qopt,qdisc:null,totals,flagged:_flag};
}
function percentile(totals,my){const b=totals.filter(s=>s<my).length,e=totals.filter(s=>s===my).length;return Math.round((b+0.5*e)/totals.length*100);}

     ${_fl>0?`<p style="margin:7px 0;color:var(--teal-d)"><b>⑤ 데이터 품질.</b> 또래 통계 산출 시 신뢰할 수 없는 응답(단일 보기 반복·답안 패턴 복제) <b>${_fl}건</b>을 자동 제외해 통계 오염을 막았다.</p>`:''}
   </div></details>
   ${glossHTML()}
  </div>`;
}
function cohortDomBroad(exam,cs){
  if(!cs||!cs.ready||!exam.area)return null;
  const miss=new Set(exam.miss||[]); const ag={};
  for(let q=1;q<=exam.nQ;q++){if(miss.has(q))continue; const a=exam.area[q-1]; const bd=RX[a]?a:(RXMAP[a]||a); (ag[bd]=ag[bd]||{s:0,n:0}); ag[bd].s+=cs.qp[q-1]; ag[bd].n++;}
  const out={}; for(const d in ag)out[d]=Math.round(ag[d].s/ag[d].n); return out;
}
function radarSVG(doms,stu,coh,est){
  const n=doms.length; if(n<3)return '';
  const cx=200,cy=180,R=116;
  const ang=i=>-Math.PI/2+i*2*Math.PI/n;
  const pt=(i,scale)=>{const r=R*scale; return (cx+r*Math.cos(ang(i))).toFixed(1)+','+(cy+r*Math.sin(ang(i))).toFixed(1);};
  const poly=vals=>doms.map((d,i)=>pt(i,(vals&&vals[d]!=null?vals[d]:0)/100)).join(' ');
  const ring=f=>doms.map((d,i)=>pt(i,f)).join(' ');
  const grid=[0.25,0.5,0.75,1].map(f=>`<polygon points="${ring(f)}" fill="none" stroke="var(--line)" stroke-width="1"/>`).join('');
  const axes=doms.map((d,i)=>`<line x1="${cx}" y1="${cy}" x2="${(cx+R*Math.cos(ang(i))).toFixed(1)}" y2="${(cy+R*Math.sin(ang(i))).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`).join('');
  const labels=doms.map((d,i)=>{const lr=R+12,a=ang(i),x=cx+lr*Math.cos(a),y=cy+lr*Math.sin(a),cv=Math.cos(a);const anc=Math.abs(cv)<0.35?'middle':(cv>0?'start':'end');return `<text x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="${anc}" font-size="8.5" fill="var(--ink-2)">${esc(d)}</text>`;}).join('');
  const cohPoly=coh?`<polygon points="${poly(coh)}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="3 3"/>`:'';
  const stuPoly=`<polygon points="${poly(stu)}" fill="var(--teal)" fill-opacity="0.14" stroke="var(--teal)" stroke-width="2"/>`;
  const stuDots=doms.map((d,i)=>{const p=pt(i,(stu[d]||0)/100).split(',');return `<circle cx="${p[0]}" cy="${p[1]}" r="2.2" fill="var(--teal)"/>`;}).join('');
  return `<div style="text-align:center;margin:8px 0 2px"><svg viewBox="0 0 400 360" style="width:100%;max-width:400px;height:auto" xmlns="http://www.w3.org/2000/svg">
    ${grid}${axes}${cohPoly}${stuPoly}${stuDots}${labels}
  </svg>
  <div style="font-size:11.5px;color:var(--muted);margin-top:-4px"><span style="color:var(--teal);font-weight:700">■</span> 나${coh?` &nbsp;&nbsp;<span style="color:var(--muted);font-weight:700">┄</span> 또래 평균${est?'(추정)':''}`:''} &nbsp;&nbsp;바깥일수록 정답률 높음</div></div>`;
}
function areaSec(exam,selv,cs){
  if(!exam.area||exam.area.length!==exam.nQ)return `<div class="sec">${secH('영역별 성취')}<div class="note">이 시험은 영역별 진단이 <b>준비 중</b>입니다. 총점·백분위·문항별 분석으로 진단을 제공합니다.</div></div>`; const miss=new Set(exam.miss||[]); const ag={};
  const ans=[];for(let q=1;q<=exam.nQ;q++){ans.push(selv[q]||0);if(miss.has(q))continue;const a=exam.area[q-1]||'기타';(ag[a]=ag[a]||{c:0,t:0});ag[a].t++;if(okq(exam,q,selv[q]||0))ag[a].c++;}
  const rows=Object.entries(ag).map(([a,v])=>({a,c:v.c,t:v.t,p:Math.round(v.c/v.t*100)})).sort((x,y)=>x.p-y.p);
  const sb=domScoresBroad(exam,ans)||{},cb=cohortDomBroad(exam,cs),rdoms=Object.keys(RX).filter(d=>d in sb);
  const radar=rdoms.length>=3?radarSVG(rdoms,sb,cb,cs&&cs.estimated):'';
  return `<div class="sec">${secH('영역별 성취 · 약한 단원부터')}${radar}${rows.map(r=>`<div class="barrow"><span class="ba">${esc(r.a)}</span><span class="bar"><i style="width:${r.p}%;background:${pcolor(r.p)}"></i></span><span class="bp">${r.c}/${r.t}</span></div>`).join('')}</div>`;
}
function typeSec(exam,selv){
  if(!exam.type)return''; const miss=new Set(exam.miss||[]); const tg={};
  for(let q=1;q<=exam.nQ;q++){if(miss.has(q))continue;const t=exam.type[q-1]||'기타';(tg[t]=tg[t]||{c:0,t:0});tg[t].t++;if(okq(exam,q,selv[q]||0))tg[t].c++;}
  const weak=Object.entries(tg).map(([t,v])=>({t,c:v.c,tt:v.t,p:Math.round(v.c/v.t*100)})).filter(x=>x.p<100).sort((a,b)=>a.p-b.p).slice(0,10);
  if(!weak.length)return `<div class="sec">${secH('개념(유형) 숙련도')}<div class="muted">모든 개념을 맞혔습니다.</div></div>`;
  return `<div class="sec">${secH('개념(유형) 숙련도 · 보완 우선')}<div class="sub">틀린 개념을 우선순위로 정리했습니다.</div>${weak.map(r=>`<div class="barrow"><span class="ba" style="width:120px">${esc(r.t)}</span><span class="bar"><i style="width:${r.p}%;background:${pcolor(r.p)}"></i></span><span class="bp">${r.c}/${r.tt}</span></div>`).join('')}</div>`;
}
const LEC={"원자모형": {"s": "원자모형의 핵심은 '에너지의 양자화'다. 전자는 아무 에너지나 가질 수 없고 허용된 준위에만 존재한다. 수소꼴(전자 1개) 이온은 En=-13.6Z²/n² eV로 정확히 풀리며, 음(-) 부호는 속박 상태를, n→∞에서 0이 됨은 이온화 경계를 뜻한다. 전자가 높은 n에서 낮은 n으로 떨어지면 두 준위 차만큼의 광자를 내놓고(방출) 흡수는 그 반대다. 그래서 선 스펙트럼의 파장 하나하나가 특정 전이를 가리킨다 — 라이먼(→n=1, 자외선)·발머(→n=2, 가시)·파셴(→n=3, 적외). 여기서 자주 무너지는 지점: 에너지와 진동수는 비례(E=hν), 진동수와 파장은 반비례(c=λν)이므로 '에너지 큰 전이=짧은 파장=큰 진동수'를 한 줄로 꿰어야 한다. 다전자 원자에서는 전자-전자 반발과 안쪽 전자의 가림(shielding) 때문에 같은 n이라도 s<p<d로 갈라진다. 전자배치는 네 양자수(n, l, ml, ms)로 규정되며 l은 0~n-1, ml은 -l~+l, ms는 ±1/2만 허용된다 — 이 범위를 어기는 보기가 단골 오답이다. 배치 규칙은 셋: 파울리(한 오비탈에 반대 스핀 2개까지)·훈트(축퇴 오비탈은 홀전자부터)·쌓음(낮은 에너지부터). 셋을 모두 지키면 바닥상태, 하나라도 어기면 들뜬상태다. 이 모든 양자 개념의 출발점은 빛의 입자성(광전효과: 세기가 아니라 문턱 진동수 이상이라야 전자 방출)과 물질의 파동성(드브로이 λ=h/p)이다.", "u": "lecture-index.html#area-01"}, "주기율": {"s": "주기성을 지배하는 단 하나의 변수는 유효 핵전하(Zeff)다. 전자가 실제로 느끼는 핵의 끌림으로, '양성자수 - 안쪽 전자의 가림'으로 어림한다. 같은 주기에서 오른쪽으로 갈수록 양성자는 늘지만 전자는 같은 껍질에 들어가 가림이 거의 안 늘어 Zeff가 커진다 → 반지름은 줄고 이온화에너지·전기음성도는 커진다. 같은 족에서 아래로 가면 껍질이 늘어 바깥 전자가 멀어지므로 반지름은 커지고 이온화에너지는 작아진다. 여기서 학생이 놓치는 두 예외가 급소다. 첫째 2족>13족 역전(Be>B): 13족의 첫 전자는 에너지가 높은 p 오비탈에 있어 떼기 쉽다. 둘째 15족>16족 역전(N>O): 15족은 p 오비탈이 반쯤 찬 안정 배치라, 16족에서 처음 짝지어진 전자를 떼는 쪽이 오히려 쉽다. '경향을 외우되 두 예외에서 갈린다'가 출제 포인트다. 강력한 도구가 순차 이온화에너지다. IE1, IE2, … 를 차례로 떼다 보면 값이 급격히 점프하는 지점이 있는데, 그 직전까지가 원자가전자 수다 — 즉 급증 지점이 족을 알려 준다(IE3에서 점프 = 원자가전자 2개 = 2족). 이온 반지름은 등전자 비교가 단골인데, 전자 수가 같으면 양성자수가 많을수록 핵이 더 세게 당겨 반지름이 작아진다(예: O²⁻>F⁻>Na⁺>Mg²⁺).", "u": "lecture-index.html#area-02"}, "분자의모양": {"s": "분자의 모양은 'VSEPR' 한 원리에서 거의 다 나온다: 중심원자 주위의 전자영역(결합쌍이든 고립쌍이든)은 서로의 반발을 피해 최대한 멀어진다. 먼저 전자영역의 '수'가 기본 골격을 정한다 — 2개 직선(180°)·3개 평면삼각(120°)·4개 사면체(109.5°)·5개 삼방양뿔·6개 팔면체. 그다음 고립쌍이 모양을 깎는다. 고립쌍은 핵에 묶이지 않아 더 퍼져 결합쌍을 강하게 밀어내므로, 같은 전자영역 수라도 고립쌍이 있으면 결합각이 줄고 실제 모양이 달라진다. CH₄·NH₃·H₂O는 모두 전자영역 4개(사면체 골격)지만 고립쌍이 0·1·2개로 늘면서 결합각이 109.5°>107°>104.5°로 줄고 모양은 정사면체→삼각뿔→굽은형으로 바뀐다 — 이 비교가 가장 자주 나온다. 흔한 오개념: '전자영역 수'와 '결합한 원자 수'를 혼동하는 것. 모양을 정하는 건 고립쌍을 포함한 전자영역이지 결합 원자 수가 아니다. 혼성도 같은 논리로 따라온다 — 전자영역 2·3·4·5·6개가 각각 sp·sp²·sp³·sp³d·sp³d²에 대응한다(혼성은 모양의 결과이지 원인이 아니라고 보면 헷갈리지 않는다). 다중결합은 전자영역 하나로 센다는 점도 놓치기 쉽다.", "u": "lecture-index.html#area-03"}, "분자간인력": {"s": "끓는점·녹는점·점도·증기압 — 분자성 물질의 물리적 성질은 거의 다 '분자 사이를 잡아당기는 힘(분자간 인력)'의 세기로 결정된다. 세기의 서열을 몸에 익히는 것이 출발점이다: 이온결합 > 이온-쌍극자 > 수소결합 > 쌍극자-쌍극자 > 분산력. 분산력(런던 힘)은 모든 분자에 있고 순간 쌍극자에서 나오며 전자가 많을수록(대개 분자량이 클수록) 커진다. 그래서 무극성 분자끼리는 분자량이 큰 쪽이 끓는점이 높다(He<Ne<Ar<Kr<Xe). 수소결합은 특별 취급한다 — F·O·N에 직접 결합한 H가 옆 분자의 F·O·N 고립쌍과 맺는 강한 인력으로, 같은 족에서 H₂O·NH₃·HF의 끓는점이 분자량 경향을 거슬러 유난히 높은 이유다. 단골 함정: 분자량만 보고 순서를 매기는 것. H₂O는 16족에서 분자량이 가장 작은데도 수소결합 때문에 끓는점이 가장 높다(H₂S<H₂Se<H₂Te≪H₂O). 점도·표면장력도 같은 원리로, -OH가 많은 분자일수록 수소결합이 촘촘해 점도가 크다. 성질 문제를 만나면 '어떤 인력이 지배하는가'를 먼저 묻고, 수소결합 여부 → 극성(쌍극자) 여부 → 분자량(분산력) 순으로 따지면 거의 틀리지 않는다.", "u": "lecture-index.html#area-04"}, "몰과양적관계": {"s": "화학의 정량은 전부 '몰'이라는 다리를 건넌다. 질량(g)·입자수(개)·기체 부피(L)는 서로 직접 비례하지 않지만, 모두 몰로 환산하면 연결된다 — 몰=질량/몰질량=입자수/아보가드로수(6.02×10²³)=기체부피/22.4L(0°C, 1atm). 반응의 양적 관계에서 가장 중요한 원칙은 '계수비=몰비'다. 화학반응식의 계수는 분자(또는 몰)의 개수비이지 질량비가 아니다. 그래서 질량으로 바로 비례식을 세우면 틀린다 — 반드시 질량→몰로 바꾼 뒤 계수비를 적용하고 필요하면 다시 몰→질량으로 되돌린다. 이 '몰로 갔다 오기'를 건너뛰는 것이 양적관계 최대의 오답 원인이다. 한계 반응물 문제는 각 반응물을 몰로 바꿔 계수로 나눈 뒤, 그 몫이 가장 작은 쪽이 먼저 떨어지는 한계 반응물임을 이용한다. 실험식·분자식은 거꾸로 가는 길이다 — 각 원소의 질량(또는 %)을 몰질량으로 나눠 몰비를 구하고, 가장 간단한 정수비로 만들면 실험식, 거기에 (실제 몰질량/실험식량) 배를 하면 분자식이다. 연소분석은 생성된 CO₂·H₂O 질량에서 C·H의 몰수를 거꾸로 추적하는 전형이다.", "u": "lecture-index.html#area-05"}, "기체": {"s": "이상기체 상태방정식 PV=nRT 하나가 기체 단원의 중심이다. 변수 관계를 따로 외우기보다, 다른 변수를 고정하고 둘만 보면 보일(P∝1/V)·샤를(V∝T)·아보가드로(V∝n) 법칙이 모두 PV=nRT의 특수한 단면임을 알면 된다. 자주 쓰는 변형 둘: 밀도 d=PM/RT(같은 조건이면 밀도는 몰질량에 비례)와 두 상태 비교 P₁V₁/T₁=P₂V₂/T₂. 온도는 반드시 절대온도(K)로 넣어야 한다 — 섭씨로 넣는 것이 흔한 실수다. 혼합기체에서는 부분압이 핵심이다. 각 성분의 부분압 = 전체압 × 그 성분의 몰분율이고, 부분압의 합이 전체압(돌턴 법칙)이다. 분출·확산은 그레이엄 법칙으로, 속도는 √(몰질량)에 반비례한다(가벼운 기체가 빠르다) — 비를 거꾸로 쓰지 않도록 주의한다. 실제기체는 분자 자체 부피와 분자간 인력 때문에 이상기체에서 벗어나는데, 낮은 압력·높은 온도일수록 이상기체에 가깝다. 반데르발스 식의 a는 인력 보정(압력을 키워 줌), b는 부피 보정(자유 부피를 줄임)이라는 의미를 알면 충분하다.", "u": "lecture-index.html#area-06"}, "액체,용액": {"s": "용액 단원의 두 기둥은 '농도'와 '총괄성'이다. 농도는 단위가 핵심이다 — 몰농도(M, mol/용액 L)는 부피 기준이라 온도에 따라 변하고, 몰랄농도(m, mol/용매 kg)는 질량 기준이라 온도와 무관하다. 총괄성(어는점 내림·끓는점 오름·증기압 내림·삼투압)을 다룰 땐 부피가 아닌 질량 기준 몰랄농도를 써야 한다는 점이 자주 헷갈린다. 총괄성의 핵심 정의: 용질의 '종류'가 아니라 '입자 수'에만 비례한다. 그래서 전해질은 반트호프 인자 i(녹아서 생기는 이온 수)를 곱해야 한다 — NaCl은 i≈2, CaCl₂는 i≈3. 이 i를 빠뜨리는 것이 총괄성 최대의 오답이다. 증기압 내림은 라울 법칙으로, 용매에 비휘발성 용질이 녹으면 표면에서 증발할 용매 분자가 줄어 증기압이 낮아진다 — 그래서 끓는점은 오르고 어는점은 내린다. ΔTb=Kb·m·i, ΔTf=Kf·m·i로 한 묶음으로 외우면 된다. 삼투압 π=iMRT(여기선 몰농도 사용)는 반투막을 사이에 둔 용매의 이동으로 이해한다.", "u": "lecture-index.html#area-07"}, "고체": {"s": "결정 단원은 '단위세포'라는 가장 작은 반복 단위로 전체를 추론하는 게임이다. 핵심은 단위세포 안에 입자가 '몇 개분' 들어 있는지를 위치별 분율로 세는 것이다 — 꼭짓점 입자는 8개 세포가 나눠 가지므로 1/8개, 면심은 2개가 나눠 1/2개, 모서리는 4개가 나눠 1/4개, 몸 중심은 온전히 1개다. 이 분율 계산을 틀리면 모든 게 어긋난다. 대표 구조 둘만 정확히: 체심입방(BCC)은 세포당 입자 2개, 체대각선을 따라 원자가 닿아 4r=√3a다. 면심입방(FCC)은 세포당 4개, 면대각선을 따라 닿아 4r=√2a다. 이 '닿는 방향'을 잘못 잡는 것이 반지름-모서리 관계의 단골 오답이다. 배위수(가장 가까운 이웃 수)도 구조의 지문이다 — BCC는 8, FCC는 12. 밀도는 이 모두를 잇는다: 밀도 = (세포당 입자 수 × 몰질량) / (아보가드로수 × 세포 부피 a³). 이온결정(NaCl, 형석 CaF₂ 등)에서는 양이온·음이온의 배위수와 비율이 화학식과 맞아떨어져야 한다는 점도 확인 포인트다.", "u": "lecture-index.html#area-08"}, "열화학": {"s": "열화학의 뼈대는 '엔탈피(H)는 상태함수'라는 한 문장이다. 상태함수란 경로와 무관하게 처음과 끝 상태로만 정해지는 양이다. 그래서 반응 엔탈피 ΔH는 어떤 경로로 가든 같고, 이로부터 헤스 법칙이 나온다 — 여러 반응식을 더하고 빼서 목표 반응을 만들면 ΔH도 똑같이 더하고 뺀다. 이때 식을 뒤집으면 ΔH의 부호가 바뀌고, 계수를 n배 하면 ΔH도 n배가 된다 — 이 부호·배수 처리를 놓치는 것이 헤스 법칙 최대의 함정이다. 부호 규약도 확실히: 발열(주위로 열 방출)은 ΔH<0, 흡열은 ΔH>0. 결합으로 보면 '결합을 끊는 데는 에너지가 들고(흡열) 결합이 생기면 에너지가 나온다(발열)'이므로, ΔH ≈ (끊은 결합 에너지 합) - (생긴 결합 에너지 합)이다 — 방향을 거꾸로 쓰지 않도록 한다. 표준 생성 엔탈피를 쓰면 ΔH = Σ(생성물 ΔHf) - Σ(반응물 ΔHf)로 한 번에 구할 수 있고, 홑원소 물질의 ΔHf는 0이라는 약속이 출발점이다.", "u": "lecture-index.html#area-09"}, "화학평형": {"s": "평형은 '반응이 멈춘 상태'가 아니라 '정반응과 역반응의 속도가 같아져 농도가 더 이상 변하지 않는 동적 상태'다 — 이 오개념을 먼저 깨야 한다. 평형의 위치는 평형상수 K로 표현된다: K = (생성물 농도의 계수 거듭제곱 곱) / (반응물 농도의 계수 거듭제곱 곱). K 식을 세울 때 둘을 자주 틀린다 — 계수를 지수로 올리는 것을 빠뜨리는 것, 그리고 순수 고체·순수 액체는 농도가 일정하므로 K 식에서 제외한다는 점이다. 기체 반응에서는 농도 대신 부분압으로 쓴 Kp가 있고, Kp=Kc(RT)^Δn(Δn=기체 생성물 몰수-반응물 몰수) 관계가 성립한다. 평형이 어디로 이동할지는 르샤틀리에 원리로 판단한다 — 평형에 변화를 주면 그 변화를 '덜어내는' 쪽으로 이동한다. 농도를 늘리면 줄이는 쪽으로, 압력을 높이면(부피를 줄이면) 기체 몰수가 적은 쪽으로, 온도를 올리면 흡열 방향으로 이동한다. 핵심 주의: 촉매와 (반응에 무관한) 비활성 기체 첨가는 평형 위치를 바꾸지 않는다. 농도·압력 변화는 위치를 옮길 뿐 K는 그대로이며, 오직 온도만이 K 값 자체를 바꾼다.", "u": "lecture-index.html#area-10"}, "산과염기": {"s": "산-염기는 정의의 사다리를 오르며 본다. 아레니우스(물에서 H⁺/OH⁻)보다 넓은 브뢴스테드-로우리 정의가 핵심이다 — 산은 양성자(H⁺)를 주는 쪽, 염기는 받는 쪽이다. 그러면 한 반응에서 산과 그 짝염기, 염기와 그 짝산이 쌍으로 나타난다(짝산-짝염기 쌍은 H⁺ 하나 차이). 강산/강염기는 물에서 완전히 이온화하지만, 약산/약염기는 일부만 이온화해 평형을 이루고 그 정도가 Ka/Kb로 표현된다. 물의 자체 이온화곱 Kw=[H⁺][OH⁻]=1.0×10⁻¹⁴(25°C)는 모든 수용액에서 성립하며, 여기서 pH+pOH=14가 나온다. pH=-log[H⁺]에서 자주 나오는 함정: 농도가 10배 묽어지면 pH는 1만큼 변한다는 로그 감각, 그리고 약산은 농도만으로 [H⁺]를 정할 수 없고 Ka로 평형 계산을 해야 한다는 점이다. 또 강산을 아무리 묽혀도 pH가 7을 넘지(염기성이 되지) 않는다 — 물의 자체 이온화 때문에 7에 수렴할 뿐이다. 짝산-짝염기의 세기는 반비례한다: 강한 산의 짝염기는 약하다.", "u": "lecture-index.html#area-11"}, "중화반응": {"s": "중화는 산의 H⁺와 염기의 OH⁻가 만나 물이 되는 반응(H⁺+OH⁻→H₂O)이며, 정량의 핵심은 '몰수'로 따진다는 것이다. 양적 관계의 기준은 n가(산이 내놓는 H⁺ 수, 염기가 내놓는 OH⁻ 수)를 곱한 당량이다 — (산의 몰수×양성자수) = (염기의 몰수×수산화이온 수)일 때 완전 중화된다. H₂SO₄처럼 양성자가 2개인 산을 1가로 취급해 부피·농도를 잘못 잡는 것이 단골 오답이다. 중화점의 액성은 '강약의 조합'으로 갈린다 — 강산+강염기는 중성(pH 7), 강산+약염기는 산성, 약산+강염기는 염기성이다. 이는 생성된 염이 물에서 가수분해하기 때문으로, 약한 쪽의 짝이온이 물과 반응해 액성을 기울인다. 적정에서 지시약은 중화점 부근 pH 도약 구간에서 변색하는 것을 골라야 한다(강산-약염기엔 메틸오렌지, 약산-강염기엔 페놀프탈레인). 당량점과 중화점을 혼동하지 않는 것, 그리고 완충 영역(약산과 그 짝염기가 함께 있어 pH가 잘 안 변하는 구간)을 읽는 것이 고난도 포인트다.", "u": "lecture-index.html#area-12"}, "산화환원": {"s": "산화-환원의 본질은 '전자의 이동'이다. 전자를 잃으면 산화, 얻으면 환원 — 한쪽이 잃으면 반드시 다른 쪽이 얻으므로 둘은 항상 짝으로 일어난다. 실전 도구는 산화수다. 각 원자에 형식적으로 매긴 전하로, 반응 전후 산화수가 커지면 산화, 작아지면 환원이다. 산화수 규칙(홑원소 0, 단원자 이온은 전하, 산소 대개 -2, 수소 대개 +1, 화합물 합은 0)을 적용해 누가 산화·환원됐는지부터 찾는다. 반응식 균형은 전자 수를 맞추는 게 핵심이다 — 산화 반쪽반응에서 잃은 전자 수와 환원 반쪽반응에서 얻은 전자 수가 같도록 계수를 맞춘다(산성/염기성 조건에 따라 H⁺·OH⁻·H₂O로 산소·수소를 맞춘다). 전기화학은 이 자발성을 전위로 읽는다. 표준환원전위 E°가 클수록 환원되려는 경향이 크다. 갈바니 전지에서 E°가 큰 쪽이 환원(+극)·작은 쪽이 산화(-극)이며, E°cell=E°(환원극)-E°(산화극)>0이면 자발적이다. 전극 명칭과 부호를 혼동하기 쉬운데 '산화는 anode, 환원은 cathode'를 기준으로 잡는다. 네른스트 식 E=E°-(RT/nF)lnQ에서 lnQ 앞 부호와 Q의 구성(생성물/반응물)을 틀리는 것이 고난도 단골 오답이다. 전기분해는 외부 전원으로 비자발 반응을 강제하는 것으로, 패러데이 법칙(전하량 ∝ 석출 몰수, Q=nF)으로 정량한다.", "u": "lecture-index.html#area-13"}, "반응속도": {"s": "반응속도론의 첫 교훈은 '속도식의 차수는 반응식 계수가 아니라 실험으로 정한다'는 것이다. aA+bB→ 반응의 속도식이 v=k[A]^m[B]^n일 때 m·n은 a·b와 같을 수도 다를 수도 있다 — 계수를 그대로 지수로 옮기는 것이 가장 흔한 오개념이다. 차수는 보통 농도를 바꿔 가며 속도 변화를 보는 초기속도법으로 결정한다(한 반응물 농도만 2배 했을 때 속도가 2배면 1차, 4배면 2차). 속도에 영향을 주는 요인은 충돌 이론으로 꿰어진다 — 반응은 분자들이 '충분한 에너지(활성화에너지 Ea 이상)로, 올바른 방향으로' 충돌해야 일어난다. 그래서 농도·압력을 높이면 충돌 빈도가 늘어 빨라지고, 온도를 높이면 Ea를 넘는 분자 비율이 급증해(아레니우스) 빨라진다. 촉매는 Ea가 더 낮은 다른 경로를 열어 속도를 높이지만 반응의 ΔH나 평형 위치는 바꾸지 않는다 — 이 구분이 핵심이다. 다단계 반응에서는 가장 느린 단계(율속 단계)가 전체 속도를 지배하며, 속도식은 율속 단계로부터 나온다. 반응 중간체(생성됐다 소모됨)와 촉매(소모됐다 재생)를 구별하고, 정상상태 근사로 중간체 농도를 소거하는 것이 고난도 영역이다.", "u": "lecture-index.html#area-14"}, "탄소화합물": {"s": "탄소화합물(유기화학 입문)은 '작용기'라는 렌즈로 보면 방대한 분자가 몇 갈래로 정리된다. 탄소 골격(알케인·알켄·알카인, 단일·이중·삼중 결합)에 작용기가 붙어 성질을 결정한다 — 하이드록시(-OH, 알코올)·카보닐(C=O, 알데하이드·케톤)·카복실(-COOH, 산)·아미노(-NH₂)·에터·에스터 등. 같은 분자식이라도 원자의 연결이 다르면 다른 물질인 '구조 이성질체'가 나오는데, 분자식만 보고 같은 물질로 착각하는 것이 흔한 오류다. 작용기는 물리적 성질로 직결된다 — -OH나 -COOH가 있으면 수소결합을 해서 같은 탄소 수의 탄화수소보다 끓는점이 높고 물에 잘 녹는다. 반응성도 작용기로 예측한다 — 알켄·알카인의 첨가 반응, 알코올의 산화(1차→알데하이드→카복실산, 2차→케톤), 카복실산과 알코올의 에스터화(축합) 같은 큰 줄기를 잡아 둔다. 명명에서는 가장 긴 사슬을 모체로 잡고 작용기·치환기의 위치 번호를 매기는 규칙이 출발점이다. 이 단원은 암기처럼 보이지만 '작용기 → 성질·반응'의 인과로 묶으면 외울 양이 크게 준다.", "u": "lecture-index.html#area-15"}, "배위화학": {"s": "배위화학은 중심 금속 이온에 리간드(고립쌍을 주는 분자·이온)가 결합해 만든 착물을 다룬다. 핵심 골격은 '배위수'와 '기하구조'다 — 배위수 2는 직선, 4는 사면체 또는 평면사각형, 6은 팔면체가 대표적이다. 같은 배위수 4라도 사면체와 평면사각형이 갈리는데(d⁸ 금속은 평면사각형을 선호) 이 차이가 이성질체와 성질을 가른다. 결정장 이론이 색·자성의 열쇠다 — 리간드가 만드는 정전기장이 금속의 d 오비탈을 에너지가 다른 두 무리로 갈라놓고(팔면체에서 eg와 t2g) 그 갈라짐 크기 Δ에 따라 전자가 채워지는 방식이 달라진다. Δ가 크면(강한장 리간드) 전자가 짝지어 들어가 저스핀, 작으면(약한장) 훈트대로 퍼져 고스핀이 된다 — 이 스핀 상태가 자성(상자성/반자성)을 정한다. 색은 이 d-d 갈라짐 에너지에 해당하는 빛을 흡수하고 그 보색이 보이는 것이다. 리간드의 장 세기 순서(분광화학 계열)와 이성질체(기하·광학 이성질체), 킬레이트(한 리간드가 여러 자리로 무는 것)의 안정성이 출제의 단골이다.", "u": "lecture-index.html#area-16"}};
function conceptClinicSec(exam, sel, wrong, cs){
  if(!wrong.length) return '';
  const broad=a=>RX[a]?a:(RXMAP[a]||a); const TH=25;
  const items=wrong.map(w=>{ const q=w.q, my=w.a;
    const ar=exam.area?(exam.area[q-1]||'기타'):'기타'; const bd=broad(ar);
    const ty=exam.type?(exam.type[q-1]||''):'';
    const cohOpt=(cs&&cs.percReady&&cs.qopt&&cs.qopt[q-1])?cs.qopt[q-1][(my||1)-1]:null;
    const cMis=ty?omFor(ty):null;
    return {q,my,bd,ty,cohOpt,cMis}; });
  const groups={}; items.forEach(it=>{(groups[it.bd]=groups[it.bd]||[]).push(it);});
  const domHasCommon=bd=>groups[bd].some(it=>it.cohOpt!=null&&it.cohOpt>=TH);
  const order=Object.keys(groups).sort((a,b)=>{ const ca=domHasCommon(a)?1:0, cb=domHasCommon(b)?1:0; if(ca!==cb)return cb-ca; return groups[b].length-groups[a].length; });
  const anyCommon=items.some(it=>it.cohOpt!=null&&it.cohOpt>=TH);

function gaussPath(mu,sd,lo,hi,x2px,baseY,peakH){if(!(sd>0))return '';let d='';const N=64;for(let i=0;i<=N;i++){const xv=lo+(hi-lo)*i/N,z=(xv-mu)/sd,y=Math.exp(-z*z/2);d+=(i?'L':'M')+x2px(xv).toFixed(1)+','+(baseY-y*peakH).toFixed(1)+' ';}return d.trim();}
function bellCurveSVG(totals, my, maxTotal){

  const path=gaussPath(mu,sd,lo,hi,x,baseY,peakH);
  const myC=Math.max(lo,Math.min(hi,my)),myX=x(myC);

    <path d="${path}" fill="none" stroke="var(--cobalt)" stroke-width="2"/>
    <line x1="${x(mu).toFixed(1)}" y1="${baseY}" x2="${x(mu).toFixed(1)}" y2="${(pt+ih*0.08).toFixed(1)}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="${x(mu).toFixed(1)}" y="${(pt-5).toFixed(1)}" font-size="10" fill="var(--muted)" text-anchor="middle">평균 ${mu.toFixed(0)}</text>
    <line x1="${myX.toFixed(1)}" y1="${baseY}" x2="${myX.toFixed(1)}" y2="${(pt+ih*0.02).toFixed(1)}" stroke="var(--teal)" stroke-width="2"/>
    <circle cx="${myX.toFixed(1)}" cy="${baseY.toFixed(1)}" r="3.5" fill="var(--teal)"/>

    <line x1="${pl}" y1="${baseY}" x2="${W-pr}" y2="${baseY}" stroke="var(--line)" stroke-width="1"/>

function propCI(p,N){
  if(!N||N<1)return {lo:0,hi:100,m:50};

/* ===== 성적표 PDF 다운로드 (인쇄 대화상자 없이 파일 생성) ===== */
function loadScriptOnce(src){ return new Promise(function(res,rej){ var ex=document.querySelector('script[data-lib="'+src+'"]'); if(ex){ if(ex.dataset.loaded){res();return;} ex.addEventListener('load',function(){res();}); ex.addEventListener('error',function(){rej(new Error(src));}); return; } var s=document.createElement('script'); s.src=src; s.dataset.lib=src; s.onload=function(){s.dataset.loaded='1';res();}; s.onerror=function(){rej(new Error(src));}; document.head.appendChild(s); }); }
async function ensurePdfLibs(){ if(!window.html2canvas) await loadScriptOnce('vendor/html2canvas.min.js'); if(!(window.jspdf&&window.jspdf.jsPDF)) await loadScriptOnce('vendor/jspdf.umd.min.js'); }
async function downloadReportPDF(){
  var el=document.getElementById('repPDF'); if(!el){ fToast('리포트를 찾을 수 없습니다'); return; }
  fToast('PDF 만드는 중… 잠시만요');
  var dets=[].map.call(el.querySelectorAll('details'),function(d){return [d,d.open];}); dets.forEach(function(x){x[0].open=true;});
  el.classList.add('pdfing');
  try{
    await ensurePdfLibs();
    await new Promise(function(r){setTimeout(r,80);});
    var canvas=await html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false,windowWidth:el.scrollWidth});
    var jsPDF=window.jspdf.jsPDF;
    var pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
    var pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight();
    var M=8, iw=pw-M*2, pageH=ph-M*2;
    var pxPerMM=canvas.width/iw, sliceH=Math.floor(pageH*pxPerMM);
    var totalPages=Math.max(1,Math.ceil(canvas.height/sliceH));
    var y=0, page=0;
    while(y<canvas.height){
      var h=Math.min(sliceH, canvas.height-y);
      var c=document.createElement('canvas'); c.width=canvas.width; c.height=h;
      var ctx=c.getContext('2d'); ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,c.width,h);
      ctx.drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);
      if(page>0) pdf.addPage();
      pdf.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',M,M,iw,h/pxPerMM);
      pdf.setFontSize(8); pdf.setTextColor(150);
      pdf.text('Chemistreal   '+(page+1)+' / '+totalPages, pw/2, ph-3, {align:'center'});
      y+=h; page++;
    }
    var nm=(window.__rpt&&window.__rpt.name)||'';
    var fn=((nm?nm+'_':'')+(cur&&cur.title||'성적표')+'_성적표').replace(/[\\/:*?"<>|]+/g,'')+'.pdf';
    // 파일명 보장을 위해 blob 다운로드를 직접 트리거
    var blob=pdf.output('blob'); var url=URL.createObjectURL(blob);
    var a=document.createElement('a'); a.href=url; a.download=fn; document.body.appendChild(a); a.click();
    setTimeout(function(){ try{URL.revokeObjectURL(url); a.remove();}catch(e){} },1500);
    fToast('PDF 다운로드 완료 · '+fn);
  }catch(err){ console.error(err); fToast('PDF 생성 실패 — 인쇄 버튼을 이용해 주세요'); }
  finally{ el.classList.remove('pdfing'); dets.forEach(function(x){x[0].open=x[1];}); }
}

  const m=location.hash.match(/r=([^.]+)\.([0-9a-z]+)(?:\.([^.]*)\.(.*))?$/);
  if(m){ const ex=FINAL_EXAMS.find(e=>e.id===m[1]); if(ex){ openExam(ex.id); fShared=true; let n=0n; for(const c of m[2]) n=n*36n+BigInt(parseInt(c,36)); for(let q=1;q<=ex.nQ;q++){ const v=Number(n%5n); n=n/5n; if(v) setAns(q,v); } const ne=document.getElementById('nm'), xe=document.getElementById('exno'); if(m[4]&&ne) ne.value=decodeURIComponent(m[4]); if(m[3]&&xe) xe.value=m[3]; scoreAuto(); return; } }
  if(location.hash==='#qbank'||location.hash==='#admin'){ renderQbank(); } else { renderList(); }
}
window.addEventListener('hashchange',boot);
boot();
