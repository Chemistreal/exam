    N.slice().sort((a,b)=>lv[a]-lv[b]||a.localeCompare(b)).map(d=>{
      const ps=(PREREQ[d]||[]).filter(p=>nodes.has(p));
      const st=!reliable(d)?'표본 부족':(sb[d]>=75?'안정':sb[d]>=60?'보통':'약함');
      return `<tr><td>${esc(d)}${d===target?' (목표)':''}</td><td>${lv[d]+1}층</td><td>${reliable(d)?sb[d]+'% · '+st:st}</td><td>${ps.length?ps.map(esc).join(' · '):'-'}</td></tr>`;
    }).join('')}</tbody></table>`;
  return `<div class="sec">${secH('선수 개념 지도 · 학습 순서')}<div class="sub">가장 약한 영역이 어떤 선행 개념 위에 서 있는지 보여 줍니다. 화살표는 '먼저 알아야 함', 칸 안의 <b>안정 · 보통 · 약함 · 표본 부족</b>이 현재 숙달도입니다(색도 같이 씁니다).</div>
   ${svg}${docxTbl}
   <div class="note" style="font-size:12.5px;margin-top:9px">${advice}</div>
   ${drill}
  </div>`;
}
function adaptiveSec(exam, sel, cs, correct, total){

  for(let q=1;q<=exam.nQ;q++){ if(okq(exam,q,sel[q]||0))continue;
    const raw=exam.area?exam.area[q-1]:null; const d=raw?(RX[raw]?raw:(RXMAP[raw]||raw)):'기타'; domWrong[d]=(domWrong[d]||0)+1;
    if(cs&&cs.ready&&cs.qp){const dd=cs.qp[q-1];if(dd!=null&&dd>=70){careless++;carelessQ.push(q);}} }

  if(careless>0){ acc=Math.min(total,acc+careless); const p=winProb(total,acc,cut); steps.push({eff:'노력 최소',label:`쉬운데 틀린 ${careless}문항 오답노트 복구`,detail:carelessQ.slice(0,8).join(', ')+'번', pv:Math.round(p[ti]*100)}); }
  const wd=Object.keys(domWrong).filter(d=>sb[d]!=null&&d!=='기타').sort((a,b)=>sb[a]-sb[b]);
  const weak1=wd[0];
  if(weak1){ const n=domWrong[weak1]; acc=Math.min(total,acc+n); const p=winProb(total,acc,cut); steps.push({eff:'개념 보강',label:`${weak1} 영역 ${n}문항 정복 (정답률 ${sb[weak1]}%)`,detail:(RX[weak1]&&RX[weak1].rx)?RX[weak1].rx:'', pv:Math.round(p[ti]*100)}); }
  if(!steps.length) return '';

     <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><span style="font-size:13px;font-weight:700">${i+1}. ${s.label}</span><span style="font-size:13px;color:var(--teal);font-weight:800;white-space:nowrap">${targetName} ${s.pv}%</span></div>

   ${rows}
   ${last>p0?`<div class="note" style="font-size:12px;margin-top:8px">위 순서대로 메우면 ${targetName} 확률이 <b>${p0}% → ${last}%</b>로 오릅니다. 쉬운 실점부터 잡는 것이 노력 대비 효율이 가장 큽니다.</div>`:''}

/* 이력에서 **지금 보고 있는 회차**가 몇 번째인지. 시각 순으로 늘어놓을 때는
   맨 뒤가 곧 이번 회차였지만, 회차 순으로 늘어놓으면 아니다 — 9회 성적표를
   여는데 이력의 끝은 10회일 수 있다. '지난 진단 대비' 가 엉뚱한 회차를
   가리키면 학부모가 읽는 문장이 통째로 틀린다. */
function histAt(hist,exam){
  var id=exam&&exam.id;
  for(var i=0;i<hist.length;i++) if(hist[i].e.id===id) return i;
  return hist.length-1;               // 이력에 없으면(공유 링크 등) 맨 뒤

/* ── 회차 순서 ────────────────────────────────────────────────────
   이력을 **채점한 시각**으로 늘어놓고 있었다. 그런데 선생님은 답안지를
   모아 두었다가 하루에 몰아서 채점한다 — 7/31 에 3·8·9·10회를 넣으면
   화면에는 9 → 10 → 8 → 3 회 순으로 뜬다. 시각은 채점한 순서일 뿐,
   학생이 밟아 온 순서가 아니다. 회차 번호로 늘어놓는다.

   순서는 제목에서 뽑는다. 목록(exams.json) 차례를 그대로 쓰면 KMChC 기출이
   2026 → 2013 으로 거꾸로 간다(목록은 최신을 위에 두므로 그쪽이 맞다).
   그렇다고 group 으로 묶을 수도 없다 — KMChC 는 group 이 연도별로 갈려 있다.
   그래서 id 앞머리로 갈래를 잡고, 갈래 안에서는 제목의 숫자를 오름차순으로.

       JMChC 모의고사 11-1회 → [11,1]   (11회 다음, 12회 앞)
       KMChC 2024 제2차      → [2024,2] (제1차 다음)
       기출동형 3회    → [3,2017] (첫 숫자가 회차다)

   숫자가 같으면 목록 차례로(2025 제1차 일반 → 심화). */
function examFamily(id){
  var s=String(id||'');
  if(s.indexOf('jmchc-')===0) return 'jmchc';
  if(s.indexOf('donghyung-')===0) return 'donghyung';
  if(s.indexOf('sanyeom')===0) return 'sanyeom';
  return 'kmchc';                      // kmchc-* · hwol-* 는 같은 갈래다
}
var _EXORD=null;
function examOrder(e){
  if(!_EXORD){
    _EXORD={}; var fam={}, fi=0;
    FINAL_EXAMS.forEach(function(x,i){
      var f=examFamily(x.id);
      if(fam[f]==null) fam[f]=fi++;
      _EXORD[x.id]={f:fam[f], n:(String(x.title||'').match(/\d+/g)||[]).map(Number), i:i};
    });
  }
  return (e&&_EXORD[e.id])||{f:999,n:[],i:999};
}
function cmpExam(a,b){
  var A=examOrder(a), B=examOrder(b);
  if(A.f!==B.f) return A.f-B.f;
  var m=Math.max(A.n.length,B.n.length);
  for(var k=0;k<m;k++){
    var x=A.n[k], y=B.n[k];
    if(x==null) return -1;             // 짧은 쪽이 앞(11회 < 11-1회)
    if(y==null) return 1;
    if(x!==y) return x-y;
  }
  return A.i-B.i;
}
/* 축에 붙일 짧은 이름. 'JMChC 모의고사 1회' → '1회', 'KMChC 2021' → '2021' */
function shortExam(e){
  var t=String((e&&e.title)||'');
  var m=t.match(/(\d+(?:-\d+)?)\s*회/); if(m) return m[1]+'회';
  m=t.match(/(20\d\d)(?:[^\d]*제(\d)차)?/);
  if(m){ var x=m[1].slice(2)+'년'; if(m[2]) x+=' '+m[2]+'차'; if(/심화/.test(t)) x+='심';
         return x; }                 // 25년 2차심 — 같은 해 일반·심화를 갈라 놓는다
  return t.slice(0,6);
}

/* ══════════════════════════════════════════════════════════════════
   한 학생의 응시 이력을 한 곳에서 정한다
   ------------------------------------------------------------------
   아홉 군데가 각자 같은 규칙을 베껴 쓰고 있었다:

       subs(e.id).filter(r => r.name.trim()===nm && r.ans.length===e.nQ)

   한 곳만 고치면 나머지 여덟이 어긋난다. 그리고 그 규칙이 보던 것은
   **이 브라우저에 채점해 둔 기록**뿐이었다. 학부모 휴대폰에서 공유 링크를
   열면 그 폰이 우연히 열어 본 회차만 잡혀서 "지금까지 2회 응시" 가 됐다 —
   실제로는 여섯 번을 봤는데. 선생님이 학원 PC 를 바꿔도 마찬가지였다.

   시트에는 어느 기기에서 채점했든 다 들어 있다. 학생 하나를 이름으로 물어
   전 회차를 받아 두고(loadHist), 이 브라우저 기록과 합쳐 여기서 낸다.

   이름은 nameKey 로 견준다 — 공백을 지우므로 '박 바다' 도 같은 사람이다. */
var HIST_ROWS=null, HIST_FOR='', HIST_TRIED='';
function histOf(nm){
  const key=nameKey(nm); if(!key) return [];
  const best={};
  const take=function(e,r){
    if(!e||!r||!r.ans||r.ans.length!==e.nQ) return;
    const p=best[e.id];
    if(!p||(r.ts||0)>=(p.ts||0)) best[e.id]={e:e, r:r, ts:r.ts||0};
  };
  FINAL_EXAMS.forEach(function(e){
    subs(e.id).forEach(function(r){ if(nameKey(r&&r.name)===key) take(e,r); });
  });
  /* 시트에서 받아 온 것. 이 브라우저에 없던 회차가 여기서 채워진다.
     localStorage 에 쓰지는 않는다 — 학부모 폰에 남길 이유가 없다. */
  if(HIST_ROWS && nameKey(HIST_FOR)===key) HIST_ROWS.forEach(function(row){
    const e=examById(row.examId);
    if(!e) return;
    const digits=String(row.answers||'').replace(/[^0-4]/g,'');
    if(digits.length!==e.nQ) return;
    const ans=digits.split('').map(Number);
    let c=0; for(let q=1;q<=e.nQ;q++) if(okq(e,q,ans[q-1]||0)) c++;
    take(e,{name:row.name||nm, school:row.school||'', grade:row.grade||'',
            ts:row.ts||0, correct:c, total:e.nQ, wrong:e.nQ-c, ans:ans});
  });
  return Object.keys(best).map(function(k){ const h=best[k];
      h.pct=h.r.total?Math.round(h.r.correct/h.r.total*100):0; return h; })
    .sort(function(a,b){ return cmpExam(a.e,b.e); });
}
/* 시트에서 그 학생의 전 회차를 받아 온다. 받아 오면 성적표를 다시 그린다 —
   먼저 그려 둔 화면이 '2회 응시' 라고 적혀 있을 수 있으므로. */
function loadHist(nm){
  const key=nameKey(nm);
  if(!key || !SHEET_ENDPOINT) return;
  if(HIST_TRIED===key) return;          // 이름당 한 번만 묻는다
  HIST_TRIED=key;
  sheetCall({action:'history', name:nm}, function(res){
    if(!res || res.ok===false || !res.rows){ return; }
    HIST_ROWS=res.rows; HIST_FOR=nm;
    /* 넘어져도 화면은 그대로 살아야 한다. 다만 조용히 삼키지는 않는다 —
       이 자리에서 한 번 조용히 죽어서 '2회 응시' 가 그대로 남았었다. */
    try{ if(typeof rerenderReport==='function') rerenderReport(); }
    catch(e){ console.error('[이력] 성적표를 다시 그리지 못했습니다', e); }
  });
}

/* ── 이 학생의 기록이 다른 이름표로 갈라져 있지 않은가 ────────────────────
   성적표는 이름이 **정확히 같은** 기록만 한 학생으로 본다(아홉 군데가 같은
   규칙을 쓴다). 그래서 '박 바다' 처럼 공백 하나, 글자 하나가 어긋난 기록은
   조용히 빠진다. 화면은 "진단 6회 누적" 이라고 단언하는데 실제로는 여덟 번을
   봤다 — 읽는 쪽에는 빠졌다는 신호가 어디에도 없다. 학부모에게 나가는 종이에
   "첫 진단입니다" 라고 적히는 일까지 생긴다.

   빠진 것이 있으면 성적표가 **먼저 말한다.** 합치는 것은 명단 관리에서 한다. */
function splitNameRecords(nm){
  var key=nameKey(nm); if(!key) return [];
  var seenKey={}, by={};
  FINAL_EXAMS.forEach(function(e){
    var k=cohortKey(e.id); if(seenKey[k]) return; seenKey[k]=1;   // 별칭은 한 번만 센다
    subs(e.id).forEach(function(r){
      var n=((r&&r.name)||'').trim(); if(!n) return;
      /* 띄어쓰기 차이는 이제 저장할 때 저절로 붙는다(nameKey). 여기서 경고할
         것은 **사람이 봐야 하는** 것만 남긴다 — 한 글자가 다른 이름. 기계가
         합치면 동명이인을 되돌릴 수 없게 묶으므로 합치지는 않는다. */
      var x=nameKey(n);
      if(x===key) return;                    // 이미 같은 사람으로 센다
      if(!(x.length>=2 && key.length>=2 && editDist(x,key)===1)) return;
      var rec = by[n] || (by[n]={name:n, n:0, why:'한 글자 다름'});
      rec.n++;
    });
  });
  return Object.keys(by).map(function(k){ return by[k]; }).sort(function(a,b){ return b.n-a.n; });
}
/* 성적표가 세는 것은 **이 브라우저에 채점해 둔 것**뿐이다. 다른 기기에서
   채점한 회차는 시트에만 있다 — 그 사실을 성적표가 밝혀야, 빠진 회차를 보고
   "안 봤나 보다" 로 넘어가지 않는다. */
function historyScopeNote(){
  return `<div style="font-size:11.5px;color:var(--muted);margin-top:7px">
    이 브라우저에 채점해 둔 기록 기준입니다. 다른 기기·브라우저에서 채점한 회차가 있으면
    시험 목록의 <b>시트에서 불러오기 ↓</b> 를 먼저 눌러 주세요.</div>`;
}
/* ⚠ 이 알림은 **다른 학생들의 이름을 적는다.** 「명단 관리에서 합치세요」 는
   선생님만 할 수 있는 일이고, 학부모에게 건네는 파일에 급우 실명이 실릴 자리는
   없다. 한국 이름은 세 글자 중 한 글자만 다른 동급생이 흔해서(김민준 ↔ 김민서)
   여기 걸리는 것은 오타 변형이 아니라 **진짜 다른 아이**일 때가 많다.
   그래서 공유 성적표에서는 통째로 접고, 내보낸 파일에서는 .splitnote 를 걷어낸다. */
function splitNameNote(nm){
  if(window.__sharedReport) return '';
  var sp=[]; try{ sp=splitNameRecords(nm); }catch(e){ return ''; }
  if(!sp.length) return '';
  var tot=sp.reduce(function(a,x){ return a+x.n; },0);
  return `<div class="note splitnote" style="border-color:rgba(192,96,58,.38);background:#FBF0EA;color:#8a3a1d">
    <b>빠진 회차가 있을 수 있습니다.</b> ${esc(nm)} 학생과 비슷한 이름으로 저장된 기록이
    <b>${tot}건</b> 더 있습니다 —
    ${sp.map(function(x){ return `<b>${esc(x.name)}</b>(${x.n}건 · ${x.why})`; }).join(' · ')}.
    같은 학생이면 <b>명단 관리</b>에서 합치세요. 합쳐야 이 성적표의 회차 수와 성장 추적이 맞습니다.</div>`;
}

function growthSec(exam){
  const nm=curName(); if(!nm)return'';
  const hist=[];
  hist.push.apply(hist, histOf(nm));
  /* '첫 진단입니다' 는 단언이다. 갈라진 기록이 있으면 그 단언이 틀린다 —
     먼저 그것부터 말한다. */
  const splitNote=splitNameNote(nm);
  if(hist.length<2)return `<div class="sec">${secH('성장 추적 · 기준선')}${splitNote}<div class="note">${esc(nm)} 학생의 <b>${splitNote?'이 이름으로는 첫':'첫'} 진단</b>입니다. 이번 결과가 <b>기준선</b>이 되어, 다음 진단부터 영역별 <b>지난 진단 대비 성장</b>이 표시됩니다.</div>${historyScopeNote()}</div>`;
  const _at=histAt(hist,exam);
  const cur=hist[_at], prev=hist[_at>0?_at-1:1];
  const dO=cur.pct-prev.pct;
  const cs=domScoresBroad(cur.e,cur.r.ans), ps=domScoresBroad(prev.e,prev.r.ans);
  let dl=[]; if(cs&&ps){for(const d in cs){if(d in ps)dl.push({d,now:cs[d],was:ps[d],delta:cs[d]-ps[d]});}}
  dl.sort((a,b)=>b.delta-a.delta);
  const allDS=hist.map(h=>domScoresBroad(h.e,h.r.ans)||{});
  const curDS=allDS[allDS.length-1]||{};
  const weak2=Object.entries(curDS).sort((a,b)=>a[1]-b[1]).slice(0,2).map(x=>x[0]);
  const lineSeries=[{name:'전체 정답률',color:'var(--teal)',vals:hist.map(h=>h.pct),main:true},
    ...weak2.map((d,i)=>({name:d,color:i?'var(--brass)':'var(--cobalt)',vals:allDS.map(ds=>ds[d]!=null?ds[d]:null)}))];
  const lineChart=lineChartSVG(lineSeries,hist.map((h,i)=>`${i+1}회`));
  const fmt=v=>v>0?`▲+${v}`:(v<0?`▼${-v}`:'±0');
  const col=v=>v>0?'var(--teal)':(v<0?'var(--ms)':'var(--muted)');
  const trendBars=hist.map(h=>`<div class="barrow"><span class="ba" style="width:auto;min-width:118px;max-width:168px">${esc(h.e.title)}</span><span class="bar"><i style="width:${h.pct}%;background:${pcolor(h.pct)}"></i></span><span class="bp">${h.pct}%</span></div>`).join('');
  const deltaRows=dl.map(x=>`<div class="barrow"><span class="ba">${esc(x.d)}</span><span style="flex:1;color:var(--muted);font-size:12px">${x.was}% → ${x.now}%</span><span style="font-weight:700;font-size:13px;color:${col(x.delta)}">${fmt(x.delta)}%p</span></div>`).join('');
  const up=dl.filter(x=>x.delta>0), dn=dl.filter(x=>x.delta<0);
  let summary='';
  if(dl.length){const top=dl[0], bot=dl[dl.length-1];
    summary=`<div class="note"><b>지난 진단 대비.</b> 전체 정답률 ${prev.pct}% → ${cur.pct}% (<b style="color:${col(dO)}">${fmt(dO)}%p</b>).${up.length?` 가장 성장한 영역은 <b style="color:var(--teal)">${esc(top.d)} ${fmt(top.delta)}%p</b>.`:''}${dn.length?` 주의가 필요한 영역은 <b style="color:var(--ms)">${esc(bot.d)} ${fmt(bot.delta)}%p</b>.`:''}</div>`;}
  return `<div class="sec">${secH('성장 추적 · 지난 진단 대비')}
   <div class="sub">${esc(nm)} 학생 · 진단 ${hist.length}회 누적 (지난 진단: ${esc(prev.e.title)})</div>
   ${splitNote}
   ${summary}
   ${historyScopeNote()}
   <div style="font-size:12px;color:var(--muted);margin:9px 0 4px">정답률 궤적 · 전체 + 현재 약점 2영역</div>
   ${lineChart}
   ${dl.length?`<details style="margin:9px 0 2px"><summary class="muted" style="cursor:pointer">영역별 지난 진단 대비 변화 (공통 영역 ${dl.length}개)</summary><div style="margin-top:8px">${deltaRows}</div></details>`:''}
   <div class="note" style="font-size:12px;color:var(--muted)">서로 다른 시험 간 비교이므로 난이도 차이가 있을 수 있으며, 절대 측정이 아닌 <b>성장 방향 지표</b>로 해석합니다.</div>
  </div>`;
}
function tierLadderSVG(W,cut,total){
  if(!cut||!cut.length||!total)return '';
  const aw=award(W,cut), c=total-W;
  const lo=Math.max(0,total-cut[cut.length-1]-3);
  const W2=400,ml=14,mr=14,mt=38,barH=22,pw=W2-ml-mr,H=96;
  const X=v=>ml+((Math.max(lo,Math.min(total,v))-lo)/(total-lo))*pw;
  const cols=['#d2cfc7','#cdbfa3','#bd8a5e','#aab0b5','#d4af37'];
  const names=['수상권 밖','장려상','동상','은상','금상'];
  const edges=[lo,total-cut[4],total-cut[3],total-cut[2],total-cut[1],total];
  let bands='',labs='';
  for(let i=0;i<5;i++){const x0=X(edges[i]),x1=X(edges[i+1]); if(x1<=x0)continue; bands+=`<rect x="${x0.toFixed(1)}" y="${mt}" width="${(x1-x0).toFixed(1)}" height="${barH}" fill="${cols[i]}"/>`;
    const xc2=(x0+x1)/2; if(x1-x0>26)labs+=`<text x="${xc2.toFixed(1)}" y="${(mt+barH+12).toFixed(1)}" text-anchor="middle" font-size="8.5" fill="var(--ink-2)">${names[i]}</text>`;}
  const xT=X(total); bands+=`<rect x="${(xT-3).toFixed(1)}" y="${(mt-3).toFixed(1)}" width="3" height="${barH+6}" fill="#1f7a68"/>`;
  labs+=`<text x="${xT.toFixed(1)}" y="${(mt+barH+12).toFixed(1)}" text-anchor="end" font-size="8.5" font-weight="700" fill="#1f7a68">대상</text>`;
  const xc=X(c); const marker=`<line x1="${xc.toFixed(1)}" y1="${(mt-3).toFixed(1)}" x2="${xc.toFixed(1)}" y2="${(mt+barH+3).toFixed(1)}" stroke="var(--ink)" stroke-width="1.5"/><polygon points="${xc.toFixed(1)},${(mt-3).toFixed(1)} ${(xc-5).toFixed(1)},${(mt-12).toFixed(1)} ${(xc+5).toFixed(1)},${(mt-12).toFixed(1)}" fill="var(--ink)"/><text x="${xc.toFixed(1)}" y="${(mt-15).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="700" fill="var(--ink)">현재 ${c}문항</text>`;
  let nextMark='';
  if(aw.nextTier&&aw.gap>0){const xn=X(c+aw.gap); nextMark=`<line x1="${xn.toFixed(1)}" y1="${(mt-3).toFixed(1)}" x2="${xn.toFixed(1)}" y2="${(mt+barH+3).toFixed(1)}" stroke="var(--brass)" stroke-width="2" stroke-dasharray="2 2"/>`;}
  const cap=aw.nextTier&&aw.gap>0?`<div style="font-size:12px;color:var(--muted);text-align:center;margin-top:3px"><b style="color:var(--brass)">${esc(aw.nextTier)}</b> 도달선까지 ${aw.gap}문항 (점선)</div>`:(aw.inA&&!aw.nextTier?`<div style="font-size:12px;color:#1f7a68;text-align:center;margin-top:3px;font-weight:700">최고 등급 도달</div>`:'');
  return `<div style="margin:8px 0 2px"><svg viewBox="0 0 ${W2} ${H}" style="width:100%;max-width:420px;height:auto" xmlns="http://www.w3.org/2000/svg">${bands}${nextMark}${marker}${labs}</svg>${cap}</div>`;
}
function lgammaWP(z){ const g=7,c=[0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
  if(z<0.5) return Math.log(Math.PI/Math.sin(Math.PI*z))-lgammaWP(1-z);
  z-=1; let x=c[0]; for(let i=1;i<g+2;i++)x+=c[i]/(z+i); const t=z+g+0.5;
  return 0.5*Math.log(2*Math.PI)+(z+0.5)*Math.log(t)-t+Math.log(x); }
function lbetaWP(a,b){return lgammaWP(a)+lgammaWP(b)-lgammaWP(a+b);}
function lchooseWP(n,k){return lgammaWP(n+1)-lgammaWP(k+1)-lgammaWP(n-k+1);}
function betaBinomPMF(k,n,a,b){return Math.exp(lchooseWP(n,k)+lbetaWP(k+a,n-k+b)-lbetaWP(a,b));}
/* ── 한 번의 시험은 60개의 증거가 아니다 ────────────────────────────
   예전에는 a=맞은수+1, b=틀린수+1 로 두었다. 60문항이면 실력을 60번
   독립으로 관측한 셈이 되어 사후분포가 아주 좁아진다 — 그래서 "이 학생은
   앞으로도 딱 이만큼" 이라고 단언하게 되고, 조금 모자란 학생의 확률이
   실제보다 낮게 나왔다.

   사실은 그렇지 않다. 시험지마다 난이도와 단원 구성이 다르고, 컨디션도
   다르다. **회차가 바뀌면 점수는 흔들린다.** 그 흔들림이 문항 하나하나의
   우연보다 훨씬 크다. 그래서 한 회차를 60개가 아니라 **EFF 개 남짓의
   증거**로 셈한다(효과적 표본 크기). 폭이 넓어지면 모자란 학생의 확률은
   오르고 넉넉한 학생의 확률은 조금 내린다 — 부풀리는 것이 아니라 **모르는
   만큼 모른다고 말하는 것**이다.

   gain 은 앞으로의 성장이다. 지금까지의 추세로 다음 회차에 몇 문항쯤 더
   맞을지를 넣으면, 그만큼 실력을 옮겨 놓고 확률을 다시 잰다. 추세가 없으면
   0 이라 예전과 같다. */
const WP_EFF = 24;
/* ── 흔들림은 학생마다 다르다 ──────────────────────────────────────
   24 는 "보통 이 정도로 흔들린다" 는 어림값이다. 그런데 회차마다 점수가
   거의 그대로인 학생과 크게 오르내리는 학생을 같은 폭으로 재면, 앞엣
   학생에게는 지나치게 넓고 뒤엣 학생에게는 지나치게 좁은 값이 나간다.

   기록이 세 회차 이상이면 **그 학생의 흔들림을 직접 잰다.** 추세(오르는
   기울기)를 빼고 남은 흩어짐만 본다 — 꾸준히 오르는 것은 흔들림이 아니다.
   흩어짐 s² 와 평균 정답률 p 에서 n = p(1−p)/s² 로 되돌린다.

   위아래를 막는다. 여덟보다 작으면 확률이 죄다 50% 근처가 되어 아무 말도

function effN(total){
  try{
    if(typeof curName!=='function'||typeof histOf!=='function') return WP_EFF;
    const nm=curName(); if(!nm) return WP_EFF;
    const h=histOf(nm); if(!h||h.length<3) return WP_EFF;
    const ps=h.map(x=> x.r.total? x.r.correct/x.r.total : 0);
    const n=ps.length; let sx=0,sy=0,sxx=0,sxy=0;
    for(let i=0;i<n;i++){ sx+=i; sy+=ps[i]; sxx+=i*i; sxy+=i*ps[i]; }
    const den=n*sxx-sx*sx;
    const bb=den?(n*sxy-sx*sy)/den:0, aa=(sy-bb*sx)/n;
    let ss=0; for(let i=0;i<n;i++){ const e=ps[i]-(aa+bb*i); ss+=e*e; }

}
/* ── 어려웠던 회차는 시상 기준을 조금 늦춘다 ───────────────────────

   36%, 11회는 0% 였다 — 11회를 본 학생은 아무리 잘 봐도 확률이 바닥으로
   나온다. 그 학생이 못한 것이 아니라 그 회차가 어려웠던 것이다.

   얼마나 늦출지는 **화면에서 셈하지 않는다.** tools/gen_cut_adj.py 가 기준
   기록으로 미리 재어 exams.json 에 cutAdj 로 적어 둔다. 화면에서 그때그때
   계산하면 기준 기록이 늦게 도착한 학생에게 다른 기준이 적용된다 — 같은
   시험인데 누가 언제 열었느냐로 상이 갈리면 안 된다.

   기록이 얇을 때는 거의 안 움직이고(w = N/(N+30)), 쌓일수록 조금씩 다가간다.
   상한은 문항 수의 8% 다. 쉬운 회차는 건드리지 않는다. */
function effCut(exam){
  if(!exam||!exam.cut) return exam?exam.cut:null;
  var a=+exam.cutAdj||0;
  return a ? exam.cut.map(function(c){ return c+a; }) : exam.cut;

function winProb(total, correct, cut, gain, eff){

  const c = correct + g, w = total - c;

     재 오고, 없으면 어림값을 쓴다. 비율은 그대로, 확신만 줄인다. */
  const k = Math.min(1, (eff != null ? eff : effN(total)) / total);
  const a = 1 + c * k, b = 1 + w * k;
  const pmf=[]; for(let i=0;i<=total;i++)pmf.push(betaBinomPMF(i,total,a,b));

/* ── 이 학생이 지금 얼마나 오르고 있는가 ───────────────────────────
   회차별 정답률(%)에 직선을 맞춰 **한 회차당 오르는 폭**을 구하고, 그것을
   이번 시험의 문항 수로 바꿔 돌려준다. 두 회차 미만이면 알 수 없으니 0.

   함부로 크게 잡지 않는다 — 한 회차에 총문항의 8%(60문항이면 5문항)까지만
   본다. 우연히 한 번 잘 본 것을 '추세' 로 읽어 확률을 부풀리면, 그 숫자는
   위로가 아니라 거짓말이 된다. */
function growthGain(total){
  try{
    const nm=curName(); if(!nm) return 0;
    const h=histOf(nm); if(!h || h.length<2) return 0;
    const ys=h.map(x=> x.r.total? x.r.correct/x.r.total*100 : 0);
    const n=ys.length; let sx=0,sy=0,sxx=0,sxy=0;
    for(let i=0;i<n;i++){ sx+=i; sy+=ys[i]; sxx+=i*i; sxy+=i*ys[i]; }
    const den=n*sxx-sx*sx; if(!den) return 0;
    const slope=(n*sxy-sx*sy)/den;              // 회차당 정답률 상승(%p)
    if(!(slope>0)) return 0;                    // 내려가는 중이면 안 얹는다

        +`<span style="font-size:12px;color:var(--muted)">지난 회차들의 상승 폭을 직선으로 이어 다음 회차에 <b>+${gN}문항</b>을 더 맞는다고 두었을 때입니다. 가정이 붙은 숫자예요 — 확정이 아니라 <b>지금 방향을 유지했을 때</b>의 값입니다.</span></div>`;

      marg=`<div class="note" style="margin-top:9px;font-size:12.5px"><b>한계 이득.</b> 쉬운데 틀린 <b>${careless}문항</b>을 고치면 ${top}. 가장 큰 점수 여력이 여기 있습니다.</div>`; } }

        아닙니다")를 아무리 정직하게 적어도 **작은 글씨는 큰 숫자를 못 이긴다.**
        열네 살에게 0% 는 '가능성이 없다' 로 읽힌다.
        (선생님 결정 B13 · `docs/성적표를-읽는-사람.md` 3절)

        숫자를 바꾸지 않는다 — 그건 거짓말이다. **시점**을 붙인다.
        `0%` 는 '영원히' 가 아니라 '지금 실력 그대로일 때' 다. 그리고 0 일

       +`<div style="font-size:11.5px;color:var(--muted);margin-top:2px">지금 실력 그대로일 때</div>${lift}</div>`;

/* 수상권 밖일 때: 몇 문항만 회복하면 입상(장려상 이상) 가능성이 얼마로 오르는지 격려 문구 */
function belowAwardKick(exam, correct, total, weak){
  try{
    var cut=effCut(exam); if(!cut||total<=0) return null;
    var gap=Math.max(1,(total-correct)-cut[4]);                                  // 장려상 도달까지 회복해야 할 정답 수

         큰 글씨가 이미 `수상권 밖` 이라, 한 화면에서 두 번 같은 말을 들었다.
         그 위치는 히어로가 작은 딱지로 이미 말한다 — 여기서는 **길만 말한다.**
         (선생님 결정 B10 · `docs/성적표를-읽는-사람.md` 1절) */

function tierPathSec(exam,sel){

  } else {

     <div style="font-size:13px;margin-top:5px">우선순위: ${pathStr(pathTo(tg.gap))}. 이 영역의 오답을 메우면 도달선을 넘습니다.</div>

function learnerTypeSec(exam, sel, cs, correct, total){

      if(d>=70 && !ok) miss++; if(d<55 && ok) hard++; } }

     영역이 0% 로 끼면 편차가 부풀어 '영역 편차형' 이라고 단정하게 된다. */
  const sb=domJudgeable(exam,sel); const accs=Object.values(sb);
  const mean=accs.length?accs.reduce((a,b)=>a+b,0)/accs.length:0;
  const variance=accs.length?Math.sqrt(accs.reduce((s,v)=>s+(v-mean)**2,0)/accs.length):0;
  const _rpP=rankPool(exam,cs);
  const pct=_rpP.ready?percentile(_rpP.pool,correct):Math.round(correct/Math.max(1,total)*100);

  if(pct<40) t={name:'기초 정착형',desc:'기본 개념을 다지는 단계입니다. 자주 나오는 유형부터 확실히 잡으면 빠르게 오릅니다.'};
  else if(miss>=3 && miss>=hard) t={name:'실수 교정형',desc:'아는 문항에서 점수가 새는 패턴입니다. 검토 습관만 잡으면 즉시 상승 여력이 큽니다.'};
  else if(hard>=3) t={name:'응용 강점형',desc:'어려운 문항을 풀어내는 응용력이 돋보입니다. 심화로 폭을 넓히기 좋습니다.'};

    <div style="flex:0 0 auto;text-align:center"><div style="font-size:11.5px;color:var(--muted);letter-spacing:1px">학습 유형</div><div style="font-size:17px;font-weight:800;color:var(--teal);white-space:nowrap;margin-top:1px">${t.name}</div></div>

/* ── 누적 오개념 프로필 ───────────────────────────────────────────────

   무엇을 틀렸는지만 말하고, 그 학생이 **매번 같은 자리에서 걸린다**는 사실은
   어디에도 나오지 않는다. 그게 사실 가장 중요한 정보인데.

   같은 이름으로 여러 시험을 본 기록을 모아, 문항 유형별로 몇 번 만나 몇 번
   틀렸는지 센다. 시험 하나에서만 틀린 유형은 그날 컨디션일 수 있으므로,
   **서로 다른 시험 두 개 이상에서** 틀린 것만 보여 준다. */
/* 반복 오답 유형을 숫자로만 낸다. 화면과 Word 가 같은 값을 쓰도록 계산은 한 곳에.
   반환 배열에 takes(응시 시험 수)를 달아 둔다. */
/* 유형 이름으로 오개념 설명을 찾되, 없으면 그 유형이 속한 대분류의 함정 설명으로
   채운다. OMLIB 에 없는 세부 유형(PV=nRT 같은 것)이 꽤 있어서 그냥 두면 빈칸이 된다. */
function missWhy(exam,ty){
  var why=omFor(ty); if(why) return why;
  try{
    var idx=(exam.type||[]).indexOf(ty);
    var area=(idx>=0&&exam.area)?exam.area[idx]:ty;
    var bd=RX[area]?area:(RXMAP[area]||area);
    if(RX[bd]&&RX[bd].t) return RX[bd].t;
  }catch(e){}

function repeatedMisses(exam){
  var nm=curName();
  if(!nm) return [];
  var takes=histOf(nm).map(function(h){ return {e:h.e, ans:h.r.ans}; });
  if(takes.length<2) return [];
  var stat={};
  takes.forEach(function(t){
    for(var q=1;q<=t.e.nQ;q++){
      var ty=(t.e.type&&t.e.type[q-1])||(t.e.area&&t.e.area[q-1])||'';
      if(!ty) continue;
      var st=stat[ty]||(stat[ty]={met:0,bad:0,exams:{}});
      st.met++;

    }

    .sort(function(a,b){ return (b.nEx-a.nEx)||(b.rate-a.rate)||(b.bad-a.bad); })
    .slice(0,6);

/* ── 동형문제 회복률 ──────────────────────────────────────────────────
   성적표는 지금까지 "무엇을 틀렸나"까지만 말했다. 정작 알고 싶은 것은
   "그래서 고쳤나"인데, 잴 방법이 없었다. 동형문제를 눌러 풀 수 있게 되면서
   처음으로 그게 가능해졌다.

   원문을 틀린 문항의 동형문제를 맞히면 **회복**이다 — 숫자와 조건이 달라져도
   같은 개념을 적용했다는 뜻이니까. 동형문제까지 틀리면 그 문항은 아직 남아 있고,
   어느 선택지를 골랐는지가 무엇에 걸리는지를 말해 준다. */
/* 회복 현황을 숫자로만 낸다. 화면(recoverySec)과 Word 가 같은 값을 쓰도록
   계산을 한 곳에 둔다. 기록이 없으면 빈 배열. */
function dhRecovery(exam){
  var nm=curName(); if(!nm) return [];
  var log=dhLog(exam.id).filter(function(r){ return r.name===nm; });
  if(!log.length) return [];
  var byQ={};
  log.forEach(function(r){ (byQ[r.q]=byQ[r.q]||[]).push(r); });
  var qs=Object.keys(byQ).map(Number).sort(function(a,b){return a-b;});
  var solved=[], stuck=[];
  qs.forEach(function(q){ (byQ[q].some(function(r){ return r.ok; })?solved:stuck).push(q); });
  var out=qs;
  out.solved=solved; out.stuck=stuck;
  out.tried=log.length; out.right=log.filter(function(r){return r.ok;}).length;
  out.rate=qs.length?Math.round(solved.length/qs.length*100):0;
  return out;
}
function recoverySec(exam){
  var qs=dhRecovery(exam); if(!qs.length) return '';
  var solved=qs.solved, stuck=qs.stuck, tried=qs.tried, right=qs.right;

  var stuckHTML='';

    stuckHTML='<div class="note" style="margin:9px 0 0;border-left-color:var(--ms)">'

  }

    +'<div class="sub">틀린 문항의 동형문제를 직접 풀어 본 결과입니다. '
    +'<b>'+qs.length+'문항</b>에 도전해 <b>'+solved.length+'문항</b>을 회복했습니다'
    +'<span style="color:var(--muted)"> (푼 문제 '+tried+'개 중 '+right+'개 정답)</span>.</div>'
    +'<div style="margin:10px 0 2px"><div class="barrow" style="font-size:13px">'
    +'<span style="min-width:74px;font-weight:600">회복률</span>'

    +'<i style="display:block;height:100%;width:'+Math.max(2,rate)+'%;background:var(--teal)"></i></span>'
    +'<span style="font-family:var(--mono);font-size:12px;width:44px;text-align:right">'+rate+'%</span></div></div>'
    +solvedHTML+stuckHTML+'</div>';
}
function masterySec(exam){

    if(n>=2&&s[n-1]>=MAST&&s[n-2]>=MAST)mastered.push({d,s});

function sharedReportRuntime(){
  var C=['','①','②','③','④'];

      card.querySelector('[data-retry-label]').textContent=C[val];

      var ds=card.querySelector('[data-dh-solution]');if(ds){ds.hidden=false;ds.open=true;}card.querySelectorAll('[data-dh-mis]').forEach(function(n){n.hidden=n.getAttribute('data-dh-mis')!==String(value);});

function mergeSheetRows(exam,rows,prune){

         안 줘서 '-' 로 들어온 줄이 영영 '-' 로 남았다. 비어 있으면 채운다. */
      var cur0=arr[seen[sig]];

        if(!cur0.grade && rowRec.grade){ cur0.grade=rowRec.grade; filled++; }

let RESENT_BY={};

      if(!(r.name||r.school)) return;
      /* 한없이 다시 보내지는 않는다. 세 번을 보냈는데도 시트에서 안 보이면
         **간 것을 우리가 못 찾는 것**일 수 있다 — 계속 보내면 시트에 같은 줄이
         쌓인다. 멈추고 표시만 남긴다(명단 관리에서 사람이 본다). */

/* ── 성적표 링크를 복사한다 · 언제 복사했는지 남긴다 (선생님 결정 #32) ──

/* ── 무엇이 밀려 있나 (선생님 결정 #31) ────────────────────────────────
   *"시트가 느릴 때 무엇이 밀렸는지 안 보인다 — 실패한 저장이 조용히 쌓인다."*

function pendingCount(){

    FINAL_EXAMS.forEach(function(exam){
      var ck=cohortKey(exam.id); if(done[ck]) return; done[ck]=1;
      subs(exam.id).forEach(function(r){
        if(!(r.name||r.school)) return;

            qp:qp,qopt:qopt,qdisc:null,qcnt:qcnt,totals:totals,
            yearTotals:yearTotals,yearOf:yearOf,flagged:0,fromLink:true,
            local:{N:N,qcnt:qcnt}};
  }catch(e){ return null; }
}
// 옛 형식(문항당 6바이트). 이미 학부모에게 나간 링크가 있으므로 계속 읽는다.
function unpackCohortV1(exam,b){
  var nQ=exam.nQ, N=(b[2]<<8)|b[3], qp=[], qopt=[], qcnt=[], i=4;
  for(var q=0;q<nQ;q++){
    var p=b[i++], o1=b[i++], o2=b[i++], o3=b[i++], o4=b[i++]; i++;   // 마지막은 변별도(안 쓴다)
    if(p===255){ qp.push(null); qopt.push(null); qcnt.push(null); continue; }
    qp.push(p); qopt.push([o1,o2,o3,o4]);
    // 옛 형식은 비율만 담았다. 기준 기록을 얹으려면 사람 수가 필요해 되돌린다
    // (반올림 오차가 한둘 섞일 수 있지만, 기준 기록을 통째로 버리는 것보다 낫다).
    qcnt.push([o1,o2,o3,o4].map(function(x){ return Math.max(0,Math.min(N,Math.round(x*N/100))); }));
  }
  var totals=[];
  for(var t=0;t<=nQ;t++){ var c=b[i++]||0; for(var k=0;k<c;k++) totals.push(t); }
  if(!totals.length) return null;
  return {N:N,ready:true,estimated:false,percReady:true,
          qp:qp,qopt:qopt,qdisc:null,qcnt:qcnt,totals:totals,flagged:0,fromLink:true,
          local:{N:N,qcnt:qcnt}};
}
/* ── 성적표 링크의 모양 ─────────────────────────────────────────────────
   여기서 한 번만 적는다. 이 규칙이 여러 곳에 흩어져 있어서, 칸 하나를 늘리자
   검사 셋이 한꺼번에 빨간불이 났다(2026-08-11, 채점일 `t=`).

       final.html#[이름=값&]*r=<회차>.<답안36진법>[.<수험번호>.<이름>]

   · `r=` 는 **맨 뒤**다. 뒤를 통째로 삼키는 규칙이라(hashStrFinal) 뒤에
     아무것도 못 붙인다. 새 칸은 언제나 `r=` **앞**에 `이름=값&` 으로 붙인다.
   · 지금 붙는 칸: `s=` 또래 통계 스냅숏 · `t=` 채점일
   · 읽는 쪽은 `[#&]이름=` 으로 본다 — `#이름=` 으로 보면 앞에 다른 칸이
     생긴 날 못 찾는다. 실제로 그렇게 세 군데가 걸렸다.
   · 옛 링크에는 새 칸이 없다. **없을 때 조용한 것**까지가 규칙이다 —
     모르는 것을 오늘 값으로 메우면 틀린 것처럼 보이지 않으면서 틀린다. */
function shareLinkFinal(cur,sel,nm,exno){
  /* 또래 통계 스냅숏은 `r=` **앞**에 붙인다. 뒤에 붙이면 이름을 끝까지 집어삼키는
     기존 해시 규칙에 걸려 이름 안으로 들어가 버린다. */
  var snap='';
  try{ if(!fShared&&csLinkOn()){ var cs=cohortStats(cur); var packed=packCohort(cur,cs); if(packed) snap='s='+packed+'&'; } }catch(e){}
  /* ── 언제 본 시험인지 링크에 싣는다 (#17) ────────────────────────────
     성적표에는 발행일만 있었는데, 그 발행일은 **파일을 만든 날**이라 학부모가
     두 달 뒤에 열면 오늘 날짜가 찍힌다. "두 달 전 시험인지 어제인지" 를 알
     길이 없었다.

     ⚠ **응시일은 아무 데도 기록돼 있지 않다**(rankPoolYear 주석 참고).
       그러니 응시일이라고 적으면 그건 지어낸 말이다. 우리가 실제로 아는 것은
       **채점한 날**이고, 그것만 적는다.

     `r=` 는 뒤를 통째로 삼키는 규칙이라(hashStrFinal) `s=` 처럼 **앞**에 붙인다.
     이미 나간 링크에는 이 칸이 없다 — 그때는 조용히 발행일만 나온다. */
  var gd='';
  try{ var d=new Date();
       gd='t='+d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2)+'&'; }catch(e){}
  /* ── 「즉시 재도전」 회차는 **봉투가 곧 시험지다** ──────────────────────
     그 회차(id 가 `<코드>-r…`)는 저장소 어디에도 없다. 문항·정답·크롭 자리가
     전부 주소의 `x=` 봉투에만 산다. 그래서 봉투를 안 실으면, 받는 쪽에서
     retryParse 가 null 이 되고 examById 가 회차를 못 찾아 성적표 대신 시험
     목록이 뜬다 — 이름은 해시에 멀쩡히 있는데 성적표가 없는 죽은 링크다.

     final-submit 쪽은 이미 봉투를 앞에 싣고 있었는데(withEnv), 여기서 다시
     공유하는 세 자리(명단 링크·「성적표 링크 복사」·시트에 적히는 link)는
     빠져 있었다. `r=` 는 뒤를 통째로 삼키므로 `s=`·`t=` 와 같이 **앞**에 붙인다. */
  var env='';
  try{ if(cur&&cur.retry&&window.__retryRaw) env='x='+window.__retryRaw+'&'; }catch(e){}
  return location.origin+location.pathname+'#'+env+snap+gd+hashStrFinal(cur,sel,nm,exno);
}
/* 아무리 줄여도 또래 통계를 실으면 주소가 답안만 담을 때보다 길어진다.
   카톡으로 보내기에 너무 길면 통째로 끄는 스위치. 끄면 학부모 쪽 성적표에서
   백분위·문항 정답률·선택지 분석이 빠진다(개인 성적은 그대로 나온다).
   채점할 때 만들어 시트에 적히므로, 바꾸면 그 뒤에 채점한 학생부터 적용된다. */
const CSLINK_KEY='chemistreal:final:cslink';
function csLinkOn(){ try{ return localStorage.getItem(CSLINK_KEY)!=='0'; }catch(e){ return true; } }

/* ── 시트에 보낼 한 줄을 만드는 유일한 자리 ─────────────────────────────
   채점 직후에 보내는 것과, 못 보낸 것을 나중에 다시 보내는 것이 같은 모양이어야
   한다. 두 벌로 두면 나중에 보낸 줄만 열이 비거나 원점수가 달라진다. */
function sheetPayloadFor(exam,sel,cs,nm,sch,grd){
  const broad=a=>RX[a]?a:(RXMAP[a]||a); const ag={};
  if(exam.area) for(let q=1;q<=exam.nQ;q++){ const bd=broad(exam.area[q-1]||''); if(!bd)continue; (ag[bd]=ag[bd]||{c:0,t:0}); ag[bd].t++; if(okq(exam,q,sel[q]||0))ag[bd].c++; }
  const areas=Object.keys(ag).map(d=>d+' '+ag[d].c+'/'+ag[d].t).join(', ');
  const ans=[]; let correct=0, total=0, _wr=[];
  for(let q=1;q<=exam.nQ;q++){ const a=sel[q]||0; ans.push(a); total++;
    if(okq(exam,q,a)) correct++; else _wr.push({q:q,a:a}); }
  const pct=total?Math.round(correct/total*100):0;
  /* 감점을 반영한 진짜 원점수. 시트의 '원점수' 열에는 맞은 문항 수가 들어가고
     (석차의 기준이라 못 바꾼다) 이 값은 맨 뒤 열에 따로 실린다.
     받는 쪽에서 correct*3 으로 지어내면 오답 감점이 있는 회차(KMChC·동형 등)는
     그만큼 부풀려 나간다. 화면이 보여 주는 것과 같은 수를 보낸다. */
  const _rs=finalRawScore(exam,correct,_wr);
  let perc='', rnk=''; try{ const _rp=rankPool(exam,cs);
    if(_rp.ready){ perc=percentile(_rp.pool,correct); rnk=rankIn(_rp.pool,correct)+'/'+_rp.N; } }catch(e){}
  return { name:nm||'', examno:'', school:sch||'', grade:grd||'',
    date:new Date().toISOString().slice(0,10), exam:exam.title,
    total:correct, max:total, pct100:pct,
    percentile: perc===''?'':+(+perc).toFixed(1), rank:rnk, n:(cs&&cs.N)||'',
    correct:correct, areas:areas, answers:ans.join(''), link:shareLinkFinal(exam,sel,nm),
    raw:_rs.score, rawMax:total*3, pen:_rs.pen };
}
/* 시트에 쏜다. no-cors 라 **응답을 읽을 수 없다** — 성공했는지는 나중에 시트를
   다시 읽어 그 줄이 있는지로만 알 수 있다. 그래서 보낸 기록에 '아직 확인 못 함'
   표를 달아 두고, 다음 동기화 때 시트에 있으면 표를 지운다. */
function postToSheet(payload){
  try{
    fetch(SHEET_ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
      .catch(function(){ fToast('시트 전송 실패 · 다음에 다시 보냅니다'); });
    return true;
  }catch(e){ fToast('시트 전송 호출 실패 · 다음에 다시 보냅니다'); return false; }
}
function saveToSheetFinal(cur,sel,correct,total,W,cs,nm,sch,grd,pct){
  if(!SHEET_ENDPOINT) return;
  if(fShared) return;

  postToSheet(sheetPayloadFor(cur,sel,cs,nm,sch,grd));
  fToast('구글 시트로 전송했습니다 · '+(nm||sch));
  /* 방금 한 명이 늘었다. 들고 있던 인원은 이미 낡았으니 버리고 다시 묻는다 —
     안 그러면 다음 학생 성적표에 **한 명 적은** 분모가 찍힌다.
     시트가 줄을 받아 넣을 틈을 조금 준다(no-cors 라 끝난 때를 알 수 없다). */
  try{

      LIVE_ASK[_eid]=0;
      if(LIVE_POOL&&LIVE_POOL.id===_eid) LIVE_POOL=null;
      loadLiveCohort(_eid, cohortRedraw);
    }, 2500);
  }catch(e){}
}

/* ── 가장 빨리 오르는 한 걸음 (선생님 결정 #18) ─────────────────────────
   *"`0%` 뒤에 또 `0%`"* — 수상 확률이 0% 로 나오고, 바로 다음 자리인 오답 노트
   첫 장의 회복률도 0% 다. 두 개의 0 이 붙어 있으면 학생이 읽는 것은 숫자가
   아니라 «나는 안 되는구나» 다.

   여기서 **하나만** 고른다. 여러 개를 늘어놓으면 그것도 0 앞에 선 사람에게는
   또 하나의 벽이다. 한 문항이면 오늘 저녁에 할 수 있다.

   무엇을 고르나 — **또래가 가장 많이 맞힌, 내가 틀린 문항.** 그게 가장 빨리
   오르는 한 칸이다. 정답률은 실측이 없어도 회차 열의 전국 공식 정답률에서
   온다(cohortStats 의 qp).

   ⚠ 정답률을 모르면 «가장 빨리» 라고 말하지 않는다. 그때는 취약 영역의 첫
     문항을 **«먼저 볼 한 문항»** 이라고만 적는다 — 근거 없이 최상급을 붙이면
     그 말이 다음부터 안 읽힌다. */
function oneStepSec(exam, sel, cs, wrong){
  try{
    wrong = wrong || [];
    if(!wrong.length) return '';
    var qp = (cs && cs.qp) ? cs.qp : null;
    var pick = null, why = '';
    if(qp){
      wrong.forEach(function(w){
        var v = qp[w.q-1];
        if(v==null) return;
        if(!pick || v > pick.v) pick = {q:w.q, v:v};
      });
      if(pick) why = '또래 <b>'+pick.v+'%</b>가 맞힌 문항입니다.';
    }
    var lead;
    if(pick){ lead = '가장 빨리 오르는 한 걸음'; }
    else {
      var weak = finalWeakArea(exam, wrong);
      var first = weak ? wrong.filter(function(w){ return (exam.area&&exam.area[w.q-1])===weak; })[0] : wrong[0];
      if(!first) return '';
      pick = {q:first.q, v:null};
      lead = '먼저 볼 한 문항';
      why = weak ? '<b>'+esc(weak)+'</b> 영역에서 처음 만나는 문항입니다.' : '';
    }
    var area = (exam.area && exam.area[pick.q-1]) || '';
    var type = (exam.type && exam.type[pick.q-1]) || '';
    return '<div class="onestep">'
      +'<div class="onestep__ey">'+lead+'</div>'
      +'<div class="onestep__q"><b>'+pick.q+'번</b>'
        +(area?'<span class="onestep__tag">'+esc(area)+'</span>':'')
        +(type?'<span class="onestep__tag">'+esc(type)+'</span>':'')+'</div>'
      +'<div class="onestep__why">'+why+' 아래 <b>오답정리</b>에서 이 한 문항의 '
      +'오개념과 개념 보충을 읽고, 같은 개념의 연습 문제까지만 풀어 보세요. '
      +'<b>오늘은 여기까지면 충분합니다.</b></div>'
      +'<a role="button" tabindex="0" class="onestep__go" '
      +'onclick="scrollToWrong('+pick.q+');return false" '
      +'onkeydown="if(event.key===\'Enter\'||event.key===\' \'){scrollToWrong('+pick.q+');return false}">'
      +pick.q+'번으로 →</a></div>';
  }catch(e){ return ''; }
}
/* 그 한 문항의 오답정리 카드로 내려간다. 없으면 오답정리 첫머리로 간다 —
   아무 데도 안 가는 단추가 가장 나쁘다. */
function scrollToWrong(q){
  try{
    var el = document.querySelector('[data-wbq="'+q+'"]') || document.getElementById('wrongbook');
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});

/* 취약한 순서로 영역 이름을 늘어놓는다(선생님 결정 #23).
   `finalWeakArea` 는 **하나만** 돌려주는데, 목차에서는 몇 개가 필요하다.
   세는 규칙은 같다 — 틀린 문항이 많은 영역이 앞이다. */
function weakOrder(exam, wrong){
  try{
    /* ⚠ **묶음 이름으로 보낸다.** 시험의 영역은 106가지로 잘게 나뉘어 있고
       (`계수맞추기` · `헨더슨하셀바흐식` …), 목차는 16묶음이다. 잘게 나뉜
       이름을 그대로 보내면 목차에서 하나도 못 찾는다 — 실제로 처음엔
       넷 중 하나만 붙었다. `bkBroad` 가 이미 그 묶기를 안다. */
    var cnt={}; (wrong||[]).forEach(function(w){
      var a=(exam.area&&exam.area[w.q-1])||''; if(!a) return;
      var bd=bkBroad(a)||a; cnt[bd]=(cnt[bd]||0)+1; });
    return Object.keys(cnt).filter(function(k){ return k && k!=='기타'; })
      .sort(function(a,b){ return cnt[b]-cnt[a] || a.localeCompare(b); });
  }catch(e){ return []; }
}
function finalWeakArea(exam, wrong){
  try{ var cnt={}; wrong.forEach(function(w){ var a=(exam.area&&exam.area[w.q-1])||''; if(a) cnt[a]=(cnt[a]||0)+1; });
    var best='', n=0; Object.keys(cnt).forEach(function(k){ if(cnt[k]>n){n=cnt[k];best=k;} }); return best;
  }catch(e){ return ''; }

/* 시험별 오답 감점 배점: JMChC·산과염기는 무감점(정답+3 / 무응답0 / 오답0),

/* ── 한 시험의 동형문제 세트 ─────────────────────────────────────────────
   같은 시험이 두 ID 로 등록돼 있던 것을 하나로 합치면서, 사라지는 쪽 ID 로
   집필해 둔 동형문제를 버리지 않고 함께 보여준다. 틀린 문항마다 서로 다른
   연습 문제를 두 개씩 받게 되므로 한 벌만 쓰던 때보다 낫다.
   세트가 더 늘어나면 여기에 파일 이름(ID)만 덧붙이면 된다. */
/* ⚠ 이 표는 tests/wrongbook-assets.py 가 **글자 그대로 잘라 JSON 으로 읽는다.**
   안에 주석을 넣으면 그 검사가 깨진다 — 설명은 여기 밖에 적는다.

   · 값이 여럿인 회차: 같은 시험이 이름 둘로 불리던 때의 세트를 함께 읽는다.
   · 값이 빈 배열인 회차(단원별 여덟): **동형문제 세트가 아직 없다.** 기본값
     ([id])대로 두면 없는 파일을 부르고 검사도 «있어야 하는데 없다» 고 읽는다.
     오답노트의 동형문제 자리는 개념 풀(donghyung/index.json)이 대신 채운다. */
const DH_SETS={'hwol-2018':['hwol-2018','kmchc-2018'],
               'hwol-2019':['hwol-2019','kmchc-2019'],
               'hwol-2024':['hwol-2024','kmchc-2024-1'],
               'kch1u1':[], 'kch1to2':[], 'kch1to2-b':[], 'kch1to3':[],
               'kch1to3-b':[], 'chem2-1':[], 'kch2to3':[], 'kch2final':[]};
const dhSetIds=id=>DH_SETS[id]||[id];
/* 문항 번호 → 동형문제 배열. 세트 순서대로 담는다. */
async function loadAnalogues(id){
  var out={};
  var files=await Promise.all(dhSetIds(id).map(function(x){
    return fetch('donghyung/'+x+'.json',{cache:'no-store'})
      .then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});
  }));
  var ids=dhSetIds(id);
  files.forEach(function(f,fi){ if(!f)return; var qs=f.questions||f;
    Object.keys(qs).forEach(function(q){
      // 어느 파일에서 왔는지 달아 둔다. 성취 기록이 '몇 번째 동형문제였는지'를
      // 세트 순서가 아니라 파일 이름으로 가리켜야 나중에 세트가 바뀌어도 흔들리지 않는다.
      var item=qs[q]; if(item&&typeof item==='object') item._src=ids[fi];
      (out[q]=out[q]||[]).push(item);
    }); });
  return out;
}
/* 동형문제 보기(①②③④). 정답에는 아무 표시도 하지 않는다 —
   먼저 스스로 풀게 하고, 정답은 아래 접힌 블록에서 따로 확인하게 한다. */
/* 보기를 눌러 풀 수 있게 만든다.
   읽기만 하는 문제는 눈으로 훑고 정답을 펼쳐 보면 끝난다. 답을 **고르게** 하면
   학생이 자기 판단을 한 번 걸고 넘어가고, 틀렸을 때 "왜 하필 그걸 골랐는지"를
   그 자리에서 짚어 줄 수 있다.

   2400문항 모두 `misconceptions` 에 오답 선택지마다 그 선택으로 이끄는 오개념
   문장을 갖고 있다. 그걸 보기에 실어 두었다가 누른 즉시 보여 준다.
   (정답 번호가 `data-ans` 에 들어가니 소스를 뒤지면 보이기는 한다. 그래도
   보기에 색을 칠해 두는 것보다는 낫다 — 눈에 먼저 들어오지 않는다.) */
function wbChoiceList(dq){
  var chs=(dq.choicesHtml||dq.choices||[]); if(!chs.length) return '';
  var ans=Number(dq.answer)||0, mis=dq.misconceptions||{};
  return '<ol class="wb-opts is-live" data-ans="'+ans+'">'+chs.map(function(c,i){
    var n=i+1, why=mis[String(n)]||'';
    return '<li role="button" tabindex="0" data-c="'+n+'"'+(why?' data-mis="'+esc(why)+'"':'')+'>'
      +'<span class="ci">'+CIRC[n]+'</span><span>'+c+'</span></li>';
  }).join('')+'</ol><div class="wb-verdict" hidden></div>';
}
/* ── 동형문제 성취 기록 ───────────────────────────────────────────────
   지금까지 성적표는 "무엇을 틀렸나"까지만 말하고 "고쳤나"는 말하지 못했다.
   동형문제를 눌러 풀 수 있게 되면서 처음으로 그걸 잴 수 있게 됐다.

   원문을 틀린 문항의 동형문제를 맞히면 **회복**이다. 개념이 잡혔다는 뜻이다.
   동형문제까지 틀리면 그 문항은 아직 남아 있는 것이고, 어느 선택지를 골랐는지가
   무엇이 걸리는지를 말해 준다.

   브라우저에만 쌓는다(시트로 보내지 않는다). 학생 이름과 시험으로 묶는다. */
const DHLOG='final:dhlog:';
function dhLog(examId){
  try{ return JSON.parse(localStorage.getItem(DHLOG+cohortKey(examId))||'[]'); }
  catch(e){ return []; }
}
function logAttempt(dh,choice,ok){
  try{
    if(!cur||fShared) return;              // 공유 링크로 열어 본 것은 기록하지 않는다
    var card=dh.closest('.wb-card'); if(!card) return;
    var nm=curName(); if(!nm) return;
    var rec={name:nm, q:Number(card.dataset.q)||0,
             src:dh.dataset.src||'', choice:choice, ok:!!ok, ts:Date.now()};
    var arr=dhLog(cur.id);
    // 같은 학생이 같은 문항의 같은 동형문제를 다시 풀면 최근 것만 남긴다
    arr=arr.filter(function(r){ return !(r.name===rec.name&&r.q===rec.q&&r.src===rec.src); });
    arr.push(rec);
    localStorage.setItem(DHLOG+cohortKey(cur.id),JSON.stringify(arr));
    // 회복률 섹션은 성적표를 그린 뒤에 생기는 정보라, 풀 때마다 그 자리만 다시 그린다
    var host=document.getElementById('recovery');

  }catch(e){}
}
/* 보기를 눌렀을 때. 한 번 고르면 바꾸지 못한다 — 눌러 보며 정답을 찾는 것은
   푸는 것이 아니다. 고른 뒤에는 해설을 자동으로 펼쳐 준다. */
function pickChoice(li){
  var ol=li.parentNode; if(!ol||!ol.classList.contains('is-live')) return;
  ol.dataset.done='1';
  // 다 푼 보기에서는 `is-live` 를 떼어 낸다. 그대로 두면 커서가 계속 손가락
  // 모양이라 아직 고를 수 있는 것처럼 보인다(눌러도 막히긴 하지만 헷갈린다).
  ol.classList.remove('is-live');
  var ans=Number(ol.dataset.ans)||0, mine=Number(li.dataset.c)||0, ok=(mine===ans);
  [].forEach.call(ol.children,function(x){
    var n=Number(x.dataset.c)||0;
    if(n===ans) x.classList.add('is-key');
    if(n===mine) x.classList.add(ok?'is-ok':'is-no');
    x.setAttribute('tabindex','-1');
  });
  var box=ol.nextElementSibling;
  if(box&&box.classList.contains('wb-verdict')){
    var why=li.dataset.mis||'';
    box.innerHTML=ok
      ? '<b class="ok">맞았습니다</b> 같은 개념을 다른 조건에서도 적용했습니다.'
      : ('<b class="no">틀렸습니다</b> 정답은 <b>'+CIRC[ans]+'</b>입니다.'
         +(why?'<div class="wb-verdict-why"><b>'+CIRC[mine]+'번을 고른 이유</b> '+why+'</div>':''));
    box.hidden=false;
  }
  var dh=li.closest?li.closest('.wb-dh'):null;
  if(dh){
    var det=dh.querySelector('details.wb-dh-reveal'); if(det) det.open=true;
    logAttempt(dh,mine,ok);
  }
}
document.addEventListener('click',function(e){
  var li=e.target&&e.target.closest?e.target.closest('.wb-opts.is-live>li'):null;
  if(li) pickChoice(li);
});

  if(e.key!=='Enter'&&e.key!==' ') return;

/* 동형문제 표시 가능 여부. 생성 과정에서 도형·선택지 추출이 실패한 항목("렌더 누락",
 * 빈 선택지)은 학생에게 보여주면 오히려 혼란을 주므로 숨기고 안내 문구로 대체한다. */
function dhUsable(dq){
  if(!dq) return false;
  var stem=String(dq.stem||dq.stemHtml||''), expl=String(dq.explanation||dq.explanationHtml||'');
  if(!stem.trim() && !dq.image) return false;
  // '누락'은 정상적인 한국어 표현("중복이나 누락 없이")으로도 쓰이므로,
  // 렌더·추출·복원 실패를 가리키는 문맥에서만 손상으로 판정한다.
  if(/(?:렌더|렌더링|추출|복원|원본)[^\n]{0,30}?누락|누락[^\n]{0,30}?(?:렌더|렌더링|추출|복원)|렌더\s*실패|추출\s*실패|복원되지\s*않/.test(stem+expl)) return false;
  var chs=(dq.choices||dq.choicesHtml||[]);
  if(chs.length<4) return false;
  for(var i=0;i<chs.length;i++){ if(!String(chs[i]==null?'':chs[i]).trim()) return false; }
  return true;
}
/* 또래 선택지 분포 → 함정 선택지 판정. co={opt:[4],qp,N} 없으면 null */
function wbTrap(co,accepted,myAns){
  if(!co||!co.opt) return null;
  var trap=0,trapP=-1;
  for(var i=1;i<=4;i++){ if(accepted.indexOf(i)>=0) continue; var v=co.opt[i-1]||0; if(v>trapP){trapP=v;trap=i;} }
  if(!trap) return null;
  return {opt:co.opt,qp:co.qp,N:co.N,trap:trap,trapP:trapP,fell:(myAns===trap)};
}

/* ── 개념으로 문제 더 찾기 ────────────────────────────────────────────

   그 시험에 집필해 둔 것이 전부였다. 2400문항이 시험 칸막이에 갇혀 있던 셈이다.

   donghyung/index.json 은 '어디에 무엇이 있는지'만 담은 색인이다(지문·해설은
   들어 있지 않다). 세부 개념으로 먼저 찾고, 모자라면 대분류로 넓힌다.
   세부 개념 597가지 중 303가지는 문항이 하나뿐이라 두 층이 필요하다. */
var _poolIndex=null, _poolFiles={};
async function poolIndex(){
  if(_poolIndex) return _poolIndex;
  try{
    var r=await fetch('donghyung/index.json',{cache:'no-store'});
    _poolIndex=r.ok?await r.json():{broad:{},concept:{}};
  }catch(e){ _poolIndex={broad:{},concept:{}}; }
  return _poolIndex;
}
async function poolFile(id){
  if(_poolFiles[id]) return _poolFiles[id];
  try{
    var r=await fetch('donghyung/'+id+'.json',{cache:'no-store'});
    var j=r.ok?await r.json():null;
    _poolFiles[id]=(j&&(j.questions||j))||{};
  }catch(e){ _poolFiles[id]={}; }
  return _poolFiles[id];
}
/* 이 시험(세트 포함)에서 이미 보여 준 것은 빼고 고른다. */
async function poolPick(concept,area,examId,want){
  var idx=await poolIndex();
  var mine={}; dhSetIds(examId).forEach(function(x){ mine[x]=1; });
  var seen={}, out=[];
  function take(refs){
    (refs||[]).forEach(function(ref){
      if(out.length>=want) return;
      var bits=ref.split(':');
      if(mine[bits[0]]||seen[ref]) return;
      seen[ref]=1; out.push({file:bits[0],q:bits[1]});
    });
  }
  take(idx.concept&&idx.concept[concept]);                 // 세부 개념 먼저
  if(out.length<want) take(idx.broad&&idx.broad[area]);    // 모자라면 대분류로
  return out;
}
async function loadMore(details){

  var label=details.dataset.label||'같은 개념 문제';
  var picks=[];
  try{ picks=await poolPick(bits[0],bits[1],(cur&&cur.id)||'',2); }catch(e){}
  var made=[];
  for(var i=0;i<picks.length;i++){
    var qs=await poolFile(picks[i].file), dq=qs[picks[i].q];
    if(!dhUsable(dq)) continue;

    var sol=dq.explanationHtml||esc(dq.explanation||'');
    var mis=dq.misconception||'';
    made.push('<div class="wb-dh" data-src="'+esc('pool:'+picks[i].file+':'+picks[i].q)+'"><div class="wb-dh-h">'+label+' '+CIRC[made.length+1]
      +'<span class="wb-dh-src">'+esc(dq.concept||dq.area||'')+'</span></div>'
      +(stem?('<div class="wb-stem">'+stem+'</div>'):'')
      +wbChoiceList(dq)
      +'<details class="wb-dh-reveal"><summary>정답 · 해설 보기</summary>'
      +'<div class="wb-dh-ans">정답 <b>'+(dq.answer?CIRC[Number(dq.answer)]:'·')+'</b></div>'
      +(sol?'<div class="wb-dh-sol"><b>해설</b> '+sol+'</div>':'')
      +(mis?'<div class="wb-mis"><b>오개념</b> '+esc(mis)+'</div>':'')
      +'</details></div>');

function scoreAuto(again){

     회차에 네 줄까지 쌓였다.

     같은 시험에서 **이름과 답안이 같으면 같은 응시**로 본다. 새로 쌓지 않고

  if(exam.area) for(var q=1;q<=exam.nQ;q++){ var bd=bkBroad(exam.area[q-1]||''); if(!bd)continue;

  else { var need=Math.max(1,W-(cut[4]||18)); lead='<b>'+esc2(nm||'학생')+'</b> 학생은 이번 「'+esc2(exam.title)+'」에서 '+total+'문항 중 <b>'+correct+'문항</b>을 맞혀 원점수 <b>'+rs.score+'점</b>을 기록했습니다. 장려상까지 <b>'+need+'문항</b> — 아래에서 짚은 취약 개념을 회복하면 수상권 진입이 가능합니다.'; }

    var wq0=(wrong||[]).slice().sort(function(a,b){return a.q-b.q;});

/* ===== 동형 미니 시험지 — 다음 수업 입실고사용 인쇄물 =====
   성적표는 화면에서 보는 것이고, 수업에서는 종이가 필요하다. 틀린 문항의
   동형문제만 뽑아 한 장짜리 시험지로 만든다. 다음 수업 시작할 때 풀리면
   지난 시간 오답이 정말 메워졌는지 그 자리에서 확인된다.

   무엇을 담을지 고르는 순서:
   1) 아직 회복하지 못한 문항을 먼저 (원문도 동형도 틀렸거나, 아직 안 푼 것)
   2) 화면에서 이미 풀어 본 동형문제는 뺀다 — 답을 아는 문제를 또 주면 뜻이 없다
   3) 그래도 자리가 남으면 회복한 문항의 다른 동형문제로 채운다(복습)

   정답은 맨 뒤 별도 페이지에 모은다. 잘라 내면 그대로 학생용이 된다. */
function retestPick(exam, wrong, analogues){
  var nm=curName();
  var log=dhLog(exam.id).filter(function(r){ return !nm||r.name===nm; });
  var solvedQ={}, usedSrc={};
  log.forEach(function(r){ if(r.ok) solvedQ[r.q]=1; usedSrc[r.q+'|'+r.src]=1; });

  var fresh=[], review=[];
  (wrong||[]).slice().sort(function(a,b){return a.q-b.q;}).forEach(function(w){
    var list=(analogues[String(w.q)]||[]).filter(dhUsable);
    // 화면에서 이미 푼 것은 뺀다
    var unused=list.filter(function(dq,i){ return !usedSrc[w.q+'|'+(dq._src||('set'+i))]; });
    var pickFrom=unused.length?unused:list;
    if(!pickFrom.length) return;
    (solvedQ[w.q]?review:fresh).push({q:w.q, dq:pickFrom[0]});
  });
  return fresh.concat(review);
}

/* ===== 약점 극복 모의고사 — 이 파일에는 없다 =========================
   한 학생이 그동안 틀린 것만 모아 그 사람 한 벌의 시험지를 짓는 장치는
   **weak60.html** 로 옮겼다. 여기 두었다가 뺀 까닭:

     · 그 장치는 **정답이 실린 해설 Word** 를 만든다. 성적표는 학생·학부모가
       링크로 여는 화면이다. 답을 찍어 내는 단추가 그 화면에 있을 자리가 아니다.
     · 60제는 발행 → 1교시 채점 → 2교시 되풀이 → 해설로 이어지는 **여러 걸음**이라
       회차 하나를 보는 성적표와 화면 짜임이 다르다.

   옮긴 것이지 베낀 것이 아니다. 채점 규칙(okq·allc·accSet)과 명단 열쇠는

          else if(tpw.qp<=40) tmsg+=(tmsg?' ':'')+'또래 정답률 '+tpw.qp+'%인 고난도 문항입니다. 개념부터 차분히 잡으면 됩니다.'; }

          /* ── 답이 바로 아래 있다 (선생님 결정 #21) ────────────────────

  var firstFtr=new Footer({children:[new Paragraph({children:[]})]});
  var doc=new Document({
    creator:'Chemistreal', title:(nm?nm+' ':'')+cur.title+' 성적표',

    var blob=await Packer.toBlob(doc);

  if(m){ const ex=examById(m[1]); if(ex){ if(sm) window.__csLink={id:ex.id,raw:sm[1]}; openExam(ex.id); fShared=true; let n=0n; for(const c of m[2]) n=n*36n+BigInt(parseInt(c,36)); for(let q=1;q<=ex.nQ;q++){ const v=Number(n%5n); n=n/5n; if(v) setAns(q,v); } const ne=document.getElementById('nm'), xe=document.getElementById('exno'); if(m[4]&&ne) ne.value=decName(m[4]); if(m[3]&&xe) xe.value=m[3]; scoreAuto();
    /* 링크에 실린 인원은 링크를 지은 순간의 것이다. 지금 몇 명인지 시트에

/* ── 개념강의로 나갈 때, 돌아올 자리를 들려 보낸다 ────────────────────
   학생이 강의를 여는 길은 하나다 — 자기 성적표의 '오답 개념 클리닉'. 그런데
   강의 페이지의 돌아가는 단추는 시험 목록으로 박혀 있어서, 눌러도 자기
   성적표가 아니라 **남의 이름과 점수가 있는 목록**이 나왔다. 코드를 모르니
   잠금 화면에 갇히고, 성적표 주소는 손으로 칠 수 있는 것이 아니다.

   그래서 나가는 링크에 `?from=` 으로 지금 주소를 실어 준다. 강의 쪽 조각은
   tools/lec_back.py 가 125장에 넣어 두었다.

   ⚠ 주소에 싣는다(sessionStorage 가 아니다). 강의는 **새 탭**에서 열리는데
     (rel=noopener) 새 탭은 이 탭의 sessionStorage 를 물려받지 않는다. 같은
     탭에서는 한 번 적힌 것이 계속 남아, 나중에 목록에서 연 강의까지 성적표로
     보내 버린다 — 얻는 것 없이 끈적하기만 하다.

   성적표(#r=)일 때만 싣는다. 선생님이 목록에서 채점하다 연 강의는 예전처럼
   목록으로 돌아가는 것이 맞다. */
document.addEventListener('click', function(e){
  var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
  if(!a) return;
  var h = a.getAttribute('href') || '';
  /* ⚠ 여기가 `lec-*.html` 만 봤다. 학부모 눈으로 훑어 보니 **들어가면 못
       돌아 나오는 화면이 둘 더** 있었다(2026-08-10).

           lecture-index.html    헤더의 '개념강의 목차 →' — 돌아갈 길 없음
           sol-final-*.html      성적표 아래 해설 링크 — 돌아갈 길 없음

       강의 한 장에는 `‹ 성적표로` 가 붙는데 목차와 해설에는 없었다. 학부모는
       휴대폰으로 연다 — 뒤로 가기를 눌러도 되지만, **화면 안에 길이 없으면
       거기서 끝난다.** 같은 규칙을 셋에 다 준다. */
  if(!/^(lec-[\w-]+|lecture-index|sol-final-[\w-]+)\.html/.test(h)) return;
  if(!/[#&]r=/.test(location.hash)) return;
  var base = h.split('?')[0].split('#')[0];
  var q = '?from=' + encodeURIComponent(location.href);
  /* ── 목차에 «어느 영역부터» 를 실어 보낸다 (선생님 결정 #23) ───────────
     *"개념 강의 125강에 «몇 분» 만 있고 순서가 없다 — 어느 것부터 볼지
     학생이 정해야 한다"*.

     재어 보니 **영역 안의 순서는 있었다**(목차가 스스로 그렇게 적어 둔다:
     «각 영역은 개념 순서대로 배열돼 있고, 영역 끝에는 종합강이 있어»).
     없는 것은 **어느 영역부터** 다. 그건 학생마다 다르고, 이 성적표는 그걸
     이미 알고 있다 — 그런데 목차로 건너갈 때 **안 들고 갔다.**

     그래서 취약 영역 이름만 실어 보낸다. 성적은 안 보낸다 — 목차는 남이
     열어 볼 수 있는 장이라, 거기 점수가 실릴 이유가 없다. */
  if(/^lecture-index\.html/.test(base)){
    try{
      var wk = weakOrder(cur, (window.__fw||[]));
      if(wk.length) q += '&w=' + encodeURIComponent(wk.slice(0,4).join('|'));
    }catch(e){}
  }
  a.setAttribute('href', base + q);
}, true);
/* 시험 목록·채점 규칙을 받아 온 뒤에 화면을 그린다. */
async function start(){
  FINAL_EXAMS=await loadExams();
  await loadStudentFinals();
  /* 주소에 실려 온 「즉시 재도전」 시험을 목록에 끼워 넣는다.
     저장소에 없는 회차라, 이것을 안 하면 examById 가 못 찾는다. */
  var _rt=retryParse();
  if(_rt) STUDENT_FINALS.push(_rt);
  await loadBaseline();          // 석차 모집단. 없어도 진행한다(그때는 예전처럼 이 브라우저 기록만 본다).
  if(!FINAL_EXAMS){
    // 여기까지 오면 정말 아무 데도 없다. 빈 화면 대신 이유를 보여 주고 스스로
    // 다시 시도한다(학생이 새로고침을 몰라도 되도록).
    var app=document.getElementById('app');
    if(app) app.innerHTML='<div class="note" style="border-color:#B0512F;color:#8a2f1d">'
      +'시험 목록을 불러오는 중입니다… 잠시 뒤 자동으로 다시 시도합니다.'
      +'<br><small>계속되면 새로고침해 주세요.</small></div>';
    setTimeout(start,5000);
    return;
  }
  window.addEventListener('hashchange',boot);
  boot();
  /* 화면을 먼저 그리고 나서 맞춘다. 시트를 부르는 것은 <script> 를 붙이는
     일이라 최대 12초를 기다릴 수 있는데, 그 사이 화면이 비어 있으면 안 된다.
     보이는 것이 먼저고, 맞추는 것은 뒤에서 한다. */
  if(document.readyState==='complete') setTimeout(autoSync,1200);
  else window.addEventListener('load',function(){ setTimeout(autoSync,1200); });
}
/* ── 열 때마다 조용히 맞춘다 ───────────────────────────────────────────
   여태 시트에서 받아오는 것은 **버튼을 눌러야만** 했다. 누르지 않으면 화면은
   이 브라우저에 남은 것만 보여 준다 — 학원 PC 와 노트북에서 반씩 채점하면
   양쪽 다 절반씩만 알고, 어느 쪽 화면도 사실이 아니다. 누르라고 안내해 봐야
   누르지 않는 것이 정상이다. 사람이 기억해야 맞는 것은 안 맞는다.

   한 번에 받게 됐으니(action=all) 그냥 열 때마다 맞춘다. 화면을 세워 두고
   기다리지 않는다 — 뒤에서 받아 놓고 도착하면 다시 그린다.

   학부모가 연 공유 링크에서는 하지 않는다. 그 화면에 필요한 것은 링크에 이미
   다 들어 있고, 남의 기록을 그 폰에 받아 둘 이유가 없다. */
const AUTO_SYNC_STALE = 10*60*1000;      // 10분
let _autoSyncing=false;
function autoSync(force){
  if(fShared || !SHEET_ENDPOINT || _autoSyncing) return;
  if(!force && (Date.now()-lastSyncAt()) < AUTO_SYNC_STALE) return;
  _autoSyncing=true;
  try{
    syncAllFromSheet(function(){ _autoSyncing=false; }, true);
  }catch(e){ _autoSyncing=false; }
}
document.addEventListener('visibilitychange',function(){ if(!document.hidden) autoSync(); });
window.addEventListener('focus',function(){ autoSync(); });
/* 다른 탭(통합 셸 등)이 맞추면 이 화면도 따라 다시 그린다. 같은 오리진이라
   저장이 이쪽으로 온다 — 두 화면이 서로 다른 숫자를 들고 있으면 안 된다. */
window.addEventListener('storage',function(e){
  if(!e.key) return;
  if(e.key.indexOf(PFX)!==0 && e.key!==SYNC_KEY) return;
  refreshScreen();
});
