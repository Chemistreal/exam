<style>
/* ⚠ 색은 재서 정한다. --muted 는 #8a8578 이었고 종이색 위에서 3.52:1 이라
   본문 글씨 기준(4.5:1)에 못 미쳤다 — '조준모 화학 · 기출 수상권…',
   '60문항', 바닥글이 그 색이다. 통합 셸(hub.html)은 이미 #6f6a5e 로
   고쳐 놓고 **여기만 남아 있었다.** 같은 팔레트를 쓰는 두 앱이 갈렸다.
   5.16:1(종이) · 4.64:1(가장 옅은 분홍 카드)까지 확인.
   --brass 는 2.96:1 로 그림 기준(3:1)에 아슬아슬하게 못 미쳤다. 테두리·막대에
   쓰는 색이라 안 넘기면 칸 경계가 안 보인다. 눈으로는 구별이 안 되는 만큼만
   (밝기 2단계) 낮춰 3.02:1 로 맞췄다. */
:root{--cream:#FBFAF6;--paper:#fff;--ink:#23201b;--ink-2:#5a564d;--muted:#6f6a5e;--teal:#0E5A4C;--teal-d:#3A7A6B;--brass:#AF8B55;--line:#E8E4DA;--ms:#C0603A;--ok-bg:#eef5f2;--no-bg:#f7ece7;--cobalt:#3F5C8C;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;line-height:1.62;-webkit-text-size-adjust:100%}
.serif{font-family:"Nanum Myeongjo",Georgia,serif}
header{background:linear-gradient(180deg,#0E5A4C,#0b4a3f);color:#fff;padding:24px 20px 20px;text-align:center}
header .logo{font-size:12.5px;letter-spacing:.18em;opacity:.82;font-weight:600}
header h1{margin:6px 0 3px;font-size:24px;font-weight:700}
header .sub{font-size:12.5px;opacity:.85}
main{max-width:780px;margin:0 auto;padding:16px 15px 60px}
.back{display:inline-flex;align-items:center;gap:5px;color:var(--teal);background:none;border:none;font-size:14px;cursor:pointer;padding:8px 0;font-weight:600}
.note{background:#fff;border:1px solid var(--line);border-left:3px solid var(--brass);border-radius:8px;padding:11px 14px;font-size:13px;color:var(--ink-2);margin:13px 0}
.grp{margin:22px 0 8px;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.grp .gt{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:#eef5f2;color:var(--teal)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:11px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 16px;cursor:pointer;transition:.13s;display:flex;flex-direction:column;gap:7px}
.card:hover{border-color:var(--teal-d);box-shadow:0 3px 14px rgba(14,90,76,.08);transform:translateY(-1px)}
.card__t{font-size:15.5px;font-weight:700}
/* 오른쪽 위 '제출 링크' 버튼은 absolute 라 긴 제목이 그 밑으로 파고든다.
   버튼과 겹치는 **첫 줄에만** 자리를 비운다. padding-right 로 하면 짧은 제목까지
   폭이 좁아져 불필요하게 줄바꿈된다. */
.card__t::before{content:'';float:right;width:72px;height:22px}
.card__m{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{position:relative}
.slink{position:absolute;top:10px;right:10px;font-size:11.5px;color:var(--teal,#3A7A6B);background:rgba(58,122,107,.08);border:1px solid rgba(58,122,107,.25);border-radius:7px;padding:4px 8px;cursor:pointer;font-weight:600}
.slink:active{background:rgba(58,122,107,.18)}
#repPDF.pdfing{background:#fff;padding:10px 12px;border-radius:0}
/* PDF 캡처 시: 페이지에 걸쳐 잘려도 지저분하지 않도록 큰 컨테이너의 테두리·그림자·둥근모서리·배경 제거(책처럼 흐르게).
   작은 색상 박스(핵심/함정/처방/문항)와 히어로·수상 카드는 그대로 둔다. */
#repPDF.pdfing .sec,
#repPDF.pdfing .note,
#repPDF.pdfing .tb-area,
#repPDF.pdfing .fclosing,
#repPDF.pdfing .detail{
  border:none!important; box-shadow:none!important; border-radius:0!important; background:transparent!important;
  padding-left:0!important; padding-right:0!important; margin-left:0!important; margin-right:0!important;
}
#repPDF.pdfing .sec{margin-top:14px!important}
/* ============================================================
   교재형 성적표 · 인쇄 재디자인 (캡처 시에만 적용)
   화면은 그대로 두고, PDF는 책처럼 조판되도록 완전 재구성한다.
   ============================================================ */
#repPDF.pdfing{background:#fff!important;padding:2px 10px 0!important;color:#1b1913;font-size:13px}
#repPDF.pdfing>h2,#repPDF.pdfing>h2+.muted{display:none!important} /* 표지가 대체 */
/* 섹션 = 책의 절(節). 제목은 명조 + 하단 괘선 + 번호 칩 */
#repPDF.pdfing .sec{margin:0 0 6px!important;padding:0!important}
#repPDF.pdfing .sec__h{align-items:baseline!important;gap:11px!important;margin:24px 0 13px!important;
  border-bottom:1.4px solid #0E5A4C!important;padding-bottom:7px!important;break-after:avoid}
#repPDF.pdfing .sec__no{font-family:'Nanum Myeongjo',Georgia,serif!important;background:#0E5A4C!important;color:#fff!important;
  width:auto!important;min-width:24px!important;height:23px!important;padding:0 8px!important;border-radius:5px!important;font-size:13px!important;font-weight:700!important}
#repPDF.pdfing .sec__t{font-family:'Nanum Myeongjo',Georgia,serif!important;font-size:19.5px!important;font-weight:800!important;color:#0b3a31!important;letter-spacing:-.01em!important}
#repPDF.pdfing .sub{color:#6b6456!important;font-size:12px!important;margin:-3px 0 13px!important;line-height:1.65!important}
/* 본문 가독성: 줄간·자간·색 */
#repPDF.pdfing p,#repPDF.pdfing li{font-size:12.9px!important;line-height:1.92!important;color:#2a2820!important;letter-spacing:-.002em}
#repPDF.pdfing b,#repPDF.pdfing strong{color:#0b3a31}
/* 오답 클리닉 그룹(.note)은 크기가 커서 여러 페이지로 쪼개져야 한다 → 배경 없이(atomic 아님) 좌측 괘선만. */
#repPDF.pdfing .note{background:transparent!important;border:none!important;border-left:2px solid #d8cca6!important;
  border-radius:0!important;padding:6px 0 6px 15px!important;margin:12px 0!important}
#repPDF.pdfing .tb-box{border-radius:0!important;padding:10px 13px!important;margin-top:10px!important;border-left:2.5px solid transparent}
#repPDF.pdfing .tb-key{background:#eef4f1!important;border-left-color:#3A7A6B!important}
#repPDF.pdfing .tb-trap{background:#f9efec!important;border-left-color:#b1442f!important}
#repPDF.pdfing .tb-rx{background:#f7f1e4!important;border-left-color:#B08D57!important}
/* 부록(교재) 절 표지·소제목 */
#repPDF.pdfing .tb-appendix{margin-top:34px!important;border-top:none!important;padding-top:0!important;
  page-break-before:always}
#repPDF.pdfing .tb-cover{font-size:27px!important;letter-spacing:-.01em}
/* .tb-area에는 위/아래 테두리를 주면 안 됨 — pdfAtomics가 통째로 넘길 박스로 오인해
   한 페이지보다 큰 강의/영역이 안 쪼개지고 빈 페이지를 만든다. 구분은 여백으로. */
#repPDF.pdfing .tb-area{border:none!important;border-radius:0!important;background:transparent!important;
  padding:0!important;margin:26px 0 20px!important}
#repPDF.pdfing .tb-h{font-size:18.5px!important;border-bottom-width:1.2px!important}
#repPDF.pdfing .tb-lh{font-size:14px!important;color:#0b3a31!important;margin:14px 0 4px!important}
#repPDF.pdfing .tb-area>p,#repPDF.pdfing .tb-lec p,#repPDF.pdfing .tb-box p{font-size:12.9px!important;line-height:1.95!important}
/* 표: 인쇄용 깔끔한 괘선 */
#repPDF.pdfing table{border-collapse:collapse!important}
#repPDF.pdfing .gtbl th,#repPDF.pdfing .gtbl td{border-color:#e0dacd!important}
/* 카드형 잔재 평탄화(공유 리포트 내 잔여 그림자 제거) */
#repPDF.pdfing .detail,#repPDF.pdfing .learner,#repPDF.pdfing .fclosing{box-shadow:none!important}
/* ── 표지 페이지 ── */

/* 예전에는 auto 였다. 마디가 한 쪽보다 긴 경우가 있어서 그렇게 두었는데,
   그 탓에 **한 쪽에 들어가는 짧은 마디까지** 쪽 경계에서 반으로 잘렸다
   (재어 보니 여섯 군데). avoid 로 두어도 한 쪽보다 긴 마디는 브라우저가
   알아서 나눈다 — 쪽 수를 재어 확인했다. */
.sec{break-inside:avoid}
h1,h2,.sec__h,.sub{break-after:avoid}
summary{list-style:none;cursor:default}
summary::-webkit-details-marker{display:none}
}

/* ============================================================
   책형식 성적 리포트 — PDF 전용, 웹 UI와 완전히 독립된 새 디자인

#bookPDF{position:absolute;left:-99999px;top:0;width:840px;background:#FBF8F1;color:#221E16;

.bk-hero::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 60% at 82% 0%,rgba(230,200,102,.18),rgba(0,0,0,0) 70%);pointer-events:none}
.bk-hero::after{content:"❖";position:absolute;top:9px;right:13px;color:rgba(230,200,102,.55);font-size:15px}

/* ── 성취 막대: 금·에메랄드 그라디언트 + 광택 ── */

.bk-pctn{color:#0E4A38!important}
.bk-tagS{background:linear-gradient(135deg,#0E4A38,#0a3327)!important;color:#EBCF74!important;border:none!important;border-radius:3px;box-shadow:0 2px 6px -2px rgba(14,74,56,.6)}
.bk-tagW{background:linear-gradient(135deg,#8A2E1A,#C0603A)!important;color:#FBF6EA!important;border:none!important;border-radius:3px;box-shadow:0 2px 6px -2px rgba(138,46,26,.5)}
.bk-areatbl th{color:#8A6D1F!important;border-bottom:2px solid #B8912E!important}
/* ── 영역 오답 헤더 · 처방 · 강의 제목: 오너먼트 + 금 그라디언트 괘선 ── */
.bk-ah{color:#0E4A38!important;position:relative;border-bottom:none!important;padding-bottom:7px!important}
.bk-ah::before{content:"❖ ";color:#B8912E}
.bk-ah::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,#B8912E,rgba(184,145,46,0))}
.bk-mis{border-left:2px solid #C9A227!important;background:linear-gradient(90deg,rgba(201,162,39,.07),rgba(201,162,39,0))!important;padding:5px 0 5px 13px!important}
.bk-rx{border-top:none!important;position:relative;padding-top:16px!important}
.bk-rx::before{content:"❖ ⸻⸻⸻";display:block;color:#B8912E;font-size:12px;letter-spacing:.1em;margin-bottom:6px}
.bk-rxh{color:#0E4A38!important}
.bk-rxrow::before{background:linear-gradient(90deg,#B8912E,#EBCF74)!important;height:2px!important;width:9px!important}
.bk-rxrow b{color:#8A6D1F!important}
/* 부록 표지 · 강의 제목 장식 */
.bk-apxcover{background:radial-gradient(120% 72% at 50% 42%,#FFFDF6,#F4E9CF)!important;position:relative;overflow:hidden}
/* 부록 챕터 표지: 한 페이지를 채우는 장식 프레임 + 큰 化 워터마크(여백을 의도적 디자인으로) */
.bk-apxcover::before{content:"";position:absolute;left:30px;right:30px;top:30px;bottom:30px;border:2px solid #C9A227;border-radius:4px;box-shadow:inset 0 0 0 4px #FBF8F1,inset 0 0 0 5px rgba(184,145,46,.45);pointer-events:none;z-index:0}
.bk-apxcover.bk-full::after{content:"化";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:"Nanum Myeongjo",serif;font-size:340px;line-height:1;color:rgba(184,145,46,.07);pointer-events:none;z-index:0}
.bk-apxcover>*{position:relative;z-index:1}
.bk-apxkicker{color:#B8912E!important}
.bk-apxkicker::before{content:"❖ "}.bk-apxkicker::after{content:" ❖"}
.bk-apxtitle{color:#0E4A38!important;text-shadow:0 1px 0 rgba(184,145,46,.15)}
.bk-apxtitle::before{content:"❦ ❖ ❦";display:block;font-size:15px;color:#B8912E;font-weight:400;letter-spacing:.3em;margin-bottom:16px}
.bk-apxtitle::after{content:"❦";display:block;font-size:18px;color:#B8912E;font-weight:400;margin-top:12px}
.bk-lech{color:#0E4A38!important;border-bottom:none!important;position:relative;padding-bottom:9px!important}
.bk-lech::before{content:"❖ ";color:#B8912E}
.bk-lech::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2.5px;background:linear-gradient(90deg,#0E4A38,#B8912E 45%,#EBCF74 55%,#B8912E 70%,rgba(184,145,46,0))}
.bk-lec .bk-lh{color:#8A6D1F!important}
.bk-lec .bk-lh::before{content:"◆ ";color:#B8912E;font-size:11.5px;vertical-align:middle}
.bk-foot{color:#9A7A24!important}
.bk-foot::before{content:"❦ "}.bk-foot::after{content:" ❦"}
/* ============================================================
   v2 — 2배 화려 · 가독성 · 여백 · 주제별 한 페이지 오프너

/* ── 오답 정리 노트 카드 ── */
/* 오답 카드: 박스(테두리/배경) 대신 좌측 금박 바 + 흐르는 조판 — 페이지를 꽉 채워 빈 공간을 줄인다.
   (동형문제 박스 .bk-dh 는 통째로 유지되어 카드 중간에서만 자연스럽게 나뉜다) */
.bk-wq{margin:24px 0 0!important;padding:2px 4px 2px 20px!important;position:relative}
.bk-wq::before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:5px;border-radius:3px;background:linear-gradient(180deg,#D4AE3A,#8A6D1F)}
.bk-wq-h{display:flex;align-items:baseline;gap:13px;flex-wrap:wrap}
.bk-wq-no{font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:20px;color:#0E4A38}
.bk-wq-ar{font-size:12px;font-weight:700;color:#8A6D1F;background:rgba(201,162,39,.15);padding:3px 10px;border-radius:3px}
.bk-wq-ty{font-size:13.5px;color:#6b6456}
.bk-wq-re{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:14px 0!important;padding:11px 0!important;border-top:1px dashed #d8cca6;border-bottom:1px dashed #d8cca6}
.bk-wq-relbl{font-size:12px;font-weight:800;color:#8A6D1F;letter-spacing:.08em}
.bk-bubs{font-size:21px;color:#14432F;letter-spacing:.3em}
.bk-wq-ref{font-size:11.5px;color:#a99f88;margin-left:auto;font-style:italic}
.bk-wq-chk{font-size:14px;color:#332f26;margin:9px 0 2px}
.bk-wq-chk .o{color:#0E4A38;font-family:"Nanum Myeongjo",serif}.bk-wq-chk .x{color:#B0512F;font-family:"Nanum Myeongjo",serif}
.bk-wq-chk .sep{color:#cabf9f;margin:0 12px}
.bk-wq-mis,.bk-wq-key{font-size:13.2px;line-height:1.9;color:#4a4437;margin-top:7px!important;padding-left:14px!important;border-left:2px solid #C9A227}
.bk-wq-mis b{color:#B0512F;margin-right:4px}.bk-wq-key b{color:#0E4A38;margin-right:4px}
/* 원문 문제 이미지 슬롯(관리자 제공) */
.bk-wq-img{display:block;max-width:100%;margin:12px 0!important;border:1px solid #E3D6B5;border-radius:5px;background:#fff}
/* 동형문제 슬롯(관리자 제공) */
.bk-dh{margin:14px 0 2px!important;padding:14px 18px!important;border:1px dashed #B8912E;border-radius:7px;
  background:linear-gradient(180deg,#FDFBF2,#F6EEDA)}
.bk-dh-h{font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:15.5px;color:#0E4A38;margin-bottom:9px!important}
.bk-dh-h::before{content:"◈ ";color:#B8912E}
.bk-dh-stem{font-size:13.6px;line-height:1.95;color:#2f2b22;margin-bottom:9px!important}
.bk-dh-ch{font-size:13.3px;line-height:1.85;color:#332f26;padding-left:5px!important}
.bk-dh-re{display:flex;align-items:center;gap:14px;margin:11px 0 4px!important;padding-top:10px!important;border-top:1px dashed #d8cca6}
.bk-dh-sol{font-size:12.9px;line-height:1.9;color:#4a4437;margin-top:10px!important;padding-top:10px!important;border-top:1px solid #e6ddc8}
.bk-dh-sol b{color:#0E4A38;margin-right:3px}
.bk-dh-mis{margin-top:6px!important}.bk-dh-mis b{color:#B0512F}
.bk-wq-first{margin-left:auto;font-size:13px;color:#6b6456}
.bk-wq-first .x{color:#B0512F;font-family:"Nanum Myeongjo",serif}.bk-wq-first .o{color:#0E4A38;font-family:"Nanum Myeongjo",serif}
/* 보기에는 정답을 칠하지 않는다. 정답·해설은 문제 아래 `.bk-dh-rev` 블록에 따로 모아,
   먼저 풀어 본 뒤 눈을 내려 확인하게 한다(종이라 접을 수는 없으므로 선으로 가른다). */
.bk-dh-rev{margin-top:13px!important;padding-top:11px!important;border-top:1.5px dashed #c9a227}
.bk-dh-rev-h{font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:12.8px;color:#8a6d1f;
  letter-spacing:.04em;margin-bottom:7px!important}
.bk-dh-rev-h::before{content:"▾ "}
.bk-dh-ans{margin-top:0!important;font-size:13.5px;color:#332f26}.bk-dh-ans b{color:#0E4A38;font-family:"Nanum Myeongjo",serif;font-size:15px;margin-left:3px}
.bk-note{margin:9px 0!important;padding-bottom:12px!important;border-bottom:1px solid #cfc4ab;font-size:12.5px;color:#6f6758}
/* 정답·해설 항목: 박스(테두리/배경) 대신 흐르는 조판 — 테두리가 없어 페이지를 꽉 채우고 빈 공간을 없앤다.
   (테두리/배경이 있으면 pdfAtomics가 '통짜 블록'으로 잡아 다음 항목을 통째로 다음 페이지로 밀어 빈 공간이 생긴다) */
.bk-ans-card{margin:26px 0 0!important;padding:0!important;position:relative}
.bk-ans-card::before{content:"";display:block;width:58px;height:2px;border-radius:2px;background:linear-gradient(90deg,#C9A227,#8A6D1F);margin:0 0 13px!important}
.bk-ans-card h4{font-family:"Nanum Myeongjo",serif;font-size:18px;color:#0E4A38;margin-bottom:8px!important}
.bk-ans-card .sol{font-size:13px;line-height:1.9;color:#413c32}
.bk-ans-card .sol p{margin:5px 0!important}.bk-ans-card .sol h4{font-size:14px;margin-top:8px!important}
/* ── 화면용 부록 · 오답정리 (간단 학습 카드: 왜 틀렸나 + 동형문제·정답·해설 바로 표시) ── */
.wb{margin:24px 0 4px;border-top:3px solid var(--teal);padding-top:18px}
.wb-title{font-family:'Nanum Myeongjo',Georgia,serif;font-size:24px;color:var(--teal);margin:0 0 5px}
.wb-sub{font-size:13px;color:var(--muted);line-height:1.75;margin-bottom:14px}
.wb-sub b{color:var(--ink-2)}
.wb-loading,.wb-missing{border:1px dashed var(--line);border-radius:11px;padding:14px;color:var(--muted);font-size:13px;background:#fff}
.wb-card{background:#fff;border:1px solid var(--line);border-radius:14px;margin:14px 0;padding:18px;box-shadow:0 8px 24px -22px rgba(19,59,50,.7)}
.wb-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:11px;margin-bottom:12px}
.wb-qno{font-family:'Nanum Myeongjo',Georgia,serif;font-size:19px;font-weight:800;color:var(--teal)}
.wb-tag{font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--cream);color:var(--ink-2);font-weight:600}
.wb-first{margin-left:auto;font-size:12.5px;color:var(--ms)}
.wb-first b.x{color:#b0512f}.wb-first b.o{color:var(--teal)}
.wb-why{font-size:13px;line-height:1.7;color:var(--ink-2);background:#fff7f2;border-left:3px solid var(--ms);border-radius:0 8px 8px 0;padding:9px 12px;margin:0 0 10px}
.wb-why b{color:#b0512f;margin-right:4px}
.wb-fix{font-size:13px;line-height:1.75;color:var(--ink-2);background:#eef4f1;border-left:3px solid var(--teal);border-radius:0 8px 8px 0;padding:9px 12px;margin:0 0 12px}
.wb-fix b{color:var(--teal);margin-right:4px}
/* 또래 선택지 분포(누적 응시 기반 함정 분석) */
.wb-peer{margin:0 0 12px;border:1px solid #e6ddc8;border-radius:10px;background:#fcfaf3;padding:11px 13px}
.wb-peer-h{font-size:12.5px;font-weight:700;color:#8a6d1f;margin-bottom:8px}
.wb-peer-h span{font-weight:600;color:var(--muted);margin-left:7px}
.wb-orow{display:flex;align-items:center;gap:9px;margin:4px 0;font-size:12.5px}
.wb-orow .oc{flex:0 0 20px;color:var(--muted);font-weight:700}
.wb-orow .ob{flex:1;height:9px;background:#efece2;border-radius:5px;overflow:hidden}
.wb-orow .ob i{display:block;height:100%;background:#c9c2b0;border-radius:5px}
.wb-orow .op{flex:0 0 40px;text-align:right;color:var(--ink-2)}
.wb-orow.is-ans .oc,.wb-orow.is-ans .op{color:var(--teal);font-weight:700}
.wb-orow.is-ans .ob i{background:var(--teal)}
.wb-orow.is-trap .oc,.wb-orow.is-trap .op{color:#b0512f;font-weight:700}
.wb-orow.is-trap .ob i{background:var(--ms)}
.wb-peer-msg{margin-top:9px;font-size:12.5px;line-height:1.7;color:var(--ink-2)}
.wb-peer-msg b{color:#b0512f}
.wb-orig{margin:0 0 12px}
.wb-orig-h{font-size:12.5px;font-weight:700;color:var(--teal);margin-bottom:2px}
.wb-qimage{display:block;width:100%;height:auto;border:1px solid #e7e0d2;border-radius:8px;background:#fff;margin:9px 0}
.wb-img-fail{display:none;color:var(--ms);font-size:12.5px;padding:10px;border:1px dashed #d9b8a8;border-radius:8px}
.wb-dh{border:1px solid #e6ddc8;border-radius:11px;background:#fffdf7;padding:14px 15px}
.wb-dh-h{font-family:'Nanum Myeongjo',Georgia,serif;font-size:15px;font-weight:800;color:#8a6d1f;margin-bottom:9px}
.wb-dh-src{font-family:inherit;font-size:11.5px;font-weight:600;color:var(--muted);margin-left:8px;padding:2px 8px;border:1px solid var(--line);border-radius:999px;vertical-align:middle}
.wb-stem{font-size:13.5px;line-height:1.85;color:var(--ink)}
.wb-opts{list-style:none;margin:9px 0 0;padding:0}
.wb-opts li{display:flex;gap:8px;font-size:13.5px;line-height:1.7;color:var(--ink-2);padding:4px 8px;border-radius:7px}
.wb-opts li .ci{color:var(--muted);font-weight:700;flex:0 0 auto}
/* 눌러서 푸는 보기. 답을 고르게 하면 학생이 자기 판단을 한 번 걸고 넘어간다.
   한 번 고르면 바꿀 수 없다 — 눌러 보며 정답을 찾는 것은 푸는 것이 아니다. */
.wb-opts.is-live li{cursor:pointer;border:1px solid transparent;transition:background .12s,border-color .12s}
.wb-opts.is-live li:hover{background:var(--surface-2,#F6F1E7);border-color:var(--line)}
.wb-opts.is-live li:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
.wb-opts li.is-key{background:var(--ok-bg,#EAF4F0);border-color:#cfe3da}
.wb-opts li.is-key .ci{color:var(--teal)}
.wb-opts li.is-no{background:#FBECE8;border-color:#E8C7BD}
.wb-opts li.is-ok{font-weight:600}
.wb-verdict{margin-top:9px;font-size:13px;line-height:1.7;color:var(--ink-2)}
.wb-verdict b.ok{color:var(--teal);margin-right:4px}
.wb-verdict b.no{color:var(--ms);margin-right:4px}
.wb-verdict-why{margin-top:6px;padding:8px 11px;background:#FBECE8;border-left:3px solid #D99C88;
  border-radius:0 7px 7px 0;font-size:12.8px;color:#6B3A2B}
.wb-verdict-why b{color:var(--ms);margin-right:4px}
/* 보기에는 정답을 표시하지 않는다. 색칠된 보기가 먼저 눈에 들어오면 학생이 풀어 보지

<script>
/* ── 첫 화면 잠금 ──────────────────────────────────────────────────────
   이 페이지는 GitHub Pages 에 그대로 올라간다. 주소만 알면 아무나 들어와
   학생 이름과 점수를 볼 수 있어서, 들어올 때 코드를 한 번 묻는다.

   **이것은 암호가 아니다.** 소스 보기를 누르면 코드가 그대로 보인다. 지나가다
   눌러 보는 사람을 막는 문고리이지, 잠그는 자물쇠가 아니다. 이 페이지에
   진짜 비밀이 실려서는 안 된다는 뜻이다.

   학부모에게 보낸 성적표 링크(#r=…)는 묻지 않고 통과시킨다. 그 링크는
   주소 자체가 열쇠이고, 여기서 막으면 학부모가 못 본다.

   한 번 맞히면 이 브라우저에 기억해 둔다(90일). 지우려면 콘솔에서
   localStorage.removeItem('chemistreal:gate') 를 실행한다. */
(function () {
  var KEY = 'chemistreal:gate', CODE = '0000', DAYS = 90;
  function passed() {
    try {
      var v = localStorage.getItem(KEY);
      if (!v) return false;
      return (Date.now() - Number(v)) < DAYS * 864e5;
    } catch (e) { return false; }
  }
  // 학부모 성적표 링크는 그대로 열어 준다
  if (/[#&]r=/.test(location.hash) || passed()) return;

  var wrap = document.createElement('div');
  wrap.id = 'gate';
  wrap.innerHTML =
    '<div class="gate__box">' +
    '<div class="gate__logo">CHEMISTREAL</div>' +
    '<div class="gate__t">조준모 화학</div>' +
    '<div class="gate__s">이어서 보려면 코드를 입력하세요.</div>' +
    '<input class="gate__i" id="gateIn" type="tel" inputmode="numeric" maxlength="12" ' +
    'autocomplete="off" placeholder="････" aria-label="접속 코드">' +
    '<button class="gate__b" id="gateGo">들어가기</button>' +
    '<div class="gate__e" id="gateErr"></div></div>';
  var css = document.createElement('style');
  css.textContent =
    '#gate{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;' +
    'background:linear-gradient(160deg,#0E5A4C 0%,#0b3f36 55%,#08241f 100%);font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif}' +
    '.gate__box{width:min(320px,86vw);text-align:center;color:#F4F1E8}' +
    '.gate__logo{font-size:11.5px;letter-spacing:3px;opacity:.72;margin-bottom:14px}' +
    '.gate__t{font-size:25px;font-weight:800;letter-spacing:-.4px}' +
    '.gate__s{font-size:13px;opacity:.75;margin:7px 0 20px}' +
    '.gate__i{width:100%;box-sizing:border-box;padding:13px 14px;font-size:19px;text-align:center;' +
    'letter-spacing:7px;border:1px solid rgba(255,255,255,.28);border-radius:11px;' +
    'background:rgba(255,255,255,.08);color:#fff;outline:none}' +
    '.gate__i:focus{border-color:rgba(255,255,255,.6);background:rgba(255,255,255,.13)}' +
    '.gate__b{width:100%;margin-top:11px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;' +
    'border:0;border-radius:11px;background:#F4F1E8;color:#0E5A4C}' +
    '.gate__b:active{transform:translateY(1px)}' +
    '.gate__e{min-height:19px;margin-top:11px;font-size:13px;color:#F3B8A4}';
  document.head.appendChild(css);
  document.body.appendChild(wrap);
  document.documentElement.style.overflow = 'hidden';

  var input = document.getElementById('gateIn'), err = document.getElementById('gateErr');
  function open() {
    try { localStorage.setItem(KEY, String(Date.now())); } catch (e) {}
    wrap.remove(); document.documentElement.style.overflow = '';
  }
  function tryOpen() {
    if (input.value.trim() === CODE) { open(); return; }
    err.textContent = '코드가 맞지 않습니다.';
    input.value = ''; input.focus();
  }
  document.getElementById('gateGo').addEventListener('click', tryOpen);
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') tryOpen(); });
  input.addEventListener('input', function () { err.textContent = ''; });
  setTimeout(function () { try { input.focus(); } catch (e) {} }, 60);
})();
</script>

/* exams.json 이 최신이지만, 그 파일 하나가 늦게 온다고 앱 전체가 죽어서는 안 된다.
   실제로 배포 직후 CDN 전파 시차 때문에 성적표 링크로 들어온 학생이
   "시험 목록을 불러오지 못했습니다 · HTTP 404" 만 보고 끝난 일이 있었다.
   분리하기 전에는 이 파일이 자체 완결이라 없던 문제다. 세 겹으로 받는다.
     1) exams.json (짧게 두 번까지 다시 시도)
     2) 서비스워커가 캐시해 둔 것
     3) 이 파일에 심어 둔 예비본 FALLBACK_EXAMS
   예비본은 손으로 관리하는 사본이 아니다. tools/gen_exam_fallback.py 가
   exams.json 에서 심고 CI 가 매번 대조하므로 갈라질 수 없다. */
async function loadExams(){
  for(var attempt=0;attempt<2;attempt++){
    try{
      var res=await fetch('exams.json',{cache:'no-store'});
      if(res.ok){
        var list=await res.json();
        if(Array.isArray(list)&&list.length) return list;
      }
    }catch(e){}
    if(attempt===0) await new Promise(function(r){ setTimeout(r,600); });
  }
  try{
    if(window.caches){
      var hit=await caches.match('exams.json');
      if(!hit) hit=await caches.match(new URL('exams.json',location.href).pathname);
      if(hit){ var cached=await hit.json();
        if(Array.isArray(cached)&&cached.length){ console.warn('[exams] 캐시본 사용'); return cached; } }
    }
  }catch(e){}
  // const 로 선언한 것은 window 에 붙지 않으므로 이름으로 직접 본다.
  if(typeof FALLBACK_EXAMS!=='undefined'&&Array.isArray(FALLBACK_EXAMS)&&FALLBACK_EXAMS.length){
    console.warn('[exams] exams.json 을 받지 못해 예비본으로 진행');
    return FALLBACK_EXAMS.slice();
  }
  return null;
}

/* ── 이름을 다듬는 한 곳 ────────────────────────────────────────────
   '박 하람' 과 '박하람' 은 한 사람이다. 그런데 앱은 이름을 **적힌 그대로**
   열쇠로 써서 둘을 남남으로 봤다 — 명단이 두 줄이 되고, 성적표 회차가
   갈라지고, 또래 인원이 한 명 더 늘었다. 시트 쪽은 이미 공백을 지우고
   견주고 있었으니(_normName) 앱만 다르게 세고 있었던 셈이다.

   이제 **저장할 때 공백을 지운다.** 견줄 때도 지우고 견준다. 한글 이름에
   띄어쓰기가 뜻을 갖는 경우는 없다 — 붙여 쓰는 것이 표준 표기다.

   아래 tidyNames 가 이 함수를 쓰므로 **그보다 먼저** 있어야 한다. const 는
   끌어올려지지 않아서, 뒤에 두면 그 정리가 조용히 아무것도 안 한다. */
const nameKey=s=>String(s==null?'':s).replace(/\s+/g,'').trim();
const accSet=(e,q)=>(e.multi&&e.multi[q])?e.multi[q]:[e.key[q-1]];
/* ── 전원정답 문항 ────────────────────────────────────────────────────
   삭제·취소된 문항, 그리고 보기 넷을 모두 인정하는 문항이다. 이런 문항은
   **답을 쓰지 않아도 맞은 것으로 센다.** 답안지에 아무것도 없으니 답을
   요구하면 전원정답이 전원오답이 된다.

   빼지 않고 더한다. 예전에는 miss 를 분모에서 통째로 빼서 60문항짜리가
   59문항이 되었는데, 시험은 60문항으로 치렀고 삭제된 문항도 모두가 맞은
   것으로 처리하는 것이 채점의 관례다. 분모는 문항 수 그대로 둔다. */
const allc=(e,q)=>{
  if(e&&e.miss&&e.miss.indexOf(q)>=0) return true;
  const m=e&&e.multi&&e.multi[q];
  if(m&&m.length>=4) return true;
  /* 정답이 X 로 적힌 문항 — 정답키 자리가 비어 있다. 답이 정해지지 않은
     문항을 오답으로 셀 수는 없으므로 전원정답으로 본다.

     정답키 **배열이 통째로 없는** 것은 다른 이야기다. 그건 아직 안 들어온
     데이터이지 전원정답이 아니다 — 그렇게 세면 회차 하나가 통째로 만점이
     된다. 배열이 있고 그 자리가 비었을 때만 본다. */
  if(!e||!e.key||!e.key.length||q<1||q>e.key.length) return false;
  const k=e.key[q-1];
  return k===0||k===''||k==null||k==='X'||k==='x';
};
const allcSet=e=>{ const s=new Set((e&&e.miss)||[]);
  if(e&&e.multi) for(const q in e.multi){ if((e.multi[q]||[]).length>=4) s.add(+q); }
  const n=(e&&(e.nQ||(e.key&&e.key.length)))|0;
  for(let q=1;q<=n;q++) if(allc(e,q)) s.add(q);
  return s; };
const okq=(e,q,a)=>allc(e,q)||accSet(e,q).indexOf(a)>=0;
const ansLabel=(e,q)=>{const s=accSet(e,q);return s.length>=4?'전원정답':s.map(x=>CIRC[x]).join('·');};
/* ── 같은 시험이 두 ID 로 등록된 쌍: 또래 통계를 한 곳에 모은다 ──────────────
   화올 2018·2019·2024 와 KMChC 2018·2019·2024 제1차는 같은 시험이 두 번 등록된
   것이다(문항 크롭 이미지까지 바이트 단위로 같다). 문항 수·정답·복수정답·제외
   문항·수상 컷이 모두 같아 채점 규칙이 완전히 일치하므로 응시 기록을 합쳐도 된다.

   합치지 않으면 응시가 두 풀로 갈린다. 각 풀이 MINP(8명)를 못 넘기면 또래 정답률·
   선택 분포·함정 분석·백분위가 **아예 나오지 않는다**. 12명이 6/6 으로 갈리면 양쪽
   다 통계가 없는데, 합치면 12명으로 전부 나온다.

   문항 내용(crops·answers·donghyung)은 ID 별로 그대로 둔다. 두 ID 의 동형문제를
   일부러 다르게 집필해 두었으므로, 학생은 같은 시험을 서로 다른 두 벌의 연습
   문제로 복습할 수 있다. */
const COHORT_ALIAS={'kmchc-2018':'hwol-2018','kmchc-2019':'hwol-2019','kmchc-2024-1':'hwol-2024'};
const cohortKey=id=>COHORT_ALIAS[id]||id;
function subs(id){try{return JSON.parse(localStorage.getItem(PFX+cohortKey(id))||'[]')}catch(e){return[]}}
function saveSubs(id,a){try{localStorage.setItem(PFX+cohortKey(id),JSON.stringify(a))}catch(e){}}
/* 별칭 키에 이미 쌓여 있던 기록을 대표 키로 옮긴다(한 번만 돌면 된다).
   같은 응시가 양쪽에 있을 수 있으므로 답안+시각으로 중복을 거른다. */
(function mergeAliasRosters(){
  try{
    for(var from in COHORT_ALIAS){
      var raw=localStorage.getItem(PFX+from); if(!raw) continue;
      var old=JSON.parse(raw)||[], to=COHORT_ALIAS[from];
      var dst=JSON.parse(localStorage.getItem(PFX+to)||'[]')||[], seen={};
      dst.forEach(function(r){ seen[(r.ans||[]).join('')+'|'+(r.ts||'')]=1; });
      old.forEach(function(r){ var k=(r.ans||[]).join('')+'|'+(r.ts||''); if(!seen[k]){ dst.push(r); seen[k]=1; } });
      dst.sort(function(x,y){ return (x.ts||0)-(y.ts||0); });
      localStorage.setItem(PFX+to,JSON.stringify(dst));
      localStorage.removeItem(PFX+from);
    }
  }catch(e){}
})();

/* ── 이미 쌓여 있는 이름을 한 번 다듬는다 ───────────────────────────────
   규칙만 바꾸면 앞으로 저장되는 것만 합쳐진다. 지금까지 '박 하람' 으로
   쌓인 회차는 그대로 갈라져 있다. 한 번 돌면서 이름을 다듬고, 그 바람에
   같아진 기록(이름+답안이 같다)은 최근 것만 남긴다.

   답안이 다르면 다시 푼 것이므로 따로 둔다 — 채점 규칙(subSig)과 같다.

   별칭 이관(mergeAliasRosters) **뒤에** 돈다. 옮겨 온 기록도 함께 다듬어야
   한다 — 앞에 두면 옮겨 온 것만 옛 이름으로 남는다. */
(function tidyNames(){
  try{
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i); if(!k||k.indexOf(PFX)!==0) continue;
      var arr; try{ arr=JSON.parse(localStorage.getItem(k)||'[]'); }catch(e){ continue; }
      if(!Array.isArray(arr)||!arr.length) continue;
      var changed=false, keep=[], seen={};
      arr.forEach(function(r){
        if(!r) return;
        var fixed=nameKey(r.name);
        if(fixed!==String(r.name||'')){ r.name=fixed; changed=true; }
        var sig=subSig(r), at=seen[sig];
        if(at==null){ seen[sig]=keep.length; keep.push(r); return; }
        changed=true;
        var old=keep[at];
        /* 같은 응시가 둘로 있었다. 최근 것을 남기되 학교·학년은 채워 둔다. */
        var win=((r.ts||0)>=(old.ts||0))?r:old, lose=(win===r)?old:r;
        if(!win.school&&lose.school) win.school=lose.school;
        if(!win.grade&&lose.grade) win.grade=lose.grade;
        keep[at]=win;
      });
      if(changed){ keep.sort(function(x,y){ return (x.ts||0)-(y.ts||0); });
        try{ localStorage.setItem(k,JSON.stringify(keep)); }catch(e){} }
    }
  }catch(e){}
})();

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function award(W,cut){let idx=cut.findIndex(c=>W<=c);const inA=idx!==-1;if(!inA)idx=5;const name=inA?TIERS[idx]:'수상권 밖';
  let nextTier=null,gap=null,reach=false;if(idx>0){const n=inA?idx-1:4;nextTier=TIERS[n];gap=W-cut[n];reach=gap>=1&&gap<=2;}return{name,idx,inA,nextTier,gap,reach};}
function pcolor(p){return p<50?'#C0603A':(p<80?'#B08D57':'#3A7A6B');}

function qbankAudit(){
  const known=new Set(Object.keys(RX).concat(Object.keys(RXMAP)).concat(['기타']));
  const issues=[]; const add=(id,lv,m)=>issues.push({id:id,lv:lv,m:m}); const seen={};
  FINAL_EXAMS.forEach(e=>{
    if(seen[e.id]) add(e.id,'err','시험 ID 중복'); seen[e.id]=1;
    const nQ=e.nQ;
    if(!(nQ>0)) add(e.id,'err','nQ 비정상: '+nQ);
    if(!e.title) add(e.id,'warn','제목(title) 누락');
    if(!e.key||e.key.length!==nQ){ add(e.id,'err','정답키 길이 불일치 ('+(e.key?e.key.length:'없음')+' / 문항 '+nQ+')'); }
    else { e.key.forEach((k,idx)=>{ if([0,1,2,3,4].indexOf(k)<0) add(e.id,'err','문항 '+(idx+1)+' 정답키 범위 이탈: '+k); });
      const ac=allcSet(e); const multi=e.multi||{};
      e.key.forEach((k,idx)=>{ const q=idx+1; if(k===0 && !ac.has(q) && !(q in multi)) add(e.id,'warn','문항 '+q+' 정답키 0인데 전원정답·복수정답 미연동'); }); }
    if(e.area){ if(e.area.length!==nQ) add(e.id,'err','area 길이 불일치 ('+e.area.length+' / 문항 '+nQ+')');
      else e.area.forEach((a,idx)=>{ if(a && !known.has(a)) add(e.id,'warn','문항 '+(idx+1)+' area 미등록 태그: '+a); }); }
    if(e.type && e.type.length!==nQ) add(e.id,'err','type 길이 불일치 ('+e.type.length+' / 문항 '+nQ+')');
    (e.miss||[]).forEach(q=>{ if(q<1||q>nQ) add(e.id,'err','전원정답 문항 범위 이탈: '+q); });
    const mc={}; (e.miss||[]).forEach(q=>{ if(mc[q]) add(e.id,'warn','전원정답 중복: '+q); mc[q]=1; });
    Object.keys(e.multi||{}).forEach(qs=>{ const q=+qs; if(q<1||q>nQ) add(e.id,'err','복수정답 문항 범위 이탈: '+qs);
      const opts=e.multi[qs]; if(!Array.isArray(opts)||!opts.length) add(e.id,'err','복수정답 문항 '+qs+' 보기 배열 비정상');
      else opts.forEach(o=>{ if([1,2,3,4].indexOf(o)<0) add(e.id,'err','복수정답 문항 '+qs+' 보기 값 이탈: '+o); }); });
    if(!e.cut||e.cut.length!==5){ add(e.id,'err','등급컷 길이 비정상 (5 기대, '+(e.cut?e.cut.length:'없음')+')'); }
    else { if(e.cut[0]!==0) add(e.id,'warn','등급컷 첫 값 0 아님: '+e.cut[0]);
      for(let j=1;j<e.cut.length;j++){ if(e.cut[j]<e.cut[j-1]){ add(e.id,'err','등급컷 비단조: '+e.cut.join(',')); break; } } }
  });
  return issues;
}
function qbankStats(){
  const ex=FINAL_EXAMS, total=ex.reduce((s,e)=>s+e.nQ,0), grp={};
  ex.forEach(e=>{ const g=e.group||'(미분류)'; grp[g]=(grp[g]||0)+1; });
  const withArea=ex.filter(e=>e.area).length, withType=ex.filter(e=>e.type).length, withPdf=ex.filter(e=>e.pdf).length;
  const broad=a=>RX[a]?a:(RXMAP[a]||a), dom={};
  ex.forEach(e=>(e.area||[]).forEach(a=>{ if(a){ const b=broad(a); dom[b]=(dom[b]||0)+1; } }));
  return {nExam:ex.length,total:total,grp:grp,withArea:withArea,withType:withType,withPdf:withPdf,dom:dom};
}
function showExamQ(id){
  const e=FINAL_EXAMS.find(x=>x.id===id); if(!e)return; const ac=allcSet(e); const multi=e.multi||{};
  let rows='';
  for(let q=1;q<=e.nQ;q++){ const flag=ac.has(q)?'<span class="pill">전원정답</span>':((q in multi)?'<span class="pill">복수 '+multi[q].join('')+'</span>':'');
    rows+=`<tr><td class="mono">${q}</td><td class="mono">${e.key?e.key[q-1]:'?'}</td><td>${e.area?esc(e.area[q-1]||''):'<span class="muted">·</span>'}</td><td>${e.type?esc(e.type[q-1]||''):'<span class="muted">·</span>'}</td><td>${flag}</td></tr>`; }
  const el=document.getElementById('qbdetail'); if(el) el.innerHTML=`<div style="overflow-x:auto;-webkit-overflow-scrolling:touch"><table class="gtbl"><thead><tr><th scope="col">문항</th><th scope="col">정답</th><th scope="col">area</th><th scope="col">type</th><th scope="col">비고</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
/* ══════════════════════════════════════════════════════════════════════
   명단 관리 (#roster)
   ----------------------------------------------------------------------
   이름을 잘못 입력했을 때 고칠 방법이 없었다. 그런데 이름이 틀리면 그
   학생의 기록이 **둘로 갈라진다** — 성장 추적·숙달 추적·되풀이되는 오개념은
   전부 이름이 같은지로 같은 학생을 잇기 때문이다. 한 글자 오타 하나에
   지난 회차가 통째로 안 보인다.

   여기서 할 수 있는 것: 이름 일괄 고치기(전 회차) · 회차별 기록 수정·삭제 ·
   비슷한 이름 찾아 합치기 · 백업 내보내기/가져오기.

   기록은 이 브라우저에만 있다(localStorage). 브라우저를 지우면 사라지므로
   가끔 내보내 두는 편이 좋다.
   ══════════════════════════════════════════════════════════════════════ */
/* 누가 같은 학생인가.
   **이름·학교·학년이 모두 같아야 같은 학생**이다(선생님이 정한 규칙).
   이름만 있고 학교·학년이 비어 있으면 다른 사람으로 센다 — 실제로 동명이인이
   있고, 학교·학년이 그 둘을 가르는 유일한 단서다. */
function rosterKey(r){
  return [nameKey(r.name)||'(이름 없음)', (r.school||'').trim(), (r.grade||'').trim()].join('\u0001');
}
function rosterLabel(key){
  var p=String(key).split('\u0001');
  var tail=[p[1], p[2]?p[2]+'학년':''].filter(Boolean).join(' ');
  return {name:p[0], where:tail, full:p[0]+(tail?' · '+tail:'')};
}
function rosterIndex(){
  var by={}, done={};
  FINAL_EXAMS.forEach(function(e){
    var k=cohortKey(e.id); if(done[k]) return; done[k]=1;
    subs(e.id).forEach(function(r,i){
      var key=rosterKey(r);
      (by[key]=by[key]||[]).push({exam:e,idx:i,rec:r});
    });
  });
  return by;
}
/* 같은 시험에서 이름과 답안이 같은 기록은 같은 응시다. 채점을 두 번 하면
   그만큼 쌓였다(그 버그는 고쳤지만 이미 쌓인 것은 남아 있다).
   무엇이 겹쳤는지 세기만 하고, 지우는 것은 부르는 쪽이 정한다. */
function rosterDupes(){
  var out=[], done={};
  FINAL_EXAMS.forEach(function(e){
    var k=cohortKey(e.id); if(done[k]) return; done[k]=1;
    var arr=subs(e.id), byS={};
    arr.forEach(function(r,i){ (byS[subSig(r)]=byS[subSig(r)]||[]).push(i); });
    for(var sig in byS) if(byS[sig].length>1)
      out.push({exam:e, idxs:byS[sig], name:(arr[byS[sig][0]].name||'').trim(), extra:byS[sig].length-1});
  });
  return out;
}
function rosterDedupe(){
  var groups=rosterDupes();
  if(!groups.length){ fToast('겹치는 기록이 없습니다'); return; }
  var extra=groups.reduce(function(a,g){ return a+g.extra; },0);
  var head=groups.slice(0,6).map(function(g){
    return '· '+g.name+' — '+g.exam.title+' ('+(g.extra+1)+'줄)'; }).join('\n');
  if(!confirm('같은 응시가 여러 줄로 쌓인 곳 '+groups.length+'군데, 지울 줄 '+extra+'개입니다.\n\n'
     +head+(groups.length>6?('\n· …외 '+(groups.length-6)+'군데'):'')
     +'\n\n각 묶음에서 한 줄만 남깁니다(학교·학년이 적힌 쪽 우선).\n'
     +'구글 시트도 같이 정리합니다. 되돌릴 수 없으니 필요하면 먼저 백업을 받으세요.')) return;
  var removed=0, done={};
  FINAL_EXAMS.forEach(function(e){
    var k=cohortKey(e.id); if(done[k]) return; done[k]=1;
    var arr=subs(e.id), byS={}, keep={};
    arr.forEach(function(r,i){ (byS[subSig(r)]=byS[subSig(r)]||[]).push(i); });
    var hit=false;
    for(var sig in byS){
      var idxs=byS[sig];
      // 학교·학년이 적힌 줄을 살린다. 없으면 가장 먼저 들어온 줄.
      var best=idxs.slice().sort(function(x,y){
        var rx=arr[x], ry=arr[y];
        var fx=((rx.school||'')?1:0)+((rx.grade||'')?1:0), fy=((ry.school||'')?1:0)+((ry.grade||'')?1:0);
        return fy-fx || (rx.ts||0)-(ry.ts||0);
      })[0];
      keep[best]=1;
      if(idxs.length>1) hit=true;
    }
    if(!hit) return;
    var left=arr.filter(function(r,i){ return keep[i]; });
    removed+=arr.length-left.length; saveSubs(e.id,left);
  });
  fToast('겹친 기록 '+removed+'줄을 정리했습니다'); renderRoster();
  if(removed) sheetCall({action:'dedupe'},function(res){ sheetEditToast(res,'정리했습니다'); });
}
// 한 글자 차이까지 본다. 두 글자 이상 다르면 다른 사람일 가능성이 크다.
function editDist(a,b){
  var m=a.length,n=b.length; if(Math.abs(m-n)>1) return 9;
  var prev=[],curr=[],i,j; for(j=0;j<=n;j++) prev[j]=j;
  for(i=1;i<=m;i++){ curr[0]=i;
    for(j=1;j<=n;j++) curr[j]=Math.min(prev[j]+1,curr[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=curr.slice(); }
  return prev[n];
}
/* 같은 사람일 법한 두 줄을 찾는다. 셋을 본다.
   1) 이름은 같은데 한쪽만 학교·학년이 비어 있다 — 시트에서 받아온 줄이
      대개 이렇다. 가장 흔하고 가장 확실한 경우다.
   2) 띄어쓰기만 다르다   3) 한 글자만 다르다 */
function nameSuspects(keys){
  var out=[];
  for(var i=0;i<keys.length&&out.length<20;i++) for(var j=i+1;j<keys.length&&out.length<20;j++){
    var A=rosterLabel(keys[i]), B=rosterLabel(keys[j]);
    if(A.name==='(이름 없음)'||B.name==='(이름 없음)') continue;
    if(A.name===B.name){
      if(!A.where!==!B.where){ out.push({ia:i,ib:j,why:'학교·학년만 비어 있음'}); continue; }
      if(A.where!==B.where) continue;          // 학교·학년이 서로 다르면 다른 사람이다
      continue;
    }
    // 이름이 다르면, 학교·학년이 어긋나는 짝은 굳이 짚지 않는다
    if(A.where&&B.where&&A.where!==B.where) continue;
    var x=A.name.replace(/\s+/g,''), y=B.name.replace(/\s+/g,'');
    if(x===y){ out.push({ia:i,ib:j,why:'띄어쓰기만 다름'}); continue; }
    if(x.length>=2&&y.length>=2&&editDist(x,y)===1) out.push({ia:i,ib:j,why:'한 글자 다름'});
  }
  return out;
}
/* 아래 동작들은 이름이 아니라 **정체성 열쇠**(이름+학교+학년)로 움직인다.
   같은 이름이라도 학교·학년이 다르면 다른 사람이라 함께 바뀌면 안 된다. */
function rosterRenameAt(i){ var k=(window.__rnames||[])[i]; if(k) rosterRename(k); }
function rosterMergeAt(i,j){ var a=(window.__rnames||[])[i], b=(window.__rnames||[])[j]; if(a&&b) rosterMerge(a,b); }
function rosterDelNameAt(i){ var k=(window.__rnames||[])[i]; if(k) rosterDelName(k); }
// 이 열쇠에 해당하는 기록만 골라 바꾼다. 반환값은 손댄 건수.
function rosterApply(key, fn){
  var n=0, done={};
  FINAL_EXAMS.forEach(function(e){
    var ck=cohortKey(e.id); if(done[ck]) return; done[ck]=1;
    var arr=subs(e.id), hit=false;
    arr.forEach(function(r){ if(rosterKey(r)===key){ fn(r); hit=true; n++; } });
    if(hit) saveSubs(e.id,arr);
  });
  return n;
}
function rosterRename(key){

  fToast(n?('"'+L.name+'" → "'+to+'" · '+n+'건 고쳤습니다'):'바뀐 기록이 없습니다');

/* 두 줄을 한 사람으로 합친다. 받는 쪽의 이름·학교·학년을 그대로 따라간다 —

     +'앞쪽 기록을 "'+B.full+'" 로 옮깁니다.')) return;

  var n=rosterApply(a,function(r){ r.name=p[0]; r.school=p[1]; r.grade=p[2]; });
  if(n && A.name!==B.name) noteRename(A.name,B.name);

    sheetCall({action:'rename',from:A.name,to:B.name},function(res){ sheetEditToast(res,'고쳤습니다'); });
}

function rosterImport(){
  var inp=document.createElement('input'); inp.type='file'; inp.accept='application/json,.json';
  inp.onchange=function(){
    var f=inp.files&&inp.files[0]; if(!f) return;
    var fr=new FileReader();
    fr.onload=function(){
      var data; try{ data=JSON.parse(fr.result); }catch(e){ fToast('읽지 못했습니다 — 내보낸 파일이 맞나요?'); return; }
      if(!data||!data.rosters){ fToast('명단 백업 파일이 아닙니다'); return; }
      var ids=Object.keys(data.rosters);
      if(!confirm('시험 '+ids.length+'개분을 합칩니다.\n지금 기록은 지우지 않고, 없는 것만 더합니다.')) return;
      var added=0;
      ids.forEach(function(id){
        var arr=subs(id), seen={};
        arr.forEach(function(r){ seen[subSig(r)]=1; });
        (data.rosters[id]||[]).forEach(function(r){
          var sig=subSig(r); if(seen[sig]) return; seen[sig]=1; arr.push(r); added++; });
        arr.sort(function(x,y){ return (x.ts||0)-(y.ts||0); });
        saveSubs(id,arr);
      });
      try{ var m=renameMap(); for(var k in (data.renames||{})) if(!m[k]) m[k]=data.renames[k];
        localStorage.setItem(RENAME_KEY,JSON.stringify(m)); }catch(e){}
      fToast('새 기록 '+added+'건을 더했습니다'); renderRoster();
    };
    fr.readAsText(f);
  };
  inp.click();
}

/* 한 학생은 한 명으로 센다.
   같은 학생을 두 번 채점하면(오타를 고치고 다시 채점하는 일이 흔하다) 답안이
   조금이라도 다르면 기록이 두 줄 남는다. 통계가 그 둘을 각각 세면 또래 인원이
   부풀고, 시트는 학생별 최신 1건만 세므로 **화면 14명 · 문자 13명**이 된다.
   같은 학생인지는 이름·학교·학년으로 본다(rosterKey — 선생님이 정한 규칙,
   시트의 _whoKey 와 같다). 여러 벌이면 가장 최근 것을 남긴다. */
function latestPerStudent(arr){
  var by={}, order=[];
  arr.forEach(function(r){
    var k=rosterKey(r);
    if(!(k in by)){ by[k]=r; order.push(k); return; }
    if((r.ts||0)>=(by[k].ts||0)) by[k]=r;
  });
  return order.map(function(k){ return by[k]; });
}
function cleanCohort(exam,arr){
  const clean=[], flagged=[]; const seen=new Set();
  arr.forEach(r=>{ const ans=r.ans; let bad=null;
    const cnt=[0,0,0,0]; let answered=0;
    ans.forEach(a=>{if(a>=1&&a<=4){cnt[a-1]++;answered++;}});
    if(answered>=10 && Math.max(cnt[0],cnt[1],cnt[2],cnt[3])/answered>=0.85) bad='단일 보기 반복';
    const key=ans.join(',');
    if(!bad && seen.has(key)) bad='답안 패턴 복제';
    seen.add(key);
    if(bad) flagged.push({rec:r,reason:bad}); else clean.push(r); });
  return {clean, flagged};
}
/* ── 석차의 모집단 ──────────────────────────────────────────────────────
   석차·백분위는 그때까지 **이 브라우저에 채점해 둔 학생 수**를 모집단으로
   삼았다. 그래서 같은 시험인데 학생마다 숫자가 달랐다 — 먼저 채점한 학생은
   3/9, 나중에 채점한 학생은 8/10, 8명이 되기 전에 본 학생은 아예 석차가
   없었다. 모집단이 "지금까지 내가 채점한 만큼"이면 석차는 뜻을 잃는다.

   한 회차를 실제로 응시한 사람은 성적표 엑셀에 다 들어 있다. 그 점수 분포를
   `cohort/baseline.json` 에 담아 두고 모집단으로 쓴다. 누구를 먼저 채점하든
   같은 숫자가 나오고, 첫 학생부터 석차가 나온다.

   담긴 것은 히스토그램뿐이다(몇 점을 몇 명). 이름도 학교도 없다.

   이 브라우저 기록과 **더한다.** 처음에는 두 번 세어질까 봐 기준표로
   대신했는데, 엑셀에 든 사람과 지금 채점하는 사람이 전혀 다른 학생들이라고
   하셨다. 겹치지 않으면 더하는 것이 맞다 — 대신하면 새 학생이 모집단에서
   통째로 빠진다. 기준표가 없는 시험은 예전대로 이 브라우저 기록만 쓴다.

   그래서 분모는 채점을 진행하는 동안 늘어난다(11 → 12 → 13 …). 화면은 열 때마다
   다시 그리므로 전원 채점을 마친 뒤 열면 모두 같은 숫자를 본다. 하지만 공유
   링크와 Word 는 **만든 시점**의 인원이 박힌다. 전원 채점 후에 만들어야 한다. */
var BASELINE=null;
async function loadBaseline(){
  try{ var r=await fetch('cohort/baseline.json',{cache:'no-cache'});
    if(r.ok){ var j=await r.json(); if(j&&j.exams) BASELINE=j.exams; } }catch(e){}

}
const LEC={"원자모형": {"s": "원자모형의 핵심은 '에너지의 양자화'다. 전자는 아무 에너지나 가질 수 없고 허용된 준위에만 존재한다. 수소꼴(전자 1개) 이온은 En=-13.6Z²/n² eV로 정확히 풀리며, 음(-) 부호는 속박 상태를, n→∞에서 0이 됨은 이온화 경계를 뜻한다. 전자가 높은 n에서 낮은 n으로 떨어지면 두 준위 차만큼의 광자를 내놓고(방출) 흡수는 그 반대다. 그래서 선 스펙트럼의 파장 하나하나가 특정 전이를 가리킨다 — 라이먼(→n=1, 자외선)·발머(→n=2, 가시)·파셴(→n=3, 적외). 여기서 자주 무너지는 지점: 에너지와 진동수는 비례(E=hν), 진동수와 파장은 반비례(c=λν)이므로 '에너지 큰 전이=짧은 파장=큰 진동수'를 한 줄로 꿰어야 한다. 다전자 원자에서는 전자-전자 반발과 안쪽 전자의 가림(shielding) 때문에 같은 n이라도 s<p<d로 갈라진다. 전자배치는 네 양자수(n, l, ml, ms)로 규정되며 l은 0~n-1, ml은 -l~+l, ms는 ±1/2만 허용된다 — 이 범위를 어기는 보기가 단골 오답이다. 배치 규칙은 셋: 파울리(한 오비탈에 반대 스핀 2개까지)·훈트(축퇴 오비탈은 홀전자부터)·쌓음(낮은 에너지부터). 셋을 모두 지키면 바닥상태, 하나라도 어기면 들뜬상태다. 이 모든 양자 개념의 출발점은 빛의 입자성(광전효과: 세기가 아니라 문턱 진동수 이상이라야 전자 방출)과 물질의 파동성(드브로이 λ=h/p)이다.", "u": "lec-001-atomic-structure-isotopes.html"}, "주기율": {"s": "주기성을 지배하는 단 하나의 변수는 유효 핵전하(Zeff)다. 전자가 실제로 느끼는 핵의 끌림으로, '양성자수 - 안쪽 전자의 가림'으로 어림한다. 같은 주기에서 오른쪽으로 갈수록 양성자는 늘지만 전자는 같은 껍질에 들어가 가림이 거의 안 늘어 Zeff가 커진다 → 반지름은 줄고 이온화에너지·전기음성도는 커진다. 같은 족에서 아래로 가면 껍질이 늘어 바깥 전자가 멀어지므로 반지름은 커지고 이온화에너지는 작아진다. 여기서 학생이 놓치는 두 예외가 급소다. 첫째 2족>13족 역전(Be>B): 13족의 첫 전자는 에너지가 높은 p 오비탈에 있어 떼기 쉽다. 둘째 15족>16족 역전(N>O): 15족은 p 오비탈이 반쯤 찬 안정 배치라, 16족에서 처음 짝지어진 전자를 떼는 쪽이 오히려 쉽다. '경향을 외우되 두 예외에서 갈린다'가 출제 포인트다. 강력한 도구가 순차 이온화에너지다. IE1, IE2, … 를 차례로 떼다 보면 값이 급격히 점프하는 지점이 있는데, 그 직전까지가 원자가전자 수다 — 즉 급증 지점이 족을 알려 준다(IE3에서 점프 = 원자가전자 2개 = 2족). 이온 반지름은 등전자 비교가 단골인데, 전자 수가 같으면 양성자수가 많을수록 핵이 더 세게 당겨 반지름이 작아진다(예: O²⁻>F⁻>Na⁺>Mg²⁺).", "u": "lec-011-periodic-table-structure.html"}, "분자의모양": {"s": "분자의 모양은 'VSEPR' 한 원리에서 거의 다 나온다: 중심원자 주위의 전자영역(결합쌍이든 고립쌍이든)은 서로의 반발을 피해 최대한 멀어진다. 먼저 전자영역의 '수'가 기본 골격을 정한다 — 2개 직선(180°)·3개 평면삼각(120°)·4개 사면체(109.5°)·5개 삼방양뿔·6개 팔면체. 그다음 고립쌍이 모양을 깎는다. 고립쌍은 핵에 묶이지 않아 더 퍼져 결합쌍을 강하게 밀어내므로, 같은 전자영역 수라도 고립쌍이 있으면 결합각이 줄고 실제 모양이 달라진다. CH₄·NH₃·H₂O는 모두 전자영역 4개(사면체 골격)지만 고립쌍이 0·1·2개로 늘면서 결합각이 109.5°>107°>104.5°로 줄고 모양은 정사면체→삼각뿔→굽은형으로 바뀐다 — 이 비교가 가장 자주 나온다. 흔한 오개념: '전자영역 수'와 '결합한 원자 수'를 혼동하는 것. 모양을 정하는 건 고립쌍을 포함한 전자영역이지 결합 원자 수가 아니다. 혼성도 같은 논리로 따라온다 — 전자영역 2·3·4·5·6개가 각각 sp·sp²·sp³·sp³d·sp³d²에 대응한다(혼성은 모양의 결과이지 원인이 아니라고 보면 헷갈리지 않는다). 다중결합은 전자영역 하나로 센다는 점도 놓치기 쉽다.", "u": "lec-018-octet-lewis.html"}, "분자간인력": {"s": "끓는점·녹는점·점도·증기압 — 분자성 물질의 물리적 성질은 거의 다 '분자 사이를 잡아당기는 힘(분자간 인력)'의 세기로 결정된다. 세기의 서열을 몸에 익히는 것이 출발점이다: 이온결합 > 이온-쌍극자 > 수소결합 > 쌍극자-쌍극자 > 분산력. 분산력(런던 힘)은 모든 분자에 있고 순간 쌍극자에서 나오며 전자가 많을수록(대개 분자량이 클수록) 커진다. 그래서 무극성 분자끼리는 분자량이 큰 쪽이 끓는점이 높다(He<Ne<Ar<Kr<Xe). 수소결합은 특별 취급한다 — F·O·N에 직접 결합한 H가 옆 분자의 F·O·N 고립쌍과 맺는 강한 인력으로, 같은 족에서 H₂O·NH₃·HF의 끓는점이 분자량 경향을 거슬러 유난히 높은 이유다. 단골 함정: 분자량만 보고 순서를 매기는 것. H₂O는 16족에서 분자량이 가장 작은데도 수소결합 때문에 끓는점이 가장 높다(H₂S<H₂Se<H₂Te≪H₂O). 점도·표면장력도 같은 원리로, -OH가 많은 분자일수록 수소결합이 촘촘해 점도가 크다. 성질 문제를 만나면 '어떤 인력이 지배하는가'를 먼저 묻고, 수소결합 여부 → 극성(쌍극자) 여부 → 분자량(분산력) 순으로 따지면 거의 틀리지 않는다.", "u": "lec-028-imf-overview.html"}, "몰과양적관계": {"s": "화학의 정량은 전부 '몰'이라는 다리를 건넌다. 질량(g)·입자수(개)·기체 부피(L)는 서로 직접 비례하지 않지만, 모두 몰로 환산하면 연결된다 — 몰=질량/몰질량=입자수/아보가드로수(6.02×10²³)=기체부피/22.4L(0°C, 1atm). 반응의 양적 관계에서 가장 중요한 원칙은 '계수비=몰비'다. 화학반응식의 계수는 분자(또는 몰)의 개수비이지 질량비가 아니다. 그래서 질량으로 바로 비례식을 세우면 틀린다 — 반드시 질량→몰로 바꾼 뒤 계수비를 적용하고 필요하면 다시 몰→질량으로 되돌린다. 이 '몰로 갔다 오기'를 건너뛰는 것이 양적관계 최대의 오답 원인이다. 한계 반응물 문제는 각 반응물을 몰로 바꿔 계수로 나눈 뒤, 그 몫이 가장 작은 쪽이 먼저 떨어지는 한계 반응물임을 이용한다. 실험식·분자식은 거꾸로 가는 길이다 — 각 원소의 질량(또는 %)을 몰질량으로 나눠 몰비를 구하고, 가장 간단한 정수비로 만들면 실험식, 거기에 (실제 몰질량/실험식량) 배를 하면 분자식이다. 연소분석은 생성된 CO₂·H₂O 질량에서 C·H의 몰수를 거꾸로 추적하는 전형이다.", "u": "lec-034-mole-avogadro.html"}, "기체": {"s": "이상기체 상태방정식 PV=nRT 하나가 기체 단원의 중심이다. 변수 관계를 따로 외우기보다, 다른 변수를 고정하고 둘만 보면 보일(P∝1/V)·샤를(V∝T)·아보가드로(V∝n) 법칙이 모두 PV=nRT의 특수한 단면임을 알면 된다. 자주 쓰는 변형 둘: 밀도 d=PM/RT(같은 조건이면 밀도는 몰질량에 비례)와 두 상태 비교 P₁V₁/T₁=P₂V₂/T₂. 온도는 반드시 절대온도(K)로 넣어야 한다 — 섭씨로 넣는 것이 흔한 실수다. 혼합기체에서는 부분압이 핵심이다. 각 성분의 부분압 = 전체압 × 그 성분의 몰분율이고, 부분압의 합이 전체압(돌턴 법칙)이다. 분출·확산은 그레이엄 법칙으로, 속도는 √(몰질량)에 반비례한다(가벼운 기체가 빠르다) — 비를 거꾸로 쓰지 않도록 주의한다. 실제기체는 분자 자체 부피와 분자간 인력 때문에 이상기체에서 벗어나는데, 낮은 압력·높은 온도일수록 이상기체에 가깝다. 반데르발스 식의 a는 인력 보정(압력을 키워 줌), b는 부피 보정(자유 부피를 줄임)이라는 의미를 알면 충분하다.", "u": "lec-044-gas-pressure.html"}, "액체,용액": {"s": "용액 단원의 두 기둥은 '농도'와 '총괄성'이다. 농도는 단위가 핵심이다 — 몰농도(M, mol/용액 L)는 부피 기준이라 온도에 따라 변하고, 몰랄농도(m, mol/용매 kg)는 질량 기준이라 온도와 무관하다. 총괄성(어는점 내림·끓는점 오름·증기압 내림·삼투압)을 다룰 땐 부피가 아닌 질량 기준 몰랄농도를 써야 한다는 점이 자주 헷갈린다. 총괄성의 핵심 정의: 용질의 '종류'가 아니라 '입자 수'에만 비례한다. 그래서 전해질은 반트호프 인자 i(녹아서 생기는 이온 수)를 곱해야 한다 — NaCl은 i≈2, CaCl₂는 i≈3. 이 i를 빠뜨리는 것이 총괄성 최대의 오답이다. 증기압 내림은 라울 법칙으로, 용매에 비휘발성 용질이 녹으면 표면에서 증발할 용매 분자가 줄어 증기압이 낮아진다 — 그래서 끓는점은 오르고 어는점은 내린다. ΔTb=Kb·m·i, ΔTf=Kf·m·i로 한 묶음으로 외우면 된다. 삼투압 π=iMRT(여기선 몰농도 사용)는 반투막을 사이에 둔 용매의 이동으로 이해한다.", "u": "lec-050-evaporation-vapor-pressure.html"}, "고체": {"s": "결정 단원은 '단위세포'라는 가장 작은 반복 단위로 전체를 추론하는 게임이다. 핵심은 단위세포 안에 입자가 '몇 개분' 들어 있는지를 위치별 분율로 세는 것이다 — 꼭짓점 입자는 8개 세포가 나눠 가지므로 1/8개, 면심은 2개가 나눠 1/2개, 모서리는 4개가 나눠 1/4개, 몸 중심은 온전히 1개다. 이 분율 계산을 틀리면 모든 게 어긋난다. 대표 구조 둘만 정확히: 체심입방(BCC)은 세포당 입자 2개, 체대각선을 따라 원자가 닿아 4r=√3a다. 면심입방(FCC)은 세포당 4개, 면대각선을 따라 닿아 4r=√2a다. 이 '닿는 방향'을 잘못 잡는 것이 반지름-모서리 관계의 단골 오답이다. 배위수(가장 가까운 이웃 수)도 구조의 지문이다 — BCC는 8, FCC는 12. 밀도는 이 모두를 잇는다: 밀도 = (세포당 입자 수 × 몰질량) / (아보가드로수 × 세포 부피 a³). 이온결정(NaCl, 형석 CaF₂ 등)에서는 양이온·음이온의 배위수와 비율이 화학식과 맞아떨어져야 한다는 점도 확인 포인트다.", "u": "lec-058-solid-classification.html"}, "열화학": {"s": "열화학의 뼈대는 '엔탈피(H)는 상태함수'라는 한 문장이다. 상태함수란 경로와 무관하게 처음과 끝 상태로만 정해지는 양이다. 그래서 반응 엔탈피 ΔH는 어떤 경로로 가든 같고, 이로부터 헤스 법칙이 나온다 — 여러 반응식을 더하고 빼서 목표 반응을 만들면 ΔH도 똑같이 더하고 뺀다. 이때 식을 뒤집으면 ΔH의 부호가 바뀌고, 계수를 n배 하면 ΔH도 n배가 된다 — 이 부호·배수 처리를 놓치는 것이 헤스 법칙 최대의 함정이다. 부호 규약도 확실히: 발열(주위로 열 방출)은 ΔH<0, 흡열은 ΔH>0. 결합으로 보면 '결합을 끊는 데는 에너지가 들고(흡열) 결합이 생기면 에너지가 나온다(발열)'이므로, ΔH ≈ (끊은 결합 에너지 합) - (생긴 결합 에너지 합)이다 — 방향을 거꾸로 쓰지 않도록 한다. 표준 생성 엔탈피를 쓰면 ΔH = Σ(생성물 ΔHf) - Σ(반응물 ΔHf)로 한 번에 구할 수 있고, 홑원소 물질의 ΔHf는 0이라는 약속이 출발점이다.", "u": "lec-064-exo-endothermic.html"}, "화학평형": {"s": "평형은 '반응이 멈춘 상태'가 아니라 '정반응과 역반응의 속도가 같아져 농도가 더 이상 변하지 않는 동적 상태'다 — 이 오개념을 먼저 깨야 한다. 평형의 위치는 평형상수 K로 표현된다: K = (생성물 농도의 계수 거듭제곱 곱) / (반응물 농도의 계수 거듭제곱 곱). K 식을 세울 때 둘을 자주 틀린다 — 계수를 지수로 올리는 것을 빠뜨리는 것, 그리고 순수 고체·순수 액체는 농도가 일정하므로 K 식에서 제외한다는 점이다. 기체 반응에서는 농도 대신 부분압으로 쓴 Kp가 있고, Kp=Kc(RT)^Δn(Δn=기체 생성물 몰수-반응물 몰수) 관계가 성립한다. 평형이 어디로 이동할지는 르샤틀리에 원리로 판단한다 — 평형에 변화를 주면 그 변화를 '덜어내는' 쪽으로 이동한다. 농도를 늘리면 줄이는 쪽으로, 압력을 높이면(부피를 줄이면) 기체 몰수가 적은 쪽으로, 온도를 올리면 흡열 방향으로 이동한다. 핵심 주의: 촉매와 (반응에 무관한) 비활성 기체 첨가는 평형 위치를 바꾸지 않는다. 농도·압력 변화는 위치를 옮길 뿐 K는 그대로이며, 오직 온도만이 K 값 자체를 바꾼다.", "u": "lec-073-reversible-equilibrium.html"}, "산과염기": {"s": "산-염기는 정의의 사다리를 오르며 본다. 아레니우스(물에서 H⁺/OH⁻)보다 넓은 브뢴스테드-로우리 정의가 핵심이다 — 산은 양성자(H⁺)를 주는 쪽, 염기는 받는 쪽이다. 그러면 한 반응에서 산과 그 짝염기, 염기와 그 짝산이 쌍으로 나타난다(짝산-짝염기 쌍은 H⁺ 하나 차이). 강산/강염기는 물에서 완전히 이온화하지만, 약산/약염기는 일부만 이온화해 평형을 이루고 그 정도가 Ka/Kb로 표현된다. 물의 자체 이온화곱 Kw=[H⁺][OH⁻]=1.0×10⁻¹⁴(25°C)는 모든 수용액에서 성립하며, 여기서 pH+pOH=14가 나온다. pH=-log[H⁺]에서 자주 나오는 함정: 농도가 10배 묽어지면 pH는 1만큼 변한다는 로그 감각, 그리고 약산은 농도만으로 [H⁺]를 정할 수 없고 Ka로 평형 계산을 해야 한다는 점이다. 또 강산을 아무리 묽혀도 pH가 7을 넘지(염기성이 되지) 않는다 — 물의 자체 이온화 때문에 7에 수렴할 뿐이다. 짝산-짝염기의 세기는 반비례한다: 강한 산의 짝염기는 약하다.", "u": "lec-081-acid-base-definition.html"}, "중화반응": {"s": "중화는 산의 H⁺와 염기의 OH⁻가 만나 물이 되는 반응(H⁺+OH⁻→H₂O)이며, 정량의 핵심은 '몰수'로 따진다는 것이다. 양적 관계의 기준은 n가(산이 내놓는 H⁺ 수, 염기가 내놓는 OH⁻ 수)를 곱한 당량이다 — (산의 몰수×양성자수) = (염기의 몰수×수산화이온 수)일 때 완전 중화된다. H₂SO₄처럼 양성자가 2개인 산을 1가로 취급해 부피·농도를 잘못 잡는 것이 단골 오답이다. 중화점의 액성은 '강약의 조합'으로 갈린다 — 강산+강염기는 중성(pH 7), 강산+약염기는 산성, 약산+강염기는 염기성이다. 이는 생성된 염이 물에서 가수분해하기 때문으로, 약한 쪽의 짝이온이 물과 반응해 액성을 기울인다. 적정에서 지시약은 중화점 부근 pH 도약 구간에서 변색하는 것을 골라야 한다(강산-약염기엔 메틸오렌지, 약산-강염기엔 페놀프탈레인). 당량점과 중화점을 혼동하지 않는 것, 그리고 완충 영역(약산과 그 짝염기가 함께 있어 pH가 잘 안 변하는 구간)을 읽는 것이 고난도 포인트다.", "u": "lec-093-neutralization.html"}, "산화환원": {"s": "산화-환원의 본질은 '전자의 이동'이다. 전자를 잃으면 산화, 얻으면 환원 — 한쪽이 잃으면 반드시 다른 쪽이 얻으므로 둘은 항상 짝으로 일어난다. 실전 도구는 산화수다. 각 원자에 형식적으로 매긴 전하로, 반응 전후 산화수가 커지면 산화, 작아지면 환원이다. 산화수 규칙(홑원소 0, 단원자 이온은 전하, 산소 대개 -2, 수소 대개 +1, 화합물 합은 0)을 적용해 누가 산화·환원됐는지부터 찾는다. 반응식 균형은 전자 수를 맞추는 게 핵심이다 — 산화 반쪽반응에서 잃은 전자 수와 환원 반쪽반응에서 얻은 전자 수가 같도록 계수를 맞춘다(산성/염기성 조건에 따라 H⁺·OH⁻·H₂O로 산소·수소를 맞춘다). 전기화학은 이 자발성을 전위로 읽는다. 표준환원전위 E°가 클수록 환원되려는 경향이 크다. 갈바니 전지에서 E°가 큰 쪽이 환원(+극)·작은 쪽이 산화(-극)이며, E°cell=E°(환원극)-E°(산화극)>0이면 자발적이다. 전극 명칭과 부호를 혼동하기 쉬운데 '산화는 anode, 환원은 cathode'를 기준으로 잡는다. 네른스트 식 E=E°-(RT/nF)lnQ에서 lnQ 앞 부호와 Q의 구성(생성물/반응물)을 틀리는 것이 고난도 단골 오답이다. 전기분해는 외부 전원으로 비자발 반응을 강제하는 것으로, 패러데이 법칙(전하량 ∝ 석출 몰수, Q=nF)으로 정량한다.", "u": "lec-098-oxidation-number.html"}, "반응속도": {"s": "반응속도론의 첫 교훈은 '속도식의 차수는 반응식 계수가 아니라 실험으로 정한다'는 것이다. aA+bB→ 반응의 속도식이 v=k[A]^m[B]^n일 때 m·n은 a·b와 같을 수도 다를 수도 있다 — 계수를 그대로 지수로 옮기는 것이 가장 흔한 오개념이다. 차수는 보통 농도를 바꿔 가며 속도 변화를 보는 초기속도법으로 결정한다(한 반응물 농도만 2배 했을 때 속도가 2배면 1차, 4배면 2차). 속도에 영향을 주는 요인은 충돌 이론으로 꿰어진다 — 반응은 분자들이 '충분한 에너지(활성화에너지 Ea 이상)로, 올바른 방향으로' 충돌해야 일어난다. 그래서 농도·압력을 높이면 충돌 빈도가 늘어 빨라지고, 온도를 높이면 Ea를 넘는 분자 비율이 급증해(아레니우스) 빨라진다. 촉매는 Ea가 더 낮은 다른 경로를 열어 속도를 높이지만 반응의 ΔH나 평형 위치는 바꾸지 않는다 — 이 구분이 핵심이다. 다단계 반응에서는 가장 느린 단계(율속 단계)가 전체 속도를 지배하며, 속도식은 율속 단계로부터 나온다. 반응 중간체(생성됐다 소모됨)와 촉매(소모됐다 재생)를 구별하고, 정상상태 근사로 중간체 농도를 소거하는 것이 고난도 영역이다.", "u": "lec-107-reaction-rate.html"}, "탄소화합물": {"s": "탄소화합물(유기화학 입문)은 '작용기'라는 렌즈로 보면 방대한 분자가 몇 갈래로 정리된다. 탄소 골격(알케인·알켄·알카인, 단일·이중·삼중 결합)에 작용기가 붙어 성질을 결정한다 — 하이드록시(-OH, 알코올)·카보닐(C=O, 알데하이드·케톤)·카복실(-COOH, 산)·아미노(-NH₂)·에터·에스터 등. 같은 분자식이라도 원자의 연결이 다르면 다른 물질인 '구조 이성질체'가 나오는데, 분자식만 보고 같은 물질로 착각하는 것이 흔한 오류다. 작용기는 물리적 성질로 직결된다 — -OH나 -COOH가 있으면 수소결합을 해서 같은 탄소 수의 탄화수소보다 끓는점이 높고 물에 잘 녹는다. 반응성도 작용기로 예측한다 — 알켄·알카인의 첨가 반응, 알코올의 산화(1차→알데하이드→카복실산, 2차→케톤), 카복실산과 알코올의 에스터화(축합) 같은 큰 줄기를 잡아 둔다. 명명에서는 가장 긴 사슬을 모체로 잡고 작용기·치환기의 위치 번호를 매기는 규칙이 출발점이다. 이 단원은 암기처럼 보이지만 '작용기 → 성질·반응'의 인과로 묶으면 외울 양이 크게 준다.", "u": "lec-114-carbon-compounds.html"}, "배위화학": {"s": "배위화학은 중심 금속 이온에 리간드(고립쌍을 주는 분자·이온)가 결합해 만든 착물을 다룬다. 핵심 골격은 '배위수'와 '기하구조'다 — 배위수 2는 직선, 4는 사면체 또는 평면사각형, 6은 팔면체가 대표적이다. 같은 배위수 4라도 사면체와 평면사각형이 갈리는데(d⁸ 금속은 평면사각형을 선호) 이 차이가 이성질체와 성질을 가른다. 결정장 이론이 색·자성의 열쇠다 — 리간드가 만드는 정전기장이 금속의 d 오비탈을 에너지가 다른 두 무리로 갈라놓고(팔면체에서 eg와 t2g) 그 갈라짐 크기 Δ에 따라 전자가 채워지는 방식이 달라진다. Δ가 크면(강한장 리간드) 전자가 짝지어 들어가 저스핀, 작으면(약한장) 훈트대로 퍼져 고스핀이 된다 — 이 스핀 상태가 자성(상자성/반자성)을 정한다. 색은 이 d-d 갈라짐 에너지에 해당하는 빛을 흡수하고 그 보색이 보이는 것이다. 리간드의 장 세기 순서(분광화학 계열)와 이성질체(기하·광학 이성질체), 킬레이트(한 리간드가 여러 자리로 무는 것)의 안정성이 출제의 단골이다.", "u": "lec-122-complex-ion-coordinate-bond.html"}};

/* PDF 교재용 부록: 오답 개념을 영역별로 강의 전문·핵심·함정·처방까지 모두 담아 이 파일 하나로 복습 가능하게 한다 */
function buildConceptTextbook(exam, wrong){
  if(!wrong||!wrong.length) return '';
  var broad=function(a){ return RX[a]?a:(RXMAP[a]||a); };
  var groups={};
  wrong.forEach(function(w){ var ar=exam.area?(exam.area[w.q-1]||'기타'):'기타'; var bd=broad(ar); (groups[bd]=groups[bd]||[]).push(w); });
  var order=Object.keys(groups).sort(function(a,b){ return groups[b].length-groups[a].length; });
  var pages=order.map(function(bd){
    var r=RX[bd], lec=LEC[bd];
    var its=groups[bd].map(function(w){ var ty=exam.type?(exam.type[w.q-1]||''):'';
      var mis=(ty?omFor(ty):null)||((r&&r.t)?r.t:'');
      return '<div class="tb-q"><b>'+w.q+'번</b> <span style="color:#b1442f">'+(w.a?CIRC[w.a]:'·')+'</span> → <span style="color:#1f7a68">'+ansLabel(exam,w.q)+'</span>'+(ty?' · <span style="color:#555">'+esc(ty)+'</span>':'')+'</div>'
        +(mis?'<div class="tb-mis">'+esc(mis)+'</div>':''); }).join('');
    return '<div class="tb-area">'
      +'<div class="tb-h">'+esc(bd)+' <span>· 이번 시험 오답 '+groups[bd].length+'문항</span></div>'
      +'<div class="tb-qs">'+its+'</div>'
      +(r&&r.k?'<div class="tb-box tb-key"><div class="tb-lab">✔ 핵심 개념</div><p>'+esc(r.k)+'</p></div>':'')
      +(r&&r.t?'<div class="tb-box tb-trap"><div class="tb-lab">⚠ 자주 틀리는 함정</div><p>'+esc(r.t)+'</p></div>':'')
      +(r&&r.rx?'<div class="tb-box tb-rx"><div class="tb-lab">▶ 복습 처방</div><p>'+esc(r.rx)+'</p></div>':'')
      +'</div>';
  }).join('');
  return '<div class="tb-appendix"><div class="tb-cover">부록 1 · 오답 개념 총정리</div>'
    +'<div class="tb-sub">이번 시험에서 틀린 문항의 개념을 영역별로 정리했습니다. 문항별 오개념 → 핵심 → 함정 → 처방. 각 개념의 강의 전문은 「부록 2 · 개념 강의」에 실었습니다.</div>'
    + pages
    +'<div class="tb-foot">Chemistreal · 조준모 화학 — 오답 개념 총정리</div></div>';
}
/* 오답 문항의 개념에 해당하는 실제 강의 파일 목록(중복 제거). 유형 우선, 없으면 영역 대표 강의 */
function lecturesForWrong(exam, wrong){
  var files=[], seen={};
  (wrong||[]).forEach(function(w){
    var ty=exam.type?(exam.type[w.q-1]||''):''; var ar=exam.area?(exam.area[w.q-1]||''):'';
    var f=lecFor(ar,ty);
    if(f&&!seen[f]){ seen[f]=1; files.push(f); }
  });
  return files;
}
/* 강의 파일에서 제목·본문(제목/문단/목록)만 뽑아 교재 스타일 HTML로 변환 */
async function fetchLectureContent(file){
  try{
    var res=await fetch(file); if(!res.ok) return null;
    var doc=new DOMParser().parseFromString(await res.text(), 'text/html');
    var title=((doc.querySelector('title')||{}).textContent||'').split('·')[0].trim()||file;
    var main=doc.querySelector('main')||doc.body; if(!main) return null;
    var out='', nodes=main.querySelectorAll('.sec__h, h2, h3, p, li');
    nodes.forEach(function(el){
      if(el.closest('script,style,button')) return;
      var t=(el.textContent||'').replace(/\s+/g,' ').trim(); if(t.length<2) return;
      var isH=el.classList.contains('sec__h')||el.tagName==='H2'||el.tagName==='H3';
      out+= isH ? '<div class="tb-lh">'+esc(t)+'</div>' : (el.tagName==='LI'?'<p class="tb-li">· '+esc(t)+'</p>':'<p>'+esc(t)+'</p>');
    });
    return out ? { title:title, html:out } : null;
  }catch(e){ return null; }
}

function gaussPath(mu,sd,lo,hi,x2px,baseY,peakH){if(!(sd>0))return '';let d='';const N=64;for(let i=0;i<=N;i++){const xv=lo+(hi-lo)*i/N,z=(xv-mu)/sd,y=Math.exp(-z*z/2);d+=(i?'L':'M')+x2px(xv).toFixed(1)+','+(baseY-y*peakH).toFixed(1)+' ';}return d.trim();}
function bellCurveSVG(totals, my, maxTotal){
  if(!totals||totals.length<5) return '';
  const mu=totals.reduce((a,b)=>a+b,0)/totals.length;
  const sd=Math.sqrt(totals.reduce((s,v)=>s+(v-mu)**2,0)/totals.length);
  if(!(sd>0)) return '';
  const W=400,H=150,pl=10,pr=10,pt=18,pb=24;
  const lo=Math.max(0,mu-3.2*sd),hi=Math.min(maxTotal,mu+3.2*sd);
  if(hi<=lo) return '';
  const iw=W-pl-pr,ih=H-pt-pb,baseY=pt+ih,peakH=ih*0.9;
  const x=v=>pl+(v-lo)/(hi-lo)*iw;
  const path=gaussPath(mu,sd,lo,hi,x,baseY,peakH);
  const myC=Math.max(lo,Math.min(hi,my)),myX=x(myC);
  let fill='M'+x(lo).toFixed(1)+','+baseY.toFixed(1)+' '; const Nn=48;
  for(let i=0;i<=Nn;i++){const xv=lo+(myC-lo)*i/Nn;const z=(xv-mu)/sd;const y=Math.exp(-z*z/2);fill+='L'+x(xv).toFixed(1)+','+(baseY-y*peakH).toFixed(1)+' ';}
  fill+='L'+myX.toFixed(1)+','+baseY.toFixed(1)+' Z';
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-top:8px" xmlns="http://www.w3.org/2000/svg">
    <path d="${fill}" fill="var(--cobalt)" opacity="0.16"/>
    <path d="${path}" fill="none" stroke="var(--cobalt)" stroke-width="2"/>
    <line x1="${x(mu).toFixed(1)}" y1="${baseY}" x2="${x(mu).toFixed(1)}" y2="${(pt+ih*0.08).toFixed(1)}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="${x(mu).toFixed(1)}" y="${(pt-5).toFixed(1)}" font-size="10" fill="var(--muted)" text-anchor="middle">평균 ${mu.toFixed(0)}</text>
    <line x1="${myX.toFixed(1)}" y1="${baseY}" x2="${myX.toFixed(1)}" y2="${(pt+ih*0.02).toFixed(1)}" stroke="var(--teal)" stroke-width="2"/>
    <circle cx="${myX.toFixed(1)}" cy="${baseY.toFixed(1)}" r="3.5" fill="var(--teal)"/>
    <text x="${myX.toFixed(1)}" y="${(baseY+15).toFixed(1)}" font-size="10.5" fill="var(--teal)" font-weight="700" text-anchor="middle">내 점수 ${my}</text>
    <line x1="${pl}" y1="${baseY}" x2="${W-pr}" y2="${baseY}" stroke="var(--line)" stroke-width="1"/>
  </svg>`;
}
function propCI(p,N){
  if(!N||N<1)return {lo:0,hi:100,m:50};
  const z=1.96,d=1+z*z/N,c=(p+z*z/(2*N))/d,m=z*Math.sqrt(p*(1-p)/N+z*z/(4*N*N))/d;
  return {lo:Math.max(0,Math.round((c-m)*100)),hi:Math.min(100,Math.round((c+m)*100)),m:Math.round(m*100)};
}
function percSec(exam,my,cs){

  return `<div class="sec">${secH('점수 분포 속 나의 위치')}<div class="muted">연도누적 총석차 <b>${rank}/${Nn}</b>${ry.ready?` · ${ry.year}년 반석차 <b>${rankIn(ry.pool,my)}/${ry.N}</b>`:''} · <b>상위 ${100-pc}%</b> · 백분위 <b>${pc}</b> <span style="font-size:12px">(95% 구간 ${ci.lo}~${ci.hi})</span></div>

     :(N<20?`<div style="font-size:11.5px;color:var(--muted);margin-top:5px">응시 ${N}명 기준의 잠정치 — 표본이 쌓이면 정밀해집니다.</div>`:'')}</div>`;
}

function omFor(type){ if(!type) return null; for(const e of OMLIB){ if(type.indexOf(e[0])>=0) return e[1]; } return null; }
function distSec(exam,selv,cs){
  if(!cs.percReady)return'';
  // 누적 정답률 낮은 문항 + 선택지 분포
  const hard=[]; for(let q=1;q<=exam.nQ;q++){hard.push({q,p:cs.qp[q-1],opt:cs.qopt[q-1],k:exam.key[q-1],my:selv[q]||0});}
  hard.sort((a,b)=>a.p-b.p); const top=hard.slice(0,6);
  return `<div class="sec">${secH('누적 정답률 · 선택지 분석')}<div class="sub">정답률이 낮은 문항의 보기별 응답 분포입니다. 많이 고른 오답이 핵심 오개념입니다.</div>
   ${top.map(h=>`<div style="margin:9px 0"><div style="font-size:12.5px;margin-bottom:3px"><b>${h.q}번</b> · 정답 ${ansLabel(exam,h.q)} · 정답률 ${h.p}%<span style="color:var(--muted);font-size:11.5px"> ±${propCI(h.p/100,cs.N).m}</span>${h.my&&!okq(exam,h.q,h.my)?` · 내 답 ${CIRC[h.my]}`:''}</div>
     <div class="distbar">${[0,1,2,3].map(c=>{const w=h.opt[c];const isK=accSet(exam,h.q).indexOf(c+1)>=0;return w>0?`<div style="width:${w}%;background:${isK?'#0E5A4C':'#C9A98A'}" title="${CIRC[c+1]} ${w}%">${w>=10?CIRC[c+1]+' '+w+'%':''}</div>`:'';}).join('')}</div></div>`).join('')}</div>`;
}
function domScores(exam,ans){
  if(!exam.area||exam.area.length!==exam.nQ)return null;
  const ag={};
  for(let q=1;q<=exam.nQ;q++){const a=exam.area[q-1];(ag[a]=ag[a]||{c:0,t:0});ag[a].t++;if(okq(exam,q,ans[q-1]||0))ag[a].c++;}
  const out={}; for(const a in ag)out[a]=Math.round(ag[a].c/ag[a].t*100); return out;
}
function domScoresBroad(exam,ans){
  if(!exam.area||exam.area.length!==exam.nQ)return null;
  const ag={};
  for(let q=1;q<=exam.nQ;q++){const a=exam.area[q-1];const bd=RX[a]?a:(RXMAP[a]||a);(ag[bd]=ag[bd]||{c:0,t:0});ag[bd].t++;if(okq(exam,q,ans[q-1]||0))ag[bd].c++;}
  const out={}; for(const d in ag)out[d]=Math.round(ag[d].c/ag[d].t*100); return out;
}
function lineChartSVG(series,xLabels){
  const n=xLabels.length; if(n<2)return '';
  const W=400,H=230,ml=34,mr=12,mt=16,mb=28,pw=W-ml-mr,ph=H-mt-mb;
  const X=i=>n>1?ml+(i/(n-1))*pw:ml+pw/2;
  const Y=v=>mt+(1-v/100)*ph;
  const grid=[0,25,50,75,100].map(g=>`<line x1="${ml}" y1="${Y(g).toFixed(1)}" x2="${ml+pw}" y2="${Y(g).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${ml-5}" y="${(Y(g)+3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--muted)">${g}</text>`).join('');
  const xlab=xLabels.map((l,i)=>`<text x="${X(i).toFixed(1)}" y="${H-9}" text-anchor="middle" font-size="9" fill="var(--muted)">${esc(l)}</text>`).join('');
  const draw=series.map(s=>{
    let segs=[],cur=[]; s.vals.forEach((v,i)=>{if(v==null){if(cur.length>1)segs.push(cur);cur=[];}else cur.push([X(i),Y(v)]);}); if(cur.length>1)segs.push(cur);
    const w=s.main?2.5:1.6;
    const lines=segs.map(sg=>`<polyline points="${sg.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${s.color}" stroke-width="${w}"/>`).join('');
    const dots=s.vals.map((v,i)=>v==null?'':`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${s.main?3:2.4}" fill="${s.color}"/>`).join('');
    const vlab=s.main?s.vals.map((v,i)=>v==null?'':`<text x="${X(i).toFixed(1)}" y="${(Y(v)-7).toFixed(1)}" text-anchor="middle" font-size="9" font-weight="700" fill="${s.color}">${v}</text>`).join(''):'';
    return lines+dots+vlab;

function shortExam(e){
  var t=String((e&&e.title)||'');
  var m=t.match(/(\d+(?:-\d+)?)\s*회/); if(m) return m[1]+'회';
  m=t.match(/(20\d\d)(?:[^\d]*제(\d)차)?/);
  if(m){ var x=m[1].slice(2)+'년'; if(m[2]) x+=' '+m[2]+'차'; if(/심화/.test(t)) x+='심';
         return x; }                 // 25년 2차심 — 같은 해 일반·심화를 갈라 놓는다
  return t.slice(0,6);
}

/* ══════════════════════════════════════════════════════════════════
   한 학생의 응시 이력을 한 곳에서 정한다
   ------------------------------------------------------------------
   아홉 군데가 각자 같은 규칙을 베껴 쓰고 있었다:

       subs(e.id).filter(r => r.name.trim()===nm && r.ans.length===e.nQ)

   한 곳만 고치면 나머지 여덟이 어긋난다. 그리고 그 규칙이 보던 것은
   **이 브라우저에 채점해 둔 기록**뿐이었다. 학부모 휴대폰에서 공유 링크를
   열면 그 폰이 우연히 열어 본 회차만 잡혀서 "지금까지 2회 응시" 가 됐다 —
   실제로는 여섯 번을 봤는데. 선생님이 학원 PC 를 바꿔도 마찬가지였다.

   시트에는 어느 기기에서 채점했든 다 들어 있다. 학생 하나를 이름으로 물어
   전 회차를 받아 두고(loadHist), 이 브라우저 기록과 합쳐 여기서 낸다.

   이름은 nameKey 로 견준다 — 공백을 지우므로 '박 하람' 도 같은 사람이다. */
var HIST_ROWS=null, HIST_FOR='', HIST_TRIED='';
function histOf(nm){
  const key=nameKey(nm); if(!key) return [];
  const best={};
  const take=function(e,r){
    if(!e||!r||!r.ans||r.ans.length!==e.nQ) return;
    const p=best[e.id];
    if(!p||(r.ts||0)>=(p.ts||0)) best[e.id]={e:e, r:r, ts:r.ts||0};
  };
  FINAL_EXAMS.forEach(function(e){
    subs(e.id).forEach(function(r){ if(nameKey(r&&r.name)===key) take(e,r); });
  });
  /* 시트에서 받아 온 것. 이 브라우저에 없던 회차가 여기서 채워진다.
     localStorage 에 쓰지는 않는다 — 학부모 폰에 남길 이유가 없다. */
  if(HIST_ROWS && nameKey(HIST_FOR)===key) HIST_ROWS.forEach(function(row){
    const e=FINAL_EXAMS.filter(function(x){ return x.id===row.examId; })[0];
    if(!e) return;
    const digits=String(row.answers||'').replace(/[^0-4]/g,'');
    if(digits.length!==e.nQ) return;
    const ans=digits.split('').map(Number);
    let c=0; for(let q=1;q<=e.nQ;q++) if(okq(e,q,ans[q-1]||0)) c++;
    take(e,{name:row.name||nm, school:row.school||'', grade:row.grade||'',
            ts:row.ts||0, correct:c, total:e.nQ, wrong:e.nQ-c, ans:ans});
  });
  return Object.keys(best).map(function(k){ const h=best[k];
      h.pct=h.r.total?Math.round(h.r.correct/h.r.total*100):0; return h; })
    .sort(function(a,b){ return cmpExam(a.e,b.e); });
}
/* 시트에서 그 학생의 전 회차를 받아 온다. 받아 오면 성적표를 다시 그린다 —
   먼저 그려 둔 화면이 '2회 응시' 라고 적혀 있을 수 있으므로. */
function loadHist(nm){
  const key=nameKey(nm);
  if(!key || !SHEET_ENDPOINT) return;
  if(HIST_TRIED===key) return;          // 이름당 한 번만 묻는다
  HIST_TRIED=key;
  sheetCall({action:'history', name:nm}, function(res){
    if(!res || res.ok===false || !res.rows){ return; }
    HIST_ROWS=res.rows; HIST_FOR=nm;
    /* 넘어져도 화면은 그대로 살아야 한다. 다만 조용히 삼키지는 않는다 —
       이 자리에서 한 번 조용히 죽어서 '2회 응시' 가 그대로 남았었다. */
    try{ if(typeof rerenderReport==='function') rerenderReport(); }
    catch(e){ console.error('[이력] 성적표를 다시 그리지 못했습니다', e); }
  });
}

/* ── 이 학생의 기록이 다른 이름표로 갈라져 있지 않은가 ────────────────────
   성적표는 이름이 **정확히 같은** 기록만 한 학생으로 본다(아홉 군데가 같은
   규칙을 쓴다). 그래서 '박 하람' 처럼 공백 하나, 글자 하나가 어긋난 기록은
   조용히 빠진다. 화면은 "진단 6회 누적" 이라고 단언하는데 실제로는 여덟 번을
   봤다 — 읽는 쪽에는 빠졌다는 신호가 어디에도 없다. 학부모에게 나가는 종이에
   "첫 진단입니다" 라고 적히는 일까지 생긴다.

   빠진 것이 있으면 성적표가 **먼저 말한다.** 합치는 것은 명단 관리에서 한다. */
function splitNameRecords(nm){
  var key=nameKey(nm); if(!key) return [];
  var seenKey={}, by={};
  FINAL_EXAMS.forEach(function(e){
    var k=cohortKey(e.id); if(seenKey[k]) return; seenKey[k]=1;   // 별칭은 한 번만 센다
    subs(e.id).forEach(function(r){
      var n=((r&&r.name)||'').trim(); if(!n) return;
      /* 띄어쓰기 차이는 이제 저장할 때 저절로 붙는다(nameKey). 여기서 경고할
         것은 **사람이 봐야 하는** 것만 남긴다 — 한 글자가 다른 이름. 기계가
         합치면 동명이인을 되돌릴 수 없게 묶으므로 합치지는 않는다. */
      var x=nameKey(n);
      if(x===key) return;                    // 이미 같은 사람으로 센다
      if(!(x.length>=2 && key.length>=2 && editDist(x,key)===1)) return;
      var rec = by[n] || (by[n]={name:n, n:0, why:'한 글자 다름'});
      rec.n++;
    });
  });
  return Object.keys(by).map(function(k){ return by[k]; }).sort(function(a,b){ return b.n-a.n; });
}
/* 성적표가 세는 것은 **이 브라우저에 채점해 둔 것**뿐이다. 다른 기기에서
   채점한 회차는 시트에만 있다 — 그 사실을 성적표가 밝혀야, 빠진 회차를 보고
   "안 봤나 보다" 로 넘어가지 않는다. */
function historyScopeNote(){
  return `<div style="font-size:11.5px;color:var(--muted);margin-top:7px">
    이 브라우저에 채점해 둔 기록 기준입니다. 다른 기기·브라우저에서 채점한 회차가 있으면
    시험 목록의 <b>시트에서 불러오기 ↓</b> 를 먼저 눌러 주세요.</div>`;
}
function splitNameNote(nm){
  var sp=[]; try{ sp=splitNameRecords(nm); }catch(e){ return ''; }
  if(!sp.length) return '';
  var tot=sp.reduce(function(a,x){ return a+x.n; },0);
  return `<div class="note" style="border-color:rgba(192,96,58,.38);background:#FBF0EA;color:#8a3a1d">
    <b>빠진 회차가 있을 수 있습니다.</b> ${esc(nm)} 학생과 비슷한 이름으로 저장된 기록이
    <b>${tot}건</b> 더 있습니다 —
    ${sp.map(function(x){ return `<b>${esc(x.name)}</b>(${x.n}건 · ${x.why})`; }).join(' · ')}.
    같은 학생이면 <b>명단 관리</b>에서 합치세요. 합쳐야 이 성적표의 회차 수와 성장 추적이 맞습니다.</div>`;
}

function growthSec(exam){
  const nm=curName(); if(!nm)return'';
  const hist=[];
  hist.push.apply(hist, histOf(nm));
  /* '첫 진단입니다' 는 단언이다. 갈라진 기록이 있으면 그 단언이 틀린다 —
     먼저 그것부터 말한다. */
  const splitNote=splitNameNote(nm);
  if(hist.length<2)return `<div class="sec">${secH('성장 추적 · 기준선')}${splitNote}<div class="note">${esc(nm)} 학생의 <b>${splitNote?'이 이름으로는 첫':'첫'} 진단</b>입니다. 이번 결과가 <b>기준선</b>이 되어, 다음 진단부터 영역별 <b>지난 진단 대비 성장</b>이 표시됩니다.</div>${historyScopeNote()}</div>`;
  const _at=histAt(hist,exam);
  const cur=hist[_at], prev=hist[_at>0?_at-1:1];
  const dO=cur.pct-prev.pct;
  const cs=domScoresBroad(cur.e,cur.r.ans), ps=domScoresBroad(prev.e,prev.r.ans);
  let dl=[]; if(cs&&ps){for(const d in cs){if(d in ps)dl.push({d,now:cs[d],was:ps[d],delta:cs[d]-ps[d]});}}
  dl.sort((a,b)=>b.delta-a.delta);
  const allDS=hist.map(h=>domScoresBroad(h.e,h.r.ans)||{});
  const curDS=allDS[allDS.length-1]||{};
  const weak2=Object.entries(curDS).sort((a,b)=>a[1]-b[1]).slice(0,2).map(x=>x[0]);
  const lineSeries=[{name:'전체 정답률',color:'var(--teal)',vals:hist.map(h=>h.pct),main:true},
    ...weak2.map((d,i)=>({name:d,color:i?'var(--brass)':'var(--cobalt)',vals:allDS.map(ds=>ds[d]!=null?ds[d]:null)}))];
  const lineChart=lineChartSVG(lineSeries,hist.map((h,i)=>`${i+1}회`));
  const fmt=v=>v>0?`▲+${v}`:(v<0?`▼${-v}`:'±0');
  const col=v=>v>0?'var(--teal)':(v<0?'var(--ms)':'var(--muted)');
  const trendBars=hist.map(h=>`<div class="barrow"><span class="ba" style="width:auto;min-width:118px;max-width:168px">${esc(h.e.title)}</span><span class="bar"><i style="width:${h.pct}%;background:${pcolor(h.pct)}"></i></span><span class="bp">${h.pct}%</span></div>`).join('');
  const deltaRows=dl.map(x=>`<div class="barrow"><span class="ba">${esc(x.d)}</span><span style="flex:1;color:var(--muted);font-size:12px">${x.was}% → ${x.now}%</span><span style="font-weight:700;font-size:13px;color:${col(x.delta)}">${fmt(x.delta)}%p</span></div>`).join('');
  const up=dl.filter(x=>x.delta>0), dn=dl.filter(x=>x.delta<0);
  let summary='';
  if(dl.length){const top=dl[0], bot=dl[dl.length-1];
    summary=`<div class="note"><b>지난 진단 대비.</b> 전체 정답률 ${prev.pct}% → ${cur.pct}% (<b style="color:${col(dO)}">${fmt(dO)}%p</b>).${up.length?` 가장 성장한 영역은 <b style="color:var(--teal)">${esc(top.d)} ${fmt(top.delta)}%p</b>.`:''}${dn.length?` 주의가 필요한 영역은 <b style="color:var(--ms)">${esc(bot.d)} ${fmt(bot.delta)}%p</b>.`:''}</div>`;}
  return `<div class="sec">${secH('성장 추적 · 지난 진단 대비')}
   <div class="sub">${esc(nm)} 학생 · 진단 ${hist.length}회 누적 (지난 진단: ${esc(prev.e.title)})</div>
   ${splitNote}
   ${summary}
   ${historyScopeNote()}
   <div style="font-size:12px;color:var(--muted);margin:9px 0 4px">정답률 궤적 · 전체 + 현재 약점 2영역</div>
   ${lineChart}
   ${dl.length?`<details style="margin:9px 0 2px"><summary class="muted" style="cursor:pointer">영역별 지난 진단 대비 변화 (공통 영역 ${dl.length}개)</summary><div style="margin-top:8px">${deltaRows}</div></details>`:''}
   <div class="note" style="font-size:12px;color:var(--muted)">서로 다른 시험 간 비교이므로 난이도 차이가 있을 수 있으며, 절대 측정이 아닌 <b>성장 방향 지표</b>로 해석합니다.</div>
  </div>`;
}
function tierLadderSVG(W,cut,total){
  if(!cut||!cut.length||!total)return '';
  const aw=award(W,cut), c=total-W;
  const lo=Math.max(0,total-cut[cut.length-1]-3);
  const W2=400,ml=14,mr=14,mt=38,barH=22,pw=W2-ml-mr,H=96;
  const X=v=>ml+((Math.max(lo,Math.min(total,v))-lo)/(total-lo))*pw;
  const cols=['#d2cfc7','#cdbfa3','#bd8a5e','#aab0b5','#d4af37'];
  const names=['수상권 밖','장려상','동상','은상','금상'];
  const edges=[lo,total-cut[4],total-cut[3],total-cut[2],total-cut[1],total];
  let bands='',labs='';
  for(let i=0;i<5;i++){const x0=X(edges[i]),x1=X(edges[i+1]); if(x1<=x0)continue; bands+=`<rect x="${x0.toFixed(1)}" y="${mt}" width="${(x1-x0).toFixed(1)}" height="${barH}" fill="${cols[i]}"/>`;
    const xc2=(x0+x1)/2; if(x1-x0>26)labs+=`<text x="${xc2.toFixed(1)}" y="${(mt+barH+12).toFixed(1)}" text-anchor="middle" font-size="8.5" fill="var(--ink-2)">${names[i]}</text>`;}
  const xT=X(total); bands+=`<rect x="${(xT-3).toFixed(1)}" y="${(mt-3).toFixed(1)}" width="3" height="${barH+6}" fill="#1f7a68"/>`;
  labs+=`<text x="${xT.toFixed(1)}" y="${(mt+barH+12).toFixed(1)}" text-anchor="end" font-size="8.5" font-weight="700" fill="#1f7a68">대상</text>`;
  const xc=X(c); const marker=`<line x1="${xc.toFixed(1)}" y1="${(mt-3).toFixed(1)}" x2="${xc.toFixed(1)}" y2="${(mt+barH+3).toFixed(1)}" stroke="var(--ink)" stroke-width="1.5"/><polygon points="${xc.toFixed(1)},${(mt-3).toFixed(1)} ${(xc-5).toFixed(1)},${(mt-12).toFixed(1)} ${(xc+5).toFixed(1)},${(mt-12).toFixed(1)}" fill="var(--ink)"/><text x="${xc.toFixed(1)}" y="${(mt-15).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="700" fill="var(--ink)">현재 ${c}문항</text>`;
  let nextMark='';
  if(aw.nextTier&&aw.gap>0){const xn=X(c+aw.gap); nextMark=`<line x1="${xn.toFixed(1)}" y1="${(mt-3).toFixed(1)}" x2="${xn.toFixed(1)}" y2="${(mt+barH+3).toFixed(1)}" stroke="var(--brass)" stroke-width="2" stroke-dasharray="2 2"/>`;}
  const cap=aw.nextTier&&aw.gap>0?`<div style="font-size:12px;color:var(--muted);text-align:center;margin-top:3px"><b style="color:var(--brass)">${esc(aw.nextTier)}</b> 도달선까지 ${aw.gap}문항 (점선)</div>`:(aw.inA&&!aw.nextTier?`<div style="font-size:12px;color:#1f7a68;text-align:center;margin-top:3px;font-weight:700">최고 등급 도달</div>`:'');
  return `<div style="margin:8px 0 2px"><svg viewBox="0 0 ${W2} ${H}" style="width:100%;max-width:420px;height:auto" xmlns="http://www.w3.org/2000/svg">${bands}${nextMark}${marker}${labs}</svg>${cap}</div>`;
}
function lgammaWP(z){ const g=7,c=[0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
  if(z<0.5) return Math.log(Math.PI/Math.sin(Math.PI*z))-lgammaWP(1-z);
  z-=1; let x=c[0]; for(let i=1;i<g+2;i++)x+=c[i]/(z+i); const t=z+g+0.5;
  return 0.5*Math.log(2*Math.PI)+(z+0.5)*Math.log(t)-t+Math.log(x); }
function lbetaWP(a,b){return lgammaWP(a)+lgammaWP(b)-lgammaWP(a+b);}
function lchooseWP(n,k){return lgammaWP(n+1)-lgammaWP(k+1)-lgammaWP(n-k+1);}
function betaBinomPMF(k,n,a,b){return Math.exp(lchooseWP(n,k)+lbetaWP(k+a,n-k+b)-lbetaWP(a,b));}
function winProb(total, correct, cut){
  if(total<=0) return null; const wrong=total-correct, a=correct+1, b=wrong+1;
  const pmf=[]; for(let k=0;k<=total;k++)pmf.push(betaBinomPMF(k,total,a,b));
  return cut.map(cT=>{ const need=total-cT; if(need<=0)return 1; let p=0; for(let k=need;k<=total;k++)p+=(pmf[k]||0); return Math.min(1,Math.max(0,p)); });
}
function winProbSec(exam, sel, cs, correct, total, W){
  const cut=exam.cut; if(!cut||total<=0) return '';
  const probs=winProb(total, correct, cut); if(!probs) return '';
  const pAward=probs[4];
  let careless=0; if(cs&&cs.ready&&cs.qp){const mset=new Set(exam.miss||[]); for(let q=1;q<=exam.nQ;q++){if(mset.has(q))continue;const d=cs.qp[q-1];if(d==null)continue;if(d>=70&&!okq(exam,q,sel[q]||0))careless++;}}
  let marg=''; if(careless>0){ const p2=winProb(total, Math.min(total,correct+careless), cut);
    const gains=TIERS.map((t,i)=>({t,base:probs[i],d:Math.round((p2[i]-probs[i])*100)})).filter(g=>g.base<0.95 && g.d>0).sort((a,b)=>b.d-a.d);
    if(gains.length){ const top=gains.slice(0,2).map(g=>`<b>${g.t} 이상 +${g.d}%p</b>`).join(' · ');
      marg=`<div class="note" style="margin-top:9px;font-size:12.5px"><b>한계 이득.</b> 쉬운데 틀린 <b>${careless}문항</b>을 고치면 ${top}. 가장 큰 점수 여력이 여기 있습니다.</div>`; } }
  const rows=TIERS.map((t,i)=>{const p=Math.round(probs[i]*100); return `<div class="barrow" style="margin:5px 0"><span class="ba" style="width:52px">${t} 이상</span><span class="bar" style="height:11px"><i style="width:${p}%;background:${i<=1?'var(--brass)':i<=3?'var(--teal)':'var(--teal-d)'}"></i></span><span class="bp">${p}%</span></div>`;}).join('');
  return `<div class="sec">${secH('수상 확률 · 베이지안 추정')}<div class="sub">이번 성적을 바탕으로, 비슷한 난이도의 실전에서 각 등급 이상을 받을 확률입니다. 한 번의 시험에서 추정한 값이라 폭이 있으며, 응시가 쌓일수록 정밀해집니다.</div>
   <div style="text-align:center;margin:11px 0 7px"><div style="font-size:12px;color:var(--muted)">수상(장려상 이상) 확률</div><div style="font-size:30px;font-weight:800;color:var(--teal);line-height:1.1">${Math.round(pAward*100)}%</div></div>
   ${rows}
   ${marg}</div>`;
}
/* 수상권 밖일 때: 몇 문항만 회복하면 입상(장려상 이상) 가능성이 얼마로 오르는지 격려 문구 */
function belowAwardKick(exam, correct, total, weak){
  try{
    var cut=exam.cut; if(!cut||total<=0) return null;
    var gap=Math.max(1,(total-correct)-cut[4]);                                  // 장려상 도달까지 회복해야 할 정답 수
    var steps=[gap, gap+3, gap+6].filter(function(k){ return correct+k<=total; });

   처음으로 그게 가능해졌다.

  if(!log.length) return [];

  log.forEach(function(r){ (byQ[r.q]=byQ[r.q]||[]).push(r); });
  var qs=Object.keys(byQ).map(Number).sort(function(a,b){return a-b;});

  qs.forEach(function(q){ (byQ[q].some(function(r){ return r.ok; })?solved:stuck).push(q); });
