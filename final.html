/* ── 구글 시트에서 응시 기록 내려받기 ─────────────────────────────────────
   지금까지 시트는 **쓰기 전용**이었다(no-cors POST). 기록이 시트에 쌓여도 앱은
   그걸 다시 읽지 않으니, 또래 통계의 모집단은 늘 '이 브라우저에서 채점한
   학생들'뿐이었다. 학원 PC 와 노트북에서 반씩 채점하면 양쪽 다 MINP(8명)를
   못 넘겨 또래 정답률·선택 분포·백분위가 아예 나오지 않는다. 브라우저 저장소를
   비우면 누적이 통째로 사라지기도 한다.

   Apps Script 는 JSONP 로만 응답하므로(CORS 헤더가 없다) <script> 로 부른다.
   내려받은 기록은 로컬 기록과 **합치기만** 한다 — 지우지 않는다. 같은 응시인지는
   이름+답안으로 판단한다(시각은 기기마다 다르다). */
/* 시트에 물어보고 답을 받는다(JSONP). 받아오기도 고치기도 이 통로를 쓴다.
   `fetch` 를 쓰면 Apps Script 가 다른 출처라 응답을 읽을 수 없다 — 저장은
   no-cors 로 쏘고 끝이지만, 고치기는 몇 건 바뀌었는지 알아야 한다. */
function sheetCall(params,onDone){
  if(!SHEET_ENDPOINT){ onDone({error:'시트 주소가 설정되지 않았습니다'}); return; }
  var cb='__fsheet'+Math.floor(performance.now()*1000)+'_'+Math.floor(Math.random()*1e6);
  var sc=document.createElement('script'), done=false;
  function cleanup(){ try{ delete window[cb]; }catch(e){ window[cb]=undefined; }
    if(sc.parentNode) sc.parentNode.removeChild(sc); }
  window[cb]=function(res){ done=true; cleanup(); onDone(res||{}); };
  sc.onerror=function(){ if(!done){ cleanup(); onDone({error:'시트 연결 실패 — 배포·권한을 확인하세요'}); } };
  var qs=[]; for(var k in params) if(params[k]!=null) qs.push(k+'='+encodeURIComponent(params[k]));
  qs.push('callback='+cb);
  sc.src=SHEET_ENDPOINT+(SHEET_ENDPOINT.indexOf('?')>=0?'&':'?')+qs.join('&');
  document.body.appendChild(sc);
  setTimeout(function(){ if(!done){ cleanup(); onDone({error:'시트 응답 없음(시간 초과)'}); } },12000);
}
function sheetFetch(examId,onDone){ sheetCall({action:'list',exam:examId},onDone); }
/* 시트 쪽 결과를 사람 말로. 열쇠가 없으면 시트는 수정을 아예 받지 않는다. */
function sheetEditToast(res,what){
  if(!res||res.error){
    fToast('시트 반영 실패 — '+((res&&res.error)||'응답 없음'));
    return false;
  }
  fToast(res.changed? ('시트에도 '+res.changed+'건 '+what) : '시트에는 해당 행이 없었습니다');
  return true;
}
/* 같은 응시인지 가리는 열쇠. 시각은 기기마다 달라서 쓸 수 없다. */
/* ── 이름 고침 기록 ────────────────────────────────────────────────────
   이름을 고쳐도 구글 시트에는 옛 이름 행이 그대로 남아 있다. 그 상태로
   '시트에서 불러오기'를 누르면, 시트의 옛 이름 행이 **새 기록으로** 다시
   들어온다(중복 판정이 이름+답안이라 이름이 다르면 다른 사람으로 본다).
   고쳐 놓은 것이 원상복구되는 게 아니라, 오타 이름이 하나 더 생긴다.

   그래서 고친 내역을 남겨 두고, 시트에서 받아올 때 옛 이름을 새 이름으로
   바꿔서 넣는다. 시트를 직접 고치지 못하는 대신 여기서 막는다. */
const RENAME_KEY='final:renames';
function renameMap(){ try{ return JSON.parse(localStorage.getItem(RENAME_KEY)||'{}')||{}; }catch(e){ return {}; } }
function noteRename(from,to){
  from=String(from||'').trim(); to=String(to||'').trim();
  if(!from||!to||from===to) return;
  var m=renameMap();
  // A→B 로 고쳐 뒀는데 다시 B→C 로 고치면, A 도 C 를 가리키게 편다.
  for(var k in m) if(m[k]===from) m[k]=to;
  m[from]=to;
  try{ localStorage.setItem(RENAME_KEY,JSON.stringify(m)); }catch(e){}
}
function applyRename(n){ var s=String(n||'').trim(); var m=renameMap(); return m[s]||s; }
function subSig(r){ return nameKey(r.name)+'|'+((r.ans||[]).join('')); }
/* 시트 한 시험분을 로컬 풀에 합친다. 반환값은 새로 들어온 건수.

   prune 을 주면 **시트에서 사라진 줄을 여기서도 지운다.** 시트 전체를 한 번에
   받았을 때만 줄 수 있다(회차별로 받은 것으로 지우면, 안 물어본 회차가 통째로
   날아간다).

   왜 필요한가: 여태 이 사본은 **더하기만** 했다. 선생님이 학원 PC 에서 학생을
   지우거나 이름을 고치면 시트는 고쳐지는데, 노트북에는 옛 줄이 그대로 남았다.
   지운 학생이 계속 보이고, 이름을 고친 학생은 **두 명으로 늘어난다** — 옛
   이름 줄은 남아 있고 새 이름 줄이 시트에서 새로 들어오기 때문이다.

   지우는 것은 up:1(시트에서 왔거나, 시트에 있는 것을 확인한) 줄뿐이다.
   아직 못 올린 줄(up:0/2)과 출처를 모르는 옛 줄(up 없음)은 건드리지 않는다 —
   시트가 한 번도 가진 적 없는 기록을 지우면 되돌릴 수 없다. */
function mergeSheetRows(exam,rows,prune){
  if(!rows||!rows.length) return 0;
  var arr=subs(exam.id), seen={}, inSheet={};
  arr.forEach(function(r,i){ if(seen[subSig(r)]==null) seen[subSig(r)]=i; });
  var added=0, filled=0;
  rows.forEach(function(rec){
    if(!rec||!rec.answers) return;
    var digits=String(rec.answers).replace(/[^0-4]/g,'');
    if(digits.length!==exam.nQ) return;          // 문항 수가 다르면 다른 시험이다
    var ans=digits.split('').map(Number);
    var correct=0, total=0;
    for(var q=1;q<=exam.nQ;q++){ total++; if(okq(exam,q,ans[q-1]||0))correct++; }
    var rowRec={name:nameKey(applyRename(rec.name)), school:String(rec.school||''), grade:String(rec.grade||''),
                ts:rec.ts||0, correct:correct, total:total, wrong:total-correct, ans:ans};
    var sig=subSig(rowRec);
    if(seen[sig]!=null){
      /* 이미 있는 기록이다. 예전에는 그냥 넘겼는데, 그때 시트가 학교·학년을
         안 줘서 '-' 로 들어온 줄이 영영 '-' 로 남았다. 비어 있으면 채운다. */
      var cur0=arr[seen[sig]];
      if(cur0 && (rowRec.school||rowRec.grade)){
        if(!cur0.school && rowRec.school){ cur0.school=rowRec.school; filled++; }
        if(!cur0.grade && rowRec.grade){ cur0.grade=rowRec.grade; filled++; }
      }
      /* 시트에 있다는 것이 확인됐다. 보내 놓고 답을 못 받았던(up:0) 기록의
         표를 여기서 지운다 — no-cors 라 이 방법 말고는 확인할 길이 없다.
         출처를 모르던 옛 줄(up 없음)도 여기서 '시트에 있음' 이 된다. */
      if(cur0 && cur0.up!==1){ cur0.up=1; filled++; }
      inSheet[sig]=1;
      return;
    }
    rowRec.up=1;                                   // 시트에서 왔으니 올릴 것이 없다
    inSheet[sig]=1;
    seen[sig]=arr.length; arr.push(rowRec); added++;
  });
  var dropped=0;
  if(prune){
    var left=arr.filter(function(r){
      if(r.up!==1) return true;                    // 못 올린 줄·출처 모르는 줄은 그대로
      if(inSheet[subSig(r)]) return true;
      dropped++; return false;                     // 시트에서 사라졌다 — 여기서도 지운다
    });
    if(dropped) arr=left;
  }
  if(added||filled||dropped){ arr.sort(function(a,b){ return (a.ts||0)-(b.ts||0); }); saveSubs(exam.id,arr); }
  mergeSheetRows.dropped=(mergeSheetRows.dropped|0)+dropped;
  return added;
}
/* 모든 시험을 차례로 받는다. 한 번에 다 쏘면 Apps Script 가 동시 실행을 막는다. */
/* ── 마지막으로 시트와 맞춘 시각 ────────────────────────────────────────
   시트가 진짜 원본이다. 이 브라우저 기록은 사본일 뿐이라, 다른 기기에서
   채점한 회차는 여기 없다 — 그런데 화면은 그 사실을 말하지 않으니 "안 봤나
   보다" 로 넘어간다. 언제 맞췄는지를 남겨야 얼마나 묵었는지 말할 수 있다.
   통합관리 화면이 이 값을 읽어 오래됐으면 스스로 맞춘다. */
const SYNC_KEY='chemistreal:final:lastsync';
function lastSyncAt(){ try{ return +(localStorage.getItem(SYNC_KEY)||0)||0; }catch(e){ return 0; } }
function markSynced(){ try{ localStorage.setItem(SYNC_KEY, String(Date.now())); }catch(e){} }

/* ── 시트 한 번에 받기 ─────────────────────────────────────────────────
   회차마다 한 번씩, 서른여덟 번을 차례로 물었다. 한 번에 12초를 기다리니
   최악이면 7분 반이다. 그래서 '시트에서 불러오기' 는 **아무도 안 누르는
   버튼**이 됐고, 화면에 뜨는 것은 늘 이 브라우저에 남은 것뿐이었다.
   기록은 웹에 다 있는데 보이지가 않았다.

   한 번에 받는다. 회차가 몇 개든 한 번이라, 화면을 열 때마다 조용히 맞출 수
   있다 — 그래야 어느 기기에서 어떻게 들어와도 같은 것이 보인다.

   시트 쪽(action=all)이 아직 안 배포됐으면 옛길로 되돌아간다. */
function syncOneShot(onDone){
  sheetCall({action:'all'},function(res){
    if(!res || res.error || res.ok===false || !res.rows){ onDone(null); return; }
    var byId={};
    (res.rows||[]).forEach(function(r){
      if(!r||!r.examId) return; (byId[r.examId]=byId[r.examId]||[]).push(r);
    });
    var added=0, touched=0;
    mergeSheetRows.dropped=0;
    FINAL_EXAMS.forEach(function(exam){
      var rows=byId[cohortKey(exam.id)]||byId[exam.id]||null;
      /* 그 회차 줄이 응답에 아예 없으면 **손대지 않는다.** 시트 읽기가 엎어져도
         {ok:true, rows:[]} 로 오는데, 없는 것을 '전부 지워졌다' 로 읽으면 이
         브라우저 기록이 통째로 날아간다.

         대신 그 회차의 마지막 학생을 시트에서 지운 경우는 여기서 안 지워진다.
         드문 일이고, 지우는 쪽 화면에서는 이미 지워져 있다 — 통째로 날리는
         쪽보다 남기는 쪽이 낫다. */
      if(!rows) return;
      touched++;
      /* 시트 전체를 한 번에 받았을 때만 지운다. 회차별로 받은 것으로 지우면
         안 물어본 회차가 통째로 날아간다. */
      try{ added+=mergeSheetRows(exam,rows,true); }catch(e){}
    });
    onDone({added:added, exams:touched, rows:(res.rows||[]).length,
            dropped:mergeSheetRows.dropped|0});
  });
}
/* ── 아직 시트가 못 받은 기록 ───────────────────────────────────────────
   저장은 no-cors POST 라 **성공했는지 알 수 없다.** 망이 끊긴 채로 채점하면
   그 기록은 이 브라우저에만 남고, 다른 기기에서는 영영 안 보인다.

   그래서 채점할 때 up:0(아직 확인 못 함) 을 달아 두고, 시트를 다시 읽었을 때
   그 줄이 보이면 표를 지운다. 안 보이면 다시 보낸다.

   **이 브라우저가 보낸 것만** 다시 보낸다. up 이 아예 없는 옛 기록은 건드리지
   않는다 — 선생님이 시트에서 일부러 지운 줄을 되살릴 수 있기 때문이다.
   그런 것은 명단 관리에서 사람이 보고 올린다. */
function resendPending(){
  var sent=0;
  if(!SHEET_ENDPOINT || fShared) return 0;
  FINAL_EXAMS.forEach(function(exam){
    var arr=subs(exam.id), hit=false;
    arr.forEach(function(r){
      if(r.up!==0 || !r.ans || r.ans.length!==exam.nQ) return;
      if(!(r.name||r.school)) return;
      /* 한없이 다시 보내지는 않는다. 세 번을 보냈는데도 시트에서 안 보이면
         **간 것을 우리가 못 찾는 것**일 수 있다 — 계속 보내면 시트에 같은 줄이
         쌓인다. 멈추고 표시만 남긴다(명단 관리에서 사람이 본다). */
      if((r.upTry|0)>=3){ r.up=2; hit=true; return; }   // 2: 여러 번 보냈는데 안 보인다
      var sel2={}; r.ans.forEach(function(a,i){ sel2[i+1]=a; });
      try{
        postToSheet(sheetPayloadFor(exam,sel2,cohortStats(exam),r.name,r.school,r.grade));
        sent++; r.upTry=(r.upTry|0)+1; hit=true;
      }catch(e){}
    });
    if(hit) saveSubs(exam.id,arr);
  });
  return sent;
}
/* ── 다 받은 뒤 화면을 다시 그린다 ─────────────────────────────────────
   여태는 무조건 renderList() 였다. 버튼을 눌러 부를 때는 목록 화면에 있으니
   맞는 말이었는데, 이제는 **열 때마다 저절로** 돈다. 답안을 절반쯤 입력한
   선생님 화면을 목록으로 갈아엎으면 그 입력이 통째로 날아간다.
   지금 무엇을 보고 있는지 보고 정한다. */
function refreshScreen(){
  try{
    if(cur) return;                                   // 채점 중 — 건드리지 않는다
    if(location.hash && location.hash!=='#') return;   // 명단·문제은행은 저희가 그린다
    renderList();
  }catch(e){}
}
/* onDone 을 받는다 — 부르는 쪽(통합관리)이 끝난 뒤에 화면을 다시 그려야 한다.
   quiet 면 진행 토스트를 띄우지 않는다(자동으로 도는 경우). */
function syncAllFromSheet(onDone, quiet){
  if(!quiet) fToast('시트에서 불러오는 중…');
  syncOneShot(function(one){
    if(one){
      markSynced();
      var resent=resendPending();
      refreshScreen();
      if(!quiet){
        var bits=[];
        if(one.added) bits.push('새 기록 '+one.added+'건');
        /* 다른 기기에서 지우거나 이름을 고친 것이 여기까지 온 것이다.
           말없이 사라지면 "내 기록이 없어졌다" 가 되므로 반드시 적는다. */
        if(one.dropped) bits.push('시트에서 없어진 '+one.dropped+'건 정리');
        if(resent) bits.push('다시 올린 '+resent+'건');
        fToast(bits.length? ('시트와 맞췄습니다 · '+bits.join(' · ')) : '시트와 이미 같습니다');
      }
      if(typeof onDone==='function') onDone({added:one.added, failed:0, exams:one.exams,
                                             gaveUp:false, resent:resent, dropped:one.dropped|0});
      return;
    }
    syncPerExam(onDone, quiet);      // 시트 쪽이 아직 옛 판이다
  });
}
function syncPerExam(onDone, quiet){
  var list=FINAL_EXAMS.slice(), i=0, total=0, failed=0, warned=false;
  /* 한 번 부를 때마다 최대 12초를 기다린다. 망이 끊긴 채로 서른여덟 번을
     차례로 부르면 7분 반을 붙잡는다 — 자동으로 도는 자리에서는 그동안
     '불러오는 중' 에 갇힌다. 연달아 세 번 실패하고 받은 것도 없으면
     시트가 아니라 망이 문제다. 그만둔다. */
  var consec=0, gaveUp=false;
  if(!quiet) fToast('시트에서 불러오는 중… (0/'+list.length+')');
  (function step(){
    if(i>=list.length){
      /* 한 회차도 못 받았으면 맞췄다고 할 수 없다. 그때 시각을 찍으면
         망이 끊긴 채로 '방금 맞춤' 이 되어 다음에도 안 맞춘다. */
      if(failed<list.length) markSynced();
      if(failed<list.length) resendPending();
      refreshScreen();
      if(!quiet) fToast(gaveUp
        ? '시트에 닿지 못했습니다 — 연결을 확인하고 다시 시도하세요'
        : (failed
          ? ('불러오기 완료 · 새 기록 '+total+'건 · 실패 '+failed+'개 시험')
          : (total? ('시트에서 '+total+'건을 새로 받았습니다') : '시트와 이미 같습니다')));
      if(typeof onDone==='function') onDone({added:total, failed:failed, exams:list.length, gaveUp:gaveUp});
      return;
    }
    var exam=list[i++];
    sheetFetch(exam.id,function(res){
      if(res.error||res.ok===false){ failed++; consec++; }
      else{
        consec=0;
        if(res.warning && !warned){ warned=true; console.warn('[시트] '+res.warning); }
        try{ total+=mergeSheetRows(exam,res.students||[]); }catch(e){ failed++; }
      }
      if(consec>=3 && total===0){       // 망이 끊긴 것이다 — 남은 회차는 부르지 않는다
        gaveUp=true; failed+=(list.length-i); i=list.length; step(); return;
      }

   KMChC 기출은 연도 그룹('2026'·'2025'·'2024'·'이전')으로 나뉘므로 그룹 이름을

/* 동형문제 표시 가능 여부. 생성 과정에서 도형·선택지 추출이 실패한 항목("렌더 누락",
 * 빈 선택지)은 학생에게 보여주면 오히려 혼란을 주므로 숨기고 안내 문구로 대체한다. */
function dhUsable(dq){
  if(!dq) return false;
  var stem=String(dq.stem||dq.stemHtml||''), expl=String(dq.explanation||dq.explanationHtml||'');
  if(!stem.trim() && !dq.image) return false;
  // '누락'은 정상적인 한국어 표현("중복이나 누락 없이")으로도 쓰이므로,
  // 렌더·추출·복원 실패를 가리키는 문맥에서만 손상으로 판정한다.
  if(/(?:렌더|렌더링|추출|복원|원본)[^\n]{0,30}?누락|누락[^\n]{0,30}?(?:렌더|렌더링|추출|복원)|렌더\s*실패|추출\s*실패|복원되지\s*않/.test(stem+expl)) return false;
  var chs=(dq.choices||dq.choicesHtml||[]);
  if(chs.length<4) return false;
  for(var i=0;i<chs.length;i++){ if(!String(chs[i]==null?'':chs[i]).trim()) return false; }
  return true;
}
/* 또래 선택지 분포 → 함정 선택지 판정. co={opt:[4],qp,N} 없으면 null */
function wbTrap(co,accepted,myAns){
  if(!co||!co.opt) return null;
  var trap=0,trapP=-1;
  for(var i=1;i<=4;i++){ if(accepted.indexOf(i)>=0) continue; var v=co.opt[i-1]||0; if(v>trapP){trapP=v;trap=i;} }
  if(!trap) return null;
  return {opt:co.opt,qp:co.qp,N:co.N,trap:trap,trapP:trapP,fell:(myAns===trap)};
}
/* 간단 오답 카드: 왜 틀렸나 한 줄 + (접힌)원문 + 동형문제·정답·해설을 바로 표시 */

    else if(tp.trapP>=25) msg='또래가 가장 많이 걸린 함정은 <b>'+CIRC[tp.trap]+'</b>('+tp.trapP+'%)입니다. 같은 함정에 걸리지 않도록 함께 점검해 두세요.';
    if(tp.qp!=null){

  // 동형문제는 세트가 여러 벌일 수 있다(DH_SETS). 쓸 수 있는 것만 차례로 붙인다.
  var usable=(dqs||[]).filter(dhUsable);
  var dhHTML;
  if(usable.length){
    dhHTML=usable.map(function(dq,di){
      var stem=dq.stemHtml||esc(dq.stem||'');
      var sol=dq.explanationHtml||esc(dq.explanation||'');
      var mis=dq.misconception||'';
      var body=stem?('<div class="wb-stem">'+stem+'</div>'):'';

      var authored=(dq.origin==='authored');
      // 두 개 이상이면 번호를 붙여 서로 다른 문제임을 분명히 한다.
      var no=usable.length>1?(' '+CIRC[di+1]):'';

  var seed=usable[0]||qd||{};

    +'<summary>같은 개념 더 풀기</summary>'
    +'<div class="wb-more-body">불러오는 중…</div></details>';
  return '<article class="wb-card" data-q="'+q+'">'+head+origHTML+whyHTML+fixHTML+peerHTML+dhHTML+moreHTML+'</article>';

/* ── 개념으로 문제 더 찾기 ────────────────────────────────────────────
   동형문제를 `시험 → 문항번호` 로만 찾을 수 있어서, 한 문항에 붙는 연습 문제는
   그 시험에 집필해 둔 것이 전부였다. 2400문항이 시험 칸막이에 갇혀 있던 셈이다.

   donghyung/index.json 은 '어디에 무엇이 있는지'만 담은 색인이다(지문·해설은
   들어 있지 않다). 세부 개념으로 먼저 찾고, 모자라면 대분류로 넓힌다.
   세부 개념 597가지 중 303가지는 문항이 하나뿐이라 두 층이 필요하다. */
var _poolIndex=null, _poolFiles={};
async function poolIndex(){
  if(_poolIndex) return _poolIndex;
  try{
    var r=await fetch('donghyung/index.json',{cache:'no-store'});
    _poolIndex=r.ok?await r.json():{broad:{},concept:{}};
  }catch(e){ _poolIndex={broad:{},concept:{}}; }
  return _poolIndex;
}
async function poolFile(id){
  if(_poolFiles[id]) return _poolFiles[id];
  try{
    var r=await fetch('donghyung/'+id+'.json',{cache:'no-store'});
    var j=r.ok?await r.json():null;
    _poolFiles[id]=(j&&(j.questions||j))||{};
  }catch(e){ _poolFiles[id]={}; }
  return _poolFiles[id];
}
/* 이 시험(세트 포함)에서 이미 보여 준 것은 빼고 고른다. */
async function poolPick(concept,area,examId,want){
  var idx=await poolIndex();
  var mine={}; dhSetIds(examId).forEach(function(x){ mine[x]=1; });
  var seen={}, out=[];
  function take(refs){
    (refs||[]).forEach(function(ref){
      if(out.length>=want) return;
      var bits=ref.split(':');
      if(mine[bits[0]]||seen[ref]) return;
      seen[ref]=1; out.push({file:bits[0],q:bits[1]});
    });
  }
  take(idx.concept&&idx.concept[concept]);                 // 세부 개념 먼저
  if(out.length<want) take(idx.broad&&idx.broad[area]);    // 모자라면 대분류로
  return out;
}
async function loadMore(details){
  if(details.dataset.loaded) return;
  details.dataset.loaded='1';
  var body=details.querySelector('.wb-more-body'); if(!body) return;
  var bits=(details.dataset.pool||'|').split('|');
  // 오답 카드에서는 '같은 개념 문제', 선수 개념 드릴에서는 그 영역 이름을 쓴다.
  var label=details.dataset.label||'같은 개념 문제';
  var picks=[];
  try{ picks=await poolPick(bits[0],bits[1],(cur&&cur.id)||'',2); }catch(e){}
  var made=[];
  for(var i=0;i<picks.length;i++){
    var qs=await poolFile(picks[i].file), dq=qs[picks[i].q];
    if(!dhUsable(dq)) continue;
    var stem=dq.stemHtml||esc(dq.stem||'');
    var sol=dq.explanationHtml||esc(dq.explanation||'');
    var mis=dq.misconception||'';
    made.push('<div class="wb-dh" data-src="'+esc('pool:'+picks[i].file+':'+picks[i].q)+'"><div class="wb-dh-h">'+label+' '+CIRC[made.length+1]
      +'<span class="wb-dh-src">'+esc(dq.concept||dq.area||'')+'</span></div>'
      +(stem?('<div class="wb-stem">'+stem+'</div>'):'')
      +wbChoiceList(dq)
      +'<details class="wb-dh-reveal"><summary>정답 · 해설 보기</summary>'
      +'<div class="wb-dh-ans">정답 <b>'+(dq.answer?CIRC[Number(dq.answer)]:'·')+'</b></div>'
      +(sol?'<div class="wb-dh-sol"><b>해설</b> '+sol+'</div>':'')
      +(mis?'<div class="wb-mis"><b>오개념</b> '+esc(mis)+'</div>':'')
      +'</details></div>');
  }
  body.innerHTML=made.length?made.join('')
    :'<div class="wb-missing">같은 개념의 다른 문제가 아직 없습니다.</div>';
}
/* details 의 toggle 은 버블링하지 않으므로 캡처 단계에서 받는다. */

async function hydrateWrongbook(exam,wrong){
  var root=document.getElementById('wrongbook'); if(!root)return;
  var answers={}, analogues={};
  try{
    var responses=await Promise.all([fetch('answers/'+exam.id+'.json',{cache:'no-store'}),loadAnalogues(exam.id)]);
    if(responses[0].ok){var a=await responses[0].json();answers=a.questions||a;}
    analogues=responses[1]||{};
  }catch(e){}
  var cards=root.querySelector('[data-wb-cards]'); if(!cards) return;

  var cs=null; try{ cs=cohortStats(exam); }catch(e){}

/* 오답노트에 필요한 것만 서비스워커에 미리 받아 달라고 부탁한다.
   원문 이미지는 `loading="lazy"` 라 학생이 스크롤해 지나간 것만 저절로 캐시된다.
   지금 미리 받아 두면 학원에서 성적표를 열어 본 학생이 지하철에서 다시 열어도
   그대로 나온다. 실패해도 화면에는 아무 영향이 없다(되면 좋은 것일 뿐). */
function warmOffline(exam,wrong){

    var urls=['answers/'+exam.id+'.json'];

    wrong.forEach(function(w){ urls.push('crops/'+exam.id+'/'+w.q+'.png'); });

/* 성적표를 다시 그린다. 시트에서 그 학생의 전 회차가 도착하면 부른다 —
   먼저 그려 둔 화면에 '2회 응시' 라고 적혀 있을 수 있다.
   다시 그릴 때는 저장도, 시트 전송도 하지 않는다(같은 채점을 두 번 보내지 않는다). */
function rerenderReport(){ if(cur && !document.getElementById('rerender-lock')) scoreAuto(true); }
function scoreAuto(again){
  const key=cur.key; let correct=0,total=0; const wrong=[];
  for(let q=1;q<=cur.nQ;q++){ total++; const a=sel[q]||0,k=key[q-1]; if(okq(cur,q,a))correct++; else wrong.push({q,a,k}); }
  const W=wrong.length, pct=total?Math.round(correct/total*100):0;
  /* 다시 그릴 때는 답안 입력칸이 이미 사라지고 성적표가 그 자리에 있다.
     칸이 없으면 방금 그린 성적표가 들고 있던 값을 쓴다. */
  const _v=function(id,f){ const el=document.getElementById(id);
    return ((el? el.value : ((window.__rpt||{})[f]||''))||'').trim(); };
  /* 여기서 한 번 다듬으면 그 뒤로는 갈라지지 않는다 — 저장·시트·문자·링크가
     모두 이 값을 쓴다. */
  const nm=nameKey(_v('nm','name')), sch=_v('sch','school'), grd=_v('grd','grade');
  window.__rpt={name:nm,school:sch,grade:grd};
  const ans=[]; for(let q=1;q<=cur.nQ;q++) ans.push(sel[q]||0);
  /* 채점할 때마다 새 기록을 쌓고 있었다. 같은 학생을 두 번 채점하면 명단에
     두 줄이 생기고, 또래 통계 인원도 그만큼 부풀었다. 실제로 한 학생이 같은
     회차에 네 줄까지 쌓였다.

     같은 시험에서 **이름과 답안이 같으면 같은 응시**로 본다. 새로 쌓지 않고
     그 기록을 갱신한다 — 학교·학년이 비어 있었으면 이번 값으로 채운다.
     답안이 다르면 다시 푼 것이므로 따로 남긴다. */
  const arr=subs(cur.id);
  /* up:0 = 시트로 보냈지만 **닿았는지 아직 모른다.** no-cors POST 는 응답을
     읽을 수 없어서, 다음에 시트를 읽었을 때 그 줄이 보이면 그때 1 로 지운다.
     안 보이면 다시 보낸다 — 망이 끊긴 채로 채점한 기록이 이 브라우저에만
     남아 사라지는 일을 막는 유일한 장치다. */
  const nowRec={name:nm,school:sch,grade:grd,ts:Date.now(),correct,total,wrong:W,ans,up:again?1:0};
  const dup=arr.findIndex(function(r){ return subSig(r)===subSig(nowRec); });
  if(dup>=0){

async function downloadReportPDF(){
  if(!cur){ fToast('먼저 채점을 해주세요'); return; }
  fToast('성적표를 만드는 중… 잠시만요');
  // 데이터 재수집(scoreAuto와 동일 규칙)

   지난 시간 오답이 정말 메워졌는지 그 자리에서 확인된다.

   무엇을 담을지 고르는 순서:
   1) 아직 회복하지 못한 문항을 먼저 (원문도 동형도 틀렸거나, 아직 안 푼 것)

function retestPick(exam, wrong, analogues){
  var nm=curName();
  var log=dhLog(exam.id).filter(function(r){ return !nm||r.name===nm; });
  var solvedQ={}, usedSrc={};
  log.forEach(function(r){ if(r.ok) solvedQ[r.q]=1; usedSrc[r.q+'|'+r.src]=1; });

  var fresh=[], review=[];
  (wrong||[]).slice().sort(function(a,b){return a.q-b.q;}).forEach(function(w){
    var list=(analogues[String(w.q)]||[]).filter(dhUsable);
    // 화면에서 이미 푼 것은 뺀다
    var unused=list.filter(function(dq,i){ return !usedSrc[w.q+'|'+(dq._src||('set'+i))]; });
    var pickFrom=unused.length?unused:list;
    if(!pickFrom.length) return;
    (solvedQ[w.q]?review:fresh).push({q:w.q, dq:pickFrom[0]});
  });
  return fresh.concat(review);
}

function boot(){

  /* 링크에 실려 온 또래 통계(합계만). 개인 기록은 들어 있지 않다. */
  window.__csLink=null;
  const sm=location.hash.match(/[#&]s=([A-Za-z0-9_-]+)&/);
  if(m){ const ex=FINAL_EXAMS.find(e=>e.id===m[1]); if(ex){ if(sm) window.__csLink={id:ex.id,raw:sm[1]}; openExam(ex.id); fShared=true; let n=0n; for(const c of m[2]) n=n*36n+BigInt(parseInt(c,36)); for(let q=1;q<=ex.nQ;q++){ const v=Number(n%5n); n=n/5n; if(v) setAns(q,v); } const ne=document.getElementById('nm'), xe=document.getElementById('exno'); if(m[4]&&ne) ne.value=decName(m[4]); if(m[3]&&xe) xe.value=m[3]; scoreAuto();
    /* 링크에 실린 인원은 링크를 지은 순간의 것이다. 지금 몇 명인지 시트에
       물어 보고, 오면 그 숫자로 다시 그린다. 화면은 먼저 띄운다 —
       창구를 기다리느라 성적표가 안 뜨면 그게 더 나쁘다. */
    loadLiveCohort(ex.id, function(){ try{ scoreAuto(); }catch(e){} });
    return; } }
  if(location.hash==='#roster'){ renderRoster(); }
  else if(location.hash==='#qbank'||location.hash==='#admin'){ renderQbank(); }
  else { renderList(); }
}

async function start(){

  if(!FINAL_EXAMS){
    // 여기까지 오면 정말 아무 데도 없다. 빈 화면 대신 이유를 보여 주고 스스로
    // 다시 시도한다(학생이 새로고침을 몰라도 되도록).
    var app=document.getElementById('app');
    if(app) app.innerHTML='<div class="note" style="border-color:#B0512F;color:#8a2f1d">'
      +'시험 목록을 불러오는 중입니다… 잠시 뒤 자동으로 다시 시도합니다.'
      +'<br><small>계속되면 새로고침해 주세요.</small></div>';
    setTimeout(start,5000);
    return;
  }
  window.addEventListener('hashchange',boot);
  boot();
  /* 화면을 먼저 그리고 나서 맞춘다. 시트를 부르는 것은 <script> 를 붙이는
     일이라 최대 12초를 기다릴 수 있는데, 그 사이 화면이 비어 있으면 안 된다.
     보이는 것이 먼저고, 맞추는 것은 뒤에서 한다. */
  if(document.readyState==='complete') setTimeout(autoSync,1200);

   다 들어 있고, 남의 기록을 그 폰에 받아 둘 이유가 없다. */

let _autoSyncing=false;
function autoSync(force){
  if(fShared || !SHEET_ENDPOINT || _autoSyncing) return;
  if(!force && (Date.now()-lastSyncAt()) < AUTO_SYNC_STALE) return;
  _autoSyncing=true;
  try{
    syncAllFromSheet(function(){ _autoSyncing=false; }, true);
  }catch(e){ _autoSyncing=false; }
}
document.addEventListener('visibilitychange',function(){ if(!document.hidden) autoSync(); });
window.addEventListener('focus',function(){ autoSync(); });
/* 다른 탭(통합 셸 등)이 맞추면 이 화면도 따라 다시 그린다. 같은 오리진이라
   저장이 이쪽으로 온다 — 두 화면이 서로 다른 숫자를 들고 있으면 안 된다. */
window.addEventListener('storage',function(e){
  if(!e.key) return;
  if(e.key.indexOf(PFX)!==0 && e.key!==SYNC_KEY) return;
  refreshScreen();
});
start();
